rmed the basis of the decision in the earlier case. When judging almost any case, then, a judge can find a relevant precedential case which, in subsequent opinions, has been read by one judge as stating one legal rule, and by another judge as stating another, possibly contradictory one. A judge thus faces an indeterminate legal situation in which he or she has to choose which rules are to govern the case at hand.","questions":[{"id":1,"question":"According to the passage, the realists argued that which one of the\nfollowing is true of a common-law system?","options":["It gives rise to numerous situations in which the decisions of\nearlier judges are found to be in error by later judges.","It possesses a clear set of legal rules in theory, but in practice\nmost judges are unaware of the strict meaning of those rules.","Its strength lies in the requirement that judges decide cases\naccording to precedent rather than according to a set of abstract\nprinciples.","It treats the difference between the holding and the dicta in a\nwritten opinion rather loosely in practice."],"correct":3,"explanation":"The correct answer is option D. The passage explicitly states or directly supports that it treats the difference between the holding and the dicta in a\nwritten opinion rather loosely in practice. This information is stated in the passage, making it the most accurate answer based on the text."},{"id":2,"question":"According to the passage, which one of the following best describes\nthe relationship between a judicial holding and a judicial decision?","options":["The holding is not commonly considered binding on subsequent\njudges, but the decision is.","The holding formally states the outcome of the case, while the\ndecision explains it.","The holding explains the decision but does not include it.","The holding sets forth and justifies a decision."],"correct":3,"explanation":"The correct answer is option D. The passage explicitly states or directly supports that the holding sets forth and justifies a decision. This information is stated in the passage, making it the most accurate answer based on the text."},{"id":3,"question":"The information in the passage suggests that the realists would\nmost likely have agreed with which one of the following statements about\nthe reaction of judges to past interpretations of a precedential case,\neach of which states a different legal rule?","options":["The judges would most likely disagree with one or more of the\ninterpretations and overturn the earlier judges' decisions.","The judges might differ from each other concerning which of the\ninterpretations would apply in a given case.","The judges probably would consider themselves bound by all the\nlegal rules stated in the interpretations.","The judges would regard the lack of unanimity among\ninterpretations as evidence that no precedents existed."],"correct":1,"explanation":"The correct answer is option B. This can be inferred from the passage. The passage provides evidence that supports the conclusion that the judges might differ from each other concerning which of the\ninterpretations would apply in a given case. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":4,"question":"It can be inferred from the passage that most legal scholars today\nwould agree with the realists that","options":["Linguistic vagueness can cause indeterminacy regarding the outcome\nof a litigated case.","In any litigated case, several different and possibly\ncontradictory legal rules are relevant to the decision of the case.","The distinction between holding and dicta in a written opinion is\nusually difficult to determine in practice.","The boundaries of applicability of terms may sometimes be\ndifficult to determine, but the core meanings of the terms are well\nestablished."],"correct":0,"explanation":"The correct answer is option A. This can be inferred from the passage. The passage provides evidence that supports the conclusion that linguistic vagueness can cause indeterminacy regarding the outcome\nof a litigated case. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":5,"question":"The passage suggests that the realists believed which one of the\nfollowing to be true of the dicta in a judge's written opinion?","options":["The judge writing the opinion is usually careful to specify those\nparts of the opinion he or she considers part of the dicta.","The appropriateness of the judge's decision would be disputed by\nsubsequent judges on the basis of legal rules expressed in the dicta.","A consensus concerning what constitutes the dicta in a judge's\nopinion comes to be fixed over time as subsequent similar cases are\ndecided.","Subsequent judges can consider parts of what the original judge\nsaw as the dicta to be essential to the original opinion."],"correct":3,"explanation":"The correct answer is option D. This can be inferred from the passage. The passage provides evidence that supports the conclusion that subsequent judges can consider parts of what the original judge\nsaw as the dicta to be essential to the original opinion. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":6,"question":"Which one of the following best describes the overall organization\nof the passage?","options":["A traditional point of view is explained and problems arising from\nit are described.","Two conflicting systems of thought are compared point for point\nand then evaluated.","A legal concept is defined and arguments justifying that\ndefinition are refuted.","Two viewpoints on an issue are briefly described and one of those\nviewpoints is discussed at greater length."],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: two viewpoints on an issue are briefly described and one of those\nviewpoints is discussed at greater length. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."}]},"44":{"id":44,"title":"Years after the movement to obtain civil rights for black people in the United","difficulty":"Moderate","passage":"Years after the movement to obtain civil rights for black people in the United States made its most important gains, scholars are reaching for a theoretical perspective capable of clarifying its momentous developments. New theories of social movements are being discussed, not just among social psychologists, but also among political theorists.\n\nOf the many competing formulations of the \"classical\" social psychological theory of social movement, three are prominent in the literature on the civil rights movement: \"rising expectations,\" \"relative deprivation,\" and \"J-curve.\" Each conforms to a causal sequence characteristic of classical social movement theory, linking some unusual condition, or \"system strain,\" to the generation of unrest. When these versions of the classical theory are applied to the civil rights movement, the source of strain is identified as a change in black socioeconomic status that occurred shortly before the widespread protest activity of the movement.\n\nFor example, the theory of rising expectations asserts that protest activity was a response to psychological tensions generated by gains experienced immediately prior to the civil rights movement. Advancement did not satisfy ambition, but created the desire for further advancement. Only slightly different is the theory of relative deprivation. Here the impetus to protest is identified as gains achieved during the premovement period, coupled with simultaneous failure to make any appreciable headway relative to the dominant group. The J-curve theory argues that the movement occurred because a prolonged period of rising expectations and gratification was followed by a sharp reversal.\n\nPolitical theorists have been dismissive of these applications of classical theory to the civil rights movement. Their arguments rest on the conviction that, implicitly, the classical theory trivializes the political ends of movement participants, focusing rather on presumed psychological dysfunctions: reduction of complex social situations to simple paradigms of stimulus and response obviates the relevance of all but the shortest-term analysis. Furthermore, the theories lack predictive value: \"strain\" is always present to some degree, but social movement is not. How can we know which strain will provoke upheaval?\n\nThese very legitimate complaints having frequently been made, it remains to find a means of testing the strength of the theories. Problematically, while proponents of the various theories have contradictory interpretations of socioeconomic conditions leading to the civil rights movement, examination of various statistical records regarding the material status of black Americans yields ample evidence to support any of the three theories. The steady rise in median black family income supports the rising expectations hypothesis; the stability of the economic position of black vis-à-vis (prep....,..., ) white Americans lends credence to the relative deprivation interpretation; unemployment data are consistent with the J-curve theory. A better test is the comparison of each of these economic indicators with the frequency of movement-initiated events reported in the press; unsurprisingly, none correlates significantly with the pace of reports about movement activity.","questions":[{"id":1,"question":"It can be inferred from the passage that the classical theory of\nsocial movement would not be appropriately applied to an annual general\nelection because such an election","options":["may focus on personalities rather than on political issues","is not provoked primarily by an unusual condition","may be decided according to the psychological needs of voters","may not entail momentous developments"],"correct":1,"explanation":"The correct answer is option B. This can be inferred from the passage. The passage provides evidence that supports the conclusion that is not provoked primarily by an unusual condition. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":2,"question":"According to the passage, the \"rising expectations\" and \"relative\ndeprivation\" models differ in which one of the following ways?","options":["They predict different responses to the same socioeconomic\nconditions.","They disagree about the relevance of psychological explanations\nfor protest movements.","They are meant to explain different kinds of social change.","They describe the motivation of protesters in slightly different\nways."],"correct":3,"explanation":"The correct answer is option D. The passage explicitly states or directly supports that they describe the motivation of protesters in slightly different\nways. This information is stated in the passage, making it the most accurate answer based on the text."},{"id":3,"question":"The author implies that political theorists attribute which one of\nthe following assumptions to social psychologists who apply the\nclassical theory of social movements to the civil rights movement?","options":["Participants in any given social movement have conflicting\nmotivations.","Social movements are ultimately beneficial to society.","Only strain of a socioeconomic nature can provoke a social\nmovement.","Psychological motivations of movement participants better\nilluminate the causes of social movements than do participants'\npolitical motivations."],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: psychological motivations of movement participants better\nilluminate the causes of social movements than do participants'\npolitical motivations. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":4,"question":"Which one of the following statements is supported by the results\nof the \"better test\" discussed in the last paragraph of the passage?","options":["The test confirms the three classical theories discussed in the\npassage.","The test provides no basis for deciding among the three classical\ntheories discussed in the passage.","The test shows that it is impossible to apply any theory of social\nmovements to the civil rights movement.","The test indicates that press coverage of the civil rights\nmovement was biased."],"correct":1,"explanation":"The correct answer is option B. The passage supports this answer: the test provides no basis for deciding among the three classical\ntheories discussed in the passage. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":5,"question":"The validity of the \"better test\" (line 65) as proposed by the\nauthor might be undermined by the fact that","options":["the press is selective about the movement activities it chooses to\ncover","not all economic indicators receive the same amount of press\ncoverage","economic indicators often contradict one another","a movement-initiated event may not correlate significantly with\nany of the three economic indicators"],"correct":0,"explanation":"The correct answer is option A. The passage supports this answer: the press is selective about the movement activities it chooses to\ncover. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":6,"question":"The main purpose of the passage is to","options":["Persuade historians of the indispensability of a theoretical\nframework for understanding recent history.","Present a new model of social movement.","Account for a shift in a theoretical debate.","Discuss the reasoning behind and shortcomings of certain social\npsychological theories.\n\n# LSAT 12 SECTION III\n\nTime 35 minutes 26 Questions\n\nDirections: Each passage in this section is followed by a group of\nquestions to be answered on the basis of what is stated or implied in\nthe passage. For some of the questions, more than one of the choices\ncould conceivably answer the question. However, you are to choose the\nbest answer, that is, the response that most accurately and completely\nanswers the question, and blacken the corresponding space on your answer\nsheet.\n\nNearly every writer on the philosophy of civil rights activist Martin\nLuther King, Jr., makes a connection between King and Henry David\nThoreau, usually via Thoreau's famous essay, \"Civil Disobedience\"\n(1849). In his book Stride Toward Freedom (1958), King himself stated\nthat Thoreau's essay was his first intellectual contact with the theory\nof passive resistance to governmental laws that are perceived as morally\nunjust. However, this emphasis on Thoreau's influence on King is\nunfortunate: first, King would not have agreed with many other aspects\nof Thoreau's philosophy, including Thoreau's ultimate acceptance of\nviolence as a form of protest; second, an overemphasis on the influence\nof one essay has kept historians from noting other correspondences\nbetween King's philosophy and transcendentalism (1: a philosophy that\nemphasizes the a priori conditions of knowledge and experience or the\nunknowable character of ultimate reality or that emphasizes the\ntranscendent as the fundamental reality; 2: a philosophy that asserts\nthe primacy of the spiritual and transcendental over the material and\nempirical). \"Civil Disobedience\" was the only example of\ntranscendentalist writing with which King was familiar, and in many\nother transcendentalist writings, including works by Ralph Waldo Emerson\nand Margaret Fuller, King would have found ideas more nearly akin to his\nown.\n\nThe kind of civil disobedience King had in mind was, in fact, quite\ndifferent from Thoreau's view of civil disobedience . Thoreau, like most other transcendentalists,\nwas primarily interested in reform of the individual, whereas King was\nprimarily interested in reform of society. As a protest against the\nMexican War, Thoreau refused to pay taxes, but he did not hope by his\naction to force a change in national policy. While he encouraged others\nto adopt similar protests, he did not attempt to mount any mass protest\naction against unjust laws. In contrast to Thoreau, King began to\nadvocate the use of mass civil disobedience to effect revolutionary\nchanges within the social system.\n\nHowever, King's writings suggest that, without realizing it, he was an\nincipient transcendentalist. Most transcendentalists subscribed to the\nconcept of \"higher law\" and included civil disobedience to unjust laws\nas part of their strategy. They often invoked the concept of higher law\nto justify their opposition to slavery and to advocate disobedience to\nthe strengthened Fugitive Slave Law of 1850. In his second major book,\nKing's discussion of just and unjust laws and the responsibility of the\nindividual is very similar to the transcendentalists' discussion of\nhigher law. In reference to how one can advocate breaking some laws and\nobeying others, King notes that there are two types of laws, just and\nunjust; he describes a just law as a \"code that squares with (square\nwith: ()...[]) the moral law \" and\nan unjust law as a \"code that is out of harmony with the moral law.\"\nThus, King's opposition to the injustice of legalized segregation in the\ntwentieth century is philosophically akin to the transcendentalists'\nopposition to the Fugitive Slave Law in the nineteenth century."],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: discuss the reasoning behind and shortcomings of certain social\npsychological theories.\n\n# lsat 12 section iii\n\ntime 35 minutes 26 questions\n\ndirections: each passage in this section is followed by a group of\nquestions to be answered on the basis of what is stated or implied in\nthe passage. for some of the questions, more than one of the choices\ncould conceivably answer the question. however, you are to choose the\nbest answer, that is, the response that most accurately and completely\nanswers the question, and blacken the corresponding space on your answer\nsheet.\n\nnearly every writer on the philosophy of civil rights activist martin\nluther king, jr., makes a connection between king and henry david\nthoreau, usually via thoreau's famous essay, \"civil disobedience\"\n(1849). in his book stride toward freedom (1958), king himself stated\nthat thoreau's essay was his first intellectual contact with the theory\nof passive resistance to governmental laws that are perceived as morally\nunjust. however, this emphasis on thoreau's influence on king is\nunfortunate: first, king would not have agreed with many other aspects\nof thoreau's philosophy, including thoreau's ultimate acceptance of\nviolence as a form of protest; second, an overemphasis on the influence\nof one essay has kept historians from noting other correspondences\nbetween king's philosophy and transcendentalism (1: a philosophy that\nemphasizes the a priori conditions of knowledge and experience or the\nunknowable character of ultimate reality or that emphasizes the\ntranscendent as the fundamental reality; 2: a philosophy that asserts\nthe primacy of the spiritual and transcendental over the material and\nempirical). \"civil disobedience\" was the only example of\ntranscendentalist writing with which king was familiar, and in many\nother transcendentalist writings, including works by ralph waldo emerson\nand margaret fuller, king would have found ideas more nearly akin to his\nown.\n\nthe kind of civil disobedience king had in mind was, in fact, quite\ndifferent from thoreau's view of civil disobedience . thoreau, like most other transcendentalists,\nwas primarily interested in reform of the individual, whereas king was\nprimarily interested in reform of society. as a protest against the\nmexican war, thoreau refused to pay taxes, but he did not hope by his\naction to force a change in national policy. while he encouraged others\nto adopt similar protests, he did not attempt to mount any mass protest\naction against unjust laws. in contrast to thoreau, king began to\nadvocate the use of mass civil disobedience to effect revolutionary\nchanges within the social system.\n\nhowever, king's writings suggest that, without realizing it, he was an\nincipient transcendentalist. most transcendentalists subscribed to the\nconcept of \"higher law\" and included civil disobedience to unjust laws\nas part of their strategy. they often invoked the concept of higher law\nto justify their opposition to slavery and to advocate disobedience to\nthe strengthened fugitive slave law of 1850. in his second major book,\nking's discussion of just and unjust laws and the responsibility of the\nindividual is very similar to the transcendentalists' discussion of\nhigher law. in reference to how one can advocate breaking some laws and\nobeying others, king notes that there are two types of laws, just and\nunjust; he describes a just law as a \"code that squares with (square\nwith: ()...[]) the moral law \" and\nan unjust law as a \"code that is out of harmony with the moral law.\"\nthus, king's opposition to the injustice of legalized segregation in the\ntwentieth century is philosophically akin to the transcendentalists'\nopposition to the fugitive slave law in the nineteenth century. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."}]},"45":{"id":45,"title":"Nearly every writer on the philosophy of civil rights activist Martin Luther King,","difficulty":"Moderate","passage":"Nearly every writer on the philosophy of civil rights activist Martin Luther King, Jr., makes a connection between King and Henry David Thoreau, usually via Thoreau's famous essay, \"Civil Disobedience\" (1849). In his book Stride Toward Freedom (1958), King himself stated that Thoreau's essay was his first intellectual contact with the theory of passive resistance to governmental laws that are perceived as morally unjust. However, this emphasis on Thoreau's influence on King is unfortunate: first, King would not have agreed with many other aspects of Thoreau's philosophy, including Thoreau's ultimate acceptance of violence as a form of protest; second, an overemphasis on the influence of one essay has kept historians from noting other correspondences between King's philosophy and transcendentalism. \"Civil Disobedience\" was the only example of transcendentalist writing with which King was familiar, and in many other transcendentalist writings, including works by Ralph Waldo Emerson and Margaret Fuller, King would have found ideas more nearly akin to his own.\n\nThe kind of civil disobedience King had in mind was, in fact, quite different from Thoreau's view of civil disobedience. Thoreau, like most other transcendentalists, was primarily interested in reform of the individual, whereas King was primarily interested in reform of society. As a protest against the Mexican War, Thoreau refused to pay taxes, but he did not hope by his action to force a change in national policy. While he encouraged others to adopt similar protests, he did not attempt to mount any mass protest action against unjust laws. In contrast to Thoreau, King began to advocate the use of mass civil disobedience to effect revolutionary changes within the social system.\n\nHowever, King's writings suggest that, without realizing it, he was an incipient transcendentalist. Most transcendentalists subscribed to the concept of \"higher law\" and included civil disobedience to unjust laws as part of their strategy. They often invoked the concept of higher law to justify their opposition to slavery and to advocate disobedience to the strengthened Fugitive Slave Law of 1850. In his second major book, King's discussion of just and unjust laws and the responsibility of the individual is very similar to the transcendentalists' discussion of higher law. In reference to how one can advocate breaking some laws and obeying others, King notes that there are two types of laws, just and unjust; he describes a just law as a \"code that squares with...[]) the moral law \" and an unjust law as a \"code that is out of harmony with the moral law.\" Thus, King's opposition to the injustice of legalized segregation in the twentieth century is philosophically akin to the transcendentalists' opposition to the Fugitive Slave Law in the nineteenth century.","questions":[{"id":1,"question":"Which one of the following best states the main idea of the passage?","options":["King's philosophy was more influenced by Thoreau's essay on civil\ndisobedience than by any other writing of the transcendentalists.","While historians may have overestimated Thoreau's influence on\nKing, King was greatly influenced by a number of the transcendentalist\nphilosophers.","Thoreau's and King's views on civil disobedience differed in that\nKing was more concerned with the social reform than with the economic\nreform of society.","Although historians have overemphasized Thoreau's influence on\nKing, there are parallels between King's philosophy and\ntranscendentalism that have not been fully appreciated."],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: although historians have overemphasized thoreau's influence on\nking, there are parallels between king's philosophy and\ntranscendentalism that have not been fully appreciated. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"Which one of the following statements about \"Civil Disobedience\"\nwould the author consider most accurate?","options":["It was not King's first contact with the concept of passive\nresistance to unjust laws.","It was one of many examples of transcendentalist writing with\nwhich King was familiar.","It provided King with a model for using passive resistance to\neffect social change.","It influenced King's philosophy on passive resistance to unjust\nlaws."],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: it influenced king's philosophy on passive resistance to unjust\nlaws. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":3,"question":"In the first paragraph, the author is primarily concerned with","options":["chronicling the development of King's philosophy on passive\nresistance to unjust law","suggesting that a common emphasis on one influence on King's\nphilosophy has been misleading","providing new information about the influence of twentieth-century\nphilosophers on King's work","summarizing the work of historians of the most important\ninfluences on King's philosophy"],"correct":1,"explanation":"The correct answer is option B. The passage supports this answer: suggesting that a common emphasis on one influence on king's\nphilosophy has been misleading. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":4,"question":"According to the passage, which one of the following is true of'\nEmerson and Fuller?","options":["Some of their ideas were less typical of transcendentalism than\nwere some of Thoreau's ideas.","They were more concerned with the reform of society than with the\nreform of the individual.","They would have been more likely than Thoreau to agree with King\non the necessity of mass protest in civil disobedience.","Some of their ideas were more similar to King's than were some of\nThoreau's."],"correct":3,"explanation":"The correct answer is option D. The passage explicitly states or directly supports that some of their ideas were more similar to king's than were some of\nthoreau's. This information is stated in the passage, making it the most accurate answer based on the text."},{"id":5,"question":"According to the passage, King differed from most transcendentalists\nin that he","options":["opposed violence as a form of civil protest","opposed war as an instrument of foreign policy under any\ncircumstances","believed that just laws had an inherent moral value","was more interested in reforming society than in reforming the\nindividual"],"correct":3,"explanation":"The correct answer is option D. The passage explicitly states or directly supports that was more interested in reforming society than in reforming the\nindividual. This information is stated in the passage, making it the most accurate answer based on the text."},{"id":6,"question":"The passage suggests which one of the following about Thoreau?","options":["He was the first to develop fully the theory of civil\ndisobedience.","His work has had a greater influence on contemporary thinkers than\nhas the work of Emerson and Fuller.","His philosophy does not contain all of the same elements as the\nphilosophies of the other transcendentalists.","He advocated using civil disobedience to force the federal\ngovernment to change its policies on war."],"correct":2,"explanation":"The correct answer is option C. This can be inferred from the passage. The passage provides evidence that supports the conclusion that his philosophy does not contain all of the same elements as the\nphilosophies of the other transcendentalists. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."}]},"46":{"id":46,"title":"In Democracies and its Critics, Robert Dahl defends both democratic value and","difficulty":"Moderate","passage":"In Democracies and its Critics, Robert Dahl defends both democratic value and pluralist democracies, or polyarchies (a rough shorthand term for Western political systems). Dahl argues convincingly that the idea of democracy rests on political equality—the equality capacity of all citizens to determine or influence collective decisions. Of course, as Dahl recognizes, if hierarchical ordering is inevitable in any structure of government, and if no society can guarantee perfect equality in the resources that may give rise to political influence, the democratic principle of political equality is incapable of full realization. So actual systems can be deemed democratic only as approximations to the ideal. It is on these grounds that Dahl defends polyarchy.\n\nAs a representative system in which elected officials both determine government policy and are accountable to a broad-based electorate, polyarchy reinforces a diffusion of power away from any single center and toward a variety of individuals, groups, and organizations. It is this centrifugal characteristic, Dahl argues, that makes polyarchy the nearest possible approximation to the democratic ideal. Polyarchy achieves this diffusion of power through party competition and the operation of pressure groups. Competing for votes, parties seek to offer different sections of the electorate what they most want; they do not ask what the majority thinks of an issue, but what policy commitments will sway the electoral decisions of particular groups. Equally, groups that have strong feelings about an issue can organize in pressure groups to influence public policy.\n\nDuring the 1960s and 1970s, criticism of the theory of pluralist democracy was vigorous. Many critics pointed to a gap between the model and the reality of Western political systems. They argued that the distribution of power resources other than the vote was so uneven that the political order systematically gave added weight to those who were already richer or organizationally more powerful. So the power of some groups to exclude issues altogether from the political agenda effectively countered any diffusion of influence on decision-making.\n\nAlthough such criticism became subdued during the 1980s, Dahl himself seems to support some of the earlier criticism. Although he regrets that some Western intellectuals demand more democracy from polyarchies than is possible, and is cautious about the possibility of further democratization, he nevertheless ends his book by asking what changes in structures and consciousness might make political life more democratic in present polyarchies. One answer, he suggests, is to look at the economic order of polyarchies from the point of view of the citizen as well as from that of producers and consumers. This would require a critical examination of both the distribution of those economic resources that are at the same time political resources, and the relationship between political structures and economic enterprises.","questions":[{"id":1,"question":"The characterization of polyarchies as \"centrifugal\" (line 22)\nemphasizes the","options":["way in which political power is decentralized in a polyarchy","central role of power resources in a polyarchy","kind of concentrated power that political parties generate in a\npolyarchy","dynamic balance that exists between economic enterprises and\nelected officials in a polyarchy"],"correct":0,"explanation":"The correct answer is option A. The passage supports this answer: way in which political power is decentralized in a polyarchy. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"In the third paragraph, the author of the passage refers to\ncriticism of the theory of polyarchy democracy primarily in order to","options":["refute Dahl's statement that Western intellectuals expect more\ndemocracy from polyarchies than is possible","advocate the need for rethinking the basic principles on which the\ntheory of democracy rests","suggest that the structure of government within pluralist\ndemocracies should be changed","point out an objection to Dahl's defense of polyarchy"],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: point out an objection to dahl's defense of polyarchy. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":3,"question":"According to the passage, the aim of a political party in a\npolyarchy is to do which one of the following?","options":["determine what the position of the majority of voters is on a\nparticular issue","determine what position on an issue will earn the support of\nparticular groups of voters","organize voters into pressure groups in order to influence public\npolicy on a particular issue","ensure that elected officials accurately represent the position of\nthe party on specific issue"],"correct":1,"explanation":"The correct answer is option B. The passage explicitly states or directly supports that determine what position on an issue will earn the support of\nparticular groups of voters. This information is stated in the passage, making it the most accurate answer based on the text."},{"id":4,"question":"It can be inferred from the passage that Dahl assumes which one of\nthe following in his defense of polyarchies?","options":["Polyarchies are limited in the extent to which they can embody the\nidea of democracy.","The structure of polyarchical governments is free of hierarchical\nordering.","The citizens of a polyarchy have equal access to the resources\nthat provide political influence.","Polyarchy is the best political system to foster the growth of\npolitical parties."],"correct":0,"explanation":"The correct answer is option A. This can be inferred from the passage. The passage provides evidence that supports the conclusion that polyarchies are limited in the extent to which they can embody the\nidea of democracy. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":5,"question":"Which one of the following is most closely analogous to pluralist\ndemocracies as they are described in relation to the democratic\nprinciple of political equality?","options":["an exact copy of an ancient artifact that is on display in a\nmuseum","a performance of a musical score whose range of tonality cannot be\ncompletely captured by any actual instruments","a lecture by a former astronaut to a class of young students who\nwould like to be astronauts","the commemoration of a historical event each year by a historian\npresenting a lecture on a topic related to the event"],"correct":1,"explanation":"The correct answer is option B. The passage supports this answer: a performance of a musical score whose range of tonality cannot be\ncompletely captured by any actual instruments. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":6,"question":"Which one of the following, if true, would most strengthen Dahl's\ndefense of polyarchy?","options":["The political agenda in a polyarchy is strongly influenced by how\npower resources other than the vote are distributed.","The outcome of elections is more often determined by the financial\nresources candidates are able to spend during campaigns than by their\nstands on political issue.","Public policy in a polyarchy is primarily determined by\ndecision-makers who are not accountable to elected officials.","Small and diverse pressure groups are able to exert as much\ninfluence on public policy in a polyarchy as are large and powerful\ngroups."],"correct":3,"explanation":"The correct answer is option D. This option most directly addresses the argument in question. It provides evidence or reasoning that bears on the claim being evaluated, while the other options are either irrelevant, supportive of the wrong conclusion, or do not address the specific argument."}]},"47":{"id":47,"title":"The old belief that climatic stability accounts for the high level of species","difficulty":"Moderate","passage":"The old belief that climatic stability accounts for the high level of species diversity in the Amazon River basin of South America emerged, strangely enough, from observations of the deep sea. Sanders discovered high diversity among the mud-dwelling animals of the deep ocean. He argued that such diversity could be attributed to the absence of significant fluctuations in climate and physical conditions, without which the extinction of species should be rare. In the course of time new species would continue to evolve, and so the rate of speciation would be greater than the rate of extinction, resulting in the accumulation of great diversity. Sanders argued that the Amazon tropical rain forest is analogous to the deep sea: because the rain forest has a stable climate, extinction should be rare. Evidence that some species of rain-forest trees have persisted for some 30 million years in the Amazon basin, added to the absence of winter and glaciation, supports this view.\n\nRecently however, several observations have cast doubt on the validity of the stability hypothesis and suggest that the climate of the Amazon basin has fluctuated significantly in the past. Haffer noted that different species of birds inhabit different corners of the basin in spite of the fact that essentially unbroken green forest spreads from the western edge to the eastern edge of the region. This pattern presented a puzzle to biologists studying the distributions of plants and animals: why would different species inhabit different parts of the forest if the habitat in which they lived had a stable climate?\n\nHaffer proposed a compelling explanation for the distribution of species. Observing that species found on high ground are different from those on low ground and knowing that in the Amazon lowlands are drier than uplands, he proposed that during the ice ages the Amazon lowlands became a near-desert arid plain; meanwhile, the more elevated regions became islands of moisture and hence served as refuges for the fauna and flora of the rain forest. Populations that were once continuous diverged and became permanently separated. Haffer's hypothesis appears to explain the distribution of species as well as the unusual species diversity. The ice-age refuges would have protected existing species from extinction. But the periodic geographic isolation of related populations (there have been an estimated 13 ice ages to date) would have facilitated the development of new species as existing species on the lowlands adapted to changing climates.\n\nAlthough no conclusive proof has yet been found to support Haffer's hypothesis, it has led other researchers to gauge the effects of climatic changes, such as storms and flooding, on species diversity in the Amazon basin. Their research suggests that climatic disturbances help account for the splendid diversity of the Amazon rain forest.","questions":[{"id":1,"question":"As discussed in the first paragraph of the passage, Sanders'\nanalogy between the deep sea and the Amazon basin involves which one of\nthe following assumptions?","options":["Both the Amazon basin and the deep sea support an unusually high\nrate of speciation.","Both the rain-forest trees in the Amazon basin and the\nmud-dwelling animals in the deep sea have survived for 30 million years.","Both the deep sea and the Amazon basin have not experienced\ndramatic changes in climate or physical conditions.","A dependable supply of water to the Amazon basin and the deep sea\nhas moderated the rate of extinction in both habitats."],"correct":2,"explanation":"The correct answer is option C. The passage supports this answer: both the deep sea and the amazon basin have not experienced\ndramatic changes in climate or physical conditions. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"The author of the passage would most likely agree with which one of\nthe following statements about Haffer's hypothesis?","options":["It provides an intriguing and complete explanation for the high\nrate of species diversity in the Amazon basin.","It is partially correct in that a number of climatic disturbances\naccount for species diversity in the Amazon basin.","It has not yet been verified, but it has had an influential effect\non current research on species diversity in the Amazon basin.","It is better than Sanders' theory in accounting for the low rate\nof species extinction in the Amazon basin."],"correct":2,"explanation":"The correct answer is option C. Based on the arguments and positions presented in the passage, the author would most likely agree that it has not yet been verified, but it has had an influential effect\non current research on species diversity in the amazon basin. This aligns with the overall thrust of the author's argument."},{"id":3,"question":"According to the passage, lowlands in the Amazon basin currently\ndiffer from uplands in which one of the following respects?","options":["Lowlands are desertlike, whereas uplands are lush.","Lowlands are less vulnerable to glaciation during the ice ages\nthan are uplands.","Uplands support a greater diversity of species than do lowlands.","Uplands are wetter than are lowlands."],"correct":3,"explanation":"The correct answer is option D. The passage explicitly states or directly supports that uplands are wetter than are lowlands. This information is stated in the passage, making it the most accurate answer based on the text."},{"id":4,"question":"Which one of the following best describes the organization of the\npassage?","options":["A hypothesis is discussed, evidence that undercuts that hypothesis\nis presented and a new hypothesis that may account for the evidence is\ndescribed.","A recently observed phenomenon is described, an explanation for\nthat phenomenon is discussed, and the explanation is evaluated in light\nof previous research findings.","Several hypotheses that may account for a puzzling phenomenon are\ndescribed and discounted, and a more promising hypothesis is presented.","A hypothesis and the assumptions on which it is based are\ndescribed, and evidence is provided to suggest that the hypothesis is\nonly partially correct."],"correct":0,"explanation":"The correct answer is option A. The passage supports this answer: a hypothesis is discussed, evidence that undercuts that hypothesis\nis presented and a new hypothesis that may account for the evidence is\ndescribed. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":5,"question":"The author of the passage mentions the number of ice ages in the\nthird paragraph most probably in order to","options":["provide proof that cooler and drier temperatures are primarily\nresponsible for the distribution of species in the Amazon","explain how populations of species were protected from extinction\nin the Amazon basin","explain how most existing species were able to survive periodic\nclimatic disturbances in the Amazon basin","suggest that geographic isolation may have occurred often enough\nto cause high species diversity in the Amazon basin"],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: suggest that geographic isolation may have occurred often enough\nto cause high species diversity in the amazon basin. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":6,"question":"The passage suggests that which one of the following is true of\nSanders' hypothesis?","options":["He underestimated the effects of winter and glaciation in the\nAmazon basin on the tropical rain forest.","He failed to recognize the similarity in physical conditions of\nthe Amazon lowlands and the Amazon uplands.","He failed to take into a count the relatively high rate of\nextinction during the ice ages in the Amazon basin.","He failed to account for the distribution of species in the Amazon\nbasin."],"correct":3,"explanation":"The correct answer is option D. This can be inferred from the passage. The passage provides evidence that supports the conclusion that he failed to account for the distribution of species in the amazon\nbasin. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."}]},"48":{"id":48,"title":"Although surveys of medieval legislation, guild organization, and terminology used","difficulty":"Moderate","passage":"Although surveys of medieval legislation, guild organization, and terminology used to designate different medical practitioners have demonstrated that numerous medical specialties were recognized in Europe during the Middle Ages, most historians continue to equate the term \"woman medical practitioner,\" wherever they encounter it in medieval records, with \"midwife.\" This common practice obscures the fact that, although women were not represented on all levels of medicine equally, they were represented in a variety of specialties throughout the broad medical community. A reliable study by Wickersheimer and Jacquart documents that of 7,647 medical practitioners in France during the twelfth through fifteenth centuries, 121 were women; of these, only 44 were identified as midwives, while the rest practiced as physicians, surgeons, apothecaries, barbers, and other healers.\n\nWhile preserving terminological distinctions somewhat increases the quality of the information extracted from medieval documents concerning women medical practitioners, scholars must also reopen the whole question of why documentary evidence for women medical practitioners comprises such a tiny fraction of the evidence historians of medieval medicine usually present. Is this due to the limitations of the historical record, as has been claimed, or does it also result from the methods historians use? Granted, apart from medical licenses, the principal sources of information regarding medical practitioners available to researchers are wills, property transfers, court records, and similar documents, all of which typically underrepresent women because of restrictive medieval legal traditions. Nonetheless, the parameters researchers choose when they define their investigations may contribute to the problem. Studies focusing on the upper echelons of \"learned\" medicine, for example, tend to exclude healers on the legal and social fringes of medical practice, where most women would have been found.\n\nThe advantages of broadening the scope of such studies is immediately apparent in Pelling and Webster's study of sixteenth-century London. Instead of focusing solely on officially recognized and licensed practitioners, the researchers defined a medical practitioner as \"any individual whose occupation is basically concerned with the care of the sick.\" Using this definition, they found primary source information suggesting that there were 60 women medical practitioners in the city of London in 1560. Although this figure may be slightly exaggerated, the evidence contrasts strikingly with that of Gottfried, whose earlier survey identified only 28 women medical practitioners in all of England between 1330 and 1530.\n\nFinally, such studies provide only statistical information about the variety and prevalence of women's medical practice in medieval Europe. Future studies might also make profitable use of analyses developed in other areas of women's history as a basis for exploring the social context of women's medical practice. Information about economic rivalry in medicine, women's literacy, and the control of medical knowledge could add much to our growing understanding of women medical practitioners' role in medieval society.","questions":[{"id":1,"question":"Which one of the following best expresses the main point of the\npassage?","options":["Recent studies demonstrate that women medical practitioners were\nmore common in England than in the rest of Western Europe during the\nMiddle Ages.","The quantity and quality of the information historians uncover\nconcerning women's medical practice in medieval Europe would be improved\nif they changed their methods of study.","The sparse evidence for women medical practitioners in studies\ndealing with the Middle Ages is due primarily to the limitations of the\nhistorical record.","Knowledge about the social issues that influenced the role women\nmedical practitioners played in medieval society has been enhanced by\nseveral recent studies."],"correct":1,"explanation":"The correct answer is option B. The passage supports this answer: the quantity and quality of the information historians uncover\nconcerning women's medical practice in medieval europe would be improved\nif they changed their methods of study. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"Which one of the following is most closely analogous to the error\nthe author believes historians make when they equate the term \"woman\nmedical practitioner\" with \"midwife\"?","options":["equating pear with apple","equating science with biology","equating supervisor with subordinate","equating member with nonmember"],"correct":1,"explanation":"The correct answer is option B. The passage supports this answer: equating science with biology. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":3,"question":"It can be inferred from the passage that the author would be most\nlikely to agree with which one of the following assertions regarding\nGottfried's study?","options":["Gottfried's study would have recorded a much larger number of\nwomen medical practitioners if the time frame covered by the study had\nincluded the late sixteenth century.","The small number of women medical practitioners identified in\nGottfried's study is due primarily to problems caused by inaccurate\nsources.","The small number of women medical practitioners identified in\nGottfried's study is due primarily to the loss of many medieval\ndocuments.","In setting the parameters for his study. Gottfried appears to have\ndefined the term \"medical practitioner\" very narrowly."],"correct":3,"explanation":"The correct answer is option D. This can be inferred from the passage. The passage provides evidence that supports the conclusion that in setting the parameters for his study. gottfried appears to have\ndefined the term \"medical practitioner\" very narrowly. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":4,"question":"The passage suggests that a future study that would be more\ninformative about medieval women medical practitioners might focus on\nwhich one of the following?","options":["the effect of social change on the political and economic\nstructure of medieval society","the effect of social constraints on medieval women's access to a\nmedical education","the types of medical specialties that developed during the Middle\nAges","the reasons why medieval historians tend to equate the term \"woman\nmedical practitioner\" with midwife"],"correct":1,"explanation":"The correct answer is option B. This can be inferred from the passage. The passage provides evidence that supports the conclusion that the effect of social constraints on medieval women's access to a\nmedical education. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":5,"question":"The author refers to the study by Wickersheimer and Jacquart in\norder to","options":["demonstrate that numerous medical specialties were recognized in\nWestern Europe during the Middle Ages","demonstrate that women are often underrepresented in studies of\nmedieval medical practitioners","prove that midwives were officially recognized as members of the\nmedical community during the Middle Ages","prove that midwives were only a part of a larger community of\nwomen medical practitioners during the Middle Ages"],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: prove that midwives were only a part of a larger community of\nwomen medical practitioners during the middle ages. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":6,"question":"In the passage, the author is primarily concerned with doing which\none of the following?","options":["describing new methodological approaches","revising the definitions of certain concepts","comparing two different analyses","arguing in favor of changes in method"],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: arguing in favor of changes in method. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."}]},"49":{"id":49,"title":"Modern architecture has been criticized for emphasizing practical and technical","difficulty":"Moderate","passage":"Modern architecture has been criticized for emphasizing practical and technical issues at the expense of aesthetic concerns. The high-rise buildings constructed throughout the industrialized world in the 1960s and 1970s provide ample evidence that cost-efficiency and utility have became the overriding concerns of the modern architect. However, Otto Wagner's seminal text on modern architecture, first published in Germany in 1896, indicates that the failure of modern architecture cannot be blamed on the ideals of its founders.\n\nWagner's Modern Architecture called for a new style based on modern technologies and models of construction. He insisted that there could be no return to traditional, preindustrial models; only by accepting wholeheartedly the political and technological revolutions of the nineteenth century could the architect establish the forms appropriate to a modern, urban society. \"All modern creation,\" Wagner wrote, \"must correspond to the new materials and demands of the present...must illustrate our own better, democratic, self-confident, ideal nature,\" and must incorporate the new \"colossal technical and scientific achievements\" of the age. This would indeed seem to be the basis of a purely materialist definition of architecture, a prototype for the simplistic form-follows-function dogma that opponents have identified as the intellectual basis of modern architecture.\n\nBut the picture was more complex, for Wagner was always careful to distinguish between art and engineering. Ultimately, he envisaged (to have a mental picture of especially in advance of realization \"envisages an entirely new system of education\") the architect developing the skills of the engineer without losing the powers of aesthetic judgment that Wagner felt were unique to the artist. \"Since the engineer is seldom a born artist and the architect must learn as a rule to be an engineer, architects will in time succeed in extending their influence into the realm occupied by the engineers, so that legitimate aesthetic demands can be met in a satisfactory way.\" In this symbiotic relationship essential to Modernism, art was to exercise the controlling influence.\n\nNo other prospect was imaginable for Wagner, who was firmly rooted as a designer and, indeed, as a teacher in the Classical tradition. The apparent inconsistency of a confessed Classicist advising against the mechanical imitation of historical models and arguing for new forms appropriate to the modern age created exactly the tension that made Wagner's writings and buildings so interesting. While he justified, for example, the choice of a circular ground plan for churches in terms of optimal sight-lines and the technology of the gasometer, the true inspiration was derived from the centralized churches of the Italian Renaissance. He acknowledged as rationalist that there was no way back to the social and technological conditions that had produced the work of Michelangelo or Fischer von Erlach, but he recognized his emotional attachment to the great works of the Italian Renaissance and Austrian Baroque.","questions":[{"id":1,"question":"Which one of the following best expresses the main idea of the\npassage?","options":["Modern architecture has been criticized for emphasizing practical\nand technical issues and for failing to focus on aesthetic concerns.","Critics have failed to take into account the technological\ninnovations and aesthetic features that architects have incorporated\ninto modern buildings.","Wagner's Modern Architecture provides architects with a\nchronicle of the origins of modern architecture.","Wagner's Modern Architecture indicates that the founders of\nmodern architecture did not believe that practical issues should\nsupersede the aesthetic concerns of the past."],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: wagner's modern architecture indicates that the founders of\nmodern architecture did not believe that practical issues should\nsupersede the aesthetic concerns of the past. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"According to the passage, Wagner asserts which one of the following\nabout the roles of architect and engineer?","options":["The architect should make decision about aesthetic issues and\nleave decision about technical matters to the engineers.","The engineer has often developed the powers of aesthetic judgment\npreviously thought to be unique to the architect.","The judgment of the engineer should be as important as the\njudgment of the architect when decisions are made about aesthetic\nissues.","The architect should acquire the knowledge of technical matters\ntypically held by the engineer."],"correct":3,"explanation":"The correct answer is option D. The passage explicitly states or directly supports that the architect should acquire the knowledge of technical matters\ntypically held by the engineer. This information is stated in the passage, making it the most accurate answer based on the text."},{"id":3,"question":"The passage suggests that Wagner would be LEAST likely to agree with\nwhich one of the following statements about classical architecture and\nthe modern architect?","options":["The modern architect should avoid the mechanical imitation of the\nmodels of the Italian Renaissance and Austrian Baroque.","The modern architect cannot design buildings appropriate to a\nmodern, urban society and still retain emotional attachments to the\nforms of the Italian Renaissance and Austrian Baroque.","The modern architect should possess knowledge of engineering as\nwell as of the architecture of the past.","The modern architect should not base designs on the technological\nconditions that underlay the design of the models of the Italian\nRenaissance and Austrian Baroque."],"correct":1,"explanation":"The correct answer is option B. This can be inferred from the passage. The passage provides evidence that supports the conclusion that the modern architect cannot design buildings appropriate to a\nmodern, urban society and still retain emotional attachments to the\nforms of the italian renaissance and austrian baroque. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":4,"question":"The passage suggests which one of the following about the quotations\nfrom Modern Architecture cited in the second paragraph?","options":["They represent the part of Wagner's work that has had the least\ninfluence on the architects who designed the high-rise buildings of the\n1960s and 1970s.","They describe the part of Wagner's work that is most often evoked\nby proponents of Wagner's ideas on art and technology.","They do not adequately reflect the complexity of Wagner's ideas on\nthe use of modern technology in architecture.","They reflect Wagner's active participation in the political\nrevolutions of the nineteenth century."],"correct":2,"explanation":"The correct answer is option C. This can be inferred from the passage. The passage provides evidence that supports the conclusion that they do not adequately reflect the complexity of wagner's ideas on\nthe use of modern technology in architecture. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":5,"question":"The author of the passage states which one of the following about\nthe concerns of modern architecture?","options":["Cost-efficiency, utility, and aesthetic demands are the primary\nconcerns of the modern architect.","Practical issues supersede aesthetic concerns in the design of\nmany modern buildings.","Cost-efficiency is more important to the modern architects than\nare other practical concerns.","The design of many new buildings suggests that modern architects\nare still inspired by architectural forms of the past."],"correct":1,"explanation":"The correct answer is option B. The passage supports this answer: practical issues supersede aesthetic concerns in the design of\nmany modern buildings. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":6,"question":"The author mentions Wagner's choice of a \"circular ground plan for\nchurches\" (line 54) most likely in order to","options":["provide an example of the kinds of technological innovations\nWagner introduced into modern architecture","provide an example of Wagner's dismissal of historical forms from\nItalian Renaissance","provide an example of a modern building where technological issues\nwere much less significant than aesthetic demands","provide evidence of the tension between Wagner's commitment to\nmodern technology and to the Classical tradition"],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: provide evidence of the tension between wagner's commitment to\nmodern technology and to the classical tradition. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."}]},"50":{"id":50,"title":"In order to explain the socioeconomic achievement, in the face of disadvantages due","difficulty":"Moderate","passage":"In order to explain the socioeconomic achievement, in the face of disadvantages due to racial discrimination, of Chinese and Japanese immigration to the United States and their descendants, sociologists have typically applied either culturally based or structurally based theories—but never both together. To use an economic metaphor, culturally based explanations assert the importance of the supply side of the labor market, emphasizing the qualities immigrant groups bring with them for competition in the United States labor market. Such explanations reflect a human-capital perspective in which status attainment is seen as a result of individuals' ability to generate resources. Structurally based explanations, on the other hand, examine the market condition of the immigrants' host society, particularly its discriminatory practices and their impact on the status attainment process of immigrant groups. In the economic metaphor, structural explanations assert the importance of the demand side of the labor market.\n\nIn order to understand the socioeconomic mobility of Chinese and Japanese immigrants and their descendants, only an analysis of supply-side and demand-side factors together, in the context of historical events, will suffice. On the cultural or supply side, differences in immigration pattern and family formation resulted in different rates of socioeconomic achievement for Chinese and Japanese immigrants. For various reasons, Chinese immigrants remained sojourners and did not (except for urban merchants) establish families. They were also hampered by ethnic conflict in the labor market. Japanese immigrants, on the other hand, were less constrained, made the transition from sojourner to settler within the first two decades of immigration, and left low-wage labor to establish small businesses based on a household mode of production. Chinese sojourners without families were more vulnerable to demoralization, whereas Japanese immigrants faced societal hostility with the emotional resources provide by a stable family life. Once Chinese immigrants began to establish nuclear families and produce a second generation, instituting household production similar to that established by Japanese immigrants, their socioeconomic attainment soon paralleled that of Japanese immigrants and their descendants.\n\nOn the structural or demand side, changes in institutional constraints, immigration laws, labor markets, and societal hostility were rooted in the dynamics of capitalist economic development. Early capitalist development generated a demand for low-wage labor that could not be fulfilled. Early Chinese and Japanese emigration was a response to this demand. In an advanced capitalist economy, the demand for immigrant labor is more differentiated: skilled professional and technical labor fills empty positions in the primary labor market and, with the traditional unskilled low-wage labor, creates two immigrant streams. The high levels of education attained by the descendants of Chinese and Japanese immigrants and their concentration in strategic states such as California paved the way for the movement of the second generation into the expanding primary labor market in the advanced capitalist economy that existed after the Second World War.","questions":[{"id":1,"question":"Which one of the following best expresses the main idea of the\npassage?","options":["The socioeconomic achievement of Chinese and Japanese immigrants\nand their descendants is best explained by a historical examination of\nthe economic structures prevalent in the United States when such\nimmigrant groups arrived.","The socioeconomic achievement of Chinese and Japanese immigrants\nand their descendants is best explained by an examination of their\ncultural backgrounds, in particular their level of educational\nattainment.","The socioeconomic achievement of Chinese and Japanese immigrants\nand their descendants has taken place in the context of a culturally\nbased emphasis on the economic welfare of the nuclear family.","Only an analysis that combines an examination of the culture of\nChinese and Japanese immigrant groups and the socioeconomic structure of\nthe host country can adequately explain the socioeconomic achievement of\nChinese and Japanese immigrants and their descendants."],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: only an analysis that combines an examination of the culture of\nchinese and japanese immigrant groups and the socioeconomic structure of\nthe host country can adequately explain the socioeconomic achievement of\nchinese and japanese immigrants and their descendants. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"Which one of the following can best be described as a supply-side\nelement in the labor market, as such elements are explained in the\npassage?","options":["concentration of small businesses in a given geographical area","need for workers with varying degrees of skill","high value placed by immigrants on work","expansion of the primary labor market"],"correct":2,"explanation":"The correct answer is option C. The passage supports this answer: high value placed by immigrants on work. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":3,"question":"Which one of the following best states the function of the author's\nmention of \"two immigration streams\" (line 62)?","options":["It demonstrates the effects of changes in human capital.","It illustrates the operation of the primary labor market.","It explains the nature of early Chinese and Japanese immigration.","It characterizes the result of changing demand-side factors."],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: it characterizes the result of changing demand-side factors. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":4,"question":"It can be inferred that the author's analysis of the socioeconomic\nachievement of Chinese and Japanese immigrants and their descendants\ndiffers from that of most sociologists primarily in that most\nsociologists","options":["address the effects of the interaction of causal factors","exclude the factor of a developing capitalist economy","do not apply an economic metaphor","focus on a single type of theoretical explanation"],"correct":3,"explanation":"The correct answer is option D. This can be inferred from the passage. The passage provides evidence that supports the conclusion that focus on a single type of theoretical explanation. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":5,"question":"It can be inferred that which one of the following was an element\nof the experience of both Chinese and Japanese immigrants in the United\nStates?","options":["initial status as sojourners","slow accumulation of capital","quick transition from laborer to manager","rapid establishment of nuclear families"],"correct":0,"explanation":"The correct answer is option A. This can be inferred from the passage. The passage provides evidence that supports the conclusion that initial status as sojourners. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":6,"question":"The author is primarily concerned with","options":["advancing a synthesis of approaches to an issue","challenging a tentative answer to a question","evaluating the soundness of theories","resolving the differences between schools of thought"],"correct":0,"explanation":"The correct answer is option A. The passage supports this answer: advancing a synthesis of approaches to an issue. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."}]},"51":{"id":51,"title":"Although the legal systems of England and the United States are superficially","difficulty":"Moderate","passage":"Although the legal systems of England and the United States are superficially similar, they differ profoundly in their approaches to and uses of legal reasons: substantive reasons in the United States, whereas in England the reverse is true. This distinction reflects a difference in the visions of law that prevail in the two counties. In England the law has traditionally been viewed as a system of rules; the United States favors a vision of law as an outward expression of the community's sense of right and justice.\n\nSubstantive reasons, as applied to law, are based on moral, economic, political, and other considerations. These reasons are found both \"in the law\" and \"outside the law,\" so to speak. Substantive reasons inform (to give character or essence to \"the principles which inform modern teaching\") the content of a large part of the law: constitutions, statutes, contracts, verdicts, and the like. Consider, for example, a statute providing (to make a proviso or stipulation) that \"no vehicles shall be taken into public parks\". Suppose that no specific rationales or purposes were explicitly written into this statute, but that it was clear (from its legislative history) that the substantive purpose of the statute was to ensure quiet and safety in the park. Now suppose that a veterans' group mounts a World War II jeep (in running order but without a battery) as a war memorial on a concrete slab in the park, and charges are brought against its members. Most judges in the United States would find the defendants not guilty because what they did had no adverse effect on park quiet and safety.\n\nFormal reasons are different in that they frequently prevent substantive reasons from coming into play, even when substantive reasons are explicitly incorporated into the law at hand. For example, when a document fails to comply with stipulated requirements, the court may render the document legally ineffective. A will requiring written witness may be declared null and void and therefore, unenforceable for the formal reason that the requirement was not observed. Once the legal rule—that a will is invalid for lack of proper witnessing—has been clearly established, and the legality of the rule is not in question, application of that rule precludes from consideration substantive arguments in favor of the will's validity or enforcement.\n\nLegal scholars in England and the United States have long bemused themselves with extreme examples of formal and substantive reasoning. On the one hand, formal reasoning in England has led to wooden interpretations of statutes and an unwillingness to develop the common law through judicial activism. On the other hand, freewheeling substantive reasoning in the United States has resulted in statutory interpretations so liberal that the texts of some statutes have been ignored altogether.","questions":[{"id":1,"question":"Which one of the following best describes the content of the\npassage as a whole?","options":["an analysis of similarities and differences between the legal\nsystems of England and the United States","a reevaluation of two legal systems with the use of examples","a contrast between the types of reasons embodied in the United\nStates and England legal systems","an explanation of how two distinct visions of the law shaped the\ndevelopment of legal reasoning"],"correct":2,"explanation":"The correct answer is option C. The passage supports this answer: a contrast between the types of reasons embodied in the united\nstates and england legal systems. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"It can be inferred from the passage that English judges would be\nlikely to find the veterans' group discussed in the second paragraph\nguilty of violating the statute because","options":["not to do so would encourage others to act as the group did","not t
