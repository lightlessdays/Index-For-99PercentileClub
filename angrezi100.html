mployment, despite its disadvantages, provides working\nmothers with an opportunity to address some of the demands of caring for\nchildren."],"correct":3,"explanation":"The correct answer is option D. This can be inferred from the passage. The passage provides evidence that supports the conclusion that part-time employment, despite its disadvantages, provides working\nmothers with an opportunity to address some of the demands of caring for\nchildren. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":3,"question":"It can be inferred from the passage that the author would be most\nlikely to agree with which one of the following statements about working\nfathers in two-parent families?","options":["They are equally burdened by the employment disadvantages placed\nupon all parents---male and female---in the labor market.","They are so absorbed in their jobs that they often do not see the\ninjustice going on around them.","They are shielded by the traditional allocation of family roles\nfrom many of the pressures associated with child-rearing\nresponsibilities.","They help compound the inequities in the labor market by keeping\nwomen form competing with men for career opportunities."],"correct":2,"explanation":"The correct answer is option C. This can be inferred from the passage. The passage provides evidence that supports the conclusion that they are shielded by the traditional allocation of family roles\nfrom many of the pressures associated with child-rearing\nresponsibilities. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":4,"question":"Of the following, which one would the author most likely say is the\nmost troublesome barrier facing working parents with primary child-care\nresponsibility?","options":["the lack of full-time jobs open to women","the inflexibility of work schedules","the low wages of part-time employment","the limited advancement opportunities for nonprofessional\nemployees"],"correct":1,"explanation":"The correct answer is option B. The passage supports this answer: the inflexibility of work schedules. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":5,"question":"The passage suggests that day care is at best a limited solution to\nthe pressures associated with child rearing for all of the following\nreasons EXCEPT:","options":["Even the best day care available cannot guarantee that children\nwill have meaningful time with their parents.","Some parents cannot afford day-care services.","Working parents sometimes have difficulty finding suitable day\ncare for their children.","Parents who send their children to day care still need to provide\ncare for their children during vacations."],"correct":3,"explanation":"The correct answer is option D. This can be inferred from the passage. The passage provides evidence that supports the conclusion that parents who send their children to day care still need to provide\ncare for their children during vacations. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":6,"question":"According to the passage, many working parents may be forced to make\nany of the following types of career decisions EXCEPT","options":["declining professional positions for nonprofessional ones, which\ntypically have less conventional work schedules","accepting part-time employment rather than full-time employment","taking jobs with limited responsibility, and thus more limited\ncareer opportunities, in order to have a more flexible schedule","pursuing career specializations that allow them to control their\nwork schedules instead of pursuing a more desirable specialization in\nthe same field"],"correct":0,"explanation":"The correct answer is option A. The passage explicitly states or directly supports that declining professional positions for nonprofessional ones, which\ntypically have less conventional work schedules. This information is stated in the passage, making it the most accurate answer based on the text."}]},"26":{"id":26,"title":"Critics have long been puzzled by the inner contradictions of major characters in","difficulty":"Moderate","passage":"Critics have long been puzzled by the inner contradictions of major characters in John Webster's tragedies. In his The Duchess of Malfi, for instance, the Duchess is \"good\" in demonstrating the obvious tenderness and sincerity of her love for Antonio, but \"bad\" in ignoring the wishes and welfare of her family and in making religion a \"cloak\" hiding worldly self-indulgence. Bosola is \"bad\" in serving Ferdinand, \"good\" in turning the Duchess' thoughts toward heaven and in planning to avenge her murder. The ancient Greek philosopher Aristotle implied that such contradictions are virtually essential to the tragic personality, and yet critics keep coming back to this element of inconsistency as though it were an eccentric feature of Webster's own tragic vision.\n\nThe problem is that, as an Elizabethan playwright, Webster has become a prisoner of our critical presuppositions. We have, in recent years, been dazzled by the way the earlier Renaissance and medieval theater, particularly the morality play, illuminates Elizabethan drama. We now understand how the habit of mind that saw the world as a battleground between good and evil produced the morality play. Morality plays allegorized that conflict by presenting characters whose actions were defined as the embodiment of good or evil. This model of reality lived on, overlaid by different conventions, in the most sophisticated Elizabethan works of the following age. Yet Webster seems not to have been as heavily influenced by the morality play's model of reality as were his Elizabethan contemporaries; he was apparently more sensitive to the more morally complicated Italian drama than to these English sources. Consequently, his characters cannot be evaluated according to reductive formulas of good and evil, which is precisely what modern critics have tried to do. They choose what seem to be the most promising of the contradictor values that are dramatized in the play, and treat those values as if they were the only basis for analyzing the moral development of the play's major characters, attributing the inconsistencies in a character's behavior to artistic incompetence on Webster's part. The lack of consistency in Webster's characters can be better understood if we recognize that the ambiguity at the heart of his tragic vision lies not in the external world but in the duality of human nature. Webster establishes tension in his plays by setting up conflicting systems of value that appear immoral only when one value system is viewed exclusively from the perspective of the other. He presents us not only with characters that we condemn intellectually or ethically and at the same time impulsively approve of, but also with judgments we must accept as logically sound and yet find emotionally repulsive. The dilemma is not only dramatic: it is tragic, because the conflict is irreconcilable, and because it is ours as much as that of the characters.","questions":[{"id":1,"question":"The primary purpose of the passage is to","options":["clarify an ambiguous assertion","provide evidence in support of a commonly held view","analyze an unresolved question and propose an answer","offer an alternative to a flawed interpretation"],"correct":3,"explanation":"The correct answer is option D. The passage as a whole is primarily focused on this theme. While other options may touch on aspects mentioned in the passage, the central purpose is best captured by this answer: offer an alternative to a flawed interpretation."},{"id":2,"question":"The author suggests which one of the following about the dramatic\nworks that most influenced Webster's tragedies?","options":["They were not concerned with dramatizing the conflict between good\nand evil that was presented in morality plays.","They were not as sophisticated as the Italian sources from which\nother Elizabethan tragedies were derived.","They have never been adequately understood by critics.","They have only recently been used to illuminate the conventions of\nElizabethan drama."],"correct":0,"explanation":"The correct answer is option A. This can be inferred from the passage. The passage provides evidence that supports the conclusion that they were not concerned with dramatizing the conflict between good\nand evil that was presented in morality plays. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":3,"question":"The author's allusion to Aristotle's view of tragedy in lines 11-13\nserves which one of the following functions in the passage?","options":["It introduces a commonly held view of Webster's tragedies that the\nauthor plans to defend.","It supports the author's suggestion that Webster's conception of\ntragedy is not idiosyncratic.","It provides an example of an approach to Webster's tragedies that\nthe author criticizes.","It establishes the similarity between classical and modern\napproaches to tragedy."],"correct":1,"explanation":"The correct answer is option B. The passage supports this answer: it supports the author's suggestion that webster's conception of\ntragedy is not idiosyncratic. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":4,"question":"It can be inferred from the passage that modern critics'\ninterpretations of Webster's tragedies would be more valid if","options":["the ambiguity inherent in Webster's tragic vision resulted from\nthe duality of human nature","Webster's conception of the tragic personality were similar to\nthat of Aristotle","Webster had been heavily influenced by the morality play","Elizabethan dramatists had been more sensitive to Italian sources\nof influence"],"correct":2,"explanation":"The correct answer is option C. This can be inferred from the passage. The passage provides evidence that supports the conclusion that webster had been heavily influenced by the morality play. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":5,"question":"With which one of the following statements regarding Elizabethan\ndrama would the author be most likely to agree?","options":["The skill of Elizabethan dramatists has in recent years been\noverestimated.","The conventions that shaped Elizabethan drama are best exemplified\nby Webster's drama.","Elizabethan drama, for the most part, can be viewed as being\nheavily influenced by the morality play.","Only by carefully examining the work of his Elizabethan\ncontemporaries can Webster's achievement as a dramatist be accurately\nmeasured."],"correct":2,"explanation":"The correct answer is option C. The passage supports this answer: elizabethan drama, for the most part, can be viewed as being\nheavily influenced by the morality play. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":6,"question":"It can be inferred from the passage that most modern critics assume\nwhich one of the following in their interpretation of Webster's\ntragedies?","options":["Webster's play tended to allegorize the conflict between good and\nevil more than did those of his contemporaries.","Webster's plays were derived more from Italian than from English\nsources.","The artistic flaws in Webster's tragedies were largely the result\nof his ignorance of the classical definition of tragedy.","In writing his tragedies, Webster was influenced by the same\nsources as his contemporaries."],"correct":3,"explanation":"The correct answer is option D. This can be inferred from the passage. The passage provides evidence that supports the conclusion that in writing his tragedies, webster was influenced by the same\nsources as his contemporaries. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."}]},"27":{"id":27,"title":"Cultivation of a single crop on a given tract of land leads eventually to decreased","difficulty":"Moderate","passage":"Cultivation of a single crop on a given tract of land leads eventually to decreased yields. One reason for this is that harmful bacterial phytopathogens, organisms parasitic on plant hosts, increase in the soil surrounding plant roots. The problem can be cured by crop rotation, denying the pathogens a suitable host for a period of time. However, even if crops are not rotated, the severity of diseases brought on by such phytopathogens often decreases after a number of years as the microbial population of the soil changes and the soil becomes \"suppressive\" to those diseases. While there may be many reasons for this phenomenon, it is clear that levels of certain bacteria, such as Pseudomonas fluorescens, a bacterium antagonistic to a number of harmful phytopathogens, are greater in suppressive than in nonsuppressive soil. This suggests that the presence of such bacteria suppresses phytopathogens. There is now considerable experimental support for this view. Wheat yield increases of 27 percent have been obtained in field trials by treatment of wheat seeds with fluorescent pseudomonads. Similar treatment of sugar beets, cotton, and potatoes has had similar results.\n\nThese improvements in crop yields through the application of Pseudomonas fluorescens suggest that agriculture could benefit from the use of bacteria genetically altered for specific purposes. For example, a form of phytopathogen altered to remove its harmful properties could be released into the environment in quantities favorable to its competing with and eventually excluding the harmful normal strain. Some experiments suggest that deliberately releasing altered nonpathogenic Pseudomonas syringae could crowd out the nonaltered variety that causes frost damage. Opponents of such research have objected that the deliberate and large-scale release of genetically altered bacteria might have deleterious results. Proponents, on the other hand, argue that this particular strain is altered only by the removal of the gene responsible for the strain's propensity to cause frost damage, thereby rendering it safer than the phytopathogen from which it was derived.\n\nSome proponents have gone further and suggest that genetic alteration techniques could create organisms with totally new combinations of desirable traits not found in nature. For example, genes responsible for production of insecticidal compounds have been transposed from other bacteria into pseudomonads that colonize corn roots. Experiments of this kind are difficult and require great care: such bacteria are developed in highly artificial environments and may not compete well with natural soil bacteria. Nevertheless, proponents contend that the prospects for improved agriculture through such methods seem excellent. These prospects lead many to hope that current efforts to assess the risks of deliberate release of altered microorganisms will successfully answer the concerns of opponents and create a climate in which such research can go forward without undue impediment.","questions":[{"id":1,"question":"Which one of the following best summarizes the main idea of the\npassage?","options":["Recent field experiments with genetically altered Pseudomonas\nbacteria have shown that releasing genetically altered bacteria into the\nenvironment would not involve any significant danger.","Encouraged by current research, advocates of agricultural use of\ngenetically altered bacteria are optimistic that such use will\neventually result in improved agriculture, though opponents remain wary.","Current research indicates that adding genetically altered\nPseudomonas syringae bacteria to the soil surrounding crop plant roots\nwill have many beneficial effects, such as the prevention of frost\ndamage in certain crops.","Genetic alteration of a number of harmful phytopathogens has been\nadvocated by many researchers who contend that these techniques will\neventually replace such outdated methods as crop rotation."],"correct":1,"explanation":"The correct answer is option B. The passage supports this answer: encouraged by current research, advocates of agricultural use of\ngenetically altered bacteria are optimistic that such use will\neventually result in improved agriculture, though opponents remain wary. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"The author discusses naturally occurring Pseudomonas fluorescens\nbacteria in the first paragraph primarily in order to do which one of\nthe following?","options":["prove that increases in the level of such bacteria in the soil are\nthe sole cause of soil suppressivity","explain why yields increased after wheat fields were sprayed with\naltered Pseudomonas fluorescens bacteria","detail the chemical processes that such bacteria use to suppress\norganisms parasitic to crop plants, such as wheat, sugar beets, and\npotatoes","provide background information to support the argument that\nresearch into the agricultural use of genetically altered bacteria would\nbe fruitful"],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: provide background information to support the argument that\nresearch into the agricultural use of genetically altered bacteria would\nbe fruitful. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":3,"question":"It can be inferred from the author's discussion of Pseudomonas\nfluorescens bacteria that which one of the following would be true of\ncrops impervious to parasitical organisms?","options":["Pseudomonas fluorescens bacteria would be absent from the soil\nsurrounding their roots.","They would crowd out and eventually exclude other crop plants if\ntheir growth were not carefully regulated.","Their yield would not be likely to be improved by adding\nPseudomonas fluorescens bacteria to the soil.","They would mature more quickly than crop plants that were\nsusceptible to parasitical organisms."],"correct":2,"explanation":"The correct answer is option C. This can be inferred from the passage. The passage provides evidence that supports the conclusion that their yield would not be likely to be improved by adding\npseudomonas fluorescens bacteria to the soil. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":4,"question":"It can be inferred from the passage that crop rotation can increase\nyields in part because","options":["moving crop plants around makes them hardier and more resistant to\ndisease","the number of Pseudomonas fluorescens bacteria in the soil\nusually increases when crops are rotated","the roots of many crop plants produce compounds that are\nantagonistic to phytopathogens harmful to other crop plants","phytopathogens typically attack some plant species but find other\nspecies to be unsuitable hosts"],"correct":3,"explanation":"The correct answer is option D. This can be inferred from the passage. The passage provides evidence that supports the conclusion that phytopathogens typically attack some plant species but find other\nspecies to be unsuitable hosts. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":5,"question":"According to the passage, proponents of the use of genetically\naltered bacteria in agriculture argue that which one of the following is\ntrue of the altered bacteria used in the frost-damage experiments?","options":["The altered bacteria had a genetic constitution differing from\nthat of the normal strain only in that the altered variety had one less\ngene.","Although the altered bacteria competed effectively with the\nnonaltered strain in the laboratory, they were not as viable in natural\nenvironments.","The altered bacteria were much safer and more effective than the\nnaturally occurring Pseudomonas fluorescens bacteria used in earlier\nexperiments.","The altered bacteria were antagonistic to several types of\nnaturally occurring phytopathogens in the soil surrounding the roots of\nfrost-damaged crops."],"correct":0,"explanation":"The correct answer is option A. The passage explicitly states or directly supports that the altered bacteria had a genetic constitution differing from\nthat of the normal strain only in that the altered variety had one less\ngene. This information is stated in the passage, making it the most accurate answer based on the text."},{"id":6,"question":"Which one of the following, if true, would most seriously weaken\nthe proponents' argument regarding the safety of using altered\nPseudomonas syringae bacteria to control frost damage?","options":["Pseudomonas syringae bacteria are primitive and have a simple\ngenetic constitution.","The altered bacteria are derived from a strain that is parasitic\nto plants and can cause damage to crops.","Current genetic-engineering techniques permit the large-scale\ncommercial production of such bacteria.","Often genes whose presence is responsible for one harmful\ncharacteristic must be present in order to prevent other harmful\ncharacteristics."],"correct":3,"explanation":"The correct answer is option D. This option most directly addresses the argument in question. It provides evidence or reasoning that bears on the claim being evaluated, while the other options are either irrelevant, supportive of the wrong conclusion, or do not address the specific argument."}]},"28":{"id":28,"title":"In 1887 the Dawes Act legislated wide-scale private ownership of reservation lands","difficulty":"Moderate","passage":"In 1887 the Dawes Act legislated wide-scale private ownership of reservation lands in the United States for Native Americans. The act allotted plots of 80 acres to each Native American adult. However, the Native Americans were not granted outright title to their lands. The act defined each grant as a \"trust patent,\" meaning that the Bureau of Indian Affairs (BIA), the governmental agency in charge of administering policy regarding Native Americans, would hold the allotted land in trust for 25 years, during which time the Native American owners could use, but not alienate (sell) the land. After the 25-year period, the Native American allottee would receive a \"fee patent\" awarding full legal ownership of the land.\n\nTwo main reasons were advanced for the restriction on the Native Americans' ability to sell their lands. First, it was claimed that free alienability would lead to immediate transfer of large amounts of former reservation land to non-Native Americans, consequently threatening the traditional way of life on those reservations. A second objection to free alienation was that Native Americans were unaccustomed to, and did not desire, a system of private landownership. Their custom, it was said, favored communal use of land.\n\nHowever, both of these arguments bear only on the transfer of Native American lands to non-Native Americans: neither offers a reason for prohibiting Native Americans from transferring land among themselves. Selling land to each other would not threaten the Native American culture. Additionally, if communal land use remained preferable to Native Americans after allotment, free alienability would have allowed allottees to sell their lands back to the tribe.\n\nWhen stated rationales for government policies prove empty, using an interest-group model often provides an explanation. While neither Native Americans nor the potential non-Native American purchasers benefited from the restraint on alienation contained in the Dawes Act, one clearly defined group did benefit: the BIA bureaucrats. It has been convincingly demonstrated that bureaucrats seek to maximize the size of their staffs and their budgets in order to compensate for the lack of other sources of fulfillment, such as power and prestige. Additionally, politicians tend to favor the growth of governmental bureaucracy because such growth provides increased opportunity for the exercise of political patronage. The restraint on alienation vastly increased the amount of work, and hence the budgets, necessary to implement the statute. Until allotment was ended in 1934, granting fee patents and leasing Native American lands were among the principal activities of the United States government. One hypothesis, then, for the temporary restriction on alienation in the Dawes Act is that it reflected a compromise between non-Native Americans favoring immediate alienability so they could purchase land and the BIA bureaucrats who administered the privatization system.","questions":[{"id":1,"question":"Which one of the following best summarizes the main idea of the\npassage?","options":["United States government policy toward Native Americans has tended\nto disregard their needs and consider instead the needs of non-Native\nAmerican purchasers of land.","In order to preserve the unique way of life on Native American\nreservations, use of Native American lands must be communal rather than\nindividual.","The Dawes Act's restriction on the right of Native Americans to\nsell their land may have been implemented primarily to serve the\ninterests of politicians and bureaucrats.","The clause restricting free alienability in the Dawes Act greatly\nexpanded United States governmental activity in the area of land\nadministration."],"correct":2,"explanation":"The correct answer is option C. The passage supports this answer: the dawes act's restriction on the right of native americans to\nsell their land may have been implemented primarily to serve the\ninterests of politicians and bureaucrats. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"Which one of the following statements concerning the reason for the\nend of allotment, if true, would provide the most support for the\nauthor's view of politicians?","options":["Politicians realized that allotment was damaging the Native\nAmerican way of life.","Politicians decided that allotment would be more congruent with\nthe Native American custom of communal land use.","Politicians believed that allotment's continuation would not\nenhance their opportunities to exercise patronage.","Politicians felt that the staff and budgets of the BIA had grown\ntoo large."],"correct":2,"explanation":"The correct answer is option C. The passage supports this answer: politicians believed that allotment's continuation would not\nenhance their opportunities to exercise patronage. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":3,"question":"Which one of the following best describes the organization of the\npassage?","options":["The passage of a law is analyzed in detail, the benefits and\ndrawbacks of one of its clauses are studied, and a final assessment of\nthe law is offered.","The history of a law is narrated, the effects of one of its\nclauses on various populations are studied, and repeal of the law is\nadvocated","A law is examined, the political and social backgrounds of one of\nits clauses are characterized, and the permanent effects of the law are\nstudied.","A law is described, the rationale put forward for one of its\nclauses is outlined and dismissed, and a different rationale for the\nclause is presented."],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: a law is described, the rationale put forward for one of its\nclauses is outlined and dismissed, and a different rationale for the\nclause is presented. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":4,"question":"The author's attitude toward the reasons advanced for the\nrestriction on alienability in the Dawes Act at the time of its passage\ncan best be described as","options":["completely credulous","partially approving","basically indecisive","highly skeptical"],"correct":3,"explanation":"The correct answer is option D. The author's tone throughout the passage is best characterised as reflected in this answer. The language and rhetorical choices in the passage support this reading."},{"id":5,"question":"It can be inferred from the passage that which one of the following\nwas true of Native American life immediately before passage of the Dawes\nAct?","options":["Most Native Americans supported themselves through farming.","Not many Native Americans personally owned the land on which they\nlived.","The land on which most Native Americans lived had been bought from\ntheir tribes.","Few Native Americans had much contact with their non-Native\nAmerican neighbors."],"correct":1,"explanation":"The correct answer is option B. This can be inferred from the passage. The passage provides evidence that supports the conclusion that not many native americans personally owned the land on which they\nlived. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":6,"question":"According to the passage, the type of landownership initially\nobtainable by Native Americans under the Dawes Act differed from the\ntype of ownership obtainable after a 25-year period in that only the\nlatter allowed","options":["owners of land to farm it","owners of land to sell it","government some control over how owners disposed of land","owners of land to build on it with relatively minor governmental\nrestrictions"],"correct":1,"explanation":"The correct answer is option B. The passage explicitly states or directly supports that owners of land to sell it. This information is stated in the passage, making it the most accurate answer based on the text."}]},"29":{"id":29,"title":"The law-and-literature movement claims to have introduced a valuable pedagogical","difficulty":"Moderate","passage":"The law-and-literature movement claims to have introduced a valuable pedagogical innovation into legal study: instructing students in techniques of literary analysis for the purpose of interpreting laws and in the reciprocal use of legal analysis for the purpose of interpreting literary texts. The results, according to advocates, are not only conceptual breakthroughs in both law and literature but also more sensitive and humane lawyers. Whatever the truth of this last claim, there can be no doubt that the movement is a success: law-and-literature is an accepted subject in law journals and in leading law schools. Indeed, one indication of the movement's strength is the fact that its most distinguished critic, Richard A. Posner, paradoxically ends up expressing qualified support for the movement in a recent study in which he systematically refutes the writings of its leading legal scholars and cooperating literary critics.\n\nCritiquing the movement's assumption that lawyers can offer special insights into literature that deals with legal matters, Posner points out that writers of literature use the law loosely to convey a particular idea or as a metaphor for the workings of the society envisioned in their fiction. Legal questions per se, about which a lawyer might instruct readers, are seldom at issue in literature. This is why practitioners of law-and-literature end up discussing the law itself far less than one might suppose. Movement leader James White, for example, in his discussion of arguments in the Iliad, barely touches on law, and then so generally as to render himself vulnerable to Posner's devastating remark that \"any argument can be analogized to a legal dispute.\"\n\nSimilarly, the notion that literary criticism can be helpful in interpreting law is problematic. Posner argues that literary criticism in general aims at exploring richness and variety of meaning in texts, whereas legal interpretation aims at discovering a single meaning. A literary approach can thus only confuse the task of interpreting the law, especially if one adopts current fashions like deconstruction, which holds that all texts are inherently uninterpretable.\n\nNevertheless, Posner writes that law-and-literature is a field with \"promise\". Why? Perhaps, recognizing the success of a movement that, in the past, has singled him out for abuse, he is attempting to appease his detractors, paying obeisance to the movements institutional success by declaring that it \"deserves a place in legal research\" while leaving it to others to draw the conclusion from his cogent analysis that it is an entirely factitious undertaking, deserving of no intellectual respect whatsoever. As a result, his work stands both as a rebuttal of law-and-literature and as a tribute to the power it has come to exercise in academic circles.","questions":[{"id":1,"question":"The primary purpose of the passage is to","options":["assess the law-and-literature movement by examining the position\nof one of its most prominent critics","assert that a mutually beneficial relationship exists between the\nstudy of law and the study of literature","provide examples of the law-and-literature movement in practice by\ndiscussing the work of its proponents","dismiss a prominent critics recent study of the law-and-literature\nmovement"],"correct":0,"explanation":"The correct answer is option A. The passage as a whole is primarily focused on this theme. While other options may touch on aspects mentioned in the passage, the central purpose is best captured by this answer: assess the law-and-literature movement by examining the position\nof one of its most prominent critics."},{"id":2,"question":"Posner's stated position with regard to (with regard to: adv.)\nthe law-and-literature movement is most analogous to which one of the\nfollowing?","options":["a musician who is trained in the classics but frequently plays\nmodern music while performing on stage","a partisan who transfers allegiance to a new political party that\ndemonstrates more promise but has fewer documented accomplishments","a sports fan who wholeheartedly supports the team most likely to\nwin rather than his or her personal favorite","a salesperson who describes the faults in a fashionable product\nwhile conceding that it may have some value"],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: a salesperson who describes the faults in a fashionable product\nwhile conceding that it may have some value. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":3,"question":"The passage suggests that Posner regards legal practitioners as\nusing an approach to interpreting law that","options":["eschews discovery of multiple meanings","employs techniques like deconstruction","interprets laws in light of varying community standards","is informed by the positions of literary critics"],"correct":0,"explanation":"The correct answer is option A. This can be inferred from the passage. The passage provides evidence that supports the conclusion that eschews discovery of multiple meanings. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":4,"question":"The Passage suggests that Posner might find legal training useful in\nthe interpretation of a literary text in which","options":["a legal dispute symbolizes the relationship between two characters","an oppressive law is used to symbolize an oppressive culture","one of the key issues involves the answer to a legal question","a legal controversy is used to represent a moral conflict"],"correct":2,"explanation":"The correct answer is option C. This can be inferred from the passage. The passage provides evidence that supports the conclusion that one of the key issues involves the answer to a legal question. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":5,"question":"The author uses the word \"success\" in line 11 to refer to the\nlaw-and-literature movement's","options":["positive effect on the sensitivity of lawyers","widespread acceptance by law schools and law journals","ability to offer fresh insights into literary texts","ability to encourage innovative approaches in two disciplines"],"correct":1,"explanation":"The correct answer is option B. The passage supports this answer: widespread acceptance by law schools and law journals. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":6,"question":"According to the passage, Posner argues that legal analysis is not\ngenerally useful in interpreting literature because","options":["use of the law in literature is generally of a quite different\nnature than use of the law in legal practice","law is rarely used to convey important ideas in literature","lawyers do not have enough literary training to analyze literature\ncompetently","legal interpretations of literature tend to focus on legal issues\nto the exclusion of other important elements"],"correct":0,"explanation":"The correct answer is option A. The passage explicitly states or directly supports that use of the law in literature is generally of a quite different\nnature than use of the law in legal practice. This information is stated in the passage, making it the most accurate answer based on the text."}]},"30":{"id":30,"title":"A recent generation of historians of science, far from portraying accepted","difficulty":"Moderate","passage":"A recent generation of historians of science, far from portraying accepted scientific views as objectively accurate reflections of a natural world, explain the acceptance of such views in terms of the ideological biases of certain influential scientists or the institutional and rhetorical power such scientists wield. As an example of ideological bias, it has been argued that Pasteur rejected the theory of spontaneous generation not because of experimental evidence but because he rejected the materialist ideology implicit in that doctrine. These historians seem to find allies in certain philosophers of science who argue that scientific views are not imposed by reality but are free inventions of creative minds, and that scientific claims are never more than brave conjectures, always subject to inevitable future falsification. While these philosophers of science themselves would not be likely to have much truck with the recent historians, it is an easy step from their views to the extremism of the historians.\n\nWhile this rejection of the traditional belief that scientific views are objective reflections of the world may be fashionable, it is deeply implausible. We now know, for example, that water is made of hydrogen and oxygen and that parents each contribute one-half of their children's complement of genes. I do not believe any serious-minded and informed person can claim that these statements are not factual descriptions of the world or that they will inevitably be falsified.\n\nHowever, science's accumulation of lasting truths about the world is not by any means a straightforward matter. We certainly need to get beyond the naive view that the truth will automatically reveal itself to any scientist who looks in the right direction; most often, in fact, a whole series of prior discoveries is needed to tease reality's truths from experiment and observation. And the philosophers of science mentioned above are quite right to argue that new scientific ideas often correct old ones by indicating errors and imprecision (as, say, Newton's ideas did to Kepler's). Nor would I deny that there are interesting questions to be answered about the social processes in which scientific activity is embedded. The persuasive processes by which particular scientific groups establish their experimental results as authoritative are themselves social activities and can be rewardingly studied as such. Indeed, much of the new work in the history of science has been extremely revealing about the institutional interactions and rhetorical devices that help determine whose results achieve prominence.\n\nBut one can accept all this without accepting the thesis that natural reality never plays any part at all in determining what scientists believe. What the new historians ought to be showing us is how those doctrines that do in fact fit reality work their way through the complex social processes of scientific activity to eventually receive general scientific acceptance.","questions":[{"id":1,"question":"It can be inferred from the passage that the author would be most\nlikely to agree with which one of the following characterizations of\nscientific truth?","options":["It is often implausible.","It is subject to inevitable falsification.","It is rarely obvious and transparent .","It is rarely discovered by creative processes."],"correct":2,"explanation":"The correct answer is option C. This can be inferred from the passage. The passage provides evidence that supports the conclusion that it is rarely obvious and transparent . The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":2,"question":"According to the passage, Kepler's ideas provide an example of\nscientific ideas that were","options":["corrected by subsequent inquiries","dependent on a series of prior observations","originally thought to be imprecise and then later confirmed","established primarily by the force of an individuals rhetorical\npower"],"correct":0,"explanation":"The correct answer is option A. The passage explicitly states or directly supports that corrected by subsequent inquiries. This information is stated in the passage, making it the most accurate answer based on the text."},{"id":3,"question":"In the third paragraph of the passage, the author is primarily\nconcerned with","options":["presenting conflicting explanations for a phenomenon","suggesting a field for possible future research","qualifying a previously expressed point of view","providing an answer to a theoretical question"],"correct":2,"explanation":"The correct answer is option C. The passage supports this answer: qualifying a previously expressed point of view. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":4,"question":"The use of the words \"any serious-minded and informed person'\n(lines 28-29) serves which one of the following functions in the context\nof the passage?","options":["to satirize chronologically earlier notions about the composition\nof water","to reinforce a previously stated opinion about certain\nphilosophers of science","to suggest the author's reservations about the \"traditional\nbelief\" mentioned in line 22","to discredit someone who would argue that certain scientific\nassertions do not factually describe reality"],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: to discredit someone who would argue that certain scientific\nassertions do not factually describe reality. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":5,"question":"It can be inferred from the passage that the author would most\nlikely agree with which one of the following statements about the\nrelationship between the views of \"certain philosophers of science\"\n(lines l2-13) and those of the recent historians?","options":["These two views are difficult to differentiate.","These two views share some similarities.","The views of the philosophers ought to be seen as the source of\nthe historians' views.","Both views emphasize the rhetorical power of scientists."],"correct":1,"explanation":"The correct answer is option B. This can be inferred from the passage. The passage provides evidence that supports the conclusion that these two views share some similarities. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":6,"question":"Which one of the following best characterizes the author's\nassessment of the opinions of the new historians of science, as these\nopinions are presented in the passage?","options":["They lack any credibility.","They themselves can be rewardingly studied as social phenomena.","They are least convincing when they concern the actions of\nscientific groups.","Although they are gross overstatements, they lead to some valuable\ninsights."],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: although they are gross overstatements, they lead to some valuable\ninsights. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."}]},"31":{"id":31,"title":"Until recently, it was thought that the Cherokee, a Native American tribe, were","difficulty":"Moderate","passage":"Until recently, it was thought that the Cherokee, a Native American tribe, were compelled to assimilate Euro-American culture during the 1820s. During that decade, it was supposed, White missionaries arrived and, together with their part-Cherokee intermediaries, imposed the benefits of \"civilization\" on Cherokee tribes while the United States government actively promoted acculturalization by encouraging the Cherokee to switch from hunting to settled agriculture. This view was based on the assumption that the end of a Native American group's economic and political autonomy would automatically mean the end of its cultural autonomy as well.\n\nWilliam G. McLaughlin has recently argued that not only did Cherokee culture flourish during and after the 1820s, but the Cherokee themselves actively and continually reshaped their culture. Missionaries did have a decisive impact during these years, he argues, but that impact was far from what it was intended to be. The missionaries' tendency to cater to the interests of an acculturating part-Cherokee elite (who comprised the bulk of their converts) at the expense of the more traditionalist full-Cherokee majority created great intratribal tensions. As the elite initiated reforms designed to legitimize their own and the Cherokee Nation's place in the new republic of the United States, antimission Cherokee reacted by fostering revivals of traditional religious beliefs and practices. However, these revivals did not, according to McLaughlin, undermine the elitist reforms, but supplemented them with popular traditionalist counterparts.\n\nTraditionalist Cherokee did not reject the elitist reforms outright, McLaughlin argues, simply because they recognized that there was more than one way to use the skills the missionaries could provide them. As he quotes one group as saying, \"We want our children to learn English so that the White man cannot cheat us.\" Many traditionalists Cherokee welcomed the missionaries for another reason: they perceived that it would be useful to have White allies. In the end, McLaughlin asserts, most members of the Cherokee council, including traditionalists, supported a move which preserved many of the reforms of the part-Cherokee elite but limited the activities and influence of the missionaries and other White settlers. According to McLaughlin, the identity and culture that resulted were distinctively Cherokee, yet reflected the larger political and social setting in which they flourished.\n\nBecause his work concentrates on the nineteenth century, McLaughlin unfortunately overlooks earlier sources of influence, such as eighteen-century White resident traders and neighbors, thus obscuring the relative impact of the missionaries of the 1820s in contributing to both acculturalization and resistance to it among the Cherokee. However, McLaughlin is undoubtedly correct in recognizing that culture is an ongoing process rather than a static entity, and he has made a significant contribution to our understanding of how Cherokee culture changed while retaining its essential identity after confronting the missionaries.","questions":[{"id":1,"question":"Which one of the following best states the main idea of the\npassage?","options":["McLaughlin's studies of the impact of missionaries on Cherokee\nculture during the 1820s are fundamentally flawed, since McLaughlin\nignores the greater impact of White resident traders in the eighteenth\ncentury.","Though his work is limited in perspective, McLaughlin is\nsubstantially correct that changes in Cherokee culture in the 1820s were\nmediated by the Cherokee themselves rather than simply imposed by the\nmissionaries.","Although McLaughlin is correct in asserting that cultural changes\namong the Cherokee were autonomous and so not a result of the presence\nof missionaries, he overemphasizes the role of intertribal conflicts.","McLaughlin has shown that Cherokee culture not only flourished\nduring and after the 1820s, but that changes in Cherokee culture during\nthis time developed naturally from elements already present in Cherokee\nculture."],"correct":1,"explanation":"The correct answer is option B. The passage supports this answer: though his work is limited in perspective, mclaughlin is\nsubstantially correct that changes in cherokee culture in the 1820s were\nmediated by the cherokee themselves rather than simply imposed by the\nmissionaries. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"Which one of the following statements regarding the Cherokee\ncouncil in the 1820s can be inferred from the passage?","options":["Members of the Cherokee council were elected democratically by the\nentire Cherokee Nation.","In order for a policy to come into effect for the Cherokee Nation,\nit had to have been approved by a unanimous vote of the Cherokee\ncouncil.","Despite the fact that the Cherokee were dominated politically and\neconomically by the United States in the 1820s, the Cherokee council was\nable to override policies set by the United States government.","Though it did not have complete autonomy in governing the Cherokee\nNation, it was able to set some policies affecting the activities of\nWhite people living in tribal areas."],"correct":3,"explanation":"The correct answer is option D. This can be inferred from the passage. The passage provides evidence that supports the conclusion that though it did not have complete autonomy in governing the cherokee\nnation, it was able to set some policies affecting the activities of\nwhite people living in tribal areas. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":3,"question":"Which one of the following statements regarding the attitudes of\ntraditionalist Cherokee toward the reforms that were instituted in the\n1820s can be inferred from the passage?","options":["They supported the reforms merely as a way of placating the\nincreasingly vocal acculturating elite.","They thought that the reforms would lead to the destruction of\ntraditional Cherokee culture but felt powerless to stop the reforms.","They supported the reforms only because they thought that they\nwere inevitable and it was better that the reforms appear to have been\ninitiated by the Cherokee themselves.","They viewed the reforms as a means of preserving the Cherokee\nNation and protecting it against exploitation."],"correct":3,"explanation":"The correct answer is option D. This can be inferred from the passage. The passage provides evidence that supports the conclusion that they viewed the reforms as a means of preserving the cherokee\nnation and protecting it against exploitation. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":4,"question":"According to the passage, McLaughlin cites which one of the\nfollowing as a contributing factor in the revival of traditional\nreligious beliefs among the Cherokee in the 1820s?","options":["Missionaries were gaining converts at an increasing rate as the\n1820s progressed.","The traditionalist Cherokee majority thought that most of the\nreforms initiated by the missionaries' converts would corrupt Cherokee\nculture.","Missionaries unintentionally created conflict among the Cherokee\nby favoring the interests of the acculturating elite at the expense of\nthe more traditionalist majority.","Traditionalist Cherokee recognized that only some of the reforms\ninstituted by a small Cherokee elite would be beneficial to all\nCherokee."],"correct":2,"explanation":"The correct answer is option C. The passage explicitly states or directly supports that missionaries unintentionally created conflict among the cherokee\nby favoring the interests of the acculturating elite at the expense of\nthe more traditionalist majority. This information is stated in the passage, making it the most accurate answer based on the text."},{"id":5,"question":"Which one of the following, if true, would most seriously undermine\nMcLaughlin's account of the course of reform among the Cherokee during\nthe 1820s?","options":["Traditionalist Cherokee gained control over the majority of seats\non the Cherokee council during the 1820s.","The United States government took an active interest in political\nand cultural developments within Native American tribes.","The missionaries living among the Cherokee in the 1820s were\nstrongly in favor of the cultural reforms initiated by the acculturating\nelite.","Revivals of traditional Cherokee religious beliefs and practices\nbegan late in the eighteenth century, before the missionaries\narrived."],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: revivals of traditional cherokee religious beliefs and practices\nbegan late in the eighteenth century, before the missionaries\narrived. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":6,"question":"It can be inferred from the author's discussion of McLaughlin's\nviews that the author thinks that Cherokee acculturalization in the\n1820s","options":["was reversed in the decades following the 1820s","may have been part of an already-existing process of\nacculturalization","could have been the result of earlier contacts with missionaries","would not have occurred without the encouragement of the United\nStates government"],"correct":1,"explanation":"The correct answer is option B. This can be inferred from the passage. The passage provides evidence that supports the conclusion that may have been part of an already-existing process of\nacculturalization. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."}]},"32":{"id":32,"title":"In the history of nineteenth-century landscape painting in the United States, the","difficulty":"Moderate","passage":"In the history of nineteenth-century landscape painting in the United States, the Luminists are distinguished by their focus on atmosphere and light. The accepted view of Luminist paintings is that they are basically spiritual and imply a tranquil mysticism that contrasts with earlier American artists' concept of nature as dynamic and energetic. According to this view, the Luminist atmosphere, characterized by \"pure and constant light,\" guides the onlooker toward a lucid transcendentalism, an idealized vision of the world.\n\nWhat this view fails to do is to identify the true significance of this transcendental atmosphere in Luminist paintings. The prosaic factors that are revealed by a closer examination of these works suggest that the glowing appearance of nature in Luminism is actually a sign of nature's domestication, its adaptation to human use. The idealized Luminist atmosphere thus seems to convey, not an intensification of human responses to nature, but rather a muting of those emotions, like awe and fear, which untamed nature elicits.\n\nOne critic, in describing the spiritual quality of harbor scenes by Fitz Hugh Lane, an important Luminist, carefully notes that \"at the peak of Luminist development in the 1850s and 1860s, spiritualism in America was extremely widespread.\" It is also true, however, that the 1850s and 1860s were a time of trade expansion. From 1848 until his death in 1865, Lane lived in a house with a view of the harbor of Gloucester, Massachusetts, and he made short trips to Maine, New York, Baltimore, and probably Puerto Rico. In all of these places he painted the harbors with their ships—the instruments of expanding trade.\n\nLane usually depicts places like New York Harbor, with ships at anchor, ), but even when he depicts more remote, less commercially active harbors, nature appears pastoral and domesticated rather than primitive or unexplored. The ships, rather than the surrounding landscapes—including the sea—are generally the active element in his pictures. For Lane the sea is, in effect, a canal or a trade route for commercial activity, not a free powerful element, as it is in the early pictures of his predecessor, Cole. For Lane nature is subdued, even when storms are approaching; thus, the sea is always a viable highway for the transport of goods. In sum, I consider Lane's sea simply an environment for human activity—nature no longer inviolate. The luminescence that Lane paints symbolizes nature's humbled state, for the light itself is as docile as the Luminist sea, and its tranquility in a sense signifies no more than good conditions on the highway to progress. Progress, probably even more than transcendence, is the secret message of Luminism. In a sense, Luminist pictures are an ideological justification of the atmosphere necessary for business, if also an exaggerated, idealistic rendering of that atmosphere.","questions":[{"id":1,"question":"The passage is primarily concerned with discussing","options":["the importance of religion to the art of a particular period","the way one artist's work illustrates a tradition of painting","the significance of the sea in one artist's work","differences in the treatment of nature as a more active or a less\nactive force"],"correct":1,"explanation":"The correct answer is option B. The passage supports this answer: the way one artist's work illustrates a tradition of painting. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"The author argues that nature is portrayed in Lane's pictures as","options":["wild and unexplored","idealized and distant","continually changing","subordinate to human concerns"],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: subordinate to human concerns. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":3,"question":"The passage contains information to suggest that the author would\nmost probably agree with which one of the following statements?","options":["The prevailing religious principles of a given time can be\nreflected in the art of that time.","In order to interest viewers, works of art must depict familiar\nsubjects in detail.","Because commerce is unusual as a subject in art, the painter of\ncommercial activity must travel and observe it widely.","Knowing about the environment in which an artist lived can aid in\nan understanding of a work by that artist."],"correct":3,"explanation":"The correct answer is option D. This can be inferred from the passage. The passage provides evidence that supports the conclusion that knowing about the environment in which an artist lived can aid in\nan understanding of a work by that artist. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":4,"question":"According to the author, a supporter of the view of Luminism\ndescribed in the first paragraph would most likely","options":["be unimpressed by the paintings glowing light","consider Luminist scenes to be undomesticated and wild","interpret the Luminist depiction of nature incorrectly","see Luminist paintings as practical rather than mystical"],"correct":2,"explanation":"The correct answer is option C. The passage explicitly states or directly supports that interpret the luminist depiction of nature incorrectly. This information is stated in the passage, making it the most accurate answer based on the text."},{"id":5,"question":"According to the author, the sea is significant in Lane's paintings\nbecause of its association with","options":["exploration","commerce","canals","idealism"],"correct":1,"explanation":"The correct answer is option B. The passage explicitly states or directly supports that commerce. This information is stated in the passage, making it the most accurate answer based on the text."},{"id":6,"question":"The author's primary purpose is to","options":["refute a new theory","replace an inadequate analysis","summarize current critics' attitudes","support another critic's evaluation"],"correct":1,"explanation":"The correct answer is option B. The passage as a whole is primarily focused on this theme. While other options may touch on aspects mentioned in the passage, the central purpose is best captured by this answer: replace an inadequate analysis."}]},"33":{"id":33,"title":"After thirty years of investigation into cell genetics, researchers made startling","difficulty":"Moderate","passage":"After thirty years of investigation into cell genetics, researchers made startling discoveries in the 1960s and early 1970s which culminated in the development of processes, collectively known as recombinant deoxyribonucleic acid (rDNA) technology, for the active manipulation of a cell's genetic code. The technology has created excitement and controversy because it involves altering DNA—which contains the building blocks of the genetic code.\n\nUsing rDNA technology, scientists can transfer a portion of the DNA from one organism to a single living cell of another. The scientist chemically \"snips\" the DNA chain of the host cell at a predetermined point and attaches another piece of DNA from a donor cell at that place, creating a completely new organism.\n\nProponents of rDNA research and development claim that it will allow scientists to find cures for disease and to better understand how genetic information controls an organism's development. They also see many other potentially practical benefits, especially in the pharmaceutical industry. Some corporations employing the new technology even claim that by the end of the century all major diseases will be treated with drugs derived from microorganisms created through rDNA technology. Pharmaceutical products already developed, but not yet marketed, indicate that these predictions may be realized.\n\nProponents also cite nonmedical applications for this technology. Energy production and waste disposal may benefit: genetically altered organisms could convert sewage and other organic material into methane fuel. Agriculture might also take advantage of rDNA technology to produce new varieties of crops that resist foul weather, pests, and the effects of poor soil.\n\nA major concern of the critics of rDNA research is that genetically altered microorganisms might escape from the laboratory. Because these microorganisms are laboratory creations that, in all probability, do not occur in nature, their interaction with the natural world cannot be predicted with certainty. It is possible that they could cause previously unknown, perhaps incurable diseases. The effect of genetically altered microorganisms on the world's microbiological predator-prey relationships is another potentially serious problem pointed out by the opponents of rDNA research. Introducing a new species may disrupt or even destroy the existing ecosystem. The collapse of interdependent relationships among species, extrapolated to its extreme, could eventually result in the destruction of humanity.\n\nOpponents of rDNA technology also cite ethical problems with it. For example, it gives scientists the power to instantly cross evolutionary and species boundaries that nature took millennia to establish. The implications of such power would become particularly profound if genetic engineers were to tinker with human genes, a practice that would bring us one step closer to Aldous Huxley's grim vision in Brave New World of a totalitarian society that engineers () human beings to fulfill specific roles.","questions":[{"id":1,"question":"In the passage, the author is primarily concerned with doing which\none of the following?","options":["explaining the process and applications of rDNA technology","advocating continued rDNA research and development","providing evidence indicating the need for regulation of rDNA\nresearch and development","summarizing the controversy surrounding rDNA research and\ndevelopment"],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: summarizing the controversy surrounding rdna research and\ndevelopment. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"According to the passage, which one of the following is an accurate\nstatement about research into the genetic code of cells?","options":["It led to the development of processes for the manipulation of\nDNA.","It was initiated by the discovery of rDNA technology.","It led to the use of new treatments for major diseases.","It was universally heralded as a great benefit to humanity."],"correct":0,"explanation":"The correct answer is option A. The passage explicitly states or directly supports that it led to the development of processes for the manipulation of\ndna. This information is stated in the passage, making it the most accurate answer based on the text."},{"id":3,"question":"The potential benefits of rDNA technology referred to in the passage\ninclude all of the following EXCEPT","options":["new methods of waste treatment","new biological knowledge","enhanced food production","development of less expensive drugs"],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: development of less expensive drugs. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":4,"question":"Which one of the following, if true, would most weaken an argument\nof opponents of rDNA technology?","options":["New safety procedures developed by rDNA researchers make it\nimpossible for genetically altered microorganisms to escape from\nlaboratories.","A genetically altered microorganism accidentally released from a\nlaboratory is successfully contained.","A particular rDNA-engineered microorganism introduced into an\necosystem attracts predators that keep its population down.","Genetically altered organisms designed to process sewage into\nmethane cannot survive outside the waste treatment plant."],"correct":0,"explanation":"The correct answer is option A. This option most directly addresses the argument in question. It provides evidence or reasoning that bears on the claim being evaluated, while the other options are either irrelevant, supportive of the wrong conclusion, or do not address the specific argument."},{"id":5,"question":"The author's reference in the last sentence of the passage to a\nsociety that engineers human beings to fulfill specific roles serves to","options":["emphasize the potential medical dangers of rDNA technology","advocate research on the use of rDNA technology in human genetics","warn of the possible disasters that could result from upsetting\nthe balance of nature","illustrate the sociopolitical ramifications of applying genetic\nengineering to humans"],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: illustrate the sociopolitical ramifications of applying genetic\nengineering to humans. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":6,"question":"Which one of the following, if true, would most strengthen an\nargument of the opponents of rDNA technology?","options":["Agricultural products developed through rDNA technology are no\nmore attractive to consumers than are traditional crops.","Genetically altered microorganisms have no natural predators but\ncan prey on a wide variety of other microorganisms.","Drugs produced using rDNA technology cost more to manufacture than\ndrugs produced with traditional technologies.","Ecosystems are impermanent systems that are often liable to\ncollapse, and occasionally do so."],"correct":1,"explanation":"The correct answer is option B. This option most directly addresses the argument in question. It provides evidence or reasoning that bears on the claim being evaluated, while the other options are either irrelevant, supportive of the wrong conclusion, or do not address the specific argument."}]},"34":{"id":34,"title":"Gray marketing, the selling of trademarked products through channels of","difficulty":"Moderate","passage":"Gray marketing, the selling of trademarked products through channels of distribution not authorized by the trademark holder, can involve distribution of goods either within a market region or across market boundaries. Gray marketing within a market region (\"channel flow diversion\") occurs when manufacturer-authorized distributors sell trademarked goods to unauthorized distributors who then sell the goods to consumers within the same region. For example, quantity discounts from manufacturers may motivate authorized dealers to enter the gray market because they can purchase larger quantities of a product than they themselves intend to stock if they can sell the extra units through gray marketing channels.\n\nWhen gray marketing occurs across market boundaries, it is typically in an international setting and may be called \"parallel importing.\" Manufacturers often produce and sell products in more than one country and establish a network of authorized dealers in each country. Parallel importing occurs when trademarked goods intended for one country are diverted from proper channels (channel flow diversion) and then exported to unauthorized distributors in another country.\n\nTrademark owners justifiably argue against gray marketing practices since such practices clearly jeopardize the goodwill established by trademark owners: consumers who purchase trademarked goods in the gray market do not get the same \"extended product,\" which typically includes pre- and postsale service. Equally important, authorized distributors may cease to promote the product if it becomes available for much lower prices through unauthorized channels.\n\nCurrent debate over regulation of gray marketing focuses on three disparate theories in trademark law that have been variously and confusingly applied to parallel importation cases: universality, exhaustion, and territoriality. The theory of universality holds that a trademark is only an indication of the source or origin of the product. This theory does not recognize the goodwill functions of a trademark. When the courts apply this theory, gray marketing practices are allowed to continue because the origin of the product remains the same regardless of the specific route of the product through the channel of distribution. The exhaustion theory holds that a trademark owner relinquishes all rights once a product has been sold. When this theory is applied, gray marketing practices are allowed to continue because the trademark owners' rights cease as soon as their products are sold to a distributor. The theory of territoriality holds that a trademark is effective in the country in which it is registered. Under the theory of territoriality, trademark owners can stop gray marketing practices in the registering countries on products bearing their trademarks. Since only the territoriality theory affords trademark owners any real legal protection against gray marketing practices, I believe it is inevitable as well as desirable that it will come to be consistently applied in gray marketing cases.","questions":[{"id":1,"question":"Which one of the following best expresses the main point of the\npassage?","options":["Gray marketing is unfair to trademark owners and should be legally\ncontrolled.","Gray marketing is practiced in many different forms and places,\nand legislators should recognize the futility of trying to regulate it.","The mechanisms used to control gray marketing across markets are\ndifferent from those most effective in controlling gray marketing within\nmarkets.","The three trademark law theories that have been applied in gray\nmarketing cases lead to different case outcomes."],"correct":0,"explanation":"The correct answer is option A. The passage supports this answer: gray marketing is unfair to trademark owners and should be legally\ncontrolled. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"The function of the passage as a whole is to","options":["criticize the motives and methods of those who practice gray\nmarketing","evaluate the effects of both channel flow diversion and parallel\nimportation","discuss the methods that have been used to regulate gray marketing\nand evaluate such methods' degrees of success","describe a controversial marketing practice and evaluate several\nlegal views regarding it"],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: describe a controversial marketing practice and evaluate several\nlegal views regarding it. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":3,"question":"Which one of the following does the author offer as an argument\nagainst gray marketing?","options":["Manufacturers find it difficult to monitor the effectiveness of\npromotional efforts made on behalf of products that are gray marketed.","Gray marketing can discourage product promotion by authorized\ndistributors.","Gray marketing forces manufacturers to accept the low profit\nmargins that result from quantity discounting.","Gray marketing discourages competition among unauthorized\ndealers."],"correct":1,"explanation":"The correct answer is option B. The passage supports this answer: gray marketing can discourage product promotion by authorized\ndistributors. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":4,"question":"The information in the passage suggests that proponents of the\ntheory of territoriality would probably differ from proponents of the\ntheory of exhaustion on which one of the following issues?","options":["the right of trademark owners to enforce, in countries in which\nthe trademarks are registered, distribution agreements intended to\nrestrict distribution to authorized channels","the right of trademark owners to sell trademarked goods only to\nthose distributors who agree to abide by distribution agreements","the legality of channel flow diversion that occurs in a country\nother than the one in which a trademark is registered","the significance consumers attach to a trademark"],"correct":0,"explanation":"The correct answer is option A. This can be inferred from the passage. The passage provides evidence that supports the conclusion that the right of trademark owners to enforce, in countries in which\nthe trademarks are registered, distribution agreements intended to\nrestrict distribution to authorized channels. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":5,"question":"The author discusses the impact of gray marketing on goodwill in\norder to","options":["fault trademark owners for their unwillingness to offer a solution\nto a major consumer complaint against gray marketing","indicate a way in which manufacturers sustain damage against which\nthey ought to be protected","highlight one way in which gray marketing across markets is more\nproblematic than gray marketing within a market","demonstrate that gr
