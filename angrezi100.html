more historians should have been drawn to a\ncomparative study of the two institutions. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":5,"question":"The author cites which one of the following as a factor that might\nhave discouraged historians from undertaking a comparative study of\nRussian serfdom and United States slavery?","options":["major differences in the political systems of the two countries","major differences in the demographics of the two countries","the failure of de Tocqueville to address the subject","differences in the size of the estates on which slaves and serfs\nlabored"],"correct":0,"explanation":"The correct answer is option A. The passage supports this answer: major differences in the political systems of the two countries. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":6,"question":"According to the passage, Kolchin's study asserts that which one of\nthe following was true of Russian nobles during the nineteenth century?","options":["They agreed to the abolition of serfdom in the 1860s largely as a\nresult of their having been influenced by the abolition of slavery in\nthe United States.","They became more directly involved in the management of their\nestates as a result of the rebellions that occurred in the previous\ncentury.","They commonly agreed to at least some of the demands that arose\nout of the volnenie.","They had relatively little direct contact with the serfs who\nworked on their estates."],"correct":3,"explanation":"The correct answer is option D. The passage explicitly states or directly supports that they had relatively little direct contact with the serfs who\nworked on their estates. This information is stated in the passage, making it the most accurate answer based on the text."}]},"61":{"id":61,"title":"Until the 1980s, most scientists believed that noncatastrophic geological processes","difficulty":"Moderate","passage":"Until the 1980s, most scientists believed that noncatastrophic geological processes caused the extinction of dinosaurs that occurred approximately 66 million years ago, at the end of the Cretaceous period. Geologists argued that a dramatic drop in sea level coincided with the extinction of the dinosaurs and could have caused the climatic changes that resulted in this extinction as well as the extinction of many ocean species.\n\nThis view was seriously challenged in the 1980s by the discovery of large amounts of iridium in a layer of clay deposited at the end of the Cretaceous period. Because iridium is extremely rare in rocks on the Earth's surface but common in meteorites, researchers theorized that it was the impact of a large meteorite that dramatically changed the earth's climate and thus triggered the extinction of the dinosaurs.\n\nCurrently available evidence, however, offers more support for a new theory, the volcanic-eruption theory. A vast eruption of lava in India coincided with the extinctions that occurred at the end of the Cretaceous period, and the release of carbon dioxide from this episode of volcanism could have caused the climatic change responsible for the demise of the dinosaurs. Such outpourings of lava are caused by instability in the lowest layer of the Earth's mantle, located just above the Earth's core. As the rock that constitutes this layer is heated by the Earth's core, it becomes less dense and portions of it eventually escape upward as blobs or molten rock, called \"diapirs,\" that can, under certain circumstances, erupt violently through the Earth's crust.\n\nMoreover, the volcanic-eruption theory, like the impact theory, accounts for the presence of iridium in sedimentary deposits; it also explains matters that the meteorite-impact theory does not. Although iridium is extremely rare on the Earth's surface, the lower regions of the Earth's mantle have roughly the same composition as meteorites and contain large amounts of iridium, which in the case of a diapir eruption would probably be emitted as iridium hexafluoride, a gas that would disperse more uniformly in the atmosphere than the iridium-containing matter thrown out from a meteorite impact. In addition, the volcanic-eruption theory may explain why the end of the Cretaceous period was marked by a gradual change in sea level. Fossil records indicate that for several hundred thousand years prior to the relatively sudden disappearance of the dinosaurs, the level of the sea gradually fell, causing many marine organisms to die out. This change in sea level might well have been the result of a distortion in the Earth's surface that resulted from the movement of diapirs upward toward the Earth's crust, and the more cataclysmic extinction of the dinosaurs could have resulted from the explosive volcanism that occurred as material from the diapirs erupted onto the Earth's surface.","questions":[{"id":1,"question":"The passage suggests that during the 1980s researchers found\nmeteorite impact a convincing explanation for the extinction of\ndinosaurs, in part because","options":["earlier theories had failed to account for the gradual extinction\nof many ocean species at the end of the Cretaceous period","geologists had, up until that time, underestimated the amount of\ncarbon dioxide that would be released during an episode of explosive\nvolcanism","a meteorite could have served as a source of the iridium found in\na layer of clay deposited at the end of the Cretaceous period","no theory relying on purely geological processes had, up until\nthat time, explained the cause of the precipitous drop in sea level that\noccurred at the end of the Cretaceous period"],"correct":2,"explanation":"The correct answer is option C. This can be inferred from the passage. The passage provides evidence that supports the conclusion that a meteorite could have served as a source of the iridium found in\na layer of clay deposited at the end of the cretaceous period. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":2,"question":"According to the passage, the lower regions of the Earth's mantle\nare characterized by","options":["a composition similar to that of meteorites","the absence of elements found in rocks on the Earth's crust","a greater stability than that of the upper regions","the presence of large amounts of carbon dioxide"],"correct":0,"explanation":"The correct answer is option A. The passage explicitly states or directly supports that a composition similar to that of meteorites. This information is stated in the passage, making it the most accurate answer based on the text."},{"id":3,"question":"It can be inferred from the passage that which one of the following\nwas true of the lava that erupted in India at the end of the Cretaceous\nperiod?","options":["It contained less carbon dioxide than did the meteorites that were\nstriking the Earth's surface during that period.","It was more dense than the molten rock, located just above the\nEarth's core.","It released enough iridium hexafluoride into the atmosphere to\nchange the Earth's climate dramatically.","It was richer in iridium than rocks usually found on the Earth's\nsurface."],"correct":3,"explanation":"The correct answer is option D. This can be inferred from the passage. The passage provides evidence that supports the conclusion that it was richer in iridium than rocks usually found on the earth's\nsurface. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":4,"question":"In the passage, the author is primarily concerned with doing which\none of the following?","options":["describing three theories and explaining why the latest of these\nappears to be the best of the three","attacking the assumptions inherent in theories that until the\n1980s had been largely accepted by geologists","outlining the inadequacies of three different explanations of the\nsame phenomenon","providing concrete examples in support of the more general\nassertion that theories must often be revised in light of new\nevidence"],"correct":0,"explanation":"The correct answer is option A. The passage supports this answer: describing three theories and explaining why the latest of these\nappears to be the best of the three. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":5,"question":"The author implies that if the theory described in the third\nparagraph is true, which one of the following would have been true of\niridium in the atmosphere at the end of the Cretaceous period?","options":["Its level of concentration in the Earth's atmosphere would have\nbeen high due to a slow but steady increase in the atmospheric iridium\nthat began in the early Cretaceous period.","Its concentration in the Earth's atmosphere would have increased\ndue to the dramatic decrease in sea level that occurred during the\nCretaceous period.","It would have been directly responsible for the extinction of many\nocean species.","It would have been more uniformly dispersed than iridium whose\nsource had been the impact of a meteorite on the Earth's surface."],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: it would have been more uniformly dispersed than iridium whose\nsource had been the impact of a meteorite on the earth's surface. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":6,"question":"The passage supports which one of the following claims about the\nvolcanic-eruption theory?","options":["It does not rely on assumptions concerning the temperature of\nmolten rock at the lowest pan of the Earth's mantle.","It may explain what caused the gradual fall in sea level that\noccurred for hundreds of thousands of years prior to the more sudden\ndisappearance of the dinosaurs.","It bases its explanation on the occurrence of periods of increased\nvolcanic activity similar to those shown to have caused earlier mass\nextinctions.","It may explain the relative scarcity of iridium in rocks on the\nEarth's surface compared to its abundance in meteorites."],"correct":1,"explanation":"The correct answer is option B. The passage supports this answer: it may explain what caused the gradual fall in sea level that\noccurred for hundreds of thousands of years prior to the more sudden\ndisappearance of the dinosaurs. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."}]},"62":{"id":62,"title":"It has become something of a truism in folklore studies that until recently the","difficulty":"Moderate","passage":"It has become something of a truism in folklore studies that until recently the lore was more often studied than the folk. That is, folklorists concentrated on the folklore—the songs, tales, and proverbs themselves—and ignored the people who transmitted that lore as part of their oral culture. However, since the early 1970s, folklore studies have begun to regard folk performers as people of creativity who are as worthy of attention as are artists who transmit their ideas in writing. This shift of emphasis has also encouraged a growing interest in women folk performers.\n\nUntil recently, folklorists tended to collect folklore from women on only a few topics such as health and games. In other areas, as Weigle and Farrer have noted, if folklorists \"had a choice between a story as told by a man or as told by a woman, the man's version was chosen.\" It is still too early to tell how profoundly this situation has changed, but one can point to several recent studies in which women performers play central roles. Perhaps more telling is the focus of the most recently published major folklore textbook, The Dynamics of Folklore. Whereas earlier textbooks gave little attention to women and their folklore, this book devotes many pages to women folk performers.\n\nRecognition of women as important bearers of folklore is not entirely a recent phenomenon. As early as 1903, a few outstanding women folk performers were the focus of scholarly attention. Bur the scholarship devoted to these women tended to focus primarily on presenting the performer's repertoire. Recent works about women folk artists, however, have been more biographically oriented. Juha Pentikainen's study of Marina Tokalo, a Finnish healer and narrator of folktales, is especially extensive and probing. Though interested in the problems of repertoire analysis, Pentikainen gives considerable attention to the details of Tokalo's life and cultural background, so that a full picture of a woman and her folklore emerges. Another notable work is Roger Abraham's book, which presents a very clear picture of the significance of traditional singing in the life of noted ballad singer Almeda Riddle. Unfortunately, unlike Pentikainen's study, Abraham's study contains little repertoire analysis.\n\nThese recent books reflect the current interest of folklorists in viewing folklore in context and thus answering questions about what folklore means to the people who use it. One unexpected result of this line of study has been the discovery that women may use the same folklore that men use, but for very different purposes. This realization has potential importance for future folklore studies in calling greater attention to the type of study required if a folklorist wants truly to understand the role folklore plays in a particular culture.","questions":[{"id":1,"question":"Which one of the following best describes the main point of the\npassage?","options":["It is only since the early 1970s that folklore studies have begun\nto recognize women as important bearers of folklore.","A careful analysis of the repertoires of women folk performers has\nled to a new discovery with important implications for future folklore\nstudies.","Recent studies of women folk performers have focused primarily on\nthe problems of repertoire analysis to the exclusion of a discussion of\nthe culture within which the folklore was developed.","A change in the focus of folklore studies has led to increased\ninterest in women folk performers and to a new understanding of the\nimportance of the context in which folklore is produced."],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: a change in the focus of folklore studies has led to increased\ninterest in women folk performers and to a new understanding of the\nimportance of the context in which folklore is produced. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"The author of the passage refers to The Dynamics of Folklore\nprimarily in order to","options":["support the idea that it is too soon to tell whether or not\nfolklorists are giving greater attention to women's folklore","refute Weigle and Farrer's contention that folklorists prefer to\ncollect folklore from men rather than from women","support the assertion that scholarship devoted to women folk\nperformers tends to focus primarily on repertoire","suggest that there are some signs that women folk performers are\ngaining increased critical attention in the field of folklore"],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: suggest that there are some signs that women folk performers are\ngaining increased critical attention in the field of folklore. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":3,"question":"The focus of which one of the following books would most clearly\nreflect the current interest of the folklorists mentioned in the last\nparagraph?","options":["an anthology of tales and songs collected exclusively from women\nin different cultures","a compilation of tales and songs from both men and women covering\na great variety of traditional and nontraditional topics","a study of the purpose and meaning of a tale or song for the men\nand women in a particular culture","an analysis of one particular tale or song that documents changes\nin the text of the folklore over a period of time"],"correct":2,"explanation":"The correct answer is option C. The passage supports this answer: a study of the purpose and meaning of a tale or song for the men\nand women in a particular culture. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":4,"question":"According to the passage, which one of the following changes has\noccurred in the field of folklore since the early 1970s?","options":["increased recognition of the similar ways in which men and women\nuse folklore","increased recognition of folk performers as creative individuals","increased emphasis on the need for repertoire analysis","less emphasis on the relationship between cultural influences and\nfolklore"],"correct":1,"explanation":"The correct answer is option B. The passage explicitly states or directly supports that increased recognition of folk performers as creative individuals. This information is stated in the passage, making it the most accurate answer based on the text."},{"id":5,"question":"It can be inferred from the passage that early folklorists assumed\nthat which one of the following was true?","options":["The people who transmitted the folklore did not play a creative\nrole in the development of that folklore.","The people who transmitted the folklore were not consciously aware\nof the way in which they creatively shaped that folklore.","The text of a song or tale did not change as the folklore was\ntransmitted from one generation to another.","Women were not involved in transmitting folklore except for songs\nor tales dealing with a few traditional topics."],"correct":0,"explanation":"The correct answer is option A. This can be inferred from the passage. The passage provides evidence that supports the conclusion that the people who transmitted the folklore did not play a creative\nrole in the development of that folklore. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":6,"question":"Based on the information in the passage, which one of the following\nis most closely analogous to the type of folklore studies produced\nbefore the early 1970s?","options":["An anthropologist studies the implements currently used by an\nisolated culture, but does not investigate how the people of that\nculture designed and used those implements.","A manufacturer hires a consultant to determine how existing\nequipment in a plant might be modified to improve efficiency, but does\nnot ask employees for their suggestions on how to improve efficiency.","A historian studies different types of documents dealing with a\nparticular historical event, but decides not to review newspaper\naccounts written by journalists who lived through that event.","An archaeologist studies the artifacts of an ancient culture to\nreconstruct the life-style of that culture, but does not actually visit\nthe site where those artifacts were unearthed."],"correct":0,"explanation":"The correct answer is option A. The passage supports this answer: an anthropologist studies the implements currently used by an\nisolated culture, but does not investigate how the people of that\nculture designed and used those implements. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."}]},"63":{"id":63,"title":"J. G. A. Pocock's numerous investigations have all revolved around the fruitful","difficulty":"Moderate","passage":"J. G. A. Pocock's numerous investigations have all revolved around the fruitful assumption that a work of political thought can only be understood in light of the linguistic constraints to which its author was subject, for these prescribed both the choice of subject matter and the author's conceptualization of this subject matter. Only the occasional epic theorist, like Machiavelli or Hobbes, succeeded in breaking out of these bonds by redefining old terms and inventing new ones. The task of the modern commentator is to identify the \"language\" or \"vocabulary\" with and within which the author operated. While historians of literature have always been aware that writers work within particular traditions, the application of this notion to the history of political ideas forms a sharp contrast to the assumptions of the 1950s, when it was naively thought that the close reading of a text by an analytic philosopher was sufficient to establish its meaning, even if the philosopher had no knowledge of the period of the text's composition.\n\nThe language Pocock has most closely investigated is that of \"civic humanism.\" For much of his career he has argued that eighteenth-century English political thought should be interpreted as a conflict between rival versions of the \"virtue\" central to civic humanism. On the one hand, he argues, this virtue is described by representatives of the Tory (a member or supporter of a major British political group of the 18th and early 19th centuries favoring at first the Stuarts and later royal authority and the established church and seeking to preserve the traditional political structure and defeat parliamentary reform compare WHIG) opposition using a vocabulary of public spirit and self-sufficiency. For these writers the societal ideal is the small, independent landowner in the countryside. On the other hand, Whig (a member or supporter of a major British political group of the late 17th through early 19th centuries seeking to limit the royal authority and increase parliamentary power compare TORY) writers describe such virtue using a vocabulary of commerce and economic progress; for them the ideal is the merchant.\n\nIn making such linguistic discriminations Pocock has disassociated himself from historians like Namier, who deride all eighteenth-century English political language as \"cant.\" But while Pocock's ideas have proved fertile when applied to England, they are more controversial when applied to the late-eighteenth-century United States. Pocock's assertion that Jefferson's attacks on the commercial policies of the Federalists simply echo the language of the Tory opposition in England is at odds with the fact that Jefferson rejected the elitist implications of that group's notion of virtue and asserted the right of all to participate in commercial society. Indeed, after promptings by Quentin Skinner, Pocock has admitted that a counterlanguage—one of rights and liberties—was probably as important in the political discourse of the late-eighteenth-century United States as the language of civic humanism. Fortunately, it is not necessary to rank the relative importance of all the different vocabularies in which eighteenth-century political argument was conducted. It is sufficient to recognize that any interesting text is probably a mixture of several of these vocabularies, and to applaud the historian who, though guilty of some exaggeration, has done the most to make us aware of their importance.","questions":[{"id":1,"question":"The main idea of the passage is that","options":["civic humanism, in any of its manifestations, cannot entirely\nexplain eighteenth-century political discourse","eighteenth-century political texts are less likely to reflect a\nsingle vocabulary than to combine several vocabularies","Pocock's linguistic approach, though not applicable to all\neighteenth-century political texts, provides a useful model for\nhistorians of political theory","Pocock has more successfully accounted for the nature of political\nthought in eighteenth-century England than in the eighteenth-century\nUnited States"],"correct":2,"explanation":"The correct answer is option C. The passage supports this answer: pocock's linguistic approach, though not applicable to all\neighteenth-century political texts, provides a useful model for\nhistorians of political theory. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"According to the passage, Pocock most clearly associates the use of\na vocabulary of economic progress with","options":["Jefferson","Federalists","English Whigs","English Tories rural"],"correct":2,"explanation":"The correct answer is option C. The passage explicitly states or directly supports that english whigs. This information is stated in the passage, making it the most accurate answer based on the text."},{"id":3,"question":"The author's attitude toward Pocock is best revealed by which of\nthe following pairs of words?","options":["\"fruitful\" (line 2) and \"cant\" (line 39)","\"sharp\" (line 16) and \"elitist\" (line 46)","\"naively\" (line 17) and \"controversial\" (line 41)","\"fertile\" (line 40) and \"applaud\" (line 60)"],"correct":3,"explanation":"The correct answer is option D. The author's tone throughout the passage is best characterised as reflected in this answer. The language and rhetorical choices in the passage support this reading."},{"id":4,"question":"The passage suggests that one of the \"assumptions of the 1950s\"\n(line 17) regarding the meaning of a political text was that this\nmeaning","options":["could be established using an approach similar to that used by\nliterary historians","could be definitively established without reference to the text's\nhistorical background","could be closely read in several different ways depending on one's\nphilosophic approach","was constrained by certain linguistic preconceptions held by the\ntext's author"],"correct":1,"explanation":"The correct answer is option B. This can be inferred from the passage. The passage provides evidence that supports the conclusion that could be definitively established without reference to the text's\nhistorical background. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":5,"question":"The author of the passage would most likely agree that which one of\nthe following is a weakness found in Pocock's work?","options":["the use of the term \"language\" to describe the expressive features\nof several diverse kinds of discourse","the overemphatic denigration of the role of the analytic\nphilosopher in establishing the meaning of a political, or indeed any,\ntext","the emphasis on the overriding importance of civic humanism in\neighteenth-century English political thought","the insistence on a single linguistic dichotomy to account for\npolitical thought in eighteenth-century England and the United\nStates"],"correct":3,"explanation":"The correct answer is option D. Based on the arguments and positions presented in the passage, the author would most likely agree that the insistence on a single linguistic dichotomy to account for\npolitical thought in eighteenth-century england and the united\nstates. This aligns with the overall thrust of the author's argument."},{"id":6,"question":"Which one of the following best describes the organization of the\npassage?","options":["A description of a thesis is offered, specific cases are\nconsidered, and an evaluation is given.","A thesis is brought forward, the thesis is qualified, and evidence\nthat calls the qualification into question is stated.","A hypothesis is described, examples that suggest it is incorrect\nare summarized, and supporting examples are offered.","A series of evaluations are given, concrete reasons are put\nforward, and a future direction for research is suggested."],"correct":0,"explanation":"The correct answer is option A. The passage supports this answer: a description of a thesis is offered, specific cases are\nconsidered, and an evaluation is given. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."}]},"64":{"id":64,"title":"In 1964 the United States federal government began attempts to eliminate racial","difficulty":"Moderate","passage":"In 1964 the United States federal government began attempts to eliminate racial discrimination in employment and wages: the United States Congress enacted Title VII of the Civil Rights Act, prohibiting employers from making employment decisions on the basis of race. In 1965 President Johnson issued Executive Order 11,246, which prohibited discrimination by United States government contractors and emphasized direct monitoring of minority representation in contractors' work forces.\n\nNonetheless, proponents of the \"continuous change\" hypothesis believe that United States federal law had a marginal impact on the economic progress made by black people in the United States between 1940 and 1975. Instead they emphasize slowly evolving historical forces, such as long-term trends in education that improved segregated schools for black students during the 1940s and were operative during and after the 1960s. They argue that as the quality of black schools improved relative to that of white schools, the earning potential of those attending black schools increased relative to the earning potential of those attending white schools.\n\nHowever, there is no direct evidence linking increased quality of underfunded segregated black schools to these improvements in earning potential. In fact, even the evidence on relative schooling quality is ambiguous. Although in the mid-1940s term length at black schools was approaching that in white schools, the rapid growth in another important measure of school quality, school expenditures, may be explained by increases in teachers' salaries, and historically, such increases have not necessarily increased school quality. Finally, black individuals in all age groups, even those who had been educated at segregated schools before the 1940s, experienced post-1960 increases in their earning potential. If improvements in the quality of schooling were an important determinant of increased returns, only those workers who could have benefited from enhanced school quality should have received higher returns. The relative improvement in the earning potential of educated black people of all age groups in the United States is more consistent with a decline in employment discrimination.\n\nAn additional problem for continuity theorists is how to explain the rapid acceleration of black economic progress in the United States after 1964. Education alone cannot account for the rate of change. Rather, the coincidence of increased United States government antidiscrimination pressure in the mid-1960s with the acceleration in the rate of black economic progress beginning in 1965 argues against the continuity theorists' view. True, correlating federal intervention and the acceleration of black economic progress might be incorrect. One could argue that changing altitudes about employment discrimination sparked both the adoption of new federal policies and the rapid acceleration in black economic progress. Indeed, the shift in national attitude that made possible the enactment of Title VII was in part produced by the persistence of racial discrimination in the southern United States. However, the fact that the law had its greatest effect in the South, in spite of the vigorous resistance of many Southern leaders, suggests its importance for black economic progress.","questions":[{"id":1,"question":"According to the passage, Title VII of the 1964 Civil Rights Act\ndiffers from Executive Order 11. 246 in that Title VII","options":["monitors employers to ensure minority representation","assesses the work forces of government contractors","eliminates discriminatory disparities in wages","governs hiring practices in a wider variety of workplaces"],"correct":3,"explanation":"The correct answer is option D. The passage explicitly states or directly supports that governs hiring practices in a wider variety of workplaces. This information is stated in the passage, making it the most accurate answer based on the text."},{"id":2,"question":"Which one of the following statements about schooling in the United\nStates during the mid-1940s can be inferred from the passage?","options":["School expenditures decreased for white schools.","The teachers in white schools had more time to cover material\nduring a school year than did teachers in black schools.","The basic curriculum of white schools was similar to the\ncurriculum at black schools.","White schools did not change substantially in quality."],"correct":1,"explanation":"The correct answer is option B. This can be inferred from the passage. The passage provides evidence that supports the conclusion that the teachers in white schools had more time to cover material\nduring a school year than did teachers in black schools. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":3,"question":"The primary purpose of the passage is to","options":["explain why an argument about black economic progress is\nincomplete","describe the impact of education on black economic progress","refute an argument about the factors influencing black economic\nprogress","describe black economic progress before and after the 1960s"],"correct":2,"explanation":"The correct answer is option C. The passage as a whole is primarily focused on this theme. While other options may touch on aspects mentioned in the passage, the central purpose is best captured by this answer: refute an argument about the factors influencing black economic\nprogress."},{"id":4,"question":"Which one of the following best states the position of proponents\nof the \"continuous change\" hypothesis regarding the relationship between\nlaw and racial discrimination?","options":["Individuals cannot be forced by legal means to behave in\nnondiscriminatory ways.","Discriminatory practices in education have been effectively\naltered by legal means.","Legislation alone has had little effect on racially discriminatory\nbehavior.","Legislation is necessary, but not sufficient, to achieve changes\nin racial altitudes."],"correct":2,"explanation":"The correct answer is option C. The passage supports this answer: legislation alone has had little effect on racially discriminatory\nbehavior. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":5,"question":"The author concedes that \"correlating federal intervention and the\nacceleration of black economic progress might be incorrect\" (lines\n58-60) primarily in order to","options":["strengthen the overall argument by anticipating an objection","introduce another factor that may have influenced black economic\nprogress","concede a point to the continuity theorists","change the overall argument in light of the views of the\ncontinuity theorists"],"correct":0,"explanation":"The correct answer is option A. The passage supports this answer: strengthen the overall argument by anticipating an objection. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":6,"question":"The \"continuous change\" hypothesis, as it is presented in the\npassage, can best be applied to which one of the following\nsituations?D","options":["Homes are found for many low-income families because the\ngovernment funds a project to build subsidized housing in an\neconomically depressed area.","A depressed economy does not cause the closing of small businesses\nin a local community because the government provides special grants to\naid these businesses.","Unemployed people are able to obtain jobs because private\ncontractors receive tax incentives for constructing office buildings in\nan area with a high unemployment rate.","A housing shortage is remedied because the changing state of the\neconomy permits private investors to finance construction in a depressed\narea."],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: a housing shortage is remedied because the changing state of the\neconomy permits private investors to finance construction in a depressed\narea. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."}]},"65":{"id":65,"title":"For the poet Philips Whitely, who was brought to colonial New England as a slave in","difficulty":"Moderate","passage":"For the poet Philips Whitely, who was brought to colonial New England as a slave in 1761, the formal literary code of eighteenth-century English was thrice removed: by the initial barrier of the unfamiliar English language, by the discrepancy between spoken and literary forms of English, and by the African tradition of oral rather than written verbal art. Wheatley transcended these barriers—she learned the English language and English literary forms so quickly and well that she was composing good poetry in English within a few years of her arrival in New England.\n\nWheatley's experience exemplifies the meeting of oral and written literary cultures. The aesthetic principles of the African oral tradition were preserved in America by folk artists in work songs, dancing, field hollers, religious music, the use of the drum, and, after the drum was forbidden, in the perpetuation of drum effects in song. African languages and the functions of language in African societies not only contributed to the emergence of a distinctive Black English but also exerted demonstrable effects on the manner in which other Americans spoke English. Given her African heritage and her facility with English and the conventions of English poetry, Wheatley's work had the potential to apply the ideas of a written literature to an oral literary tradition in the creation of an African American literary language.\n\nBut this was a potential that her poetry unfortunately did not exploit. The standards of eighteenth-century English poetry, which itself reflected little of the American language, led Wheatley to develop a notion of poetry as a closed system, derived from imitation of earlier written works. No place existed for the rough-and-ready (adj.) Americanized English she heard in the streets, for the English spoken by Black people, or for Africanisms. The conventions of eighteenth-century neoclassical poetry ruled out casual talk; her choice and feelings had to be generalized according to rules of poetic diction and characterization; the particulars of her African past, if they were to be dealt with at all, had to be subordinated to the reigning conventions. African poetry did not count as poetry in her new situation, and African aesthetic canons were irrelevant to the new context because no linguistic or social framework existed to reinforce them. Wheatley adopted a foreign language and a foreign literary tradition; they were not extensions of her past experience, but replacements.\n\nThus limited by the eighteenth-century English literary code, Wheatley's poetry contributed little to the development of a distinctive African American literary language. Yet by the standards of the literary conventions in which she chose to work, Wheatley's poetry is undeniably accomplished, and she is justly celebrated as the first Black American poet.","questions":[{"id":1,"question":"Which one of the following best expresses the main idea of the\npassage?","options":["Folk artists employed more principles of African oral tradition in\ntheir works than did Phillis Wheatley in her poetry.","Although Phillis Wheatley had to overcome significant barriers in\nlearning English, she mastered the literary conventions of\neighteen-century English as well as African aesthetic canons.","Phillis Wheatley's poetry did not fulfill the potential inherent\nin her experience but did represent a significant accomplishment.","The evolution of a distinctive African American literary language\ncan be traced from the creations of African American folk artists to the\npoetry of Phillis Wheatley."],"correct":2,"explanation":"The correct answer is option C. The passage supports this answer: phillis wheatley's poetry did not fulfill the potential inherent\nin her experience but did represent a significant accomplishment. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"The approach to poetry taken by a modern-day Italian immigrant in\nAmerica would be most analogous to Phillis Wheatley's approach, as it is\ndescribed in the passage, if the immigrant","options":["translated Italian literary forms into the American idiom","combined Italian and American literary traditions into a new form\nof poetic expression","contributed to the development of a distinctive Italian American\nliterary style","adopted the language and forms of modern American poetry"],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: adopted the language and forms of modern american poetry. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":3,"question":"According to the passage, African languages had a notable influence\non","options":["the religious music of colonists in New England","the folk art of colonists in New England","formal written English","American speech patterns"],"correct":3,"explanation":"The correct answer is option D. The passage explicitly states or directly supports that american speech patterns. This information is stated in the passage, making it the most accurate answer based on the text."},{"id":4,"question":"By a \"closed system\" of poetry (line 34-35), the author most\nprobably means poetry that","options":["cannot be written by those who are not raised knowing its\nconventions","has little influence on the way language is actually spoken","substitutes its own conventions for the aesthetic principles of\nthe past","does not admit the use of street language and casual talk"],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: does not admit the use of street language and casual talk. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":5,"question":"According to the passage, the standards of eighteenth century\nEnglish poetry permitted Wheatley to include which one of the following\nin her poetry?","options":["generalized feelings","Americanized English","themes from folk art","casual talk"],"correct":0,"explanation":"The correct answer is option A. The passage explicitly states or directly supports that generalized feelings. This information is stated in the passage, making it the most accurate answer based on the text."},{"id":6,"question":"Which one of the following, if true, would most weaken the author's\nargument concerning the role that Wheatley played in the evolution of an\nAfrican American literary language?","options":["Wheatley's poetry was admired in England for its faithfulness to\nthe conventions of neoclassical poetry.","Wheatley compiled a history in English of her family's experiences\nin Africa and America.","The language barriers that Wheatley overcame were eventually\ntranscended by all who were brought from Africa as slaves.","Scholars trace themes and expressions in African American poetry\nback to the poetry of Wheatley."],"correct":3,"explanation":"The correct answer is option D. This option most directly addresses the argument in question. It provides evidence or reasoning that bears on the claim being evaluated, while the other options are either irrelevant, supportive of the wrong conclusion, or do not address the specific argument."}]},"66":{"id":66,"title":"One scientific discipline, during its early stages of development, is often related","difficulty":"Moderate","passage":"One scientific discipline, during its early stages of development, is often related to another as an antithesis to its thesis. The thesis discipline tend to concern itself with discovery and classification of phenomena, to offer holistic explanations emphasizing pattern and form, and to use existing theory to explain the widest possible range of phenomena. The paired or antidiscipline, on the other hand, can be characterized by a more focused approach, concentrating on the units of construction, and by a belief that the discipline can be reformulated in terms of the issues and explanations of the antidiscipline.\n\nThe relationship of cytology (cell biology) to biochemistry in the late nineteenth century, when both disciplines were growing at a rapid pace, exemplifies such a pattern. Researchers in cell biology found mounting evidence of an intricate cell architecture. They also deduced the mysterious choreography of the chromosomes during cell division. Many biochemists, on the other hand, remained skeptical of the idea that so much structure existed, arguing that the chemical reactions that occur in cytological preparations might create the appearance of such structures. Also, they stood apart from the debate then raging over whether protoplasm, the complex of living material within a cell, is homogeneous, networklike, granular, or foamlike. Their interest lay in the core \"fundamental\" issues of the chemical nature of protoplasm, especially the newly formulated enzyme theory of life.\n\nIn general, biochemists judged cytologists to be too ignorant of chemistry to grasp the basic processes, whereas cytologists considered the methods of biochemists inadequate to characterize the structures of the living cell. The renewal of Mendelian genetics and, later, progress in chromosome mapping did little at first to effect a synthesis.\n\nBoth sides were essentially correct. Biochemistry has more than justified its extravagant early claims by explaining so much of the cellular machinery. But in achieving this feat (mostly since 1950) it has been partially transformed into the new discipline of molecular biology—biochemistry that deals with spatial arrangements and movements of large molecules. At the same time cytology has metamorphosed into modern cellular biology. Aided by electron microscopy, it has become more similar in language and outlook to molecular biology. The interaction of a discipline and its antidiscipline has moved both sciences toward a synthesis, namely molecular genetics.\n\nThis interaction between paired disciplines can have important results. In the case of late nineteenth-century cell research, progress was fueled by competition among the various attitudes and issues derived from cell biology and biochemistry. Joseph Fruton, a biochemist, has suggested that such competition and the resulting tensions among researchers are a principal source of vitality and \"are likely to lead to unexpected and exciting novelties in the future, as they have in the past.\"","questions":[{"id":1,"question":"Which one of the following best states the central idea of the\npassage?","options":["Antithetical scientific disciplines can both stimulate and hinder\none another's research in complex ways.","Antithetical scientific disciplines often interact with one\nanother in ways that can be highly useful.","As disciplines such as cytology and biochemistry advance, their\ninteraction necessarily leads to a synthesis of their approaches.","Cell research in the late nineteenth century was plagued by\ndisagreements between cytologists and biochemists."],"correct":1,"explanation":"The correct answer is option B. The passage supports this answer: antithetical scientific disciplines often interact with one\nanother in ways that can be highly useful. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"The passage states that in the late nineteenth century cytologists\ndeduced the","options":["maps of chromosomes","chemical nature of protoplasm","spatial relationship of molecules within the cell","sequence of the movement of chromosomes during cell division"],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: sequence of the movement of chromosomes during cell division. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":3,"question":"It can be inferred from the passage that in the late nineteenth\ncentury the debate over the structural nature of protoplasm (line 25-29)\nwas most likely carried on","options":["among cytologists","among biochemists","between cytologists and biochemists","between cytologists and geneticists"],"correct":0,"explanation":"The correct answer is option A. This can be inferred from the passage. The passage provides evidence that supports the conclusion that among cytologists. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":4,"question":"According to the passage, cytologists in the late nineteenth\ncentury were critical of the cell research of biochemists because\ncytologists believed that","options":["the methods of biochemistry were inadequate to account for all of\nthe chemical reactions that occurred in cytological preparations","the methods of biochemistry could not adequately discover and\nexplain the structures of living cells","biochemists were not interested in the nature of protoplasm","biochemists were not interested in cell division"],"correct":1,"explanation":"The correct answer is option B. The passage explicitly states or directly supports that the methods of biochemistry could not adequately discover and\nexplain the structures of living cells. This information is stated in the passage, making it the most accurate answer based on the text."},{"id":5,"question":"The author quotes Fruton (lines 62-64) primarily in order to","options":["restate the author's own conclusions","provide new evidence about the relationship of cytology to\nbiochemistry","summarize the position of the biochemists described in the passage","illustrate the difficulties encountered in the synthesis of\ndisciplines"],"correct":0,"explanation":"The correct answer is option A. The passage supports this answer: restate the author's own conclusions. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":6,"question":"Which one of the following inferences about when the enzyme theory\nof life was formulated can be drawn from the passage?","options":["The theory was formulated before the appearance of molecular\nbiology.","The theory was formulated before the initial discovery of cell\narchitecture.","The theory was formulated after the completion of chromosome\nmapping.","The theory was formulated after a synthesis of the ideas of\ncytologists and biochemists had occurred."],"correct":0,"explanation":"The correct answer is option A. This can be inferred from the passage. The passage provides evidence that supports the conclusion that the theory was formulated before the appearance of molecular\nbiology. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."}]},"67":{"id":67,"title":"There are two major systems of criminal procedure in the modern world—the","difficulty":"Moderate","passage":"There are two major systems of criminal procedure in the modern world—the adversarial and the inquisitorial. Both systems were historically preceded by the system of private vengeance in which the victim of a crime fashioned a remedy and administered it privately, either personally or through an agent.\n\nThe modern adversarial system is only one historical step removed from the private vengeance system and still remains some of its characteristic feature. For example, even though the right to initiate legal action against a criminal has now been extended to all members of society (as represented by the office of the public prosecutor(public prosecutor,)), and even though the police department has effectively assumed the pretrial investigative functions on behalf of the prosecution, the adversarial system still leaves the defendant to conduct his or her own pretrial investigation. The trial is views as a forensic duel between two adversaries, presided over by a judge who, at the start, has no knowledge of the investigative background of the case. In the final analysis the adversarial system of criminal procedure symbolizes and regularizes punitive combat.\n\nBy contrast, the inquisitorial system begins historically where the adversarial system stopped its development. It is two historical steps removed from the system of private vengeance. From the standpoint of legal anthropology, then, it is historically superior to the adversarial system. Under the inquisitorial system, the public prosecutor has the duty to investigate not just on behalf of society but also on behalf of the defendant. Additionally, the public prosecutor has the duty to present the court not only evidence that would convict the defendant, but also evidence that could prove the defendant's innocence. The system mandates that both parties permit full pretrial discovery of the evidence in their possession. Finally, an aspect of the system that makes the trial less like a duel between two adversarial parties is that the inquisitorial system mandates that the judge take an active part in the conduct of the trial, with a role that is both directive and protective.\n\nFact-finding is at the heart of the inquisitorial system. This system operate on the philosophical premise that in a criminal action the crucial factor is the body of facts, not the legal rule (in contrast to the adversarial system ), and the goal of the entire procedure is to attempt to recreate, in the mind of the court, the commission of the alleged crime.\n\nBecause of the inquisitorial system's thoroughness in conducting its pretrial investigation, it can be concluded that, if given the choice, a defendant who is innocent would prefer to be tried under the inquisitorial system, whereas a defendant who is guilty would prefer to be tried under the adversarial system.","questions":[{"id":1,"question":"It can be inferred from the passage that the crucial factor in a\ntrial under the adversarial system is","options":["rules of legality","dramatic reenactments of the crime","the search for relevant facts","the victim's personal pursuit of revenge"],"correct":0,"explanation":"The correct answer is option A. This can be inferred from the passage. The passage provides evidence that supports the conclusion that rules of legality. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":2,"question":"The author sees the judge's primary role in a trial under the\ninquisitorial system as that of","options":["passive observer","biased referee","uninvolved administrator","involved manager"],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: involved manager. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":3,"question":"According to the passage, a central distinction between the system\nof private vengeance and the two modern criminal procedure systems was\nthe shift in responsibility for initiating legal action against a\ncriminal from the","options":["defendant to the courts","victim to society","defendant to the prosecutor","courts to a law enforcement agency"],"correct":1,"explanation":"The correct answer is option B. The passage explicitly states or directly supports that victim to society. This information is stated in the passage, making it the most accurate answer based on the text."},{"id":4,"question":"All of the following are characteristics of the inquisitorial\nsystem that the author cites EXCEPT","options":["It is based on cooperation rather than conflict.","It encourages full disclosure of evidence.","It requires that the judge play an active role in the conduct of\nthe trial.","It places the defendant in charge of his or her defense."],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: it places the defendant in charge of his or her defense. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":5,"question":"The author's attitude toward the inquisitorial system can best be\ndescribed as","options":["doubtful that its judges can be both directive and protective","satisfied that it has potential for uncovering the relevant facts\nin a case","optimistic that it will replace the adversarial system","wary about its downplaying of legal rules"],"correct":1,"explanation":"The correct answer is option B. The author's tone throughout the passage is best characterised as reflected in this answer. The language and rhetorical choices in the passage support this reading."}]},"68":{"id":68,"title":"Outside the medical profession, there are various efforts to cut medicine down to","difficulty":"Moderate","passage":"Outside the medical profession, there are various efforts to cut medicine down to size : not only widespread malpractice litigation and massive governmental regulation, but also attempts by consumer groups and others to redefine medicine as a trade rather than as a profession, and the physician as merely a technician for hire under contract. Why should physicians (or indeed all sensible people) resist such efforts to give the practice of medicine a new meaning? We can gain some illumination from etymology. \"Trade,\" from Germanic and Anglo-Saxon roots meaning \"a course or pathway,\" has come to mean derivatively a habitual occupation and has been related to certain skills and crafts. On the other hand, while \"profession\" today also entails a habit of work, the word \"profession\" itself traces to an act of self-conscious and public—even confessional—speech. \"To profess\" preserves the meaning of its Latin source, to declare publicly; to announce, affirm, avow.\" A profession is an activity or occupation to which its practitioner publicly professes, that is, confesses, devotion. But public announcement seems insufficient; publicly declaring devotion to plumbing or auto repair would not turn these trades into professions.\n\nSome believe that learning and knowledge are the diagnostic signs of a profession. For reasons probably linked to the medieval university, the term \"profession\" has been applied to the so-called learned professions—medicine, law, and theology—the practices of which are founded upon inquiry and knowledge rather than mere \"know how.\" Yet it is not only the pursuit and acquisition of knowledge that makes one a professional. The knowledge involved makes the profession one of the learned variety, but its professional quality is rooted in something else.\n\nSome mistakenly seek to locate that something else in the prestige and honor accorded professionals by society, evidenced in their special titles and the special deference and privileges they receive. But externalities do not constitute medicine a profession. Physicians are not professionals because they are honored; rather, they are honored because of their profession. Their titles and the respect they are shown superficially signify and acknowledge something deeper, that (something) physicians are persons of the professional sort, knowingly and freely devoting themselves to a way of life worthy of such devotion. Just as lawyers devote themselves to rectifying injustices, looking up to what is lawful and right; just as teachers devote themselves to the education of the young, looking up to truth and wisdom; so physicians heal the sick, looking up to health and wholesomeness. Being a professional is thus rooted in our moral nature and in that which warrants and impels making a public confession to a way of life.\n\nProfessing oneself a professional is an ethical act because it is not a silent and private act, but an articulated and public one; because it promised continuing devotion to a way of life, not merely announces a present preference or a way to a livelihood; because it is an activity in service to some high good that insists on devotion; because it is difficult and demanding. A profession engages one's character and heart, not merely one's mind and hands.","questions":[{"id":1,"question":"According to the author, which one of the following is required in\norder that one be a professional?","options":["significant prestige and a title","\"know-how\" in a particular field","a long and difficult educational endeavor","a public confession of devotion to a way of life"],"correct":3,"explanation":"The correct answer is option D. The passage explicitly states or directly supports that a public confession of devotion to a way of life. This information is stated in the passage, making it the most accurate answer based on the text."},{"id":2,"question":"Which one of the following best expresses the main point made by\nthe author in the passage?","options":["Medicine is defined as a profession because of the etymology of\nthe word \"profession\".","It is a mistake to pay special honor to the knowledge and skills\nof physicians.","The work of physicians is under attack only because it is widely\nmisunderstood.","The correct reason that physicians are professionals is that their\nwork involves public commitment to a high good."],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: the correct reason that physicians are professionals is that their\nwork involves public commitment to a high good. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":3,"question":"The question posed by the author in lines 7-10 of the passage\nintroduces which one of the following?","options":["the author's belief that it is futile to resist the trend toward\ndefining the physician's work as a trade","the author's dislike of governmental regulation and consumer\nadvocacy","the author's inquiry into the nature of the practice of medicine","the author's suggestions for rallying sensible people to a\nconcentrated defense of physicians"],"correct":2,"explanation":"The correct answer is option C. The passage supports this answer: the author's inquiry into the nature of the practice of medicine. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":4,"question":"In the passage, the author mentions or suggests all of the\nfollowing EXCEPT","options":["how society generally treats physicians","that the practice of medicine is analogous to teaching","that being a professional is in part a public act","the specific knowledge on which trades are based"],"correct":3,"explanation":"The correct answer is option D. This can be inferred from the passage. The passage provides evidence that supports the conclusion that the specific knowledge on which trades are based. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":5,"question":"The author's attitude toward professionals is best described as","options":["eager that the work of one group of professionals, physicians, be\nviewed from a new perspective","sympathetic toward professionals who have become demoralized by\npublic opinion","surprised that professionals have been balked by governmental\nregulations and threats of litigation","certain that professionals confess a commitment to ethical ideals"],"correct":3,"explanation":"The correct answer is option D. The author's tone throughout the passage is best characterised as reflected in this answer. The language and rhetorical choices in the passage support this reading."},{"id":6,"question":"Based on the information in the passage, it can be inferred that\nwhich one of the following would most logically begin a paragraph\nimmediately following the passage?","options":["A skilled handicraft is a manual art acquired by habituation that\nenables trades people to tread regularly and reliably along the same\npath.","Critics might argue that being a doctor, for example, requires no\nethical or public act; thus medicine, as such , is morally\nneutral, does not bind character, and can be used for good or ill.","Sometimes the pursuit of personal health competes with the pursuit\nof other goods, and it has always been the task of the community to\norder and define competing ends.","Not least among the myriad confusions and uncertainties of our\ntime are those attending efforts to discern and articulate the essential\ncharacteristics of the medial profession."],"correct":1,"explanation":"The correct answer is option B. This can be inferred from the passage. The passage provides evidence that supports the conclusion that critics might argue that being a doctor, for example, requires no\nethical or public act; thus medicine, as such , is morally\nneutral, does not bind character, and can be used for good or ill. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."}]},"69":{"id":69,"title":"The fairness of the judicial process depends on the objective presentation of facts","difficulty":"Moderate","passage":"The fairness of the judicial process depends on the objective presentation of facts to an impartial jury made up of one's peers. Present the facts, and you have a fair trial. However, fact-finding, especially for interpersonal disagreements, is not so straightforward and is often contaminated by variables that reach beyond the legal domain.\n\nA trial is an attempt to transport jurors to the time and place of the disputed event, to recreate the disputed event, or at least to explain that event with maximum accuracy. A trial falls short of this goal, however, because it presents selected witnesses who recite selected portions of their respective memories concerning selected observations of the disputed event. These multiple selections are referred to as the abstraction process. Limitations in both perception and memory are responsible for the fact that the remembered event contains only a fraction of the detail present during the actual event, and the delay between observation and recitation causes witnesses' memories to lose even more of the original perceptions. During the course of a trial, a witness's recitation of the now-abstracted events may reflect selected disclosure based on his or her attitudes and motivations surrounding that testimony. Furthermore, the incidents reported are dependent on the lines of inquiry established by the attorneys involved. Accordingly, the recited data are a fraction of the remembered data, which are a fraction of the observed data, which are a fraction of the total data for the event.\n\nAfter the event that led to the trial has been abstracted by participants in the trial, jurors are expected to resolve factual issues. Some of the jurors' conclusions are based on facts that were directly recited; others are found inferentially. Here another abstraction process takes place. Discussions during deliberations () add to the collective pool of recalled evidentiary perceptions; nonetheless, the jurors' abstraction processes further reduce the number of characteristics traceable to the original event.\n\nComplication can arise from false abstractions at each stage. Studies have shown that witnesses recall having perceived incidents that are known to be absent from a given event. Conversely, jurors can remember hearing evidence that is unaccounted for in court transcripts. Explanations for these phenomena range from bias through prior conditioning or observer expectation to faulty reportage of the event based on the constraints of language. Aberrant abstractions in perception or recollection may not be conscious or deliberate, but reliability is nevertheless diluted.\n\nFinally, deliberate untruthfulness has always been recognized as a risk of testimonial evidence. Such intentionally false abstractions, however, are only a small part of the inaccuracies produced by the abstraction process.","questions":[{"id":1,"question":"In this passage, the author's main purpose is to","options":["discuss a process that jeopardizes the fairness of jury trials","analyze a methodology that safeguards the individual's right to\nfair trial","explain why jurors should view eyewitness testimony with\nskepticism","defend the trial-by-jury process, despite its limitations"],"correct":0,"explanation":"The correct answer is option A. The passage supports this answer: discuss a process that jeopardizes the fairness of jury trials. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"The author considers all of the following obstacles to a fair trial\nEXCEPT","options":["selective perceptions","faulty communications","partial disclosures","too few abstractions"],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: too few abstractions. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":3,"question":"The author would most likely agree that the abstraction process\noccurs in the judicial process primarily because","options":["some jurors' conclusions are based on facts rather than on\ninferences","remembered events depend upon an individual's emotions","human beings are the sources and users of data presented in trials","it is difficult to distinguish between deliberate falsehood and\nunintentional selected disclosure"],"correct":2,"explanation":"The correct answer is option C. Based on the arguments and positions presented in the passage, the author would most likely agree that human beings are the sources and users of data presented in trials. This aligns with the overall thrust of the author's argument."},{"id":4,"question":"It can be inferred that the author believes the ability of juries to\nresolve factual issues is","options":["limited by any individual juror's tendency to draw inferences from\nthe facts presented during the trial","overwhelmed by the collective pool of recalled evidentiary\nperceptions","unaffected by the process of trying to reenact the event leading\nto the trial","subject to the same limitations of perception and memory that\naffect witnesses"],"correct":3,"explanation":"The correct answer is option D. This can be inferred from the passage. The passage provides evidence that supports the conclusion that subject to the same limitations of perception and memory that\naffect witnesses. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":5,"question":"With which one of the following statements would the author most\nlikely agree?","options":["If deliberate untruthfulness were all the courts had to contend\nwith, jury trials would be fairer than they are today.","Lack of moral standards is more of an impediment to a fair trial\nthan human frailty.","The bulk of the inaccuracies produced by the abstraction process\nare innocently presented and rarely have any serious consequences.","If the inaccuracies resulting from the abstraction process\npersist, the present trial-by-jury system is likely to become a thing of\nthe past."],"correct":0,"explanation":"The correct answer is option A. The passage supports this answer: if deliberate untruthfulness were all the courts had to contend\nwith, jury trials would be fairer than they are today. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":6,"question":"The author's attitude toward the abstraction process that occurs\nwhen witnesses testify in a trial can best be described as","options":["confident that witnesses can be conditioned to overcome many\nlimitations of memory","concerned that it may undermine witnesses ability to accurately\ndescribe the original event in dispute","critical of witnesses' motivations when delivering testimony","indifferent toward the effect the abstraction process has on\ntestimony"],"correct":1,"explanation":"The correct answer is option B. The author's tone throughout the passage is best characterised as reflected in this answer. The language and rhetorical choices in the passage support this reading."}]},"70":{"id":70,"title":"A medical article once pointed with great alarm to an increase in cancer among milk","difficulty":"Moderate","passage":"A medical article once pointed with great alarm to an increase in cancer among milk drinkers. Cancer, it seems, was becoming increasingly frequent in New England, Minnesota, Wisconsin, and Switzerland, where a lot of milk is produced and consumed, while remaining rare in Ceylon, where milk is scarce. For further evidence it was pointed out that cancer was less frequent in some states of the southern United States where less milk was consumed. Also, it was pointed out, milk-drinking English women get some kinds of cancer eighteen times as frequently as Japanese women who seldom drink milk.\n\nA little digging might uncover quite a number of ways to account for these figures, but one factor is enough by itself to show them up. Cancer is predominantly a disease that strikes in middle life or after. Switzerland and the states of the United States mentioned first are alike in having populations with relatively long spans of life. English women at the time the study was made were living an average of twelve years longer than Japanese women.\n\nProfessor Helen M. Walker has worked out an amusing illustration of the folly in assuming there must be cause and effect whenever two things vary together. In investigating the relationship between age and some physical characteristics of women, begin by measuring the angle of the feet in walking. You will find that the angle tends to be greater among older women. You might first consider whether this indicates that women grow older because they toe out, and you can see immediately that this is ridiculous. So it appears that age increases the angle between the feet, and most women must come to toe out more as they grow older.\n\nAny such conclusion is probably false and certainly unwarranted. You could only reach it legitimately by studying the same women—or possibly equivalent groups—over a period of time. That would eliminate the factor responsible here, which is that the older women grew up at a time when a young lady was taught to toe out in walking, while the members of the younger group were learning posture in a day when that was discouraged.\n\nWhen you find somebody—usually an interested party—making a fuss about a correlation, look first of all to see if it is not one of this type, produced by the stream of events, the trend of the times. In our time it is easy to show a positive correlation between any pair of things like these: number of students in college, number of inmates in mental institutions, consumption of cigarettes, incidence of heart disease, use of X-ray machines, production of false teeth, salaries of California school teachers, profits of Nevada gambling halls. To call some one of these the cause of some other is manifestly silly. But it is done every day.","questions":[{"id":1,"question":"The author's conclusion about the relationship between age and the\nways women walk indicates he believes that","options":["toeing out is associated with aging","toeing out is fashionable with the younger generation","toeing out was fashionable for an older generation","studying equivalent groups proves that toeing out increases with\nage"],"correct":2,"explanation":"The correct answer is option C. The passage supports this answer: toeing out was fashionable for an older generation. This is the most accurate and complete response based on the information provided in the passage. The other options eit
