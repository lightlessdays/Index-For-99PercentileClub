s can be inferred from the passage. The passage provides evidence that supports the conclusion that her life history provides more than a record of her personal\nexperience. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":5,"question":"According to the passage, one way in which life history studies\ndiffer from life-passage studies is that life-history studies are","options":["Usually told in the subject's native language.","Less reliable because they rely solely on the subject's recall.","More likely to be told without the influence of an intermediary.","More creative in the way they interpret the subject's cultural\nlegacy."],"correct":2,"explanation":"The correct answer is option C. The passage explicitly states or directly supports that more likely to be told without the influence of an intermediary. This information is stated in the passage, making it the most accurate answer based on the text."},{"id":6,"question":"Which one of the following pairings best illustrates the contrast\nbetween life passages and life histories?","options":["A study of the attitudes of a society toward a mainstream religion\nand an analysis of techniques used to instruct members of that religious\ngroup.","A study of how a preindustrial society maintains peace with\nneighboring societies and a study of how a postindustrial society does\nthe same.","A study of the way a military organization establishes and\nmaintains discipline and a newly enlisted soldier's narrative describing\nhis initial responses to the military environment.","An analysis of a society's means of subsistence and a study of how\nits members celebrate religious holidays."],"correct":2,"explanation":"The correct answer is option C. The passage supports this answer: a study of the way a military organization establishes and\nmaintains discipline and a newly enlisted soldier's narrative describing\nhis initial responses to the military environment. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."}]},"17":{"id":17,"title":"Until recently many astronomers believed that asteroids travel about the solar","difficulty":"Moderate","passage":"Until recently many astronomers believed that asteroids travel about the solar system unaccompanied by satellites. These astronomers assumed this because they considered asteroid-satellite systems inherently unstable. Theoreticians could have told them otherwise: even minuscule bodies in the solar system can theoretically have satellites, as long as everything is in proper scale. If a bowling ball were orbiting about the Sun in the asteroid belt, it could have a pebble orbiting it as far away as a few hundred radii (or about 50 meters) without losing the pebble to the Sun's gravitational pull.\n\nObservations now suggest that asteroid satellites may exists not only in theory but also in reality. Several astronomers have noticed, while watching asteroids pass briefly in front of stars, that something besides the known asteroid sometimes blocks out the star as well. Is that something a satellite?\n\nThe most convincing such report concerns the asteroid Herculina, which was due to pass in front of a star in 1978. Astronomers waiting for the predicted event found not just one occultation, or eclipse, of the star, but two distinct drops in brightness. One was the predicted occultation, exactly on time. The other, lasting about five seconds, preceded the predicted event by about two minutes. The presence of a secondary body near Herculina thus seemed strongly indicated. To cause the secondary occultation, an unseen satellite would have to be about 45 kilometers in diameter, a quarter of the size of Herculina, and at a distance of 990 kilometers from the asteroid at the time. These values are within theoretical bounds, and such an asteroid-satellite pair could be stable.\n\nWith the Herculina event, apparent secondary occultations became \"respectable\"—and more commonly reported. In fact, so common did reports of secondary events become that they are now simply too numerous for all of them to be accurate. Even if every asteroid has as many satellites as can be fitted around it without an undue number of collisions, only one in every hundred primary occultations would be accompanied by a secondary event (one in every thousand if asteroid satellites system resembled those of the planets).\n\nYet even astronomers who find the case for asteroid satellites unconvincing at present say they would change their minds if a photoelectric record were made of a well-behaved secondary event. By \"well-behaved\" they mean that during occultation the observed brightness must drop sharply as the star winks out () and must rise sharply as it reappears from behind the obstructing object, but the brightness during the secondary occultation must drop to that of the asteroid, no higher and no lower. This would make it extremely unlikely that an airplane or a glitch in the instruments was masquerading as an occulting body.","questions":[{"id":1,"question":"Which one of the following best expresses the main idea of the\npassage?","options":["The observation of Herculina represented the crucial event that\nastronomical observers and theoreticians had been waiting for to\nestablish a convincing case for the stability of asteroid-satellite\nsystems.","Although astronomers long believed that observation supports the\nexistence of stable asteroid-satellite systems, numerous recent reports\nhave increased skepticism on this issue in astronomy.","Theoreticians' views on the stability of asteroid-satellite\nsystems may be revised in the light of reports like those about\nHerculina.","The Herculina event suggests that theoreticians' views about\nasteroid-satellite systems may be correct, and astronomers agree about\nthe kind of evidence needed to clearly resolve the issue."],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: the herculina event suggests that theoreticians' views about\nasteroid-satellite systems may be correct, and astronomers agree about\nthe kind of evidence needed to clearly resolve the issue. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"Which one of the following is mentioned in the passage as providing\nevidence that Herculina has a satellite?","options":["the diameter of a body directly observed near Herculina","the distance between Herculina and planet nearest to it","the shortest possible time in which satellites of Herculina, if\nany, could complete a single orbit","the occultation that occurred shortly before the predicted\noccultation by Herculina"],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: the occultation that occurred shortly before the predicted\noccultation by herculina. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":3,"question":"According to the passage, the attitude of astronomers toward\nasteroid satellites since the Herculina event can best described as","options":["open-mindedness combined with a concern for rigorous standards of\nproof","contempt for and impatience with the position held by\ntheoreticians","bemusement at a chaotic mix of theory, inadequate or spurious\ndata, and calls for scientific rigor","hardheaded skepticism, implying rejection of all data not recorded\nautomatically by state-of-the-art instruments"],"correct":0,"explanation":"The correct answer is option A. The passage explicitly states or directly supports that open-mindedness combined with a concern for rigorous standards of\nproof. This information is stated in the passage, making it the most accurate answer based on the text."},{"id":4,"question":"The author implies that which one of the following was true prior to\nreports of the Herculina event?","options":["Since no good theoretical model existed, all claims that reports\nof secondary occultations were common were disputed.","Some of the reported observations of secondary occultations were\nactually observations of collisions of satellites with one another.","If there were observations of phenomena exactly like the phenomena\nnow labeled secondary occultations, astronomers were less likely than to\nhave reported such observations.","The prevailing standards concerning what to classify as a\nwell-behaved secondary event were less stringent than they are now."],"correct":2,"explanation":"The correct answer is option C. The passage supports this answer: if there were observations of phenomena exactly like the phenomena\nnow labeled secondary occultations, astronomers were less likely than to\nhave reported such observations. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":5,"question":"The information presented in the passage implies which one of the\nfollowing about the frequency of reports of secondary occultations after\nthe Herculina event?","options":["The percentage of reports of primary occultations that also\nincluded reports of secondary occultations increased tenfold compared to\nthe time before the Herculina event.","Primary occultations by asteroids were reported to have been\naccompanied by secondary occultations in about one out of every thousand\ncases.","The absolute number of reports of secondary occultations increased\ntenfold compared to the time before the Herculina event.","Primary occultations by asteroids were reported to have been\naccompanied by secondary occultations in more than one out of every\nhundred cases."],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: primary occultations by asteroids were reported to have been\naccompanied by secondary occultations in more than one out of every\nhundred cases. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":6,"question":"The primary purpose of the passage is to","options":["cast doubts on existing reports of secondary occultations of stars","describe experimental efforts by astronomers to separate\ntheoretically believable observations of satellites of asteroids from\nspurious ones","review the development of ideas among astronomers about whether or\nnot satellites of asteroids exist","bring a theoretician's perspective to bear on an incomplete\ndiscussion of satellites of asteroids"],"correct":2,"explanation":"The correct answer is option C. The passage as a whole is primarily focused on this theme. While other options may touch on aspects mentioned in the passage, the central purpose is best captured by this answer: review the development of ideas among astronomers about whether or\nnot satellites of asteroids exist."}]},"18":{"id":18,"title":"Historians attempting to explain how scientific work was done in the laboratory of","difficulty":"Moderate","passage":"Historians attempting to explain how scientific work was done in the laboratory of the seventeenth-century chemist and natural philosopher Robert Boyle must address a fundamental discrepancy between how such experimentation was actually performed and the seventeenth-century rhetoric describing it. Leaders of the new Royal Society of London in the 1660s insisted that authentic science depended upon actual experiments performed, observed, and recorded by the scientists themselves. Rejecting the traditional contempt for manual operations, these scientists, all members of the English upper class, were not to think themselves demeaned by the mucking about with chemicals, furnaces, and pumps; rather, the willingness of each of them to become, as Boyle himself said, a mere \"drudge\" and \"under-builder\" in the search for God's truth in nature was taken as a sign of their nobility and Christian piety.\n\nThis rhetoric has been so effective that one modern historian assures us that Boyle himself actually performed all of the thousand or more experiments he reported. In fact, due to poor eyesight, fragile health, and frequent absences from his laboratory, Boyle turned over much of the labor of obtaining and recording experimental results to paid technicians, although published accounts of the experiments rarely, if ever, acknowledged the technicians' contributions. Nor was Boyle unique in relying on technicians without publicly crediting their work.\n\nWhy were the contributions of these technicians not recognized by their employers? One reason is the historical tendency, which has persisted into the twentieth century, to view scientific discovery as resulting from momentary flashes of individual insight rather than from extended periods of cooperative work by individuals with varying levels of knowledge and skill. Moreover, despite the clamor of seventeenth-century scientific rhetoric commending a hands-on approach, science was still overwhelmingly an activity of the English upper class, and the traditional contempt that genteel society maintained for manual labor was pervasive and deeply rooted. Finally, all of Boyle's technicians were \"servants,\" which in seventeenth-century usage meant anyone who worked for pay. To seventeenth-century sensibilities, the wage relationship was charged with political significance. Servants, meaning wage earners, were excluded from the franchise because they were perceived as ultimately dependent on their wages and thus controlled by the will of their employers. Technicians remained invisible in the political economy of science for the same reasons that underlay servants' general political exclusion. The technicians' contribution, their observations and judgment, if acknowledged, would not have been perceived in the larger scientific community as objective because the technicians were dependent on the wages paid to them by their employers. Servants might have made the apparatus work, but their contributions to the making of scientific knowledge were largely—and conveniently—ignored by their employers.","questions":[{"id":1,"question":"Which one of the following best summarizes the main idea of the\npassage?","options":["Seventeenth-century scientific experimentation would have been\nimpossible without the work of paid laboratory technicians.","Seventeenth-century social conventions prohibited upper-class\nlaboratory workers from taking public credit for their work.","Seventeenth-century views of scientific discovery combined with\nsocial class distinctions to ensure that laboratory technicians'\nscientific work was never publicly acknowledged.","Seventeenth-century scientists were far more dependent on their\nlaboratory technicians than are scientists today, yet far less willing\nto acknowledge technicians' scientific contributions."],"correct":2,"explanation":"The correct answer is option C. The passage supports this answer: seventeenth-century views of scientific discovery combined with\nsocial class distinctions to ensure that laboratory technicians'\nscientific work was never publicly acknowledged. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"It can be inferred from the passage that the \"seventeenth-century\nrhetoric\" mentioned in line 6 would have more accurately described the\nexperimentation performed in Boyle's laboratory if which one of the\nfollowing were true?","options":["Unlike many seventeenth-century scientists, Boyle recognized that\nmost scientific discoveries resulted from the cooperative efforts of\nmany individuals.","Unlike many seventeenth-century scientists, Boyle maintained a\ndeeply rooted and pervasive contempt for manual labor.","Unlike many seventeenth-century scientists, Boyle was a member of\nthe Royal Society of London.","Boyle himself performed the actual labor of obtaining and\nrecording experimental results."],"correct":3,"explanation":"The correct answer is option D. This can be inferred from the passage. The passage provides evidence that supports the conclusion that boyle himself performed the actual labor of obtaining and\nrecording experimental results. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":3,"question":"According to the author, servants of seventeenth-century England\nwere excluded from the franchised because of the belief that","options":["their interests were adequately represented by their employers","their education was inadequate to make informed political\ndecisions","the independence of their political judgment would be compromised\nby their economic dependence on their employers","their participation in the elections would be a polarizing\ninfluence on the political process"],"correct":2,"explanation":"The correct answer is option C. The passage explicitly states or directly supports that the independence of their political judgment would be compromised\nby their economic dependence on their employers. This information is stated in the passage, making it the most accurate answer based on the text."},{"id":4,"question":"According to the author, the Royal Society of London insisted that\nscientists abandon the","options":["belief that the primary purpose of scientific discovery was to\nreveal the divine truth that could be found in nature","view that scientific knowledge results largely from the insights\nof a few brilliant individuals rather than from the cooperative efforts\nof many workers","seventeenth-century belief that servants should be denied the\nright to vote because they were dependent on wages paid to them by their\nemployers","traditional disdain for manual labor that was maintained by most\nmembers of the English upper class during the seventeenth-century"],"correct":3,"explanation":"The correct answer is option D. The passage explicitly states or directly supports that traditional disdain for manual labor that was maintained by most\nmembers of the english upper class during the seventeenth-century. This information is stated in the passage, making it the most accurate answer based on the text."},{"id":5,"question":"The author implies that which one of the following beliefs was held\nin both the seventeenth and the twentieth centuries?","options":["Individual insights rather than cooperative endeavors produce most\nscientific discoveries.","How science is practiced is significantly influenced by the\npolitical beliefs and assumption of scientists.","Scientific research undertaken for pay cannot be considered\nobjective.","Scientific discovery can reveal divine truth in nature."],"correct":0,"explanation":"The correct answer is option A. The passage supports this answer: individual insights rather than cooperative endeavors produce most\nscientific discoveries. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":6,"question":"Which one of the following best describes the organization of the\nlast paragraph?","options":["Several alternative answers are presented to a question posed in\nthe previous paragraph, and the last is adopted as the most plausible.","A question regarding the cause of the phenomenon described in the\nprevious paragraph is posed, two possible explanations are rejected, and\nevidence is provided in support of a third.","A question regarding the phenomenon described in the previous\nparagraph is posed, and several incompatible views are presented.","A question regarding the cause of the phenomenon described in the\nprevious paragraph is posed, and several contributing factors are then\ndiscussed."],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: a question regarding the cause of the phenomenon described in the\nprevious paragraph is posed, and several contributing factors are then\ndiscussed. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."}]},"19":{"id":19,"title":"One type of violation of the antitrust laws is the abuse of monopoly power","difficulty":"Moderate","passage":"One type of violation of the antitrust laws is the abuse of monopoly power. Monopoly power is the ability of a firm to raise its prices above the competitive level—that is, above the level that would exist naturally if several firms had to compete—without driving away so many customers as to make the price increase unprofitable. In order to show that a firm has abused monopoly power, and thereby violated the antitrust laws, two essential facts must be established. First, a firm must be shown to possess monopoly power, and second, that power must have been used to exclude competition in the monopolized market or related markets.\n\nThe price a firm may charge for its product is constrained by the availability of close substitutes for the product. If a firm attempts to charge a higher price—a supracompetitive price—consumers will turn to other firms able to supply substitute products at competitive prices. If a firm provides a large percentage of the products actually or potentially available, however, customers may find it difficult to buy from alternative suppliers. Consequently, a firm with a large share of the relevant market of substitutable products may be able to raise its price without losing many customers. For this reason courts often use market share as a rough indicator of monopoly power.\n\nSupracompetitive prices are associated with a loss of consumers' welfare because such prices force some consumers to buy a less attractive mix of products than they would ordinarily buy. Supracompetitive prices, however, do not themselves constitute an abuse of monopoly power. Antitrust laws do not attempt to counter the mere existence of monopoly power, or even the use of monopoly power to extract extraordinarily high profits. For example, a firm enjoying economies of scale—that is, low unit production costs due to high volume—does not violate the antitrust laws when it obtains a large market share by charging prices that are profitable but so low that its smaller rivals cannot survive. If the antitrust laws posed disincentives to the existence and growth of such firms, the laws could impair consumers' welfare. Even if the firm, upon acquiring monopoly power, chose to raise prices in order to increase profits, it would not be in violation of the antitrust laws.\n\nThe antitrust prohibitions focus instead on abuses of monopoly power that exclude competition in the monopolized market or involve leverage—the use of power in one market to reduce competition in another. One such forbidden practice is a tying arrangement, in which a monopolist conditions the sale of a product in one market on the buyer's purchase of another product in a different market. For example, a firm enjoying a monopoly in the communications systems market might not sell its products to a consumer unless that customer also buys its computer systems, which are competing with other firms' computer systems.\n\nThe focus on the abuse of monopoly power, rather than on monopoly itself, follows from the primary purpose of the antitrust laws: to promote consumers' welfare through assurance of the quality and quantity of products available to consumers.","questions":[{"id":1,"question":"Which one of the following distinctions between monopoly power and\nthe abuse of monopoly power would the author say underlies the antitrust\nlaws discussed in the passage?","options":["Monopoly power is assessed in term of market share, whereas abuse\nof monopoly power is assessed in term of market control.","Monopoly power is easy to demonstrate, whereas abuse of monopoly\npower is difficult to demonstrate.","Monopoly power involves only one market, whereas abuse of monopoly\npower involves at least two or more related markets.","Monopoly power does not necessarily hurt consumer welfare, whereas\nabuse of monopoly power does."],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: monopoly power does not necessarily hurt consumer welfare, whereas\nabuse of monopoly power does. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"Would the use of leverage meet the criteria for abuse of monopoly\npower outlined in the first paragraph?","options":["No, because leverage involves a nonmonopolized market.","No, unless the leverage involves a tying arrangement.","Yes, because leverage is a characteristic of monopoly power.","Yes, because leverage is used to eliminate competition in a\nrelated market."],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: yes, because leverage is used to eliminate competition in a\nrelated market. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":3,"question":"What is the main purpose of the third paragraph (lines 28---47)?","options":["to distinguish between supracompetitive prices and\nsupracompetitive profits","to describe the positive use of monopoly power","to introduce the concept of economies of scale","to distinguish what is not covered by the antitrust law under\ndiscussion from what is covered"],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: to distinguish what is not covered by the antitrust law under\ndiscussion from what is covered. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":4,"question":"Given only the information in the passage, with which one of the\nfollowing statements about competition would those responsible for the\nantitrust laws most likely agree?","options":["Competition is essential to consumers' welfare.","There are acceptable and unacceptable ways for firms to reduce\ntheir competition.","The preservation of competition is the principal aim of the\nantitrust laws.","Supracompetitive prices lead to reductions in competition."],"correct":1,"explanation":"The correct answer is option B. Based on the arguments and positions presented in the passage, the author would most likely agree that there are acceptable and unacceptable ways for firms to reduce\ntheir competition. This aligns with the overall thrust of the author's argument."},{"id":5,"question":"Which one of the following sentences would best complete the last\nparagraph of the passage?","options":["By limiting consumers' choices, abuse of monopoly power reduces\nconsumers' welfare, but monopoly alone can sometimes actually operate in\nthe consumers' best interest.","What is needed now is a set of related laws to deal with the\nnegative impacts that monopoly itself has on consumers' ability to\npurchase products at reasonable cost.","Over time, the antitrust laws have been very effective in ensuring\ncompetition and, consequently, consumers' welfare in the volatile\ncommunications and computer systems industries.","By controlling supracompetitive prices and corresponding\nsupracompetitive profits, the antitrust laws have, indeed, gone a long\nway toward meeting that objective."],"correct":0,"explanation":"The correct answer is option A. The passage supports this answer: by limiting consumers' choices, abuse of monopoly power reduces\nconsumers' welfare, but monopoly alone can sometimes actually operate in\nthe consumers' best interest. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."}]},"20":{"id":20,"title":"Amsden has divided Navajo weaving into four distinct styles","difficulty":"Moderate","passage":"Amsden has divided Navajo weaving into four distinct styles. He argues that three of them can be identified by the type of design used to form horizontal bands: colored strips, zigzags, or diamonds. The fourth, or bordered, style he identifies by a distinct border surrounding centrally placed, dominating figures.\n\nAmsden believes that the diamond style appeared after 1869 when, under Anglo influence and encouragement, the blanket became a rug with larger designs and bolder lines. The bordered style appeared about 1890, and, Amsden argues, it reflects the greatest number of Anglo influences on the newly emerging rug business. The Anglo desire that anything with a graphic designs have a top, bottom, and border is a cultural preference that the Navajo abhorred, as evidenced, he suggests, by the fact that in early bordered specimens strips of color unexpectedly break through the enclosing pattern.\n\nAmsden argues that the bordered rug represents a radical break with previous styles. He asserts that the border changed the artistic problem facing weavers: a blank area suggests the use of isolated figures, while traditional, banded Navajo designs were continuous and did not use isolated figures. The old patterns alternated horizontal decorative zones in a regular order.\n\nAmsden's view raises several questions. First, what is involved in altering artistic styles? Some studies suggest that artisans' motor habits and thought processes must be revised when a style changes precipitously. In the evolution of Navajo weaving, however, no radical revisions in the way articles are produced need be assumed. After all, all weaving subordinates design to the physical limitations created by the process of weaving, which includes creating an edge or border. The habits required to make decorative borders are, therefore, latent and easily brought to the surface.\n\nSecond, is the relationship between the banded and bordered styles as simple as Amsden suggests? He assumes that a break in style is a break in psychology. But if style results from constant quests for invention, such stylistic breaks are inevitable. When a style has exhausted the possibilities inherent in its principles, artists cast about (v., ) for new, but not necessarily alien, principles. Navajo weaving may have reached this turning point prior to 1890.\n\nThird, is there really a significant stylistic gap? Two other styles lie between the banded styles and the bordered styles. They suggest that disintegration of the bands may have altered visual and motor habits and prepared the way for a border filled with separate units. In the Chief White Antelope blanket, dated prior to 1865, ten years before the first Anglo trading post on the Navajo reservation, whole and partial diamonds interrupt the flowing design and become separate forms. Parts of diamonds arranged vertically at each side may be seen to anticipate the border.","questions":[{"id":1,"question":"The author's central thesis is that","options":["the Navajo rejected the stylistic influences of Anglo culture","Navajo weaving cannot be classified by Amsden's categories","the Navajo changed their style of weaving because they sought the\nchallenge of new artistic problems","the casual factors leading to the emergence of the bordered style\nare not as clear-cut as Amsden suggests"],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: the casual factors leading to the emergence of the bordered style\nare not as clear-cut as amsden suggests. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"It can be inferred from the passage that Amsden views the use of\n\"strips of color\" (line 18) in the early bordered style as","options":["a sign of resistance to a change in style","an echo of the diamond style","a feature derived from Anglo culture","an attempt to disintegrate the rigid form of the banded style"],"correct":0,"explanation":"The correct answer is option A. This can be inferred from the passage. The passage provides evidence that supports the conclusion that a sign of resistance to a change in style. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":3,"question":"The author's view of Navajo weaving suggests which one of the\nfollowing?","options":["The appearance of the first trading post on the Navajo reservation\ncoincided with the appearance of the diamond style.","Traces of thought processes and motor habits of one culture can\ngenerally be found in the art of another culture occupying the same\nperiod and region.","The bordered style may have developed gradually from the banded\nstyle as a result of Navajo experiencing with design.","The influence of Anglo culture was not the only non-Native\nAmerican influence on Navajo weaving."],"correct":2,"explanation":"The correct answer is option C. This can be inferred from the passage. The passage provides evidence that supports the conclusion that the bordered style may have developed gradually from the banded\nstyle as a result of navajo experiencing with design. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":4,"question":"According to the passage, Navajo weavings made prior to 1890\ntypically were characterized by all of the following EXCEPT","options":["repetition of forms","overall patterns","horizontal bands","isolated figures"],"correct":3,"explanation":"The correct answer is option D. The passage explicitly states or directly supports that isolated figures. This information is stated in the passage, making it the most accurate answer based on the text."},{"id":5,"question":"The author would most probably agree with which one of the\nfollowing conclusions about the stylistic development of Navajo weaving?","options":["The styles of Navajo weaving changed in response to changes in\nNavajo motor habits and thought processes.","The zigzag style was the result of stylistic influences from Anglo\nculture.","Navajo weaving used isolated figures in the beginning, but\ncombined naturalistic and abstract designs in later styles.","Navajo weaving changed gradually from a style in which the entire\nsurface was covered by horizontal bands to one in which central figures\ndominated the surface."],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: navajo weaving changed gradually from a style in which the entire\nsurface was covered by horizontal bands to one in which central figures\ndominated the surface. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":6,"question":"The author suggests that Amsden's claim that borders in Navajo\nweaving were inspired by Anglo culture could be","options":["conceived as a response to imagined correspondences between Anglo\nand Navajo art","biased by Amsden's feelings about Anglo culture","a result of Amsden's failing to take into account certain aspects\nof Navajo weaving","based on a limited number of specimens of the styles of Navajo\nweaving"],"correct":2,"explanation":"The correct answer is option C. This can be inferred from the passage. The passage provides evidence that supports the conclusion that a result of amsden's failing to take into account certain aspects\nof navajo weaving. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."}]},"21":{"id":21,"title":"The Taft-Hartley Act, passed by the United States Congress in 1947, gave states the","difficulty":"Moderate","passage":"The Taft-Hartley Act, passed by the United States Congress in 1947, gave states the power to enact \"right-to-work\" legislation that prohibits union shop () agreements. According to such an agreement, a labor union negotiates wages and working conditions for all workers in a business, and all workers are required to belong to the union. Since 1947, 20 states have adopted right-to-work laws. Much of the literature concerning right-to-work laws implies that such legislation has not actually had a significant impact. This point of view, however, has not gone uncriticized. Thomas V Carroll has proposed that the conclusions drawn by previous researchers are attributable to their myopic focus on the premise that, unless right-to-work laws significantly reduce union membership within a state, they have no effect. Carroll argues that the right-to-work laws \"do matter\" in that such laws generate differences in real wages across states. Specifically, Carroll indicates that while right-to-work laws may not \"destroy\" unions by reducing the absolute number of unionized workers, they do impede the spread of unions and thereby reduce wages within right-to-work states. Because the countervailing power of unions is weakened in right-to-work states, manufacturers and their suppliers can act cohesively in competitive labor markers, thus lowering wages in the affected industries.\n\nSuch a finding has important implications regarding the demographics of employment and wages in right-to-work states. Specifically, if right-to-work laws lower wages by weakening union power, minority workers can be expected to suffer a relatively greater economic disadvantage in right-to-work states than in union shop states. This is so because, contrary to what was once thought, union tend to have a significant positive impact on the economic position of minority workers, especially Black workers, relative to White workers. Most studies concerned with the impact of unionism on the Black worker's economic position relative to the White worker's have concentrated on the changes in Black wages due to union membership. That is, they have concentrated on union versus nonunion groups. In a pioneering study, however, Ashenfelter finds that these studies overlook an important fact: although craft unionism increase the differential between the wages of White workers and Black workers due to the traditional exclusion of minority workers from unions in the craft sectors of the labor market, strong positive wage gains are made by Black workers within industrial unions. In fact, Ashenfelter estimates that industrial unionism decreases the differential between the wages of Black workers and White workers by about 3 percent. If state right-to-work laws weaken the economic power of unions to raise wages, Black workers will experience a disproportionate decline in their relative wage positions. Black workers in right-to-work states would therefore experience a decline in their relative economic positions unless there is strong economic growth in right-to-work states, creating labor shortages and thereby driving up wages.","questions":[{"id":1,"question":"The reasoning behind the \"literature\" (line 9), as that reasoning is\npresented in the passage, is most analogous to the reasoning behind\nwhich one of the following situations?","options":["A law is proposed that benefits many but disadvantages a few:\nthose advocating passage of the law argue that the disadvantages to few\nare not so serious that the benefits should be denied to many.","A new tax on certain categories of consumer items is proposed:\nthose in favor of the tax argue that those affected by the tax are well\nable to pay it, since the items taxed are luxury items.","A college sets strict course requirements that every student must\ncomplete before graduating; students already enrolled argue that it is\nunfair for the new requirements to apply to those enrolled before the\nchange.","A fare increase in a public transportation system does not\nsignificantly reduce the number of fares sold: the management of the\npublic transportation system asserts, therefore, that the fare hike has\nhad no negative effects."],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: a fare increase in a public transportation system does not\nsignificantly reduce the number of fares sold: the management of the\npublic transportation system asserts, therefore, that the fare hike has\nhad no negative effects. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"According to the passage, which one of the following is true of\nCarroll's study?","options":["It implies that right-to-work laws have had a negligible effect on\nworkers in right-to-work states.","It demonstrates that right-to-work laws have significantly\ndecreased union membership from what it once was in right-to-work\nstates.","It argues that right-to-work laws have affected wages in\nright-to-work states.","It supports the findings of most earlier researchers."],"correct":2,"explanation":"The correct answer is option C. The passage explicitly states or directly supports that it argues that right-to-work laws have affected wages in\nright-to-work states. This information is stated in the passage, making it the most accurate answer based on the text."},{"id":3,"question":"It can be inferred from the passage that the author believes which\none of following about craft unions?","options":["Craft unions have been successful in ensuring that the wages of\ntheir members remain higher than the wages of nonunion workers in the\nsame occupational groups.","The number of minority workers joining craft unions has increased\nsharply in states that have not adopted right-to-work legislation.","Wages for workers belonging to craft unions have generally risen\nfaster and more steadily than wages for workers belonging to industrial\nunions.","The wages of workers belonging to craft unions have not been\nsignificantly affected by right-to-work legislation, although the wages\nof workers belonging to industrial unions have been negatively\naffected."],"correct":0,"explanation":"The correct answer is option A. This can be inferred from the passage. The passage provides evidence that supports the conclusion that craft unions have been successful in ensuring that the wages of\ntheir members remain higher than the wages of nonunion workers in the\nsame occupational groups. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":4,"question":"Which one of the following best describes the effect industrial\nunionism has had on the wages of Black workers relative to those of\nWhite workers, as that effect is presented in the passage?","options":["Prior to 1947, industrial unionism had little effect on the wages\nof Black workers relative to those of White workers: since 1947, it has\nhad a slight positive effect.","Prior to 1947, industrial unionism had a strong positive effect on\nthe wages of Black workers relative to those of White workers: since\n1947, it has had little effect.","Prior to 1947, industrial unionism had a negative effect on the\nwages of Black workers relative to those of White workers: since 1947,\nit has had a significant positive effect.","Industrial unionism has contributed strongly to a 3 percent\ndecrease in the wage differential between Black workers and White\nworkers."],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: industrial unionism has contributed strongly to a 3 percent\ndecrease in the wage differential between black workers and white\nworkers. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":5,"question":"According to the passage, which one of the following could\ncounteract the effects of a decrease in unions' economic power to raise\nwages in right-to-work states?","options":["a decease in the number of union shop agreements","strong economic growth that creates labor shortages","a decrease in membership in craft unions","the merging of large industrial unions"],"correct":1,"explanation":"The correct answer is option B. The passage explicitly states or directly supports that strong economic growth that creates labor shortages. This information is stated in the passage, making it the most accurate answer based on the text."},{"id":6,"question":"Which one of the following best describes the passage as a whole?","options":["an overview of a problem in research methodology and a recommended\nsolution to that problem","a comparison of two competing theories and a suggestion for\nreconciling them","a critique of certain legislation and a proposal for modification\nof that legislation","a review of research that challenges the conclusions of earlier\nresearchers"],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: a review of research that challenges the conclusions of earlier\nresearchers. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."}]},"22":{"id":22,"title":"In the late nineteenth century, the need for women physicians in missionary","difficulty":"Moderate","passage":"In the late nineteenth century, the need for women physicians in missionary hospitals in Canton, China, led to expanded opportunities for both Western women and Chinese women. The presence of Western women as medical missionaries in China was made possible by certain changes within the Western missionary movement. Beginning in the 1870s, increasingly large numbers of women were forming women's foreign mission societies dedicated to the support of women's foreign mission work. Beyond giving the women who organized the societies a formal activity outside their home circles, these organizations enabled an increasing number of single women missionaries (as opposed to women who were part of the more typical husband-wife missionary teams) to work abroad. Before the formation of these women's organizations, mission funds had been collected by ministers and other church leaders, most of whom emphasized local parish work. What money was spent on foreign missions was under the control of exclusively male foreign mission boards whose members were uniformly uneasy about the new idea of sending single women out into the mission field. But as women's groups began raising impressive amounts of money donated specifically in support of single women missionaries, the home churches bowed both to women's changing roles at home and to increasing numbers of single professional missionary women abroad.\n\nAlthough the idea of employing a woman physician was a daring one for most Western missionaries in China, the advantages of a well-trained Western woman physician could not be ignored by Canton mission hospital administrators. A woman physician could attend women patients without offending any of the accepted conventions of female modesty. Eventually, some of these women were able to found and head separate women's medical institutions, thereby gaining access to professional responsibilities far beyond those available to them at home.\n\nThese developments also led to the attainment of valuable training and status by a significant number of Chinese women. The presence of women physicians in Canton mission hospitals led many Chinese women to avail themselves of Western medicine who might otherwise have failed to do so because of their culture's emphasis on physical modesty. In order to provide enough women physicians for these patients, growing numbers of young Chinese women were given instruction in medicine. This enabled them to earn an independent income, something that was then largely unavailable to women within traditional Chinese society. Many women graduates were eventually able to go out on their own into private practice, freeing themselves of dependence upon the mission community.\n\nThe most important result of these opportunities was the establishment of clear evidence of women's abilities and strengths, clear reasons for affording women expanded opportunities, and clear role models for how these abilities and responsibilities might be exercised.","questions":[{"id":1,"question":"Which one of the following statements about Western women\nmissionaries working abroad can be inferred from the passage?","options":["There were very few women involved in foreign missionary work\nbefore the 1870s.","Most women working abroad as missionaries before the 1870s were\nfinanced by women's foreign mission societies.","Most women employed in mission hospitals abroad before the 1870s\nwere trained as nurses rather than as physicians.","Most women missionaries working abroad before the 1870s were\nmarried to men who were also missionaries."],"correct":3,"explanation":"The correct answer is option D. This can be inferred from the passage. The passage provides evidence that supports the conclusion that most women missionaries working abroad before the 1870s were\nmarried to men who were also missionaries. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":2,"question":"The author mentions that most foreign mission boards were\nexclusively male most probably in order to","options":["Contrast foreign mission boards with the boards of secular\norganizations sending aid to China.","Explain the policy of foreign mission boards toward training\nChinese women in medicine.","Justify the preference of foreign mission boards for\nprofessionally qualified missionaries.","Help account for the attitude of foreign mission boards towards\nsending single women missionaries abroad."],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: help account for the attitude of foreign mission boards towards\nsending single women missionaries abroad. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":3,"question":"Which one of the following best describes the organization of the\npassage?","options":["A situation is described, conditions that brought about the\nsituation are explained, and results of the situation are enumerated.","An assertion is made, statements supporting and refuting the\nassertion are examined, and a conclusion is drawn.","An obstacle is identified, a variety of possible ways to overcome\nthe obstacle are presented, and an opinion is ventured.","A predicament is outlined, factors leading up to the predicament\nare scrutinized, and a tentative resolution of the predicament is\nrecommended."],"correct":0,"explanation":"The correct answer is option A. The passage supports this answer: a situation is described, conditions that brought about the\nsituation are explained, and results of the situation are enumerated. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":4,"question":"Which one of the following, if true, would most undermine the\nauthor's analysis of the reason for the increasing number of single\nwomen missionaries sent abroad beginning in the 1870s?","options":["The Western church boards that sent the greatest number of single\nwomen missionaries abroad had not received any financial support from\nwomen's auxiliary groups.","The women who were sent abroad as missionary physicians had been\nraised in families with a strong history of missionary commitment.","Most of the single missionary women sent abroad were trained as\nteachers and translators rather than as medical practitioners.","The western church boards tended to send abroad single missionary\nwomen who had previously been active in local parish work."],"correct":0,"explanation":"The correct answer is option A. The passage supports this answer: the western church boards that sent the greatest number of single\nwomen missionaries abroad had not received any financial support from\nwomen's auxiliary groups. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":5,"question":"According to the passage, which one of the following was a factor\nin the acceptance of Western women as physicians in mission hospitals in\nCanton, China?","options":["The number of male physicians practicing in that region.","The specific women's foreign mission society that supplied the\nfunding.","The specific home parishes from which the missionary women came.","The cultural conventions of the host society."],"correct":3,"explanation":"The correct answer is option D. The passage explicitly states or directly supports that the cultural conventions of the host society. This information is stated in the passage, making it the most accurate answer based on the text."},{"id":6,"question":"The passage suggests which one of the following about medical\npractices in late-nineteenth-century Canton, China?","options":["There was great suspicion of non-Chinese medical practices.","Medical care was more often administered in the home than in\nhospitals.","It was customary for women physicians to donate a portion of their\nincome for the maintenance of their extended family.","It was not customary for female patients to be treated by male\nphysicians."],"correct":3,"explanation":"The correct answer is option D. This can be inferred from the passage. The passage provides evidence that supports the conclusion that it was not customary for female patients to be treated by male\nphysicians. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."}]},"23":{"id":23,"title":"In recent years the early music movement, which advocates performing a work as it","difficulty":"Moderate","passage":"In recent years the early music movement, which advocates performing a work as it was performed at the time of its composition, has taken on the character of a crusade, particularly as it has moved beyond the sphere of medieval and baroque music and into music from the late eighteenth and early nineteenth centuries by composers such as Mozart and Beethoven. Granted, knowledge about the experience of playing old music on now-obsolete instruments has been of inestimable value to scholars. Nevertheless, the early music approach to performance raises profound and troubling questions.\n\nEarly music advocates assume that composers write only for the instruments available to them, but evidence suggests that composers of Beethoven's stature imagined extraordinarily high and low notes as part of their compositions, even when they recognized that such notes could not be played on instruments available at the time. In the score of Beethoven's first piano concerto, there is a \"wrong\" note, a high F-natural where the melody obviously calls for a high F-sharp, but pianos did not have this high an F-sharp when Beethoven composed the concerto. Because Beethoven once expressed a desire to revise his early works to exploit the extended range of pianos that became available to him some years later, it seems likely that he would have played the F-sharp if given the opportunity. To use a piano exactly contemporary with the work's composition would require playing a note that was probably frustrating for Beethoven himself to have had to play.\n\nIn addition, early music advocates often inadvertently divorce music and its performance from the life of which they were, and are, a part. The discovery that Haydn's and Mozart's symphonies were conducted during their lifetimes by a pianist who played the chords to keep the orchestra together has given rise to early music recordings in which a piano can be heard obtrusively in the foreground, despite evidence indicating that the orchestral piano was virtually inaudible to audiences at eighteenth-century concerts and was dropped as musically unnecessary when a better way to beat time was found. And although in the early nineteenth century the first three movements (sections) of Mozart's and Beethoven's symphonies were often played faster, and the last movement slower than today, this difference can readily be explained by the fact that at that time audiences applauded at the end of each movement, rather than withholding applause until the end of the entire work. As a result, musicians were not forced into extra brilliance in the finale in order to generate applause, as they are now. To restore the original tempo of these symphonies represents an irrational denial of the fact that our concepts of musical intensity and excitement have quite simply, changed.","questions":[{"id":1,"question":"It can be inferred from the passage that by \"a piano exactly\ncontemporary\" (line 30) with the composition of Beethoven's first piano\nconcerto, the author means the kind of piano that was","options":["Designed to be inaudible to the audience when used by conductors\nof orchestras.","Incapable of playing the high F-natural that is in the score of\nBeethoven's original version of the concerto.","Unavailable to Mozart and Haydn.","Incapable of playing the high F-sharp that the melody of the\nconcerto calls for."],"correct":3,"explanation":"The correct answer is option D. This can be inferred from the passage. The passage provides evidence that supports the conclusion that incapable of playing the high f-sharp that the melody of the\nconcerto calls for. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":2,"question":"Which one of the following best expresses the main idea of the\npassage?","options":["The early music movement has yet to resolve a number of troubling\nquestions regarding its approach to the performance of music.","The early music movement, while largely successful in its approach\nto the performance of medieval and baroque music, has yet to justify its\nuse of obsolete instruments in the performance of music by Beethoven and\nMozart.","The early music approach to performance often assumes that\ncomposers write music that is perfectly tailored to the limitations of\nthe instruments on which it will be performed during their lifetimes.","Although advocates of early music know much about the instruments\nused to perform music at the time it was composed, they lack information\nregarding how the style of such performances has changed since such\nmusic was written."],"correct":0,"explanation":"The correct answer is option A. The passage supports this answer: the early music movement has yet to resolve a number of troubling\nquestions regarding its approach to the performance of music. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":3,"question":"In the second paragraph, the author discusses Beethoven's first\npiano concerto primarily in order to","options":["Illustrate how piano music began to change in response to the\nextended range of pianos that became available during Beethoven's\nlifetime.","Illustrate how Beethoven's work failed to anticipate the changes\nin the design of instruments that were about to be made during his\nlifetime.","Suggest that early music advocates commonly perform music using\nscores that do not reflect revisions made to the music years after it\nwas originally composed.","Illustrate how composers like Beethoven sometimes composed music\nthat called for notes that could not be played on instruments that were\ncurrently available."],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: illustrate how composers like beethoven sometimes composed music\nthat called for notes that could not be played on instruments that were\ncurrently available. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":4,"question":"The author suggests that the final movements of symphonies by\nMozart and Beethoven might be played more slowly by today's orchestras\nif which one of the following were to occur?","options":["Orchestras were to use instruments no more advanced in design than\nthose used by orchestras at the time Mozart and Beethoven composed their\nsymphonies.","Audiences were to return to the custom of applauding at the end of\neach movement of a symphony.","Audiences were to reserve their most enthusiastic applause for the\nmost brilliantly played finales.","Conductors were to return to the practice of playing the chords on\nan orchestral piano to keep the orchestra together."],"correct":1,"explanation":"The correct answer is option B. This can be inferred from the passage. The passage provides evidence that supports the conclusion that audiences were to return to the custom of applauding at the end of\neach movement of a symphony. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":5,"question":"Which one of the following best describes the organization of the\nlast paragraph?","options":["A generalization is made evidence undermining it is presented, and\na conclusion rejecting it is then drawn.","A criticism is stated and then elaborated with two supporting\nexamples.","An assumption is identified and then evidence undermining its\nvalidity is presented.","An assumption is identified and then evidence frequently provided\nin support of it is then critically evaluated."],"correct":1,"explanation":"The correct answer is option B. The passage supports this answer: a criticism is stated and then elaborated with two supporting\nexamples. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":6,"question":"It can be inferred from the passage that the author's explanation\nin lines 50-54 would be most weakened if which one of the following were\ntrue?","options":["Musicians who perform in modern orchestras generally receive more\nextensive training than did their nineteenth-century counterparts.","Breaks between the movements of symphonies performed during the\nearly nineteenth century often lasted longer than they do today because\nnineteenth-century musicians needed to retune their instruments between\neach movement.","Early nineteenth-century orchestral musicians were generally as\nconcerned with the audience's response to their music as are the\nmusicians who perform today in modern orchestras.","Early nineteenth-century audience applauded only perfunctorily\nafter the first three movements of symphonies and conventionally\nwithheld their most enthusiastic applause until the final movement was\ncompleted."],"correct":3,"explanation":"The correct answer is option D. This can be inferred from the passage. The passage provides evidence that supports the conclusion that early nineteenth-century audience applauded only perfunctorily\nafter the first three movements of symphonies and conventionally\nwithheld their most enthusiastic applause until the final movement was\ncompleted. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."}]},"24":{"id":24,"title":"Although the United States steel industry faces widely publicized economic problems","difficulty":"Moderate","passage":"Although the United States steel industry faces widely publicized economic problems that have eroded its steel production capacity, not all branches of the industry have been equally affected. The steel industry is not monolithic: it includes integrated producers, minimills, and specialty-steel mills. The integrated producers start with iron ore and coal and produce a wide assortment of shaped steels. The minimills reprocess scrap steel into a limited range of low-quality products, such as reinforcing rods for concrete. The specialty-steel mills are similar to minimills in that they tend to be smaller than the integrated producers and are based on scrap, but they manufacture much more expensive products than minimills do and commonly have an active in-house research-and-development effort.\n\nBoth minimills and specialty-steel mills have succeeded in avoiding the worst of the economic difficulties that are afflicting integrated steel producers, and some of the mills are quite profitable. Both take advantage of new technology for refining and casting steel, such as continuous casting, as soon as it becomes available. The minimills concentrate on producing a narrow range of products for sale in their immediate geographic area, whereas specialty-steel mills preserve flexibility in their operations in order to fulfill a customer's particular specifications.\n\nAmong the factors that constrain the competitiveness of integrated producers are excessive labor, energy, and capital costs, as well as manufacturing inflexibility. Their equipment is old and less automated, and does not incorporate many of the latest refinement in steelmaking technology. (For example, only about half of the United States integrated producers have continuous casters, which combine pouring and rolling into one operation and thus save the cost of separate rolling equipment.) One might conclude that the older labor-intensive machinery still operating in United States integrated plants is at fault for the poor performance of the United States industry, but this cannot explain why Japanese integrated producers, who produce a higher-quality product using less energy and labor, are also experiencing economic trouble. The fact is that the common technological denominator of integrated producers is an inherently inefficient process that is still rooted in the nineteenth century.\n\nIntegrated producers have been unable to compete successfully with minimills because the minimills, like specialty-steel mills, have dispensed almost entirely with the archaic energy and capital-intensive front end of integrated steelmaking: the iron-smelting process, including the mining and preparation of the raw materials and the blast-furnace operation. In addition, minimills have found a profitable way to market steel products: as indicated above, they sell their finished products locally, thereby reducing transportation costs, and concentrate on a limited range of shapes and sizes within a narrow group of products that can be manufactured economically. For these reasons, minimills have been able to avoid the economic decline affecting integrated steel producers.","questions":[{"id":1,"question":"Which one of the following best expresses the main idea of the\npassage?","options":["United States steel producers face economic problems that are\nshared by producers in other nations.","Minimills are the most successful steel producers because they\nbest meet market demands for cheap steel.","Minimills and specialty-steel mills are more economically\ncompetitive than integrated producers because they use new technology\nand avoid the costs of the iron-smelting process.","United States steel producers are experiencing an economic decline\nthat can be traced back to the nineteenth century."],"correct":2,"explanation":"The correct answer is option C. The passage supports this answer: minimills and specialty-steel mills are more economically\ncompetitive than integrated producers because they use new technology\nand avoid the costs of the iron-smelting process. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"The author mentions all of the following as features of minimills\nEXCEPT","options":["flexibility in their operations","local sale of their products","avoidance of mining operations","use of new steel-refining technology"],"correct":0,"explanation":"The correct answer is option A. The passage supports this answer: flexibility in their operations. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":3,"question":"The author of the passage refers to \"Japanese integrated producers\"\n(line 43) primarily in order to support the view that","options":["different economic difficulties face the steel industries of\ndifferent nations","not all integrated producers share a common technological\ndenominator","labor-intensive machinery cannot be blamed for the economic\ncondition of United States integrated steel producers","modern steelmaking technology is generally labor-and\nenergy-efficient"],"correct":2,"explanation":"The correct answer is option C. The passage supports this answer: labor-intensive machinery cannot be blamed for the economic\ncondition of united states integrated steel producers. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":4,"question":"Which one of the following best describes the organization of the\nthird paragraph?","options":["A hypothesis is proposed and supported; then an opposing view is\npresented and criticized.","A debate is described and illustrated: then a contrast is made and\nthe debate is resolved.","A dilemma is described and cited as evidence for a broader\ncriticism.","General statements are made and details given; then an explanation\nis proposed and rejected, and an alternative is offered."],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: general statements are made and details given; then an explanation\nis proposed and rejected, and an alternative is offered. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":5,"question":"It can be inferred from the passage that United States\nspecialty-steel mills generally differ from integrated steel producers\nin that the specialty-steel mills","options":["sell products in a restricted geographical area","share the economic troubles of the minimills","resemble specialty-steel mills found in Japan","do not operate blast furnaces"],"correct":3,"explanation":"The correct answer is option D. This can be inferred from the passage. The passage provides evidence that supports the conclusion that do not operate blast furnaces. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":6,"question":"Each of the following describes an industry facing a problem also\nexperienced by United Stated integrated steel producers EXCEPT","options":["a paper-manufacturing company that experiences difficulty in\nobtaining enough timber and other raw materials to meet its orders","a food-canning plant whose canning machines must constantly be\ntended by human operators","a textile firm that spends heavily on capital equipment and energy\nto process raw cotton before it is turned into fabric","a window-glass manufacturer that is unable to produce quickly\ndifferent varieties of glass with special features required by certain\ncustomers"],"correct":0,"explanation":"The correct answer is option A. The passage supports this answer: a paper-manufacturing company that experiences difficulty in\nobtaining enough timber and other raw materials to meet its orders. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."}]},"25":{"id":25,"title":"The labor force is often organized as if workers had no family responsibilities","difficulty":"Moderate","passage":"The labor force is often organized as if workers had no family responsibilities. Preschool-age children need full-time care; children in primary school need care after school and during school vacations. Although day-care services can resolve some scheduling conflicts between home and office, workers cannot always find or afford suitable care. Even when they obtain such care, parents must still cope with emergencies, such as illnesses, that keep children at home. Moreover, children need more than tending; they also need meaningful time with their parents. Conventional full-time workdays, especially when combined with unavoidable household duties, are too inflexible for parents with primary child-care responsibility.\n\nAlthough a small but increasing number of working men are single parents, those barriers against successful participation in the labor market that are related to primary child-care responsibilities mainly disadvantage women. Even in families where both parents work, cultural pressures are traditionally much greater on mothers than on fathers to bear the primary child-rearing responsibilities.\n\nIn reconciling child-rearing responsibilities with participation in the labor market, many working mothers are forced to make compromises. For example, approximately one-third of all working mothers are employed only part-time, even though part-time jobs are dramatically underpaid and often less desirable in comparison to full-time employment. Even though part-time work is usually available only in occupations offering minimal employee responsibility and little opportunity for advancement or self-enrichment, such employment does allow many women the time and flexibility to fulfill their family duties, but only at the expense of the advantages associated with full-time employment.\n\nMoreover, even mothers with full-time employment must compromise opportunities in order to adjust to barriers against parents in the labor market. Many choose jobs entailing little challenge or responsibility or those offering flexible scheduling, often available only in poorly paid positions, while other working mothers, although willing and able to assume as much responsibility as people without children, find that their need to spend regular and predictable time with their children inevitably causes them to lose career opportunities to those without such demands. Thus, women in education are more likely to become teachers than school administrators, whose more conventional full-time work schedules do not correspond to the schedules of school-age children, while female lawyers are more likely to practice law in trusts and estates, where they can control their work schedules, than in litigation, where they cannot. Nonprofessional women are concentrated in secretarial work and department store sales, where their absences can be covered easily by substitutes and where they can enter and leave the work force with little loss, since the jobs offer so little personal gain. Indeed, as long as the labor market remains hostile to parents, and family roles continue to be allocated on the basis of gender, women will be seriously disadvantaged in that labor market.","questions":[{"id":1,"question":"Which one of the following best summarizes the main idea of the\npassage?","options":["Current trends in the labor force indicate that working parents,\nespecially women, may not always need to choose between occupational and\nchild-care responsibilities.","In order for mothers to have an equal opportunity for advancement\nin the labor force, traditional family roles have to be reexamined and\nrevised.","Although single parents who work have to balance parental and\ncareer demands, single mothers suffer resulting employment disadvantages\nthat single fathers can almost always avoid.","Traditional work schedules are too inflexible to accommodate the\nchild-care responsibilities of many parents, a fact that severely\ndisadvantages women in the labor force."],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: traditional work schedules are too inflexible to accommodate the\nchild-care responsibilities of many parents, a fact that severely\ndisadvantages women in the labor force. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"Which one of the following statements about part-time work can be\ninferred from the information presented in the passage?","options":["One-third of all part-time workers are working mothers.","Part-time work generally offers fewer opportunities for\nadvancement to working mothers than to women generally.","Part-time work, in addition to having relatively poor wages, often\nrequires that employees work during holidays, when their children are\nout of school.","Part-time e
