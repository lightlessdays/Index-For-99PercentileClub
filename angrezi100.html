ocumentation (the provision of documents in substantiation; also: documentary evidence) in making his arguments about processing centers' educational programs.\n\nTollefson's main contention is that the emphasis placed on immediate employment and on teaching the values, attitudes, and behaviors that the training personnel think will help the immigrants adjust more easily to life in the United States is often counterproductive and demoralizing. Because of concerns that the immigrants be self-supporting as soon as possible, they are trained almost exclusively for low-level jobs that do not require English proficiency. In this respect, Tollefson claims, the processing centers suit the needs of employers more than they suit the long-term needs of the immigrant community. Tollefson also detects a fundamental flaw in the attempts by program educators to instill in the immigrants the traditionally Western principles of self-sufficiency and individual success. These efforts often have the effect of undermining the immigrants' sense of community and, in doing so, sometimes isolate them from the moral support and even from business opportunities afforded by the immigrant community. The programs also encourage the immigrants to shed their cultural traditions and ethnic identity and adopt the lifestyles, beliefs, and characteristics of their adopted country if they wish to enter fully into the national life.\n\nTollefson notes that the ideological nature of these educational programs has roots in the turn-of-the-century educational programs designed to assimilate European immigrants into United States society. Tollefson provides a concise history of the assimilationist movement in immigrant education, in which European immigrants were encouraged to leave behind the ways of the Old World and to adopt instead the principles and practices of the New World.\n\nTollefson ably shows that the issues demanding real attention in the educational programs for Southeast Asian immigrants are not merely employment rates and government funding, but also the assumptions underpinning the educational values in the programs. He recommends many improvements for the programs, including giving the immigrants a stronger voice in determining their needs and how to meet them, redesigning the curricula, and emphasizing long-term language education and job training over immediate employment and the avoiding of public assistance. Unfortunately, though, Tollefson does not offer enough concrete solutions as to how these reforms could be carried out, despite his own descriptions of the complicated bureaucratic nature of the programs.","questions":[{"id":1,"question":"Which one of the following statements best expresses the main idea\nof the passage?","options":["Tollefson's focus on the economic and cultural factors involved in\nadjusting to a new country offers a significant departure from most\nstudies of Southeast Asian immigration.","In his analysis of educational programs for Southeast Asian\nimmigrants, Tollefson fails to acknowledge many of the positive effects\nthe programs have had on immigrants' lives.","Tollefson convincingly blames the philosophy underlying immigrant\neducational programs for some of the adjustment problems afflicting\nSoutheast Asian immigrants.","Tollefson's most significant contribution is his analysis of how\nSoutheast Asian immigrants overcome the obstacles they encounter in\nimmigrant educational programs."],"correct":2,"explanation":"The correct answer is option C. The passage supports this answer: tollefson convincingly blames the philosophy underlying immigrant\neducational programs for some of the adjustment problems afflicting\nsoutheast asian immigrants. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"With which one of the following statements concerning the\neducational programs of the immigration centers would Tollefson most\nprobably agree?","options":["Although the programs offer adequate job training, they offer\ninadequate English training.","Some of the programs' attempts to improve the earning power of the\nimmigrants cut them off from potential sources of income.","Inclusion of the history of immigration in the United States in\nthe programs' curricula facilitates adjustment for the immigrants.","Immigrants would benefit if instructors in the programs were\nbetter prepared to teach the curricula developed in the teacher-training\ncourses."],"correct":1,"explanation":"The correct answer is option B. The passage supports this answer: some of the programs' attempts to improve the earning power of the\nimmigrants cut them off from potential sources of income. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":3,"question":"Which one of the following best describes the opinion of the author\nof the passage with respect to Tollefson's work?","options":["thorough but misguided","innovative but incomplete","novel but contradictory","illuminating but unappreciated"],"correct":1,"explanation":"The correct answer is option B. The passage supports this answer: innovative but incomplete. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":4,"question":"The passage suggests that which one of the following is an\nassumption underlying the educational approach in immigrant processing\ncenters?","options":["There is a set of values and behaviors that if adopted by\nimmigrants, facilitate adjustment to United States society.","When recent immigrants are self-supporting rather than supported\nby public assistance, they tend to gain English proficiency more\nquickly.","Immediate employment tends to undermine the immigrants sense of\ncommunity with each other.","Long-term success for immigrants is best achieved by encouraging\nthe immigrants to maintain a strong sense of community."],"correct":0,"explanation":"The correct answer is option A. This can be inferred from the passage. The passage provides evidence that supports the conclusion that there is a set of values and behaviors that if adopted by\nimmigrants, facilitate adjustment to united states society. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":5,"question":"Which one of the following best describes the function of the first\nparagraph of the passage?","options":["It provides the scholarly context for Tollefson's study and a\ndescription of his methodology.","It compares Tollefson's study to other works and presents the main\nargument of his study.","It compares the types of documents Tollefson uses to those used in\nother studies.","It presents the accepted theory on Tollefson's topic and the\nmethod by which Tollefson challenges it."],"correct":0,"explanation":"The correct answer is option A. The passage supports this answer: it provides the scholarly context for tollefson's study and a\ndescription of his methodology. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":6,"question":"The author of the passage refers to Tollefson's descriptions of the\nbureaucratic nature of the immigrant educational programs in the fourth\nparagraph most probably in order to","options":["criticize Tollefson's decision to combine a description of the\nbureaucracies with suggestions for improvement","emphasize the author's disappointment in Tollefson's overly\ngeneral recommendations for improvements to the programs","point out the irony of Tollefson concluding his study with\nsuggestions for drastic changes in the programs","support a contention that Tollefson's recommendations for\nimprovements do not focus on the real sources of the programs'\nproblems"],"correct":1,"explanation":"The correct answer is option B. The passage supports this answer: emphasize the author's disappointment in tollefson's overly\ngeneral recommendations for improvements to the programs. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."}]},"81":{"id":81,"title":"To many developers of technologies that affect public health or the environment,","difficulty":"Moderate","passage":"To many developers of technologies that affect public health or the environment, \"risk communication\" means persuading the public that the potential risks of such technologies are small and should be ignored. Those who communicate risks in this way seem to believe that lay people do not understand the actual nature of technological risk, and they can cite studies asserting that although people apparently ignore mundane hazards that pose significant danger, they get upset about exotic hazards that pose little chance of death or injury. Because some risk communicators take this persuasive stance, many lay people see \"risk communication\" as a euphemism for brainwashing (a forcible indoctrination to induce someone to give up basic political, social, or religious beliefs and attitudes and to accept contrasting regimented ideas) done by experts.\n\nSince, however, the goal of risk communication should be to enable people to make informed decisions about technological risks, a clear understanding about how the public perceives risk is needed. Lay people's definitions of \"risk\" are more likely to reflect subjective ethical concerns than are experts' definitions. Lay people, for example, tend to perceive a small risk to children as more significant than a large risk to consenting adults who benefit from the risk-creating technology. However, if asked to rank hazards by the number of annual fatalities, without reference to ethical judgments, lay people provide quite reasonable estimates, demonstrating that they have substantial knowledge about many risks. Although some studies claim to demonstrate that lay people have inappropriate concerns about exotic hazards, these studies often use questionable methods, such as asking lay people to rank risks that are hard to compare. In contrast, a recent study showed that when lay people were given the necessary facts and time, they understood the specific risks of electromagnetic fields produced by high-voltage power transmission well enough to make informed decisions.\n\nRisk communication should therefore be based on the principle that people process new information in the context of their existing beliefs. If people know nothing about a topic, they will find messages about that topic incomprehensible. If they have erroneous beliefs, they are likely to misconstrue the messages. Thus, communicators need to know the nature and extent of recipients' knowledge and beliefs in order to design messages that will not be dismissed or misinterpreted. This need was demonstrated in a research project concerning the public's level of knowledge about risks posed by the presence of radon in the home. Researchers used open-ended (adj.) interviews and questionnaires to determine what information should be included in their brochure on radon. Subjects who read the researchers' brochure performed significantly better in understanding radon risks than did a control group who read a brochure that was written using a different approach by a government agency. Thus, careful preparation can help risk communicators to produce balanced material that tells people what they need to know to make decisions about technological risks.","questions":[{"id":1,"question":"Which one of the following best expresses the main point of the\npassage?","options":["Risk communicators are effectively addressing the proliferation of\ncomplex technologies that have increasing impact on public health and\nsafety.","Risk communicators should assess lay people's understanding of\ntechnologies in order to be able to give them the information they need\nto make reasonable decisions.","Experts who want to communicate to the public about the possible\nrisks of complex technologies must simplify their message to ensure that\nit is understandable.","Risk communication can be perceived as the task of persuading lay\npeople to accept the impact of a particular technology on their\nlives."],"correct":1,"explanation":"The correct answer is option B. The passage supports this answer: risk communicators should assess lay people's understanding of\ntechnologies in order to be able to give them the information they need\nto make reasonable decisions. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"The authors of the passage would be most likely to agree that the\nprimary purpose of risk communication should be to","options":["explain rather than to persuade","promote rather than to justify","influence experts rather than to influence lay people","allay people's fears about mundane hazards rather than about\nexotic hazards"],"correct":0,"explanation":"The correct answer is option A. The passage as a whole is primarily focused on this theme. While other options may touch on aspects mentioned in the passage, the central purpose is best captured by this answer: explain rather than to persuade."},{"id":3,"question":"According to the passage, it is probable that which one of the\nfollowing will occur when risk communicators attempt to communicate with\nlay people who have mistaken ideas about a particular technology?","options":["The lay people perceiving that the risk communicators have\nprovided more-reliable information, will discard their mistaken notion.","The lay people will only partially revise their ideas on the basis\nof the new information.","The lay people fitting the new information into their existing\nframework will interpret the communication differently that the risk\ncommunicators had intended.","The lay people misunderstanding the new information will further\ndistort the information when they communicate it to other lay\npeople."],"correct":2,"explanation":"The correct answer is option C. The passage explicitly states or directly supports that the lay people fitting the new information into their existing\nframework will interpret the communication differently that the risk\ncommunicators had intended. This information is stated in the passage, making it the most accurate answer based on the text."},{"id":4,"question":"Which one of the following is most clearly an example of the kind of\nrisk perception discussed in the \"studies\" mentioned in line 8?","options":["A skydiver checks the lines on her parachute several times before\na jump because tangled lines often keep the parachutes from opening\nproperly","A person decides to quit smoking in order to lesson the\nprobability of lung damage to himself and his family","A homeowner who decides to have her house tested for radon also\ndecides not to allow anyone to smoke in her house","A person who often weaves in and out of traffic while driving his\ncar at excessive speeds worries about meteorites hitting his house"],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: a person who often weaves in and out of traffic while driving his\ncar at excessive speeds worries about meteorites hitting his house. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":5,"question":"It can be inferred that the authors of the passage would be more\nlikely than would the risk communicators discussed in the first\nparagraph to emphasize which one of the following?","options":["lay people's tendency to become alarmed about technologies that\nthey find new or strange","lay people's tendency to compare risks that experts would not\nconsider comparable","the need for lay people to adopt scientists' advice about\ntechnological risk","the impact of lay people's value systems on their perceptions of\nrisk"],"correct":3,"explanation":"The correct answer is option D. This can be inferred from the passage. The passage provides evidence that supports the conclusion that the impact of lay people's value systems on their perceptions of\nrisk. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":6,"question":"According to the passage many lay people believe which one of the\nfollowing about risk communication?","options":["It focuses excessively on mundane hazards.","It is a tool used to manipulate the public.","It is a major cause of inaccuracies in public knowledge about\nscience.","It most often functions to help people make informed\ndecisions."],"correct":1,"explanation":"The correct answer is option B. The passage explicitly states or directly supports that it is a tool used to manipulate the public. This information is stated in the passage, making it the most accurate answer based on the text."}]},"82":{"id":82,"title":"In April 1990 representatives of the Pico Korea Union of electronics workers in","difficulty":"Moderate","passage":"In April 1990 representatives of the Pico Korea Union of electronics workers in Buchon city, south Korea, traveled to the United States in order to demand just settlement of their claims from the parent company of their employers, who upon the formation of the union () had shut down operations without paying the workers. From the beginning, the union cause was championed by an unprecedented coalition of Korean American groups and deeply affected the Korean American community on several levels.\n\nFirst, it served as a rallying focus for a diverse community often divided by generation, class and political ideologies. Most notably, the Pico cause mobilized many young second-generation Korean Americans, many of whom had never been part of a political campaign before, let alone one involving Korean issues. Members of this generation, unlike first-generation Korean Americans, generally fall within the more privileged sectors of the Korean American community and often feel alienated from their Korean roots. In addition to raising the political consciousness of young Korean Americans, the Pico struggle sparked among them new interest in their cultural identity. The Pico workers also suggested new roles that can be played by recent immigrants, particularly working-class immigrants. These immigrants' knowledge of working conditions overseas can help to globalize the perspective of their communities and can help to establish international ties on a more personal level, as witnessed in the especially warm exchange between the Pico workers and recent working-class immigrants from China. In addition to broadening the political base within the Korean American community, the Pico struggle also led to new alliances between the Korean American community and progressive labor and social justice groups within the larger society—as evidenced in the support received from the Coalition of Labor Union Women and leading African American unionists.\n\nThe reasons for these effects lie in the nature of the cause. The issues raised by the Pico unionists had such a strong human component that differences within the community became secondary to larger concerns for social justice and workers' rights. The workers' demands for compensation and respect were unencumbered with strong ideological trappings. The economic exploitation faced by the Pico workers underscored the common interests of Korean workers, Korean Americans, the working class more inclusively, and a broad spectrum of community leaders.\n\nThe Pico workers' campaign thus offers an important lesson. It demonstrates that ethnic communities need more than just a knowledge of history and culture as artifacts of the past in order to strengthen their ethnic identity. It shows that perhaps the most effective means of empowerment for many ethnic communities of immigrant derivation may be an identification with and participation in current struggles for economic and social justice in their countries of origin.","questions":[{"id":1,"question":"Which one of the following best describes the main topic of the\npassage?","options":["the contribution of the Korean American community to improving the\nworking conditions of Koreans employed by United States companies","the change brought about in the Korean American community by\ncontacts with Koreans visiting the United States","the contribution of recent immigrants from Korea to strengthening\nethnic identity in the Korean American community","the effects on the Korean American community of a dispute between\nKorean union workers and a United States company"],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: the effects on the korean american community of a dispute between\nkorean union workers and a united states company. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"The passage suggests that which one of the following was a\nsignificant factor in the decision to shut down the Pico plant in Buchon\nCity?","options":["the decreasing profitability of maintaining operations in Korea","the failure to resolve long-standing disputes between the Pico\nworkers and management","the creation of a union by the Pico workers","the withholding of workers' wages by the parent company"],"correct":2,"explanation":"The correct answer is option C. This can be inferred from the passage. The passage provides evidence that supports the conclusion that the creation of a union by the pico workers. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":3,"question":"Which one of the following is NOT mentioned in the passage as a\nrecent development in the Korean American community?","options":["Young second-generation Korean Americans have begun to take an\ninterest in their Korean heritage.","Recent Korean American immigrants of working-class backgrounds\nhave begun to enter the more privileged sectors of the Korean American\ncommunity.","Korean Americans have developed closer ties with activist groups\nfrom other sectors of the population.","Previously nonpolitical members of the Korean American community\nhave become more politically active."],"correct":1,"explanation":"The correct answer is option B. While the other options are discussed or mentioned in the passage, this particular point is not addressed by the author. A careful reading of the passage confirms the absence of this specific claim."},{"id":4,"question":"It can be inferred that the author of the passage would most likely\nagree with which one of the following statements about ethnic\ncommunities of immigrant derivation?","options":["Such communities can derive important benefits from maintaining\nties with their countries of origin.","Such communities should focus primarily on promoting study of the\nhistory and culture of their people in order to strengthen their ethnic\nidentity.","Such communities can most successfully mobilize and politicize\ntheir young people by addressing the problems of young people of all\nbackgrounds.","The more privileged sectors of such communities are most likely to\nmaintain a sense of closeness to their cultural roots."],"correct":0,"explanation":"The correct answer is option A. This can be inferred from the passage. The passage provides evidence that supports the conclusion that such communities can derive important benefits from maintaining\nties with their countries of origin. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":5,"question":"In the second paragraph, the author refers to immigrants from China\nmost probably in order to do which one of the following?","options":["highlight the contrast between working conditions in the United\nStates and in Korea","demonstrate the uniqueness of the problem faced by the Pico\nworkers","offer an example of the type of role that can be played by recent\nworking-class immigrants","provide an analogy for the type of activism displayed by the\nKorean American community"],"correct":2,"explanation":"The correct answer is option C. The passage supports this answer: offer an example of the type of role that can be played by recent\nworking-class immigrants. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":6,"question":"The primary purpose of the passage is to","options":["describe recent developments in the Korean American community that\nhave strongly affected other ethnic communities of immigrant derivation","describe a situation in the Korean American community that\npresents a model for the empowerment of ethnic communities of immigrant\nderivation","detail the problems faced by the Korean American community in\norder to illustrate the need for the empowerment of ethnic communities\nof immigrant derivation","argue against economic and social injustice in the countries of\norigin of ethnic communities of immigrant derivation"],"correct":1,"explanation":"The correct answer is option B. The passage as a whole is primarily focused on this theme. While other options may touch on aspects mentioned in the passage, the central purpose is best captured by this answer: describe a situation in the korean american community that\npresents a model for the empowerment of ethnic communities of immigrant\nderivation."}]},"83":{"id":83,"title":"In recent years, scholars have begun to use social science tools to analyze court","difficulty":"Moderate","passage":"In recent years, scholars have begun to use social science tools to analyze court opinions. These scholars have justifiably criticized traditional legal research for its focus on a few cases that may not be representative and its fascination with arcane matters that do not affect real people with real legal problems. Zirkel and Schoenfeld, for example, have championed the application of social science tools to the analysis of case law surrounding discrimination against women in higher education employment. Their studies have demonstrated how these social science tools may be used to serve the interests of scholars, lawyers and prospective plaintiffs as well. However, their enthusiasm for the \"outcomes analysis\" technique seems misguided.\n\nOf fundamental concern is the outcomes analysts' assumption that simply counting the number of successful and unsuccessful plaintiffs will be useful to prospective plaintiffs. Although the odds are clearly against the plaintiff in sex discrimination cases, plaintiffs who believe that their cause is just and that they will prevail are not swayed by such evidence. In addition, because lawsuits are so different in the details of the case, in the quality of the evidence the plaintiff presents, and in the attitude of the judge toward academic plaintiffs, giving prospective plaintiffs statistics about overall outcomes without analyzing the reason for these outcomes is of marginal assistance. Outcomes analysis, for example, ignores the fact that in certain academic sex discrimination cases—those involving serious procedural violations or incriminating evidence in the form of written admissions of discriminatory practices—plaintiffs are much more likely to prevail.\n\nTwo different approaches offer more useful applications of social science tools in analyzing sex discrimination cases. One is a process called \"policy capturing,\" in which the researcher reads each opinion, identifies variables discussed in the opinion, such as the regularity of employer evaluations of the plaintiff performance, training of evaluators, and the kind of evaluation instrument used, and then uses multivariate analysis to determine whether these variables predict the outcome of the lawsuit. The advantage of policy capturing research is that it attempts to explain the reason for the outcome, rather than simply reporting the outcome, and identifies factors that contribute to a plaintiff's success or failure. Taking a slightly different approach, other scholars have adopted a technique that requires reading complete transcripts of all sex discrimination cases litigated during a certain time period to identify variables such as the nature of the allegedly illegal conduct, the consequences for employers, and the nature of the remedy, as well as the factors that contributed to the verdict and the kind of evidence necessary for the plaintiff to prevail. While the findings of these studies are limited to the period covered, they assist potential plaintiffs and defendants in assessing their cases.","questions":[{"id":1,"question":"Which one of the following best expresses the main idea of the\npassage?","options":["The analysis of a limited number of atypical discrimination suits\nis of little value to potential plaintiffs.","When the number of factors analyzed in a sex discrimination suit\nis increased, the validity of the conclusions drawn becomes suspect.","Scholars who are critical of traditional legal research frequently\noffer alternative approaches that are also seriously flawed.","Outcomes analysis has less predictive value in sex discrimination\ncases than do certain other social science techniques."],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: outcomes analysis has less predictive value in sex discrimination\ncases than do certain other social science techniques. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"It can be inferred from the author's discussion of traditional\nlegal research that the author is","options":["frustrated because traditional legal research has not achieved its\nfull potential","critical because traditional legal research has little relevance\nto those actually involved in cases","appreciative of the role traditional legal research played in\ndeveloping later more efficient approaches","derisive because traditional legal research has outlasted its\npreviously significant role"],"correct":1,"explanation":"The correct answer is option B. This can be inferred from the passage. The passage provides evidence that supports the conclusion that critical because traditional legal research has little relevance\nto those actually involved in cases. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":3,"question":"Which one of the following statements about Zirkel and Schoenfeld\ncan be inferred from the passage?","options":["They were the first scholars to use social science tools in\nanalyzing legal cases.","They confined their studies to the outcomes analysis technique.","They saw no value in the analysis provided by traditional legal\nresearch.","They believed that the information generated by outcomes analysis\nwould be relevant for plaintiffs."],"correct":3,"explanation":"The correct answer is option D. This can be inferred from the passage. The passage provides evidence that supports the conclusion that they believed that the information generated by outcomes analysis\nwould be relevant for plaintiffs. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":4,"question":"The author's characterization of traditional legal research in the\nfirst paragraph is intended to","options":["provide background information for the subsequent discussion","summarize an opponent's position","argue against the use of social science tools in the analysis of\nsex discrimination cases","emphasize the fact that legal researchers act to the detriment of\npotential plaintiffs"],"correct":0,"explanation":"The correct answer is option A. The passage supports this answer: provide background information for the subsequent discussion. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":5,"question":"The information in the passage suggests that plaintiffs who pursue\nsex discrimination cases despite the statistics provided by outcomes\nanalysis can best be likened to","options":["athletes who continue to employ training techniques despite their\nknowledge of statistical evidence indicating that these techniques are\nunlikely to be effective","lawyers who handle lawsuits for a large number of clients in the\nhope that some percentage will be successful","candidates for public office who are more interested in making a\npolitical statement than in winning an election","supporters of a cause who recruit individuals sympathetic to it in\nthe belief that large numbers of supporters will lend the cause\nlegitimacy"],"correct":0,"explanation":"The correct answer is option A. This can be inferred from the passage. The passage provides evidence that supports the conclusion that athletes who continue to employ training techniques despite their\nknowledge of statistical evidence indicating that these techniques are\nunlikely to be effective. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":6,"question":"The policy-capturing approach differs from the approach described\nin lines 48-59 in that the latter approach","options":["makes use of detailed information on a greater number of cases","focuses more directly on issues of concern to litigants","analyzes information that is more recent and therefore reflects\ncurrent trends","allows assessment of aspects of a case that are not specifically\nmentioned in a judge's opinion"],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: allows assessment of aspects of a case that are not specifically\nmentioned in a judge's opinion. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."}]},"84":{"id":84,"title":"A fake can be defined as an artwork intended to deceive","difficulty":"Moderate","passage":"A fake can be defined as an artwork intended to deceive. The motives of its creator are decisive, and the merit of the object itself is a separate issue. The question mark in the title of Mark Jones's Fake? The Act of Deception reveals the study's broader concerns. Indeed, it might equally be entitled Original?, and the text begins by noting a variety of possibilities somewhere between the two extremes. These include works by an artist's followers in the style of the master, deliberate archaism, copying for pedagogical purposes, and the production of commercial facsimiles (an exact copy).\n\nThe greater part of Fake? is devoted to a Chronological survey suggesting that faking feeds on (feed on:...[]) the many different motives people have for collecting art, and that, on the whole, the faking of art flourishes whenever art collecting flourishes. In imperial Rome there was a widespread interest in collecting earlier Greek art, and therefore in faking it. No doubt many of the sculptures now exhibited as \"Roman copies\" were originally passed off as Greek. In medieval Europe, because art was celebrated more for its devotional uses than for its provenance or the ingenuity of its creators, the faking of art was virtually nonexistent. The modern age of faking began in the Italian Renaissance, with two linked developments: a passionate identification with the world of antiquity and a growing sense of individual artistic identity. A patron of the young Michelangelo prevailed upon the artist to make his Sculpture Sleeping Cupld look as though it had been buried in the earth so that \"it will be taken for antique, and you will sell it much better.\" Within a few years, however, beginning with his first masterpiece, the Bacchus, Michelangelo had shown his contemporaries that great art can assimilate and transcend what came before, resulting in a wholly original work. Soon his genius made him the object of imitators.\n\nFake? also reminds us that in certain cultures authenticity is a foreign concept. This is true of much African art, when the authenticity of an object is considered by collectors to depend on its function. As an illustration, the study compares two versions of a chi wara mask made by the Bambara people of Mali. One has pegs allowing it to be attached to a cap for its intended ceremonial purpose. The second, otherwise identical, lacks the pegs and is a replica made for sale. African carving is notoriously difficult to date (to determine the date of \"date an antique\") (date), but even if the ritual mask is recent, made perhaps to replace a damaged predecessor, and the replica much older, only the ritual mask should be seen as authentic, for it is tied to the form's original function. That, at least, is the consensus of the so-called experts. One wonders whether the Bambaran artists would agree.","questions":[{"id":1,"question":"The passage can best be described as doing which one of the\nfollowing?","options":["reconciling varied points of view","chronicling the evolution of a phenomenon","exploring a complex question","advocating a new approach"],"correct":2,"explanation":"The correct answer is option C. The passage supports this answer: exploring a complex question. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"Which one of the following best expresses the author's main\npoint?(the text begins by noting a variety of possibilities somewhere\nbetween the two extremes. These include works by an artist's followers\nin the style of the master, deliberate archaism, copying for pedagogical\npurposes, and the production of commercial facsimiles)","options":["The faking of art has occurred throughout history and in virtually\nevery culture.","Whether a work of art is fake or not is less important than\nwhether it has artistic merit.","It is possible to show that a work of art is fake, but the\nauthenticity of a work cannot be proved conclusively.","A variety of circumstances make it difficult to determine whether\na work of art can appropriately be called a fake."],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: a variety of circumstances make it difficult to determine whether\na work of art can appropriately be called a fake. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":3,"question":"According to the passage an artwork can be definitively classified\nas a fake if the person who created it","options":["consciously adopted the artistic style of an influential mentor","deliberately imitated a famous work of art as a learning exercise","wanted other people to be fooled by its appearance","made multiple, identical copies of the work available for\nsale"],"correct":2,"explanation":"The correct answer is option C. The passage explicitly states or directly supports that wanted other people to be fooled by its appearance. This information is stated in the passage, making it the most accurate answer based on the text."},{"id":4,"question":"The author provides at least one example of each of the following\nEXCEPT:","options":["categories of art that are neither wholly fake not wholly original","cultures in which the faking of art flourished","qualities that art collectors have prized in their acquisitions","contemporary artists whose works have inspired fakes"],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: contemporary artists whose works have inspired fakes. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":5,"question":"The author implies which one of the following about the artistic\nmerits of fakes?","options":["Because of the circumstances of its production, a fake cannot be\nsaid to have true artistic merit.","A fake can be said to have artistic merit only if the attempted\ndeception is successful.","A fake may or may not have artistic merit in its own right,\nregardless of the circumstances of its production.","Whether a fake has artistic merit depends on whether its creator\nis accomplished as an artist."],"correct":2,"explanation":"The correct answer is option C. The passage supports this answer: a fake may or may not have artistic merit in its own right,\nregardless of the circumstances of its production. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":6,"question":"By the standard described in the last paragraph of the passage,\nwhich one of the following would be considered authentic?","options":["an ancient Roman copy of an ancient Greek sculpture","a painting begun by Renaissance master and finished by his\nassistants after his death","a print of a painting signed by the artist who painted the\noriginal","a modern reconstruction of a medieval altarpiece designed to serve its traditional role in a service of\nworship"],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: a modern reconstruction of a medieval altarpiece designed to serve its traditional role in a service of\nworship. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."}]},"85":{"id":85,"title":"Many literary scholars believe that Zora Neale Hurston's Their Eyes Were Watching","difficulty":"Moderate","passage":"Many literary scholars believe that Zora Neale Hurston's Their Eyes Were Watching God (1937) has been the primary influence on some of the most accomplished Black women writing in the United States today. Indeed, Alice Walker, the author of the prize-winning novel The Color Purple, has said of Their Eyes, \"There is no book more important to me than this one.\" Thus, it seems necessary to ask why Their Eyes, a work now viewed by a multitude of readers as remarkably successful in its complex depiction of a Black woman's search for self and community, was ever relegated to the margins of the literary canon.\n\nThe details of the novel's initial reception help answer this question. Unlike the recently rediscovered and reexamined work of Harriet Wilson, Their Eyes was not totally ignored by book reviewers upon its publication. In fact, it received a mixture of positive and negative reviews both from White book reviewers working for prominent periodicals and from important figures within Black literary circles. In the Saturday Review of Literature, George Stevens wrote that \"the narration is exactly right, because most of it is dialogue and the dialogue gives us a constant sense of character in action.\" The negative criticism was partially a result of Hurston's ideological differences with other members of the Black Americans in literature. Black writers of the 1940s believed that the Black artist's primary responsibility was to create protest fiction that explored the negative effects of racism in the United States. For example, Richard Wright, the author of the much acclaimed Native Son (1940), wrote that Their Eyes had \"no theme\" and \"no message\". Most critics' and readers' expectations of Black literature rendered them unable to appreciate Hurston's subtle delineation of the life of an ordinary Black woman in a Black community and the novel went quietly out of print.\n\nRecent acclaim for Their Eyes results from the emergence of feminist literary criticism and the development of standards of evaluation specific to the work of Black writers; these kinds of criticism changed readers' expectations of art and enabled them to appreciate Hurston's novel. The emergence of feminist criticism was crucial because such criticism brought new attention to neglected works such as Hurston's and alerted readers to Hurston's exploration of women's issues in her fiction. The Afrocentric standards of evaluation were equally important to the rediscovery of Their Eyes, for such standards provided readers with the tools to recognize and appreciate the Black folklore and oral storytelling traditions Hurston incorporated within her work. In one of the most illuminating discussions of the novel to date, Henry Louis Gates Jr., states that \"Hurston's strategy seems to concern itself with the possibilities of representation of the speaking Black voice in writing.\"","questions":[{"id":1,"question":"The passage suggests which one of the following about Harriet\nWilson's novel?","options":["It was written at the same time as Their Eyes Were Watching God,\nbut it did not receive as much critical attention.","It greatly influenced Black women writing after the 1940s.","It was widely read when it was published but it has not received\nattention from literary critics until recently.","It did not receive critical attention when it was published, but\nit has recently become the subject of critical study."],"correct":3,"explanation":"The correct answer is option D. This can be inferred from the passage. The passage provides evidence that supports the conclusion that it did not receive critical attention when it was published, but\nit has recently become the subject of critical study. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":2,"question":"The passage offers support for which one of the following statements\nabout literary reviewers and Their Eyes Were Watching God?","options":["Their Eyes was widely acclaimed by reviewers upon its\npublication, even though it eventually went out of print.","The eventual obscurity of Their Eyes was not the result of\ncomplete neglect by reviewers.","Some early reviewers of Their Eyes interpreted the novel from a\npoint of view that later became known as Afrocentric.","Their Eyes was more typical of the protest fiction of the 1940s\nthan reviewers realized."],"correct":1,"explanation":"The correct answer is option B. The passage supports this answer: the eventual obscurity of their eyes was not the result of\ncomplete neglect by reviewers. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":3,"question":"Which one of the following best states the main idea of the passage?","options":["Hurston's Their Eyes Were Watching God had little in common with\nnovels written by Blank authors during the 1940s.","Feminist critics and authors such as Alice Walker were\ninstrumental in establishing Hurston's Their Eyes Were Watching God as\nan important part of the American literary canon.","Critics and readers were unable to appreciate fully Hurston's\nTheir Eyes Were Watching God until critics applied new standards of\nevaluation to the novel.","Hurston's Their Eyes Were Watching God was an important\ninfluence on the protest fiction written by Black writers in the\nmid-twentieth century."],"correct":2,"explanation":"The correct answer is option C. The passage supports this answer: critics and readers were unable to appreciate fully hurston's\ntheir eyes were watching god until critics applied new standards of\nevaluation to the novel. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":4,"question":"According to the passage which one of the following is true of Black\nfolklore traditions as used in literature written in the United States?","options":["They are an aspect of Black American literature first recognized\nand written about by Henry Louis Gates, Jr.","They were not widely incorporated into novels written by Black\nAmericans until after the 1940s.","They were first used by a novelist in Zora Neale Hurston's Their\nEyes Were Watching God.","They are an aspect of Black literature that some readers did not\nfully appreciate until relatively recently."],"correct":3,"explanation":"The correct answer is option D. The passage explicitly states or directly supports that they are an aspect of black literature that some readers did not\nfully appreciate until relatively recently. This information is stated in the passage, making it the most accurate answer based on the text."},{"id":5,"question":"The passage suggests that Native Son differs from Their Eyes Were\nWatching God in which one of the following ways?","options":["It received fewer positive reviews at the time of its publication\nthan did Their Eyes.","It is less typical of literature written by Black Americans during\nthe 1940s than is Their Eyes.","It is less focused on an ordinary individual's search for self\nwithin a Black community than is Then Eyes.","It denies more aspects of Black American folklore than does Their\nEyes."],"correct":2,"explanation":"The correct answer is option C. This can be inferred from the passage. The passage provides evidence that supports the conclusion that it is less focused on an ordinary individual's search for self\nwithin a black community than is then eyes. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":6,"question":"Which one of the following provides the clearest example of the kind\nof fiction that many Black writers of the 1940s, as their views are\ndescribed in the passage, believed should be written?","options":["a novel that focuses on the interrelationships among four\ngenerations of Black women","a historical novel that re-creates actual events that occurred as\nBlack people suffered from oppression and racial injustice in a small\ntown","a novel, based on biographical stories orally relayed to the\nauthor as a child, that describes the development of traditions in a\nBlack family","a novel that explores the psychological aspects of a relationship\nbetween a White man and a Black man as they work together to organize\nprotests against unjust working conditions"],"correct":1,"explanation":"The correct answer is option B. The passage supports this answer: a historical novel that re-creates actual events that occurred as\nblack people suffered from oppression and racial injustice in a small\ntown. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."}]},"86":{"id":86,"title":"Legal cases can be termed \"hard\" cases if they raise issues that are highly","difficulty":"Moderate","passage":"Legal cases can be termed \"hard\" cases if they raise issues that are highly controversial, issues about which people with legal training disagree. The ongoing debate over the completeness of the law usually concerns the extent to which such hard cases are legally determinate, or decidable according to existing law.\n\nH. L. A. Hart's The Concept of Law is still the clearest and most persuasive statement of both the standard theory of hard cases and the standard theory of law on which it rests. For Hart the law consists of legal rules formulated in general terms; these terms he calls \"open textured\" which means that they contain a \"core\" of settled meaning and a \"penumbra\" or \"periphery\" where their meaning is not determinate. For example, suppose an ordinance prohibits the use of vehicles in a park. \"Vehicle\" has a core of meaning which includes cars and motorcycles. But, Hart claims, other vehicles, such as bicycles, fall within the peripheral meaning of \"vehicle,\" so that the law does not establish whether they are prohibited. There will always be cases not covered by the core meaning of legal terms within existing laws. Hart considers these cases to be legally indeterminate. Since courts cannot decide such cases on legal grounds, they must consider nonlegal (for example, moral and political) grounds, and thereby exercise judicial discretion to make, rather than apply law.\n\nIn Ronald Dworkin's view the law is richer than Hart would grant: he denies that the law consists solely of explicit rules. The law also includes principles that do not depend for their legal status on any prior official recognition or enactment. Dworkin claims that many cases illustrate the existence of legal principles that are different from legal rules and that Hart's model of rules cannot accommodate. For Dworkin, legal rules apply in an all-or-nothing fashion, whereas legal principles do not; they provide the rationale for applying legal rules. Thus, because Dworkin thinks there is law in addition to legal rules, he thinks that legal indeterminacy and the need for judicial discretion do not follow from the existence of open texture in legal rules.\n\nIt would be a mistake, though, to dispute Hart's theory of hard cases on this basis alone. If Hart's claim about the \"open texture\" of general terms is true, then we should expect to find legal indeterminacies even if the law consists of principles in addition to rules. Legal principles as well as legal rules contain general terms that have open texture. And it would be absurd to suppose that wherever the meaning of a legal rule is unclear, there is a legal principle with a clear meaning. Most interesting and controversial cases will occur in the penumbra of both rules and principles.","questions":[{"id":1,"question":"Which one of the following best expresses the main idea of the\npassage?","options":["The law will never be complete because new situations will always\narise which will require new laws to resolve them.","The most difficult legal cases are those concerning controversial\nissues about which trained legal minds have differing opinions.","The concept of legal principles does not diminish the usefulness\nof the concept of the open texture of general terms in deciding whether\nhard cases are legally determinate.","The concept of legal principles is a deleterious addition to the\ntheory of law since any flaws exhibited by legal rules could also be\nshared by legal principles."],"correct":2,"explanation":"The correct answer is option C. The passage supports this answer: the concept of legal principles does not diminish the usefulness\nof the concept of the open texture of general terms in deciding whether\nhard cases are legally determinate. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"According to the passage the term \"legal principles\" as used by\nDworkin refers to","options":["a comprehensive code of ethics that governs the behavior of\nprofessionals in the legal system","explicit analyses of the terms used in legal rules indicating what\nmeanings the terms do and do not cover","legal doctrines that underlie and guide the use of accepted legal\nrules","legal rules that have not yet passed through the entire\nlegislative procedure necessary for them to become law"],"correct":2,"explanation":"The correct answer is option C. The passage explicitly states or directly supports that legal doctrines that underlie and guide the use of accepted legal\nrules. This information is stated in the passage, making it the most accurate answer based on the text."},{"id":3,"question":"Which one of the following expresses a view that the author of the\npassage would most probably hold concerning legal principles and legal\nrules?","options":["Legal rules are applied more often than legal principles when a\ncase involves issues about which legal professionals disagree.","Both legal rules and legal principles are officially recognized as\nvalid parts of the law.","Hart's \"model of rules\" has been superseded by a \"model of\nprinciples\" that sheds light on legal determinacy.","Legal principles are just as likely as legal rules to have terms\nthat have both core and peripheral meanings."],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: legal principles are just as likely as legal rules to have terms\nthat have both core and peripheral meanings. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":4,"question":"In the passage, the author uses the example of the word \"vehicle\"\nto","options":["illustrate a legal rule that necessarily has exceptions","show how legal principles are applied in the construction of legal\nrules","represent the core of settled meaning of a legal term","serve as an example of a legal term with both a core and a\nperiphery of meaning"],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: serve as an example of a legal term with both a core and a\nperiphery of meaning. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":5,"question":"It can be inferred that the author of the passage regards Hart's\ntheory of hard cases and the theory of standard law as","options":["exhaustive","worthy of respect","interesting but impractical","plausible but unwieldy"],"correct":1,"explanation":"The correct answer is option B. This can be inferred from the passage. The passage provides evidence that supports the conclusion that worthy of respect. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":6,"question":"Which one of the following is true of the term \"legally\ndeterminate\" (line 6) as it is used in the passage?","options":["It represents the idea that every crime should have a fixed\npenalty rather than a range of penalties within which a judge can make\nan arbitrary choice.","It refers to a legal case that can be definitively resolved in\nfavor of one side or the other according to the law in effect at the\ntime.","It describes a legal rule that requires judges to limit their\nactions to applying written law when deciding cases over which people\nwith legal training disagree.","It refers to any legal case that involves terms with imprecise\nmeanings and thus relies for its resolution only on the determination of\njudges."],"correct":1,"explanation":"The correct answer is option B. The passage supports this answer: it refers to a legal case that can be definitively resolved in\nfavor of one side or the other according to the law in effect at the\ntime. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."}]},"87":{"id":87,"title":"One way governments can decrease air pollution is to impose a tax on industrial","difficulty":"Moderate","passage":"One way governments can decrease air pollution is to impose a tax on industrial carbon dioxide emissions. But why should governments consider a carbon tax when they could control emissions by establishing energy efficiency and conservation standards, by legislating against coal use, or by increasing investment in nuclear? The great virtue of such a tax is that it would provide incentives for industry to achieve emission reductions. Because oil emits more carbon dioxide per unit of energy generated than does natural gas, and coal more than oil, a carbon tax would vary with the type of fuel. Such a tax would induce industry to substitute less-polluting fuels for those carrying a higher tax and also to reduce the total use of energy\n\nHowever, it is not clear how high such a tax should be or what its economic and environmental implications would be. At first glance, it is not difficult to estimate roughly the size of the tax needed to effect a given level of emission reduction. One writer estimates, for example, that a tax of 41 percent on the price of coal, 33 percent on oil, and 25 percent on gas would reduce the United Kingdom's emissions by 20 percent (using 1988 as the base year) by the year 2005, the target recommended by the 1988 Toronto Conference. It should be noted, however, that these numbers ignore the effect of the tax on economic growth, and hence on emissions, and assume that past responses to a price rise will be replicated in the future. These numbers are also based on the assumption that all countries will behave cooperatively in imposing a carbon tax.\n\nThere are very strong reasons to believe that cooperation would be difficult to win. If most countries cooperated, then any country that chose not to cooperate would be advantaged: it would have no abatement costs, and the effect on the environment of its defection would be relatively small. Because of this \"free rider (a benefit obtained at another's expense or without the usual cost or effort)\" effect, cooperation on a scale needed to reduce carbon dioxide emissions might prove elusive.\n\nShould countries act unilaterally to curb emissions? If a country were to act unilaterally, the benefits would be spread across the globe, whereas the costs would fall solely on the country taking the action. The action would reduce emissions globally, and the effect of this would be to reduce the benefit other countries would receive if they reduced emissions. As a consequence, other countries would have less incentive to reduce emissions and would probably emit more carbon dioxide than they would have if the unilateral action had not been taken. The entire effect of the emission reduction may not be lost, but it would surely be diminished by this free-riding behavior.","questions":[{"id":1,"question":"According to the passage, the size of the carbon tax levied on a\ngiven fuel would vary with the","options":["amount of that fuel used by a particular industry","amount of pollution caused by the fuel being taxed","size of the industries using the fuel being taxed","effect that the tax would have on a country's economy"],"correct":1,"explanation":"The correct answer is option B. The passage explicitly states or directly supports that amount of pollution caused by the fuel being taxed. This information is stated in the passage, making it the most accurate answer based on the text."},{"id":2,"question":"The author mentions the estimates of \"One writer\" (line 22)\nprimarily in order to","options":["indicate in a general way (in a general way: adv.) the size\nthat a carbon tax must be for it to be effective","provide the most accurate information available about the most\npractical size for a carbon tax","suggest that the target recommended by the 1988 Toronto Conference\nis an unrealistic one","undermine the argument that a carbon tax would provide incentives\nfor user's to achieve emissions reductions"],"correct":0,"explanation":"The correct answer is option A. The passage supports this answer: indicate in a general way (in a general way: adv.) the size\nthat a carbon tax must be for it to be effective. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":3,"question":"Which one of the following circumstances would most seriously\nundermine the conclusion \"Such a tax would induce industry to substitute\nless-polluting fuels for those carrying a higher tax\" (lines 13-15)","options":["The fuel taxed a the highest rate costs considerably less to buy\nthan fuels taxed at lower rates.","The goal set by the Toronto Conference cannot be reached unless\neach fuel it taxed at a much higher rate.","The tax on coal represents a much greater cost increase than does\nthe tax on oil or gas.","It is discovered that gas produces even less carbon dioxide per\nunit of energy generated than was previously thought."],"correct":0,"explanation":"The correct answer is option A. The passage supports this answer: the fuel taxed a the highest rate costs considerably less to buy\nthan fuels taxed at lower rates. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":4,"question":"The passage is primarily intended to answer which one of the\nfollowing questions?","options":["How high a tax should a country's government impose on carbon\ndioxide emissions?","What issues should a country's government consider before deciding\nwhether to impose a tax on carbon dioxide emissions?","What assumptions underlie a country's decision to impose a tax on\ncarbon dioxide emissions?","How can the effects of industrial pollution on the Earth's\natmosphere be decreased?"],"correct":1,"explanation":"The correct answer is option B. The passage supports this answer: what issues should a country's government consider before deciding\nwhether to impose a tax on carbon dioxide emissions?. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":5,"question":"In response to the question. \"Should countries act unilaterally to\ncurb emissions?\" (lines 44-45) the author would be most likely to\ncontend that a country should","options":["not act unilaterally because, although that country would receive\nsome benefits from such action, other countries would most likely be\nharmed by it","not act unilaterally because unilateral action would have no\nbenefits for other countries","not act unilaterally because the cost to that country would not be\njustified by the limited effect that such action would have on\nindustrial pollution worldwide","act unilaterally because that country's economy would benefit from\nthe resulting reduction in industrial emissions worldwide"],"correct":2,"explanation":"The correct answer is option C. The passage supports this answer: not act unilaterally because the cost to that country would not be\njustified by the limited effect that such action would have on\nindustrial pollution worldwide. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":6,"question":"Which one of the following is most parallel to the \"free rider\"\neffect mentioned in line 41?","options":["An industry agrees to base itself in a city where there has been\nlittle industrial development only if the city will rezone the specific\nproperty the industry desires.","Because fares for public transportation are rising, a commuter\ndecides to bicycle to work rather than to use public transportation in a\ncity where auto emissions are a problem.","An apartment dweller begins to recycle newspapers even though no\none else in the building does so and recycling is not required by law.","In an area where overgrazing is a severe problem, a shepherd\nallows his sheep to continue grazing common field even though his\nneighbors have agreed to buy feed for their animals until regrowth\noccurs.\n\nSome meteorologists have insisted that the severity of the drought in\nsub-Saharan West Africa and its long duration (nearly 40 years to date)\nmust be a sign of a long term alteration in climate. Among the theories\nproposed to explain this change, one hypothesis that has gained\nwidespread attention attributes the drought to a cooling of the Northern\nHemisphere. This hypothesis is based on the fact that between 1945 and\nthe early 1970s, the average annual air temperatures over the landmasses\nof the Northern Hemisphere decreased by about half a degree Fahrenheit\n(approximately one quarter of a degree Celsius---a small but significant\namount). Several meteorologists have suggested that this cooling was\ncaused by an increase in atmospheric dust emanating from volcanic\neruptions and from urban and industrial pollution: the dust reflected\nincoming sunlight, causing the ground to receive less solar radiation\nand to transfer less heat to the atmosphere. The cooling seemed to be\nmore pronounced in the middle and high latitudes than in the tropics, an\nobservation that is consistent with the fact that the Sun's rays enter\nthe atmosphere at a greater angle farther north and so have to pass\nthrough more dust-laden atmosphere on the way (on the way: , )\nto the Earth.\n\nSince winds are set in motion (in motion: , ) by\ndifferences in air pressure caused by\nunequal heating of the atmosphere, supporters of the cooling hypothesis\nhave argued that a growing temperature differential between the\nunusually cool middle and high latitudes and the warm tropical latitudes\nis causing a southward expansion of the circumpolar vortex---the\nhigh-altitude westerly winds that circle the Northern Hemisphere at\nmiddle latitudes. According to this hypothesis, as the circumpolar\nvortex expands, it forces south other components of large-scale\natmospheric circulation and in effect displaces the northward-moving\nmonsoon (a periodic wind especially in the Indian Ocean and southern\nAsia) that ordinarily brings sub-Saharan rain. Proponents have further\nargued that this change in atmospheric circulation might be long-term\nsince cooling in the Northern Hemisphere could be perpetuated by\nincreases in ice and snow coverage there, which would lead to reflection\nof more sunlight away from the Earth, to further (adj.) cooling, and,\nindirectly, to further drought in sub-Saharan West Africa.\n\nDespite these are predictions and even though the current African\ndrought has lasted longer than any other in this century, the notion\nthat the drought is caused by cooling of the Northern Hemisphere is, in\nfact, not well supported. Contrary to the predictions of the cooling\nhypothesis, during one period of rapid Northern Hemisphere cooling in\nthe early 1950s, the sub-Sahara was unusually rainy. Moreover, in the\nearly 1980s, when the drought was particularly severe, Northern\nHemisphere lands actually warmed slightly. And further doubt has been\ncast on the hypothesis by recent analyses suggesting that, when surface\ntemperatures of water as well as land are taken into account, the\nNorthern Hemisphere may not have cooled at all."],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: in an area where overgrazing is a severe problem, a shepherd\nallows his sheep to continue grazing common field even though his\nneighbors have agreed to buy feed for their animals until regrowth\noccurs.\n\nsome meteorologists have insisted that the severity of the drought in\nsub-saharan west africa and its long duration (nearly 40 years to date)\nmust be a sign of a long term alteration in climate. among the theories\nproposed to explain this change, one hypothesis that has gained\nwidespread attention attributes the drought to a cooling of the northern\nhemisphere. this hypothesis is based on the fact that between 1945 and\nthe early 1970s, the average annual air temperatures over the landmasses\nof the northern hemisphere decreased by about half a degree fahrenheit\n(approximately one quarter of a degree celsius---a small but significant\namount). several meteorologists have suggested that this cooling was\ncaused by an increase in atmospheric dust emanating from volcanic\neruptions and from urban and industrial pollution: the dust reflected\nincoming sunlight, causing the ground to receive less solar radiation\nand to transfer less heat to the atmosphere. the cooling seemed to be\nmore pronounced in the middle and high latitudes than in the tropics, an\nobservation that is consistent with the fact that the sun's rays enter\nthe atmosphere at a greater angle farther north and so have to pass\nthrough more dust-laden atmosphere on the way (on the way: , )\nto the earth.\n\nsince winds are set in motion (in motion: , ) by\ndifferences in air pressure caused by\nunequal heating of the atmosphere, supporters of the cooling hypothesis\nhave argued that a growing temperature differential between the\nunusually cool middle and high latitudes and the warm tropical latitudes\nis causing a southward expansion of the circumpolar vortex---the\nhigh-altitude westerly winds that circle the northern hemisphere at\nmiddle latitudes. according to this hypothesis, as the circumpolar\nvortex expands, it forces south other components of large-scale\natmospheric circulation and in effect displaces the northward-moving\nmonsoon (a periodic wind especially in the indian ocean and southern\nasia) that ordinarily brings sub-saharan rain. proponents have further\nargued that this change in atmospheric circulation might be long-term\nsince cooling in the northern hemisphere could be perpetuated by\nincreases in ice and snow coverage there, which would lead to reflection\nof more sunlight away from the earth, to further (adj.) cooling, and,\nindirectly, to further drought in sub-saharan west africa.\n\ndespite these are predictions and even though the current african\ndrought has lasted longer than any other in this century, the notion\nthat the drought is caused by cooling of the northern hemisphere is, in\nfact, not well supported. contrary to the predictions of the cooling\nhypothesis, during one period of rapid northern hemisphere cooling in\nthe early 1950s, the sub-sahara was unusually rainy. moreover, in the\nearly 1980s, when the drought was particularly severe, northern\nhemisphere lands actually warmed slightly. and further doubt has been\ncast on the hypothesis by recent analyses suggesting that, when surface\ntemperatures of water as well as land are taken into account, the\nnorthern hemisphere may not have cooled at all. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."}]},"88":{"id":88,"title":"Some meteorologists have insisted that the severity of the drought in sub-Saharan","difficulty":"Moderate","passage":"Some meteorologists have insisted that the severity of the drought in sub-Saharan West Africa and its long duration (nearly 40 years to date) must be a sign of a long term alteration in climate. Among the theories proposed to explain this change, one hypothesis that has gained widespread attention attributes the drought to a cooling of the Northern Hemisphere. This hypothesis is based on the fact that between 1945 and the early 1970s, the average annual air temperatures over the landmasses of the Northern Hemisphere decreased by about half a degree Fahrenheit (approximately one quarter of a degree Celsius—a small but significant amount). Several meteorologists have suggested that this cooling was caused by an increase in atmospheric dust emanating from volcanic eruptions and from urban and industrial pollution: the dust reflected incoming sunlight, causing the ground to receive less solar radiation and to transfer less heat to the atmosphere. The cooling seemed to be more pronounced in the middle and high latitudes than in the tropics, an observation that is consistent with the fact that the Sun's rays enter the atmosphere at a greater angle farther north and so have to pass through more dust-laden atmosphere on the way to the Earth.\n\nSince winds are set in motion by differences in air pressure caused by unequal heating of the atmosphere, supporters of the cooling hypothesis have argued that a growing temperature differential between the unusually cool middle and high latitudes and the warm tropical latitudes is causing a southward expansion of the circumpolar vortex—the high-altitude westerly winds that circle the Northern Hemisphere at middle latitudes. According to this hypothesis, as the circumpolar vortex expands, it forces south other components of large-scale atmospheric circulation and in effect displaces the northward-moving monsoon (a periodic wind especially in the Indian Ocean and southern Asia) that ordinarily brings sub-Saharan rain. Proponents have further argued that this change in atmospheric circulation might be long-term since cooling in the Northern Hemisphere could be perpetuated by increases in ice and snow coverage there, which would lead to reflection of more sunlight away from the Earth, to further (adj.) cooling, and, indirectly, to further drought in sub-Saharan West Africa.\n\nDespite these are predictions and even though the current African drought has lasted longer than any other in this century, the notion that the drought is caused by cooling of the Northern Hemisphere is, in fact, not well supported. Contrary to the predictions of the cooling hypothesis, dur
