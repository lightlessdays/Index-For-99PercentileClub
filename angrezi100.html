o do so would be to violate the substantive reasons\nunderlying the law","the veterans failed to comply with the substantive purpose of the\nstatute","the veterans failed to comply with the stipulated requirements of\nthe statute"],"correct":3,"explanation":"The correct answer is option D. This can be inferred from the passage. The passage provides evidence that supports the conclusion that the veterans failed to comply with the stipulated requirements of\nthe statute. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":3,"question":"From the discussion of wills in the third paragraph it can be\ninferred that substantive arguments as to the validity of a will might\nbe considered under which one of the following circumstances?","options":["The legal rule requiring that a will be witnessed in writing does\nnot stipulate the format of the will.","The legal rule requiring that a will be witnessed stipulates that\nthe will must be witnessed in writing by two people.","The legal rule requiring that a will be witnessed in writing\nstipulates that the witnessing must be done in the presence of a judge.","A judge rules that the law can be interpreted to allow for a\nverbal witness to a will in a case involving a medical emergency."],"correct":3,"explanation":"The correct answer is option D. This can be inferred from the passage. The passage provides evidence that supports the conclusion that a judge rules that the law can be interpreted to allow for a\nverbal witness to a will in a case involving a medical emergency. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":4,"question":"The author of the passage makes use of all of the following in\npresenting the discussion of the English and the United States legal\nsystems EXCEPT","options":["comparison and contrast","generalization","explication of term","a chronology of historical developments"],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: a chronology of historical developments. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":5,"question":"Which one of the following best describes the function of the last\nparagraph of the passage?","options":["It presents the consequences of extreme interpretations of the two\ntypes of legal reasons discussed by the author.","It shows how legal scholars can incorrectly use extreme examples\nto support their views.","It corrects inaccuracies in legal scholars' views of the nature of\nthe two types of legal systems.","It suggests how characterizations of the two types of legal\nreasons can become convoluted and inaccurate."],"correct":0,"explanation":"The correct answer is option A. The passage supports this answer: it presents the consequences of extreme interpretations of the two\ntypes of legal reasons discussed by the author. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":6,"question":"The author of the passage suggests that in English law a\nsubstantive interpretation of a legal rule might be warranted under\nwhich one of the following circumstances?","options":["Social conditions have changed to the extent that to continue to\nenforce the rule would be to decide contrary to present-day social\nnorms.","The composition of the legislature has changed to the extent that\nto enforce the rule would be contrary to the views of the majority in\nthe present legislative assembly.","The legality of the rule is in question and its enforcement is\nopen to judicial interpretation.","Individuals who have violated the legal rule argue that\napplication of the rule would lead to unfair judicial\ninterpretations."],"correct":2,"explanation":"The correct answer is option C. This can be inferred from the passage. The passage provides evidence that supports the conclusion that the legality of the rule is in question and its enforcement is\nopen to judicial interpretation. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."}]},"52":{"id":52,"title":"How does the brain know when carbohydrates have been or should be consumed? The","difficulty":"Moderate","passage":"How does the brain know when carbohydrates have been or should be consumed? The answer to this question is not known, but one element in the explanation seems to be the neurotransmitter serotonin, one of a class of chemical mediators that may be released from a presynaptic neuron and that cause the transmission of a nerve impulse across a synapse to an adjacent postsynaptic neuron. In general, it has been found that drugs that selectively facilitate serotonin-mediated neurotransmission tend to cause weight loss, whereas drugs that block serotonin-mediated transmission often have the opposite effect: they often induce carbohydrate craving and consequent weight gain.\n\nSerotonin is a derivative of tryptophan, an amino acid that is normally present at low levels in the bloodstream. The rate of conversion is affected by the proportion of carbohydrates in an individual's diet: carbohydrates stimulate the secretion of insulin, which facilitates the uptake of most amino acids into peripheral tissues, such as muscles. Blood tryptophan levels, however, are unaffected by insulin, so the proportion of tryptophan in the blood relative to the other amino acids increases when carbohydrates are consumed. Since tryptophan competes with other amino acids for transport across the blood-brain barrier into the brain, insulin secretion indirectly speeds tryptophan's entry into the central nervous system where, in a special cluster of neurons, it is converted into serotonin.\n\nThe level of serotonin in the brain in turn affects the amount of carbohydrate an individual chooses to eat. Rats that are allowed to choose among synthetic foods containing different proportions of carbohydrate and protein will normally alternate between foods containing mostly protein and those containing mostly carbohydrate. However, if rats are given drugs that enhance the effect of serotonin, the rats' carbohydrate intake is reduced. On the other hand, when rats are given drugs that interrupt serotonin-mediated neurotransmission, their brains fail to respond when carbohydrates are eaten, so the desire for them persists.\n\nIn human beings a serotoninlike drug, d-fenfluramine (which release serotonin into brain synapses and then prolong its action by blocking its reabsorption into the presynaptic neuron), selectively suppresses carbohydrate snacking (and its associated weight gain) in people who crave carbohydrates. In contrast, drugs that block serotonin-mediated transmission or that interact with neurotransmitters other than serotonin have the opposite effect: they often induce carbohydrate craving and subsequent weight gain. People who crave carbohydrates report feeling refreshed and invigorated after eating a carbohydrate-rich meal (which would be expected to increase brain serotonin levels), in contrast, those who do not crave carbohydrates become sleepy following a high-carbohydrate meal. These findings suggest that serotonin has other effects that may be useful indicators of serotonin levels in human beings.","questions":[{"id":1,"question":"Which one of the following best states the main idea of the passage","options":["The body's need for carbohydrates varies with the level of\nserotonin in the blood.","The body's use of carbohydrates can be regulated by the\nadministration of serotoninlike drugs.","The role of serotonin in regulating the consumption of\ncarbohydrates is similar in rats and in humans.","The body's desire for carbohydrates can be influenced by serotonin\nor serotoninlike drugs."],"correct":0,"explanation":"The correct answer is option A. The passage supports this answer: the body's need for carbohydrates varies with the level of\nserotonin in the blood. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"The term \"rate\" (line 17) refers to the rate at which","options":["serotonin is produced from tryptophan","carbohydrates are taken into the body","carbohydrates stimulate the secretion of insulin","insulin facilitates the uptake of amino acids into peripheral\ntissues"],"correct":0,"explanation":"The correct answer is option A. The passage supports this answer: serotonin is produced from tryptophan. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":3,"question":"It can be inferred that a person is likely to carve carbohydrates\nwhen","options":["the amount of insulin produced is too high","the amount of serotonin in the brain is too low","more tryptophan than usual crosses the blood-brain barrier","neurotransmission by neurotransmitters other than serotonin is\ninterrupted"],"correct":1,"explanation":"The correct answer is option B. This can be inferred from the passage. The passage provides evidence that supports the conclusion that the amount of serotonin in the brain is too low. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":4,"question":"The information in the passage indicates that if human beings were\ngiven a drug that inhibits the action of serotonin, which one of the\nfollowing might be expected to occur?","options":["Subjects would probably show a preference for carbohydrate-rich\nsnacks rather than protein-rich snacks.","Subjects would probably become sleepy after eating a\ncarbohydrate-rich meal.","Subjects would be more likely to lose weight than before they took\nthe drug.","Subjects' blood tryptophan levels would probably increase."],"correct":0,"explanation":"The correct answer is option A. The passage supports this answer: subjects would probably show a preference for carbohydrate-rich\nsnacks rather than protein-rich snacks. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":5,"question":"The primary purpose of the second paragraph in the passage is to","options":["provide an overview of current research concerning the effect of\nserotonin on carbohydrate consumption","contrast the role of tryptophan in the body with that of serotonin","discuss the role of serotonin in the transmission of neural\nimpulses","establish a connection between carbohydrate intake and the\nproduction of serotonin"],"correct":3,"explanation":"The correct answer is option D. The passage as a whole is primarily focused on this theme. While other options may touch on aspects mentioned in the passage, the central purpose is best captured by this answer: establish a connection between carbohydrate intake and the\nproduction of serotonin."},{"id":6,"question":"It can be inferred that after a person has taken d-fenflurarmine,\nhe or she will probably be","options":["inclined to gain weight","sleepy much of the time","unlikely to crave carbohydrates","unable to sleep as much as usual"],"correct":2,"explanation":"The correct answer is option C. This can be inferred from the passage. The passage provides evidence that supports the conclusion that unlikely to crave carbohydrates. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."}]},"53":{"id":53,"title":"A major tenet of the neurosciences has been that all neurons (nerve cells) in the","difficulty":"Moderate","passage":"A major tenet of the neurosciences has been that all neurons (nerve cells) in the brains of vertebrate animals are formed early in development. An adult vertebrate, it was believed, must make do with a fixed number of neurons: those lost through disease or injury are not replaced, and adult learning takes place not through generation of new cells but through modification of connections among existing ones.\n\nHowever, new evidence for neurogenesis (the birth of new neurons) has come from the study of canary song. Young canaries and other songbirds learn to sing much as humans learn to speak, by imitating models provided by their elders. Several weeks after birth, a young bird produces its first rudimentary attempts at singing; over the next few months the song becomes more structured and stable, reaching a fully developed state by the time the bird approaches its first breeding season. But this repertoire of song is not permanently learned. After each breeding season, during late summer and fall, the bird loses mastery of its developed \"vocabulary,\" and its song becomes as unstable as that of a juvenile bird. During the following winter and spring, however, the canary acquires new songs, and by the next breeding season it has developed an entirely new repertoire.\n\nRecent neurological research into this learning and relearning process has shown that the two most important regions of the canary's brain related to the learning of songs actually vary in size at different times of the year. In the spring, when the bird's song is highly developed and uniform, the regions are roughly twice as large as they are in the fall. Further experiments tracing individual nerve cells within these regions have shown that the number of neurons drops by about 38 percent after the breeding season, but by the following breeding season, new ones have been generated to replace them. A possible explanation for this continual replacement of nerve cells may have to do with the canary's relatively long life span and the requirements of flight. Its brain would have to be substantially larger and heavier than might be feasible for flying if it had to carry all the brain cells needed to process and retain all the information gathered over a lifetime.\n\nAlthough the idea of neurogenesis in the adult mammalian brain is still not generally accepted, these findings might help uncover a mechanism that would enable the human brain to repair itself through neurogenesis. Whether such replacement of neurons would disrupt complex learning processes or long-term memory is not known, but songbird research challenges scientists to identify the genes or hormones that orchestrate () neurogenesis in the young human brain and to learn how to activate them in the adult brain.","questions":[{"id":1,"question":"Which one of the following best expresses the main idea of the\npassage?","options":["New evidence of neurogenesis in canaries challenges an established\nneurological theory concerning brain cells in vertebrates and suggests\nthe possibility that human brains may repair themselves.","The brains of canaries differ from the brains of other vertebrate\nanimals in that the brains of adult canaries are able to generate\nneurons.","Recent studies of neurogenesis in canaries, building on\nestablished theories of vertebrate neurology, provide important clues as\nto why researchers are not likely to discover neurogenesis in adult\nhumans.","Recent research into neurogenesis in canaries refutes a long-held\nbelief about the limited supply of brain cells and provides new\ninformation about neurogenesis in the adult human brain."],"correct":0,"explanation":"The correct answer is option A. The passage supports this answer: new evidence of neurogenesis in canaries challenges an established\nneurological theory concerning brain cells in vertebrates and suggests\nthe possibility that human brains may repair themselves. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"According to the passage, which one of the following is true of the\ntypical adult canary during the late summer and fall?","options":["The canary's song repertoire takes on a fully structured and\nstable quality.","A process of neurogenesis replaces the song-learning neurons that\nwere lost during the preceding months.","The canary begins to learn an entirely new repertoire of songs\nbased on the models of other canaries.","The regions in the canary's brain that are central to the learning\nof song decrease in size."],"correct":3,"explanation":"The correct answer is option D. The passage explicitly states or directly supports that the regions in the canary's brain that are central to the learning\nof song decrease in size. This information is stated in the passage, making it the most accurate answer based on the text."},{"id":3,"question":"Information in the passage suggests that the author would most\nlikely regard which one of the following as LEAST important in future\nresearch on neurogenesis in humans?","options":["research on possible similarities between the neurological\nstructures of humans and canaries","studies that compare the ratio of brain weight to body weight in\ncanaries to that in humans","neurological research on the genes or hormones that activate\nneurogenesis in the brain of human infants","studies about the ways in which long-term memory functions in the\nhuman brain"],"correct":1,"explanation":"The correct answer is option B. This can be inferred from the passage. The passage provides evidence that supports the conclusion that studies that compare the ratio of brain weight to body weight in\ncanaries to that in humans. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":4,"question":"Which one of the following, if true, would most seriously undermine\nthe explanation proposed by the author in the third paragraph?","options":["A number of songbird species related to the canary have a shorter\nlife span than the canary and do not experience neurogenesis.","The brain size of several types of airborne birds with life spans\nsimilar to those of canaries has been shown to vary according to a\ntwo-year cycle of neurogenesis.","Several species of airborne birds similar to canaries in size are\nknown to have brains that are substantially heavier than the canary's\nbrain.","Individual canaries that have larger-than-average repertoires of\nsongs tend to have better developed muscles for flying."],"correct":2,"explanation":"The correct answer is option C. The passage supports this answer: several species of airborne birds similar to canaries in size are\nknown to have brains that are substantially heavier than the canary's\nbrain. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":5,"question":"The use of the word \"vocabulary\" (line 23) serves primarily to","options":["demonstrate the presence of a rudimentary grammatical structure in\ncanary song","point out a similarity between the patterned groupings of sounds\nin a canary's song and the syllabic structures of words","stress the stability and uniformity of canary's song throughout\nits lifetime","suggest a similarity between the possession of a repertoire of\nwords among humans and a repertoire of songs among canaries"],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: suggest a similarity between the possession of a repertoire of\nwords among humans and a repertoire of songs among canaries. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":6,"question":"According to the passage, which one of the following factors may\nhelp account for the occurrence of neurogenesis in canaries?","options":["the life span of the average canary","the process by which canaries learn songs","the frequency of canary breeding seasons","the number of regions in the canary brain related to song\nlearning"],"correct":0,"explanation":"The correct answer is option A. The passage explicitly states or directly supports that the life span of the average canary. This information is stated in the passage, making it the most accurate answer based on the text."}]},"54":{"id":54,"title":"For too many years scholars of African American history focused on the harm done by","difficulty":"Moderate","passage":"For too many years scholars of African American history focused on the harm done by slaveholders and by the institution of slavery, rather than on what Africans in the United States were able to accomplish despite the effects of that institution. In Myne Owne Ground, T. H. Breen and Stephen Innes contribute significantly to a recent, welcome shift from a white-centered to a black-centered inquiry into the role of African Americans in the American colonial period. Breen and Innes focus not on slaves, but on a small group of freed indentured servants in Northampton County (in the Chesapeake Bay region of Virginia) who, according to the authors, maintained their freedom, secured property, and interacted with persons of different races and economic standing from 1620 through the 1670s. African Americans living on the Chesapeake were to some extent disadvantaged, say Breen and Innes, but this did not preclude the attainment of status roughly equal to that of certain white planters of the area. Continuously acting within black social networks, and forming economic relationships with white planters, local Native Americans, indentured servants, and white settlers outside the gentry class, the free African Americans of Northampton County held their own in the rough-hewn world of Chesapeake Bay.\n\nThe authors emphasize that in this early period, when the percentage of African Americans in any given Chesapeake county was still no more than 10 percent of the population, very little was predetermined so far as racial status or race relations were concerned. By schooling themselves in the local legal process and by working prodigiously on the land, African Americans acquired property, established families, and warded off contentious white neighbors. Breen and Innes do acknowledge that political power on the Chesapeake was asymmetrically distributed among black and white residents. However, they underemphasize much evidence that customary law, only gradually embodies in statutory law, was closing in on free African Americans well before the 1670s: during the 1660s, when the proportion of African Americans in Virginia increased dramatically, Virginia tightened a law regulating interracial relations (1662) and enacted a statute prohibiting baptism from altering slave status (1667). Anthony Johnson, a leader in the community of free African Americans in the Chesapeake Bay region, sold the land he had cultivated for more than twenty years and moved north with his family around 1665, an action that the authors attribute to a search for \"fresh, more productive land.\" But the answer to why the Johnsons left that area where they had labored so long may lie in their realization that their white neighbors were already beginning the transition from a largely white indentured labor force to reliance on a largely black slave labor force, and that the institution of slavery was threatening their descendants' chances for freedom and success in Virginia.","questions":[{"id":1,"question":"The author of the passage objects to many scholarly studies of\nAfrican American history for which one of the following reasons?","options":["Their emphases have been on statutory law rather than on customary\nlaw.","They have ignored specific historical situations and personages in\nfavor of broad interpretations.","They have focused on the least eventful periods in African\nAmerican history.","They have failed to focus to a sufficient extent on the\nachievements of African Americans."],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: they have failed to focus to a sufficient extent on the\nachievements of african americans. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"Which one of the following can be inferred from the passage\nconcerning the relationship between the African American population and\nthe law in the Chesapeake Bay region of Virginia Between 1650 and 1670?","options":["The laws affecting black citizens were embodies in statutes much\nmore gradually than were lays affecting white citizens.","As the percentage of black citizens in the population grew, the\nlegal restrictions placed on them also increased.","Because of discriminatory laws, black farmers suffered more\neconomic setbacks than did white farmers.","Because of legal constraints on hiring indentured servants, black\nfarmers faced a chronic labor shortage on their farms."],"correct":1,"explanation":"The correct answer is option B. This can be inferred from the passage. The passage provides evidence that supports the conclusion that as the percentage of black citizens in the population grew, the\nlegal restrictions placed on them also increased. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":3,"question":"The author of the passage most probably refers to Anthony Johnson\nand his family in order to","options":["provide a specific example of the potential shortcomings of Breen\nand Innes' interpretation of historical events","provide a specific example of relevant data overlooked by Breen\nand Innes in their discussion of historical events","provide a specific example of data that Breen and Innes might\nprofitably have used in proving their thesis","argue that the standard interpretation of historical events is\nsuperior to Breen and Innes' revisionist interpretation"],"correct":0,"explanation":"The correct answer is option A. The passage supports this answer: provide a specific example of the potential shortcomings of breen\nand innes' interpretation of historical events. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":4,"question":"The attitude of the author of the passage toward Breen and Innes'\nstudy can best be described as one of","options":["condescending dismissal","wholehearted acceptance","contentious challenge","qualified approval"],"correct":3,"explanation":"The correct answer is option D. The author's tone throughout the passage is best characterised as reflected in this answer. The language and rhetorical choices in the passage support this reading."},{"id":5,"question":"The primary purpose of the passage is to","options":["summarize previous interpretations","advocate a new approach","propose and then illustrate a thesis","present and evaluate an interpretation"],"correct":3,"explanation":"The correct answer is option D. The passage as a whole is primarily focused on this theme. While other options may touch on aspects mentioned in the passage, the central purpose is best captured by this answer: present and evaluate an interpretation."}]},"55":{"id":55,"title":"Late nineteenth-century books about the French artist Watteau (1684-1721) betray a","difficulty":"Moderate","passage":"Late nineteenth-century books about the French artist Watteau (1684-1721) betray a curious blind spot : more than any single artist before or since, Watteau provided his age with an influential image of itself, and nineteenth-century writers accepted this image as genuine. This was largely due to the enterprise of Watteau's friends who, soon after his death, organized the printing of engraved reproductions of the great bulk of his work—both his paintings and his drawings—so that Watteau's total artistic output became and continued to be more accessible than that of any other artist until the twentieth-century advent of art monographs illustrated with photographs. These engravings presented aristocratic (and would-be aristocratic) eighteenth-century French society with an image of itself that was highly acceptable and widely imitate by other artists, however little relationship that image bore to reality. By 1884, the bicentenary of Watteau's birth, it was standard practice for biographers to refer to him as \"the personification of the witty and amiable eighteenth century.\"\n\nIn fact, Watteau saw little enough of that \"witty and amiable\" century for which so much nostalgia was generally felt between about 1870 and 1920, a period during which enthusiasm for the artist reached its peak. The eighteenth century's first decades, the period of his artistic activity, were fairly calamitous ones. During his short life, France was almost continually at war: his native region was overrun with foreign troops, and Paris was threatened by siege and by a rampaging army rabble. The dreadful winter of 1709, the year of Watteau's first Paris successes, was marked by military defeat and a disastrous famine.\n\nMost of Watteau's nineteenth-century admirers simply ignored the grim background of the works they found so lyrical and charming. Those who took the inconvenient historical facts into consideration did so only in order to refute the widely held deterministic view that the content and style of an artist's work were absolutely dictated by heredity and environment. (For Watteau admirers, such determinism was unthinkable: the artist was born in a Flemish town only six years after it first became part of France, yet Watteau was quintessentially French. As one patriotic French biographer put it, \"In Dreden, Potsdam, and Berlin I have never come across a Watteau without feeling refreshed by a breath of native air.\" Even such writers, however, persisted in according Watteau's canvases a privileged status as representative \"personifications\" of the eighteenth century. The discrepancy between historical fact and artistic vision, useful in refuting the extreme deterministic position, merely forced these writers to seek a new formula that allowed them to preserve the desired identity between image and reality, this time a rather suspiciously psychic one: Watteau did not record the society he knew, but rather \"foresaw\" a society that developed shortly after his death.","questions":[{"id":1,"question":"Which one of the following best describes the overall organization\nof the passage?","options":["A particular phenomenon is discussed, the reasons that it is\natypical are put forward, and these reasons are evaluated and refined.","An assumption is made, results deriving from it are compared with\nwhat is known to be true, and the assumption is finally rejected as\ncounterfactual.","A point of view is described, one hypothesis accounting for it is\nintroduced and rejected, and a better hypothesis is offered for\nconsideration.","A particular viewpoint is explained, its shortcomings are\ndiscussed, and its persistence in the face of these is noted."],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: a particular viewpoint is explained, its shortcomings are\ndiscussed, and its persistence in the face of these is noted. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"The passage suggests that late-nineteenth-century biographers of\nWatteau considered the eighteenth century to be \"witty and amiable\" in\nlarge part because of","options":["what they saw as Watteau's typical eighteenth-century talent for\ntranscending reality through art","their opposition to the determinism that dominated\nlate-nineteenth-century French thought","a lack of access to historical source material concerning the\nearly eighteenth century in France","the nature of the image conveyed by the works of Watteau and his\nmany imitators"],"correct":3,"explanation":"The correct answer is option D. This can be inferred from the passage. The passage provides evidence that supports the conclusion that the nature of the image conveyed by the works of watteau and his\nmany imitators. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":3,"question":"According to the passage, explanations of artistic production based\non determinism were unthinkable to Watteau admirers for which one of the\nfollowing reasons?","options":["If such explanations were widely accepted, too many people who\nwould otherwise have admired Watteau would cease to appreciate Watteau's\nworks.","If such explanations were adopted, they would make it difficult\nfor Watteau admirers to explain why Watteau's works were purchased and\nadmired by foreigners.","If such explanations were correct, many artists who, like Watteau,\nconsidered themselves French would have to excluded from histories of\nFrench art.","If such explanations were true, Watteau's works would reflect a\n\"Flemish\" sensibility rather than the especially \"French\" one these\nadmirers saw in them."],"correct":3,"explanation":"The correct answer is option D. The passage explicitly states or directly supports that if such explanations were true, watteau's works would reflect a\n\"flemish\" sensibility rather than the especially \"french\" one these\nadmirers saw in them. This information is stated in the passage, making it the most accurate answer based on the text."},{"id":4,"question":"The phrase \"curious blind spot\" (line 2 -3) can best be interpreted\nas referring to which one of the following?","options":["some biographers' persistent inability to appreciate what the\nauthor considers a particularly admirable equality","certain writers' surprising lack of awareness of what the author\nconsiders an obvious discrepancy","some writers' willful refusal to evaluate properly what the author\nconsiders a valuable source of information about the past","an inexplicable tendency on the part of some writers to undervalue\nan artist whom the author considers extremely influential"],"correct":1,"explanation":"The correct answer is option B. The passage supports this answer: certain writers' surprising lack of awareness of what the author\nconsiders an obvious discrepancy. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":5,"question":"It can be inferred from the passage that the author's view of\nWatteau's works differs most significantly from that of most\nlate-nineteen-century Watteau admirers in which one of the following\nways?","options":["Unlike most late-nineteenth-century Watteau admirers, the author\nappreciates the importance of Watteau's artistic accomplishment.","The author finds Watteau's works to be much less lyrical and\ncharming than did most late-nineteenth-century admirers of the works.","In contrast to most late-nineteenth-century Watteau admirers, the\nauthor finds it misleading to see Watteau's works as accurately\nreflecting social reality.","The author is much more willing to entertain deterministic\nexplanations of the origins of Watteau's works than were most\nlate-nineteenth-century Watteau admirers."],"correct":2,"explanation":"The correct answer is option C. This can be inferred from the passage. The passage provides evidence that supports the conclusion that in contrast to most late-nineteenth-century watteau admirers, the\nauthor finds it misleading to see watteau's works as accurately\nreflecting social reality. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":6,"question":"The author asserts that during the period of Watteau's artistic\nactivity French society was experiencing which one of the following?","options":["widespread social upheaval caused by war","a pervasive sense of nostalgia for an idealized past","increased domination of public affairs by a powerful aristocracy","rapid adoption by the middle classes of aristocratic manners and\nlife-style"],"correct":0,"explanation":"The correct answer is option A. The passage supports this answer: widespread social upheaval caused by war. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."}]},"56":{"id":56,"title":"Faced with the problems of insufficient evidence, of conflicting evidence, and of","difficulty":"Moderate","passage":"Faced with the problems of insufficient evidence, of conflicting evidence, and of evidence relayed through the flawed perceptual, retentive, and narrative abilities of witnesses, a jury is forced to draw inferences in its attempt to ascertain the truth. By applying the same cognitive tools they have developed and used over a lifetime, jurors engage in the inferential exercise that lawyers call fact-finding. In certain decision-making contexts that are relevant to the trial of lawsuits, however, these normally reliable cognitive tools may cause jurors to commit inferential errors that distort rather than reveal the truth.\n\nAlthough juries can make a variety of inferential errors, most of these mistakes in judgment involve the drawing of an unwarranted conclusion from the evidence, that is, deciding that the evidence proves something that, in reality, it does not prove. For example, evidence that the defendant in a criminal prosecution has a prior conviction may encourage jurors to presume the defendant's guilt, because of their preconception that a person previously convicted of a crime must be inclined toward repeated criminal behavior. That commonly held belief is at least a partial distortion of reality; not all former convicts engage in repeated criminal behavior. Also, jury may give more probative weight than objective analysis would allow to vivid photographic evidence depicting a shooting victim's wounds, or may underestimate the weight of defense testimony that is not delivered in a sufficiently forceful or persuasive manner. Finally, complex or voluminous evidence might be so confusing to a jury that its members would draw totally unwarranted conclusions or even ignore the evidence entirely.\n\nRecent empirical research in cognitive psychology suggests that people tend to commit inferential errors like these under certain predictable circumstances. By examining the available information, the situation, and the type of decision being made, cognitive psychologists can describe the kinds of inferential errors a person or group is likely to make. These patterns of human decision-making may provide the courts with a guide to evaluating the effect of evidence on the reliability of the jury's inferential processes in certain situations.\n\nThe notion that juries can commit inferential errors that jeopardize the accuracy of the fact-finding process is not unknown to the courts. In fact, one of a presiding judge's duties is to minimize jury inferential error through explanation and clarification. Nonetheless, most judges now employ only a limited and primitive concept of jury inferential error: limited because it fails to recognize the potential for error outside certain traditional situations, primitive because it ignores the research and conclusions of psychologists in favor of notions about human cognition held by lawyers.","questions":[{"id":1,"question":"Which one of the following best expresses the main idea of the\npassage?","options":["When making decisions in certain predictable situations, juries\nmay commit inferential errors that obscure rather than reveal the truth.","The views of human cognition taken by cognitive psychologists on\nthe one hand and by the legal profession on the other are demonstrably\ndissimilar.","When confronting powerful preconceptions, particularly shocking\nevidence, or complex, situation, jurors make errors in judgment.","The problem of inferential error by juries is typical of the\ndifficulties with cognitive processes that people face in their everyday\nlives."],"correct":0,"explanation":"The correct answer is option A. The passage supports this answer: when making decisions in certain predictable situations, juries\nmay commit inferential errors that obscure rather than reveal the truth. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"Of the following hypothetical reforms in trial procedure, which one\nwould the author be most likely to support as the best way to address\nthe problem of jury inferential error?","options":["a move away from jury trial","the institution of minimum formal educational requirements for\njurors","the development of strict guidelines for defense testimony","specific training for judges in the area of jury instruction"],"correct":3,"explanation":"The correct answer is option D. This can be inferred from the passage. The passage provides evidence that supports the conclusion that specific training for judges in the area of jury instruction. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":3,"question":"In the second paragraph, the author's primary purpose is to","options":["refute the idea that the fact-finding process is a complicated\nexercise","emphasize how carefully evidence must be presented in order to\navoid jury inferential error","explain how commonly held beliefs affect the jury's ability to\nascertain the truth","provide examples of situations that may precipitate jury\nerrors"],"correct":3,"explanation":"The correct answer is option D. The passage as a whole is primarily focused on this theme. While other options may touch on aspects mentioned in the passage, the central purpose is best captured by this answer: provide examples of situations that may precipitate jury\nerrors."},{"id":4,"question":"Which one of the following best describes the author's attitude\ntoward the majority of judges today?","options":["apprehensive about whether they are consistent in their\ninstruction of juries","doubtful of their ability to draw consistently correct conclusions\nbased on the evidence","critical of their failure to take into account potentially helpful\nresearch","pessimistic about their willingness to make significant changes in\ntrial procedure"],"correct":2,"explanation":"The correct answer is option C. The author's tone throughout the passage is best characterised as reflected in this answer. The language and rhetorical choices in the passage support this reading."},{"id":5,"question":"Which one of the following statements, if true, would most\nseriously undermine the author's suggestion about the use of current\npsychological research in the courtroom?","options":["All guidelines about human behavior must take account of\nvariations in the patterns of human decision-making.","Current models of how humans make decisions apply reliably to\nindividuals but do not hold for decisions made by groups.","The current conception of jury inferential error employed by\njudges has been in use for nearly a century.","Inferential errors can be more easily predicted in controlled\nsituations such as the trial of lawsuits than in other kinds of\ndecision-making processes."],"correct":1,"explanation":"The correct answer is option B. This can be inferred from the passage. The passage provides evidence that supports the conclusion that current models of how humans make decisions apply reliably to\nindividuals but do not hold for decisions made by groups. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":6,"question":"It can be inferred from the passage that the author would be most\nlikely to agree with which one of the following generalizations about\nlawyers?","options":["They have a less sophisticated understanding of human cognition\nthan do psychologists.","They often present complex or voluminous information merely in\norder to confuse a jury.","They are no better at making logical inferences from the testimony\nat a trial than are most judges.","They have worked to help judges minimize jury inferential\nerror."],"correct":0,"explanation":"The correct answer is option A. This can be inferred from the passage. The passage provides evidence that supports the conclusion that they have a less sophisticated understanding of human cognition\nthan do psychologists. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."}]},"57":{"id":57,"title":"It is a fundamental tenet of geophysics that the Earth's magnetic field can exist","difficulty":"Moderate","passage":"It is a fundamental tenet of geophysics that the Earth's magnetic field can exist in either of two polarity states: a \"normal\" state, in which north-seeking compass needles point to the geographic north, and a \"reverse\" state, in which they point to the geographic south. Geological evidence shows that periodically the field's polarity reverses, and that these reversals have been taking place at an increasing rate. Evidence also indicates that the field does not reverse instantaneously from one polarity state to another; rather, the process involves a transition period that typically spans a few thousand years.\n\nThough this much is known, the underlying causes of the reversal phenomenon are not well understood. It is generally accepted that the magnetic field itself is generated by the motion of free electrons in the outer core, a slowly churning mass of molten metal sandwiched between the Earth's mantle (the region of the Earth's interior lying below the crust) and its solid inner core. In some way that is not completely understood, gravity and the Earth's rotation, acting on temperature and density differences within the outer core fluid, provide the driving forces behind the generation of the field. The reversal phenomenon may be triggered when something disturbs the heat circulation pattern of the outer core fluid, and with it the magnetic field.\n\nSeveral explanations for this phenomenon have been proposed. One proposal, the \"heat-transfer hypothesis,\" is that the triggering process is intimately related to the way the outer core vents its heat into the mantle. For example, such heat transfer could create hotter (rising) or cooler (descending) blobs of material from the inner and outer boundaries of the fluid core, thereby perturbing the main heat-circulation pattern. A more controversial alternative proposal is the asteroid-impact hypothesis. In this scenario an extended period of cold and darkness results from the impact of an asteroid large enough to send a great cloud of dust into the atmosphere. Following this climatic change, ocean temperatures drop and the polar ice caps grow, redistributing the Earth's seawater. This redistribution increases the rotational acceleration of the mantle, causing friction and turbulence near the outer core-mantle boundary and initiating reversal of the magnetic field.\n\nHow well do these hypotheses account for such observations as the long-term increase in the frequency of reversal? In support of the asteroid-impact model, it had been argued that the gradual cooling of the average ocean temperature would enable progressively smaller asteroid impacts (which are known to occur more frequently than larger impacts) to cool the Earth's climate sufficiently to induce ice-cap growth and reversals. But theories that depend on extraterrestrial intervention seem less convincing than theories like the first, which account for the phenomenon solely by means of the thermodynamic state of the outer core and its effect on the mantle.","questions":[{"id":1,"question":"Which one of the following statements regarding the Earth's outer\ncore is best supported by information presented in the passage?","options":["Heat circulation in the outer core controls the growth and\ndiminution of the polar ice caps.","Impact of asteroids on the Earth's surface alters the way in which\nthe outer core vents its heat into the mantle.","Motion of electrons within the metallic fluid in the outer core\nproduces the Earth's magnetic field.","Friction and turbulence near the boundary between the outer core\nand the mantle are typically caused by asteroid impacts."],"correct":2,"explanation":"The correct answer is option C. The passage supports this answer: motion of electrons within the metallic fluid in the outer core\nproduces the earth's magnetic field. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"The author's objection to the second hypothesis discussed in the\npassage is most applicable to which one of the following explanations\nconcerning the extinction of the dinosaurs?","options":["The extinction of the dinosaurs was the result of gradual changes\nin the composition of the Earth's atmosphere that occurred over millions\nof years.","The dinosaurs became extinct when their food supply was disrupted\nfollowing the emergence of mammals.","The dinosaurs succumbed to the new, colder environment brought\nabout by a buildup of volcanic ash in the atmosphere.","After radical climatic changes resulted from the impact of a\ncomet, dinosaurs disappeared from the Earth."],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: after radical climatic changes resulted from the impact of a\ncomet, dinosaurs disappeared from the earth. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":3,"question":"The author mentions the creation of blobs of different temperatures\nin the Earth's outer core (lines 34-38) primarily in order to","options":["present a way in which the venting of heat from the outer core\nmight disturb the heat-circulation pattern within the outer core","provide proof for the proposal that ventilation of heat from the\nouter core into the mantle triggers polarity reversal","give an example of the way in which heat circulates between the\nEarth's outer core and the Earth's exterior","describe how the outer core maintains its temperature by venting\nits excess heat into the Earth's mantle"],"correct":0,"explanation":"The correct answer is option A. The passage supports this answer: present a way in which the venting of heat from the outer core\nmight disturb the heat-circulation pattern within the outer core. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":4,"question":"Which one of the following statements regarding the polarity of the\nEarth's magnetic field is best supported by information in the passage?","options":["Most, but not all, geophysicists agree that the Earth's magnetic\nfield may exist in two distinct polarity states.","Changes in the polarity of the Earth's magnetic field have\noccurred more often in the recent past that in the distant past.","Heat transfer would cause reversals of the polarity of the Earth's\nmagnetic field to occur more quickly than would asteroid impact.","Geophysicists' understanding of the reversal of the Earth's\nmagnetic field has increased significantly since the introduction of the\nheat-transfer hypothesis."],"correct":1,"explanation":"The correct answer is option B. The passage supports this answer: changes in the polarity of the earth's magnetic field have\noccurred more often in the recent past that in the distant past. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":5,"question":"Which one of the following can be inferred regarding the two\nproposals discussed in the passage?","options":["Since their introduction they have sharply divided the scientific\ncommunity.","Both were formulated in order to explain changes in the frequency\nof polarity reversal.","Although no firm conclusions regarding them have yet been reached,\nboth have been extensively investigated.","They are not the only proposals scientists have put forward to\nexplain the phenomenon of polarity reversal."],"correct":3,"explanation":"The correct answer is option D. This can be inferred from the passage. The passage provides evidence that supports the conclusion that they are not the only proposals scientists have put forward to\nexplain the phenomenon of polarity reversal. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":6,"question":"The author mentions each of the following as possible contributing\ncauses to reversals of the Earth's magnetic field EXCEPT","options":["changes in the way heat circulates within the outer core fluid","extended periods of colder temperatures on the Earth's surface","the creation of circulation blobs of outer core material of\ndifferent temperatures","changes in circulation patterns in the Earth's oceans"],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: changes in circulation patterns in the earth's oceans. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."}]},"58":{"id":58,"title":"Innovations in language are never completely new","difficulty":"Moderate","passage":"Innovations in language are never completely new. When the words used for familiar things change, or words for new things enter the language, they are usually borrowed or adapted from stock. Assuming new roles, they drag their old meanings along behind them like flickering shadow. This seems especially true of the language of the contemporary school of literary criticism that now prefers to describe its work simply and rather presumptuously as theory but is still popularly referred to as poststructuralism of deconstruction.\n\nThe first neologisms adopted by this movement were signifier and signified, employed to distinguish arbitrariness of the term we choose. The use of these particular terms (rather than, respectively, words and thing) underlined the seriousness of the naming process and its claim on our attention. Since in English \"to signify\" can also mean \"to portend,\" these terms also suggest that words predict coming events.\n\nWith the use of the term deconstruction we move into another and more complex realm of meaning. The most common use of the terms construction and deconstruction is in the building trades, and their borrowing by literary theorists for a new type of criticism cannot help but have certain overtones to the outsider. First, the usage suggests that the creation and critical interpretation of literature are not organic but mechanical processes; that the author of any piece of writing is not an inspired, intuitive artist, but merely a laborer who cobbles existing materials (words) into more or less conventional structures. The term deconstruction implies that the text has been put together like a building or a piece of machinery, and that it is in need of being taken apart, not so much in order to repair it as to demonstrate underlying inadequacies, false assumptions, and inherent contradictions. This process can supposedly be repeated many times and by many literary hard hats (a conservative who is intolerant of opposing views); it is expected that each deconstruction will reveal additional flaws and expose the illusions or bad faith of the builder. The fact that deconstructionists prefer to describe their activities as deconstruction rather than criticism is also revealing. Criticism and critic derive from the Greek Kritikos, \"skillful in judging, decisive.\" Deconstruction, on the other hand, has no overtones of skill or wisdom; it merely suggests demolition of an existing building. In popular usage criticism suggests censure but not change. If we find fault with a building, we may condemn it, but we do not carry out the demolition ourselves. The deconstructionist, by implication, is both judge and executioner who leaves a text totally dismantled, if not reduced to a pile of rubble.","questions":[{"id":1,"question":"Which one of the following best expresses the main idea of the\npassage?","options":["Implicit in the terminology of the school of criticism known as\ndeconstruction are meanings that reveal the true nature of the\ndeconstructionist's endeavor.","The appearance of the terms signifier and signified in the\nfield of literary theory anticipated the appearance of an even more\nradical idea known as deconstruction.","Innovations in language and relations between old and new meanings\nof terms are a special concern of the new school of criticism known as\ndeconstruction.","Deconstructionists maintain that it is insufficient merely to\njudge a work: the critic must actively dismantle it."],"correct":0,"explanation":"The correct answer is option A. The passage supports this answer: implicit in the terminology of the school of criticism known as\ndeconstruction are meanings that reveal the true nature of the\ndeconstructionist's endeavor. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"Which one of the following is a claim that the author of the passage\nmakes about deconstructionists?","options":["Deconstructionists would not have been able to formulate their\nviews adequately without the terms signifier and signified.","Deconstructionists had no particular purpose in mind in choosing\nto use neologisms.","Deconstructionists do not recognize that their own theory contains\ninherent contradictions.","Deconstructionists use the terms signifier and signified to\nstress the importance of the process of naming."],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: deconstructionists use the terms signifier and signified to\nstress the importance of the process of naming. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":3,"question":"Which one of the following generalizations about inventions is most\nanalogous to the author's point about innovation in language?","options":["A new invention usually consists of components that are\nspecifically manufactured for the new invention.","A new invention is usually behind the times, never making as much\nuse of all the available modern technology as it could.","A new invention usually consists of components that are already\navailable but are made to function in new ways.","A new invention is most useful when it is created with attention\nto the historical tradition established by implements previously used to\ndo the same job."],"correct":2,"explanation":"The correct answer is option C. The passage supports this answer: a new invention usually consists of components that are already\navailable but are made to function in new ways. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":4,"question":"The author of the passage uses the word \"criticism\" in lines 46-56\nprimarily in order to","options":["give an example","introduce a contrast","undermine an argument","codify a system"],"correct":1,"explanation":"The correct answer is option B. The passage supports this answer: introduce a contrast. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":5,"question":"Which one of the following best describes the function of the\nsecond paragraph within the passage as a whole?","options":["It introduces a hypothesis that the author later expands upon.","It qualifies a claim made earlier by the author.","It develops an initial example of the author's general thesis.","It predicts a development."],"correct":2,"explanation":"The correct answer is option C. The passage supports this answer: it develops an initial example of the author's general thesis. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":6,"question":"The passage suggests that the author most probably holds the view\nthat an important characteristic of literary criticism is that it","options":["demonstrate false assumptions and inherent contradictions","employ skill and insight","be carried out by one critic rather than many","reveal how a text is put together like a building"],"correct":1,"explanation":"The correct answer is option B. This can be inferred from the passage. The passage provides evidence that supports the conclusion that employ skill and insight. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."}]},"59":{"id":59,"title":"(The following passage was written in 1986) The legislation (the enactments of a","difficulty":"Moderate","passage":"(The following passage was written in 1986)\n\nThe legislation (the enactments of a legislator or a legislative body) of a country recently considered a bill designed to reduce the uncertainty inherent in the ownership of art by specifying certain conditions that must be met before an allegedly stolen work of art can be reclaimed by a plaintiff. The bill places the burden of proof in reclamation litigation entirely on the plaintiff, who must demonstrate that the holder of an item knew at the time of purchase that it had been stolen. Additionally, the bill creates a uniform national statute of limitations for reclamation of stolen cultural property.\n\nTestifying () in support of the bill, James D, Burke, a citizen of the country and one of its leading art museum directors, specially praised the inclusion of a statute of limitations; otherwise, he said, other countries could seek to reclaim valuable art objects, no matter how long they have been held by the current owner or how legitimately they were acquired. Any country could enact a patrimony law stating that anything ever made within the boundaries of that country is its cultural property. Burke expressed the fear that lead to ruinous legal defense costs for museums.\n\nHowever, because such reclamation suits have not yet been a problem, there is little basis for Burke's concern. In fact, the proposed legislation would establish too many unjustifiable barriers to the location and recovery of stolen objects. The main barrier is that the bill considers the announcement of an art transaction in a museum publication to be adequate evidence of an attempt to notify a possible owner. There are far too many such publications for the victim of a theft to survey, and with only this form of disclosure, a stolen object could easily remain unlocated even if assiduously searched for. Another stipulation requires that a purchaser show the object to a scholar for verification that it is not stolen, but it is a rare academic who is aware of any but the most publicized art thefts. Moreover, the time limit specified by the statute of limitations is very short, and the requirement that the plaintiff demonstrate that the holder had knowledge of the theft is unrealistic. Typically, stolen art changes hands several times before rising to the level in the marketplace where a curator or collector would see it. At that point, the object bears no trace of the initial transaction between the thief and the first purchaser, perhaps the only one in the chain who knowingly acquired a stolen work of art.\n\nThus, the need for new legislation to protect holders of art is not obvious. Rather, what is necessary is legislation remedying the difficulties that legitimate owners of works of art, and countries from which such works have been stolen, have in locating and reclaiming these stolen works.","questions":[{"id":1,"question":"Which one of the following most accurately summarizes the main\npoint of the passage?","options":["Various legal disputes have recently arisen that demonstrate the\nneed for legislation clarifying the legal position of museums in suits\ninvolving the repossession of cultural property.","A bill intended to prevent other governments from recovering\ncultural property was recently introduced into the legislature of a\ncountry at the behest of its museum directors.","A bill intended to protect good-faith purchasers of works of art\nfrom reclamation litigation is unnecessary and fails to address the\nneeds of legitimate owners attempting to recover stolen art works.","Clashes between museum professionals and members of the academic\ncommunity regarding governmental legislation of the arts can best be\nresolved by negotiation and arbitration, not by litigation."],"correct":2,"explanation":"The correct answer is option C. The passage supports this answer: a bill intended to protect good-faith purchasers of works of art\nfrom reclamation litigation is unnecessary and fails to address the\nneeds of legitimate owners attempting to recover stolen art works. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"The uncertainty mentioned in line 2 of the passage refers to the","options":["doubt that owners of works of art often harbor over whether\nindividuals have a moral right to possess great art","concern that owners of works of art often have that their\npossession of such objects may be legally challenged at any time","questions that owners of works of art often have concerning the\ncorrect identification of the age and origin of their objects","disputes that often arise between cultural institutions vying for\nthe opportunity to purchase a work of art"],"correct":1,"explanation":"The correct answer is option B. The passage supports this answer: concern that owners of works of art often have that their\npossession of such objects may be legally challenged at any time. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":3,"question":"Which one of the following is an example of the kind of action that\nBurke feared would pose a serious threat to museums in his country?","options":["the passage of a law by another country forbidding the future\nexport of any archaeological objects uncovered at sites within its\nterritory","an international accord establishing strict criteria for\ndetermining whether a work of art can be considered stolen and\nspecifying the circumstances under which it must be returned to its\ncountry of origin","the passage of a law by another country declaring that all objects\ncreated by its aboriginal people are the sole property of that country","an increase in the acquisition of culturally significant works of\nart by private collectors, who are more capable than museums of bearing\nthe cost of litigation but who rarely display their collections to the\npublic"],"correct":2,"explanation":"The correct answer is option C. The passage supports this answer: the passage of a law by another country declaring that all objects\ncreated by its aboriginal people are the sole property of that country. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":4,"question":"According to the passage, Burke envisaged the most formidable\npotential adversaries of his country's museums in reclamation litigation\nto be","options":["commercial dealers in art","law enforcement officials in his own country","governments of other countries","private collectors of art"],"correct":2,"explanation":"The correct answer is option C. The passage explicitly states or directly supports that governments of other countries. This information is stated in the passage, making it the most accurate answer based on the text."},{"id":5,"question":"The author suggests that in the country mentioned in line 1,\nlitigation involving the reclamation of stolen works of art has been","options":["less common than Burke fears it will become without passage of a\nnational stature of limitations for reclamation of stolen cultural\nproperty","increasing as a result of the passage of legislation that aids\nlegitimate owners of art in their attempts to recover stolen works","a serious threat to museums and cultural institutions that have\nunwittingly added stolen artifacts to their collections","a signal of the legitimate frustrations of victims of at\ntheft"],"correct":0,"explanation":"The correct answer is option A. This can be inferred from the passage. The passage provides evidence that supports the conclusion that less common than burke fears it will become without passage of a\nnational stature of limitations for reclamation of stolen cultural\nproperty. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":6,"question":"Which one of the following best describes the author's attitude\ntowards the proposed bill?","options":["impassioned support","measured advocacy","fearful apprehension","reasoned opposition"],"correct":3,"explanation":"The correct answer is option D. The author's tone throughout the passage is best characterised as reflected in this answer. The language and rhetorical choices in the passage support this reading."}]},"60":{"id":60,"title":"Until recently, few historians were interested in analyzing the similarities and","difficulty":"Moderate","passage":"Until recently, few historians were interested in analyzing the similarities and differences between serfdom in Russia and slavery in the United States. Even Alexis de Tocqueville, who recognized the significant comparability of the two nations, never compared their systems of servitude, despite his interest in United States slavery. Moreover, the almost simultaneous abolition of Russian serfdom and United States slavery in the 1860s—a riveting coincidence that should have drawn more modern scholars to a comparative study of the two systems of servitude—has failed to arouse the interest of scholars. Though some historians may have been put off by the forbidding political differences between nineteenth-century Russia and the United States—one an imperial monarchy, the other a federal democracy—a recent study by Peter Kolchin identifies differences that are illuminating, especially with regard to the different kinds of rebellion exhibited by slaves and serfs.\n\nKolchin points out that nobles owning serfs in Russia constituted only a tiny proportion of the population, while in the southern United States, about a quarter of all White people were members of slave-owning families. And although in the southern United States only 2 percent of slaves worked on plantations where more than a hundred slaves worked, in Russia almost 80 percent of the serfs worked for nobles who owned more than a hundred serfs. In Russia most serfs rarely saw their owners who tended to rely on intermediaries to manage their estates, while most southern planters lived on their land and interacted with slaves on a regular basis.\n\nThese differences in demographics partly explain differences in the kinds of resistance that slaves and serfs practiced in their respective countries. Both serfs and slaves engaged in a wide variety of rebellious activity, from silent sabotage, much of which has escaped the historical record, to organized armed rebellions, which were more common in Russia. The practice of absentee ownership, combined with the large numbers in which serfs were owned, probably contributed significantly to the four great rebellions that swept across Russia at roughly fifty-year intervals in the seventeenth and eighteenth centuries. The last of these, occurring between 1773 and 1774, enlisted more than a million serfs in a futile attempt to overthrow the Russian nobility. Russian serfs also participated in smaller acts of collective defiance called the volnenie, which typically started with a group of serfs who complained of grievances by petition and went out on strike. Confrontations between slaves and plantation authorities were also common, but they tended to be much less collective in nature than those that occurred in Russia, probably in part because the number of workers on each estate was smaller in the United States than was the case in Russia.","questions":[{"id":1,"question":"Which one of the following best states the main idea of the\npassage?","options":["Differences in the demographics of United States slavery and\nRussian serfdom can help explain the different kinds of resistance\npracticed by slaves and serfs in their respective countries.","Historians have yet to undertake an adequate comparison and\ncontrast of Russian serfdom and United States slavery.","Revolts by Russian serfs were commonly characterized by collective\naction.","A recent study has questioned the value of comparing United States\nslavery to Russian serfdom, especially in light of the significant\ndemographic and cultural differences between the two countries."],"correct":0,"explanation":"The correct answer is option A. The passage supports this answer: differences in the demographics of united states slavery and\nrussian serfdom can help explain the different kinds of resistance\npracticed by slaves and serfs in their respective countries. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"According to the author, de Tocqueville was similar to many modern\nhistorians in his","options":["interest in the demographic differences between Russia and the\nUnited States during the nineteenth century","failure to undertake a comparison of Russian serfdom and United\nStates slavery","inability to explain why United States slavery and Russian serfdom\nwere abolished during the same decade","overestimation of the significance of the political differences\nbetween Russia and the United States"],"correct":1,"explanation":"The correct answer is option B. The passage explicitly states or directly supports that failure to undertake a comparison of russian serfdom and united\nstates slavery. This information is stated in the passage, making it the most accurate answer based on the text."},{"id":3,"question":"Which one of the following assertions, if true, would provide the\nmost support for Kolchin's principal conclusion regarding the\nrelationship of demographics to rebellion among Russian serfs and United\nStates slaves?","options":["Collective defiance by serfs during the nineteenth century was\nconfined almost exclusively to their participation in the volnenie.","The rebellious activity of United States slaves was more likely to\nescape the historical record than was the rebellious activity of Russian\nserfs.","Organized rebellions by slaves in the Western Hemisphere during\nthe nineteenth century were most common in colonies with large estates\nthat normally employed more than a hundred slaves.","In the southern United States during the nineteenth century, those\nestates that were managed by intermediaries rather than by the owner\ngenerally relied upon the labor of at least a hundred slaves."],"correct":2,"explanation":"The correct answer is option C. The passage supports this answer: organized rebellions by slaves in the western hemisphere during\nthe nineteenth century were most common in colonies with large estates\nthat normally employed more than a hundred slaves. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":4,"question":"The fact that United States slavery and Russian serfdom were\nabolished during the same decade is cited by the author in the first\nparagraph primarily in order to","options":["emphasize that rebellions in both countries eventually led to the\ndemise of the two institutions","cite a coincidence that de Tocqueville should have been able to\nforesee","suggest one reason why more historians should have been drawn to a\ncomparative study of the two institutions","cite a coincidence that Kolchin's study has failed to explain\nadequately"],"correct":2,"explanation":"The correct answer is option C. The passage supports this answer: suggest one reason why
