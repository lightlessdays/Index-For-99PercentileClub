her misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"The author describes the posited relationship between toeing out and\nage (lines 29-40) in order to","options":["illustrate a folly","show how social attitudes toward posture change","explain the effects of aging","illustrate a medical problem"],"correct":0,"explanation":"The correct answer is option A. The passage supports this answer: illustrate a folly. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":3,"question":"Given the author's statements in the passage, his advice for\nevaluating statistics that show a high positive correlation between two\nconditions could include all the following statements EXCEPT","options":["look for an explanation in the stream of events","consider some trend of the times as the possible cause of both\nconditions","account for the correlations in some way other than causality","determine which of the two conditions is the cause and which is\nthe effect"],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: determine which of the two conditions is the cause and which is\nthe effect. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":4,"question":"Assume that there is a high statistical correlation between college\nattendance and individual earnings. Given this, the author would most\nprobably agree with which one of the following statements about the\ncause-effect relationship between college attendance and income?","options":["Someone's potential earnings may be affected by other variables,\nlike wealth or intelligence, that are also associated with college\nattendance.","Someone who attends graduate school will be rich.","Someone who attends graduate school will earn more money than\nsomeone who does not.","Someone who attends college will earn more money than someone who\ndoes not attend college."],"correct":0,"explanation":"The correct answer is option A. The passage supports this answer: someone's potential earnings may be affected by other variables,\nlike wealth or intelligence, that are also associated with college\nattendance. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":5,"question":"According to the author, Professor Walker believes that","options":["women who toe out age more rapidly than women who do not","most women toe out as they grow older because age increases the\nangle between the feet","older women tend to walk with a greater angle between the feet","toeing out is the reason why women grow old"],"correct":2,"explanation":"The correct answer is option C. The passage explicitly states or directly supports that older women tend to walk with a greater angle between the feet. This information is stated in the passage, making it the most accurate answer based on the text."},{"id":6,"question":"The author would reject all the following statements about\ncause-effect relationships as explanations for the statistics that show\nan increase in cancer rates EXCEPT that the","options":["Ceylonese drink more milk than the English","Swiss produce and consume large quantities of dairy products","Women of New England drink more milk than the women who live in\nsome states of the southern United States","People of Wisconsin have relatively high life expectancies"],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: people of wisconsin have relatively high life expectancies. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."}]},"71":{"id":71,"title":"In most developed countries, men have higher salaries, on average, than women","difficulty":"Moderate","passage":"In most developed countries, men have higher salaries, on average, than women. Much of the salary differential(difference between comparable individuals or classes) results from the tendency of women to be in lower-paying occupations. The question of whether this occupational employment pattern can be attributed to sex discrimination is a complex one. In fact, wage differentials among occupations are the norm rather than the exception. Successful athletes commonly earn more than Nobel Prize-winning academics; gifted artists often cannot earn enough to survive, while mediocre investment bankers prosper. Given such differences, the question naturally arises: talent and ability being equal, why does anyone—man or woman—enter a low-paying occupation? One obvious answer is personal choice. An individual may prefer, for example, to teach math at a modest salary rather than to become a more highly paid electrical engineer.\n\nSome people argue that personal choice also explains sex-related wage differentials. According to this explanation, many women, because they place a high priority on parenting and performing household services, choose certain careers in which they are free to enter and leave the work force with minimum penalty. They may choose to acquire skills, such as typing and salesclerking, that do not depreciate rapidly with temporary absences from the work force. They may avoid occupational specialties that require extensive training periods, long and unpredictable hours, and willingness to relocate, all of which make specialization in domestic activities problematic. By choosing to invest less in developing their career potential and to expend less effort outside the home, women must, according to this explanation, pay a price in the form of lower salaries. But women cannot be considered the victims of discrimination because they prefer the lower-paying occupations to higher-paying ones.\n\nAn alternative explanation for sex-related wage differentials is that women do not voluntarily choose lower-paying occupations but are forced into them by employers and social prejudices. According to proponents of this view, employers who discriminate may refuse to hire qualified women for relatively high-paying occupations. More generally, subtle society-wide prejudices may induce women to avoid certain occupations in favor of others that are considered more suitable. Indeed, the \"choice\" of women to specialize in parenting and performing household services may itself result from these subtle prejudices. Whether the discrimination is by employers in a particular occupation or by society as a whole is irrelevant; the effect will be the same. Further, if such discrimination does occur, women excluded from certain occupations will flood others, and this increase in supply will have a depressing effect on wages in occupations dominated by women.","questions":[{"id":1,"question":"Which one of the following is the best little for the passage?","options":["Wage Differentials Between Men and Women","Women in Low-Paying Occupations: Do They Have a Choice?","Sex Discrimination in the Workplace","The Role of Social Prejudice in Women's Careers"],"correct":1,"explanation":"The correct answer is option B. The passage supports this answer: women in low-paying occupations: do they have a choice?. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"In stating that \"Successful athletes commonly earn more than Nobel\nPrize-winning academics\" (lines 10-11), the author's primary purpose is\nto","options":["demonstrate that education has little to do with making money","suggest that people with talent and ability should not enter\nlow-paying occupations","show that highly paid occupations generally require long hours and\nextensive training","give an example of how certain occupations are better paid than\nothers regardless of inherent worth or talent required"],"correct":3,"explanation":"The correct answer is option D. The passage as a whole is primarily focused on this theme. While other options may touch on aspects mentioned in the passage, the central purpose is best captured by this answer: give an example of how certain occupations are better paid than\nothers regardless of inherent worth or talent required."},{"id":3,"question":"Which one of the following cases is least likely to involve sex\ndiscrimination, as it is described in the passage?","options":["An employer hires a man rather than an equally qualified woman.","A woman chooses to enter a high-paying occupation that uses her\ntalent and ability.","A woman chooses an occupation that is already dominated by women.","A woman chooses a low-paying job that allows her to devote more\ntime to her family."],"correct":1,"explanation":"The correct answer is option B. The passage supports this answer: a woman chooses to enter a high-paying occupation that uses her\ntalent and ability. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":4,"question":"Proponents of the \"alternative explanation\" (line 46) argue that","options":["employers have difficulty persuading qualified women to enter\nrelatively high-paying occupations","women choose undemanding jobs because they wish to keep their\ncareer options open","women will flood domestic occupations","salaries in female-dominated occupations will decrease as more\nwomen are forced into those occupations by their exclusion from\nothers"],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: salaries in female-dominated occupations will decrease as more\nwomen are forced into those occupations by their exclusion from\nothers. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":5,"question":"Which one of the following statements is the best completion of the\nlast paragraph of the passage?","options":["Wage differentials will become more exaggerated and economic\nparity between men and women less and less possible.","Finally, women will be automatically placed in the same salary\nrange as unskilled laborers.","The question is: how long will women allow themselves to be\nexcluded from male-dominated occupations?","In the last analysis, women may need to ask themselves if they can\nreally afford to allow sex discrimination to continue."],"correct":0,"explanation":"The correct answer is option A. The passage supports this answer: wage differentials will become more exaggerated and economic\nparity between men and women less and less possible. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":6,"question":"The author's attitude toward sex discrimination as an explanation\nfor wage differentials can best be characterized as","options":["critical of society's acceptance of discrimination","skeptical that discrimination is a factor","convinced that the problem will get worse","neutral with respect to its validity"],"correct":3,"explanation":"The correct answer is option D. The author's tone throughout the passage is best characterised as reflected in this answer. The language and rhetorical choices in the passage support this reading."}]},"72":{"id":72,"title":"The starting point for any analysis of insurance classification is an obvious but","difficulty":"Moderate","passage":"The starting point for any analysis of insurance classification is an obvious but fundamental fact: insurance is only one of a number of ways of satisfying the demand for protection against risk. With few exceptions, insurance need not be purchased; people can forgo it if insurance is too expensive. Indeed, as the price of coverage rises, the amount purchased and the number of people purchasing will decline. Instead of buying insurance, people will self-insure by accumulating saving to serve as a cushion in the event of loss, self-protect by spending more on loss protection, or simply use the money not spent on insurance to purchase other goods and services. An insurer must compete against these alternatives, even in the absence of(...,...) competition from other insurers.\n\nOne method of competing for protection dollars is to classify potential purchasers into groups according to their probability of loss and the potential magnitude of losses if they occur. Different risk classes may then be charged different premiums, depending on this expected loss. Were it not for the need to compete for protection dollars, an insurer could simply charge each individual a premium based on the average expected loss of all its insureds (plus a margin for profit and expenses), without incurring classification costs. In constructing risk classes, the insurer's goal is to calculate the expected loss of each insured, and to place insureds with similar expected losses into the same class, in order to charge each the same rate.\n\nAn insurer can capture protection dollars by classifying because, through classification, it can offer low-risk individuals lower prices. Classification, however, involves two costs. First, the process of classification is costly. Insurers must gather data and perform statistical operations on it; marketing may also be more costly when prices are not uniform. Second, classification necessarily raises premiums for poor risks, who purchase less coverage as a result. In the aggregate(in the aggregate:, ), classification is thus worthwhile to an insurer only when the gains produced from extra sales and fewer pay-outs outweigh classification costs plus the costs of lost sales. Even in the absence of competition from other insurers, an insurer who engages in at least some classification is likely to capture more protection dollars than it loses.\n\nWhen there is not only competition for available protection dollars, but competition among insurers for premium dollars, the value of risk classification to insurers becomes even clearer. The more refined (and accurate) an insurer's risk classifications, the more capable it is of \"skimming\" good risks away from insurers whose classifications are less refined. If other insurers do not respond, either by refining their own classifications or by raising prices and catering mainly to high risks, their \"book\" of risks will contain a higher mixture of poor risks who are still being charged premiums calculated for average risks. These insurers will attract additional poor risks, and this resulting adverse selection will further disadvantage their competitive positions.","questions":[{"id":1,"question":"Which one of the following best identifies the main topic of the\npassage?","options":["reduction of competition in the insurance business","classification of potential insurance purchasers","risk avoidance in insurance sales","insurance protection and premiums"],"correct":1,"explanation":"The correct answer is option B. The passage supports this answer: classification of potential insurance purchasers. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"The passage mentions all of the following as possible or certain\ncosts of classifying EXCEPT the cost of","options":["collecting facts","conducting statistical analyses","selling insurance at different prices","larger, albeit fewer, claims"],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: larger, albeit fewer, claims. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":3,"question":"Which one of the following is closest to the author's expressed\nposition on competition in the insurance business?","options":["It has a significant influence on most aspects of the insurance\nindustry.","It is a relevant factor, but it has little practical consequence.","It is a basic but not very apparent element of the insurance\nbusiness.","It provides a strong incentive for insurers to classify potential\ncustomers."],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: it provides a strong incentive for insurers to classify potential\ncustomers. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":4,"question":"The passage suggests that if all insurers classified risk, who\namong the following would be adversely affected?","options":["all insurance purchasers","insurance purchasers who would be classified as poor risks","individuals who self-insured or self protected","insurers who had a high proportion of good risks in their \"book\"\nof risks"],"correct":1,"explanation":"The correct answer is option B. This can be inferred from the passage. The passage provides evidence that supports the conclusion that insurance purchasers who would be classified as poor risks. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":5,"question":"Given the discussion in the first paragraph, what is the\ndistinction, if any, between \"insurance\" and \"self-protection\"?","options":["There is very little or no distinction between the two terms.","Insurance is a kind of self-protection.","Self-protection is a kind of insurance.","Insurance and self-protection are two of several alternative means\nto a specific end."],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: insurance and self-protection are two of several alternative means\nto a specific end. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":6,"question":"Which one of the following is most closely analogous to the process\nof classification in insurance, as it is described in the passage?","options":["devising a profile of successful employees and hiring on the basis\nof the profile","investigating the fuel efficiency of a make of automobile and\ndeciding whether or not to buy on that basis","assessing an investor's willingness to take risks before\nsuggesting a specific investment","making price comparisons on potential major purchases and then\nseeking discounts from competing dealers"],"correct":0,"explanation":"The correct answer is option A. The passage supports this answer: devising a profile of successful employees and hiring on the basis\nof the profile. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."}]},"73":{"id":73,"title":"Three kinds of study have been performed on Byron","difficulty":"Moderate","passage":"Three kinds of study have been performed on Byron. There is the biographical study—the very valuable examination of Byron's psychology and the events in his life. Escarpit's 1958 work is an example of this kind of study and biographers to this day continue to speculate about Byron's life. Equally valuable is the study of Byron as a figure important in the history of ideas; Russell and Praz have written studies of this kind. Finally, there are studies that primarily consider Byron's poetry. Such literary studies are valuable, however, only when they avoid concentrating solely on analyzing the verbal shadings of Byron's poetry to the exclusion of any discussion of biographical considerations. A study with such a concentration would be of questionable value because Byron's poetry, for the most part, is simply not a poetry of subtle verbal meanings. Rather, on the whole, Byron's poems record the emotional pressure of certain moments in his life. I believe we cannot often read a poem of Byron's we often can(read) one of Shakespeare's without wondering what events or circumstances in his life prompted him to write it.\n\nNo doubt the fact that most of Byron's poems cannot be convincingly read as subtle verbal creations indicates that Byron is not a \"great\" poet. It must be admitted too that Byron's literary craftsmanship is irregular and often his temperament disrupts even his lax literary method (although the result, an absence of method, has a significant purpose: it functions as a rebuke to a cosmos that Byron feels he cannot understand). If Byron is not a \"great\" poet, his poetry is nonetheless of extraordinary interest to us because of the pleasure it gives us. Our main pleasure in reading Byron's poetry is the contact with a singular personality. Reading his work gives us illumination—self-understanding—after we have seen our weaknesses and aspirations mirrored in the personality we usually find in the poems. Anyone who thinks that this kind of illumination is not a genuine reason for reading a poet should think carefully about why we read Donne's sonnets.\n\nIt is Byron and Byron's idea of himself that hold his work together (and that enthralled early nineteenth-century Europe). Different characters speak in his poems, but finally it is usually he himself who is speaking: a far cry from the impersonal poet Keats. Byron's poetry alludes to Greek and Roman myth in the context of contemporary affairs, but his work remains generally of a piece because of his close presence in the poetry. In sum, the poetry is a shrewd personal performance, and to shut out Byron the man is to fabricate a work of pseudocriticism.","questions":[{"id":1,"question":"Which one of the following titles best expresses the main idea of\nthe passage?","options":["An Absence of Method. Why Byron Is Not a \"Great\" Poet","Byron: The Recurring Presence in Byron's Poetry","Personality and Poetry: The Biographical Dimension of\nNineteenth-Century Poetry","Byron's Poetry: Its Influence on the imagination of\nEarly-Nineteenth-Century Europe"],"correct":1,"explanation":"The correct answer is option B. The passage supports this answer: byron: the recurring presence in byron's poetry. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"The author's mention of Russell and Praz serves primarily to","options":["differentiate them from one another","contrast their conclusions about Byron with those of Escarpit","point out the writers whose studies suggest a new direction for\nByron scholarship","provide examples of writers who have written one kind of study of\nByron"],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: provide examples of writers who have written one kind of study of\nbyron. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":3,"question":"Which one of the following would the author most likely consider to\nbe a valuable study of Byron?","options":["a study that compared Byron's poetic style with Keats' poetic\nstyle","a study that argued that Byron's thought ought not to be analyzed\nin terms of its importance in the history of ideas","a study that sought to identify the emotions felt by Byron at a\nparticular time in his life","a study in which a literary critic argues that the language of\nByron's poetry was more subtle than that of Keat's poetry"],"correct":2,"explanation":"The correct answer is option C. The passage supports this answer: a study that sought to identify the emotions felt by byron at a\nparticular time in his life. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":4,"question":"Which one of the following statements best describes the\norganization of first paragraph of the passage?","options":["A generalization is made and then gradually refuted.","A number of theories are discussed and then the author chooses the\nmost convincing one.","Several categories are mentioned and then one category is\ndiscussed in some detail.","A historical trend is delineated and then a prediction about the\nfuture of the trend is offered."],"correct":2,"explanation":"The correct answer is option C. The passage supports this answer: several categories are mentioned and then one category is\ndiscussed in some detail. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":5,"question":"The author mentions that \"Byron's literary craftsmanship is\nirregular\" (lines 27-28) most probably in order to","options":["contrast Byron's poetic skill with that of Shakespeare","dismiss craftsmanship as a standard by which to judge poets","offer another reason why Byron is not a \"great\" poet","point out a negative consequence of Byron's belief that the cosmos\nis incomprehensible"],"correct":2,"explanation":"The correct answer is option C. The passage supports this answer: offer another reason why byron is not a \"great\" poet. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":6,"question":"According to the author Shakespeare's poems differ from Byron's in\nthat Shakespeare's poems","options":["have elicited a wider variety of responses from both literary\ncritics and biographers","are on the whole less susceptible to being read as subtle verbal\ncreations","do not grow out of or are not motivated by actual events or\ncircumstances in the poet's life","can often be read without the reader's being curious about what\nbiographical factors motivated the poet to write them"],"correct":3,"explanation":"The correct answer is option D. The passage explicitly states or directly supports that can often be read without the reader's being curious about what\nbiographical factors motivated the poet to write them. This information is stated in the passage, making it the most accurate answer based on the text."}]},"74":{"id":74,"title":"The United States Supreme Court has not always resolved legal issues of concern to","difficulty":"Moderate","passage":"The United States Supreme Court has not always resolved legal issues of concern to Native Americans in a manner that has pleased the Indian nations. Many of the Court's decisions have been products of political compromise that looked more to the temper of the times than to enduring principles of law. But accommodation is part of the judicial system in the United States, and judicial decisions must be assessed with this fact in mind.\n\nDespite the \"accommodating\" nature of the judicial system, it is worth noting that the power of the Supreme Court has been exercised in a manner that has usually been beneficial to Native Americans, at least on minor issues and has not been wholly detrimental on the larger, more important issues. Certainly there have been decisions that cast doubt on the validity of this assertion. Some critics point to the patronizing tone of many Court opinions and the apparent rejection of Native American values as important points to consider when reviewing a case. However, the validity of the assertion can be illustrated by reference to two important contributions that have resulted from the exercise of judicial power.\n\nFirst the Court has created rules of judicial construction that in general favor the rights of Native American litigants. The Court's attitude has been conditioned by recognition of the distinct disadvantages Native Americans faced when dealing with settlers in the past. Treaties were inevitably written in English for the benefit of their authors, whereas tribal leaders were accustomed to making treaties without any written account, on the strength of mutual promises sealed (to confirm or make secure by or as if by a seal) by religious commitment and individual integrity. The written treaties were often broken and Native Americans were confronted with fraud and political and military aggression. The Court recognizes that past unfairness to Native Americans cannot be sanctioned by the force of law. Therefore, ambiguities in treaties are to be interpreted in favor of the Native American claimants, treaties are to be interpreted as the Native Americans would have understood them and, under the reserved rights doctrine, treaties reserve to Native Americans all rights that have not been specifically granted away in other treaties.\n\nA second achievement of the judicial system is the protection that has been provided against encroachment by the states into tribal affairs. Federal judges are not inclined to view favorably efforts to extend states powers and jurisdictions because of the direct threat that such expansion poses to the exercise of federal powers. In the absence of a federal statute directly and clearly allocating a function to the states, federal judges are inclined to reserve for the federal government—and the tribal governments under its charge—all those powers and rights they can be said to have possessed historically.","questions":[{"id":1,"question":"According to the passage, one reason why the United States Supreme\nCourt \"has not always resolved legal issues of concern to Native\nAmericans in a manner that has pleased the Indian nations\" (lines 1-4)\nis that","options":["Native Americans have been prevented from presenting their\nconcerns persuasively","the Court has failed to recognize that the Indian nations'\nconcerns are different from those of other groups or from those of the\nfederal government","the Court has been reluctant to curtail the powers of the federal\ngovernment","the Court has made political compromises in deciding some cases"],"correct":3,"explanation":"The correct answer is option D. The passage explicitly states or directly supports that the court has made political compromises in deciding some cases. This information is stated in the passage, making it the most accurate answer based on the text."},{"id":2,"question":"It can be inferred that the objections raised by the critics\nmentioned in line 18 would be most clearly answered (reply in rebuttal)\nby a United States Supreme Court decision that","options":["demonstrated respect for Native Americans and the principles and\nqualities they consider important","protected the rights of the states in conflicts with the federal\ngovernment","demonstrated recognition of the unfair treatment Native Americans\nreceived in the past","reflected consideration of the hardships suffered by Native\nAmericans because of unfair treaties"],"correct":0,"explanation":"The correct answer is option A. This can be inferred from the passage. The passage provides evidence that supports the conclusion that demonstrated respect for native americans and the principles and\nqualities they consider important. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":3,"question":"It can be inferred that the author calls the judicial system of the\nUnited States \"accommodating\" (line 10) primarily in order to","options":["suggest that the decisions of the United States Supreme Court have\nbeen less favorable to Native Americans than most people believe","suggest that the United States Supreme Court should be more\nsupportive of the goals of Native Americans","suggest a reason why the decisions of the United States Supreme\nCourt have not always favored Native Americans","indicate that the United States Supreme Court has made creditable\nefforts to recognize the values of Native Americans"],"correct":2,"explanation":"The correct answer is option C. This can be inferred from the passage. The passage provides evidence that supports the conclusion that suggest a reason why the decisions of the united states supreme\ncourt have not always favored native americans. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":4,"question":"The author's attitude toward the United States Supreme Court's\nresolution of legal issues of concern to Native Americans can best be\ndescribed as one of","options":["wholehearted endorsement","restrained appreciation","detached objectivity","cautious opposition"],"correct":1,"explanation":"The correct answer is option B. The author's tone throughout the passage is best characterised as reflected in this answer. The language and rhetorical choices in the passage support this reading."},{"id":5,"question":"It can be inferred that the author believes that the extension of\nthe states' powers and jurisdictions with respect to Native American\naffairs would be","options":["possible only with the consent of the Indian nations","favorably viewed by the United States Supreme Court","in the best interests of both state and federal governments","detrimental to the interests of Native Americans"],"correct":3,"explanation":"The correct answer is option D. This can be inferred from the passage. The passage provides evidence that supports the conclusion that detrimental to the interests of native americans. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":6,"question":"The author's primary purpose is to","options":["contrast opposing views","reevaluate traditional beliefs","reconcile divergent opinions","provide evidence to support a contention"],"correct":3,"explanation":"The correct answer is option D. The passage as a whole is primarily focused on this theme. While other options may touch on aspects mentioned in the passage, the central purpose is best captured by this answer: provide evidence to support a contention."}]},"75":{"id":75,"title":"When catastrophe strikes, analysts typically blame some combination of powerful","difficulty":"Moderate","passage":"When catastrophe strikes, analysts typically blame some combination of powerful mechanisms. An earthquake is traced to an immense instability along a fault line; a stock market crash is blamed on the destabilizing effect of computer trading. These explanations may well be correct. But systems as large and complicated as the Earth's crust or the stock market can break down not only under the force of a mighty blow but also at the drop of a pin. In a large interactive system, a minor event can start a chain reaction that leads to a catastrophe.\n\nTraditionally, investigators have analyzed large interactive systems in the same way they analyze small orderly systems, mainly because the methods developed for small systems have proved so successful. They believed they could predict the behavior of a large interactive system by studying its elements separately and by analyzing its component mechanisms individually. For lack of a better theory, they assumed that in large interactive systems the response to a disturbance is proportional to that disturbance.\n\nDuring the past few decades, however, it has become increasingly apparent that many large complicated systems do not yield to traditional analysis. Consequently, theorists have proposed a \"theory of self-organized criticality\": many large interactive systems evolve naturally to a critical state in which a minor event starts a chain reaction that can affect any number of elements in the system. Although such systems produce more minor events than catastrophes, the mechanism that leads to minor events is the same one that leads to major events.\n\nA deceptively simple system serves as a paradigm for self-organized criticality: a pile of sand. As sand is poured one grain at a time onto a flat disk, the grains at first stay close to the position where they land. Soon they rest on top of one another, creating a pile that has a gentle slope. Now and then, when the slope becomes too steep, the grains slide down, causing a small avalanche. The system reaches its critical state when the amount of sand added is balanced, on average, by the amount falling off the edge of the disk.\n\nNow when a grain of sand is added, it can start an avalanche of any size, including a \"catastrophic\" event. Most of the time the grain will fall so that no avalanche occurs. By studying a specific area of the pile, one can even predict whether avalanches will occur there in the near future. To such a local observer, however, large avalanches would remain unpredictable because they are a consequence of the total history of the entire pile. No matter what the local dynamics are, catastrophic avalanches would persist at a relative frequency that cannot be altered: Criticality is a global property of the sandpile.","questions":[{"id":1,"question":"The passage provides support for all of the following\ngeneralizations about large interactive systems EXCEPT:","options":["They can evolve to a critical state.","They do not always yield to traditional analysis.","They make it impossible for observers to make any predictions\nabout them.","They are subject to the effects of chain reactions."],"correct":2,"explanation":"The correct answer is option C. The passage supports this answer: they make it impossible for observers to make any predictions\nabout them. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"According to the passage, the criticality of a sandpile is\ndetermined by the","options":["size of the grains of sand added to the sandpile","number of grains of sand the sandpile contains","rate at which sand is added to the sandpile","balance between the amount of sand added to and the amount lost\nfrom the sandpile"],"correct":3,"explanation":"The correct answer is option D. The passage explicitly states or directly supports that balance between the amount of sand added to and the amount lost\nfrom the sandpile. This information is stated in the passage, making it the most accurate answer based on the text."},{"id":3,"question":"It can be inferred from the passage that the theory employed by the\ninvestigators mentioned in the second paragraph would lead one to\npredict that which one of the following would result from the addition\nof a grain of sand to a sandpile?","options":["The grain of sand would never cause anything more than a minor\ndisturbance.","The grain of sand would usually cause a minor disturbance, but\nwould occasionally cause a small avalanche.","The grain of sand would usually cause either minor disturbance or\na small avalanche, but would occasionally cause a catastrophic event.","The grain of sand would usually cause a catastrophic event, but\nwould occasionally cause only a small avalanche or an event more minor\ndisturbance."],"correct":0,"explanation":"The correct answer is option A. This can be inferred from the passage. The passage provides evidence that supports the conclusion that the grain of sand would never cause anything more than a minor\ndisturbance. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":4,"question":"Which one of the following best describes the organization of the\npassage?","options":["A traditional procedure is described and its application to common\nsituations is endorsed: its shortcomings in certain rare but critical\ncircumstances are then revealed.","A common misconception is elaborated and its consequences are\ndescribed a detailed example of one of these consequences is then given.","A general principle is stated and supported by several examples;\nan exception to the rule is then considered and its importance\nevaluated.","A traditional method of analysis is discussed and the reasons for\nits adoption are explained; an alternative is then described and\nclarified by means of an example."],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: a traditional method of analysis is discussed and the reasons for\nits adoption are explained; an alternative is then described and\nclarified by means of an example. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":5,"question":"Which one of the following is most analogous to the method of\nanalysis employed by the investigators mentioned in the second\nparagraph?","options":["A pollster gathers a sample of voter preferences and on the basis\nof this information makes a prediction about the outcome of an election.","A historian examines the surviving documents detailing the history\nof a movement and from these documents reconstructs a chronology of the\nevents that initiated the movement.","A meteorologist measures the rainfall over a certain period of the\nyear and from this data calculates the total annual rainfall for the\nregion.","An engineer analyzes the stability of each structural element of a\nbridge and from these analyses draws a conclusion about the structural\nsoundness of the bridge."],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: an engineer analyzes the stability of each structural element of a\nbridge and from these analyses draws a conclusion about the structural\nsoundness of the bridge. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":6,"question":"In the passage, the author is primarily concerned with","options":["arguing against the abandonment of a traditional approach","describing the evolution of a radical theory","reconciling conflicting points of view","illustrating the superiority of a new theoretical approach"],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: illustrating the superiority of a new theoretical approach. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."}]},"76":{"id":76,"title":"Historians have long accepted the notion that women of English descent who lived in","difficulty":"Moderate","passage":"Historians have long accepted the notion that women of English descent who lived in the English colonies of North America during the seventeenth and eighteenth centuries were better off than either the contemporary women in England or the colonists' own nineteenth-century daughters and granddaughters. The \"golden age \" theory originated in the 1920s with the work of Elizabeth Dexter, who argued that there were relatively few women among the colonists, and that all hands—male and female—were needed to sustain the growing settlements. Rigid sex-role distinctions could not exist under such circumstances; female colonists could accordingly engage in whatever occupations they wished, encountering few legal or social constraints if they sought employment outside the home. The surplus of male colonists also gave women crucial bargaining power in the marriage market since women's contributions were vital to the survival of colonial households.\n\nDexter's portrait of female colonists living under conditions of rough equality with their male counterparts was eventually incorporated into studies of nineteenth-century middle-class women. The contrast between the self-sufficient colonial woman and the oppressed nineteenth-century woman, confined to her home by stultifying ideologies of domesticity and by the fact that industrialization eliminated employment opportunities for middle-class women, gained an extraordinarily tenacious hold on historians. Even scholars who have questioned the \"golden age\" view of colonial women's status have continued to accept the paradigm of a nineteenth-century decline from a more desirable past. For example, Joan Hoff-Wilson asserted that there was no \"golden age\" and yet emphasized that the nineteenth century brought \"increased loss of function and authentic status for\" middle-class women.\n\nRecent publications about colonial women have exposed the concept of a decline in status as simplistic and unsophisticated, a theory that based its assessment of colonial women's status solely on one factor (their economic function in society) and assumed all too readily that a relatively simple social system automatically brought higher standing to colonial women. The new scholarship presents a far more complicated picture, one in which definitions of gender roles, the colonial economy, demographic patterns, religion, the law, and household organization all contributed to defining the circumstances of colonial women's lives. Indeed, the primary concern of modern scholarship is not to generalize about women's status but to identify the specific changes and continuities in women's lives during the colonial period. For example, whereas earlier historians suggested that there was little change for colonial women before 1800, the new scholarship suggests that a three-part chronological division more accurately reflects colonial women's experiences. First was the initial period of English colonization (from the 1620s to about 1660); then a period during which patterns of family and community were challenged and reshaped (roughly from 1660 to 1750); and finally the era of revolution (approximately 1750 to 1815), which brought other changes to women's lives.","questions":[{"id":1,"question":"Which one of the following best expresses the main idea of the\npassage?","options":["An earlier theory about the status of middle-class women in the\nnineteenth century has been supported by recent scholarship.","Recent studies of middle-class nineteenth-century women have\naltered an earlier theory about the status of colonial women.","Recent scholarship has exposed an earlier theory about the status\nof colonial women as too narrowly based and oversimplified.","An earlier theory about colonial women has greatly influenced\nrecent studies on middle-class women in the nineteenth century."],"correct":2,"explanation":"The correct answer is option C. The passage supports this answer: recent scholarship has exposed an earlier theory about the status\nof colonial women as too narrowly based and oversimplified. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"The author discusses Hoff-Wilson primarily in order to","options":["describe how Dexter's theory was refuted by historians of\nnineteenth-century North America","describe how the theory of middle-class women's nineteenth-century\ndecline in status was developed","describe an important influence on recent scholarship about the\ncolonial period","demonstrate the persistent influence of the \"golden age\"\ntheory"],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: demonstrate the persistent influence of the \"golden age\"\ntheory. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":3,"question":"It can be inferred from the passage that the author would be most\nlikely to describe the views of the scholars mentioned in line 32 as","options":["unassailable","innovative","paradoxical","overly sophisticated"],"correct":2,"explanation":"The correct answer is option C. This can be inferred from the passage. The passage provides evidence that supports the conclusion that paradoxical. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":4,"question":"It can be inferred from the passage that in proposing the\n\"three-part chronological division\" (lines 60-61), scholars recognized\nwhich one of the following?","options":["The circumstances of colonial women's lives were defined by a\nbroad variety of social and economic factors.","Women's lives in the English colonies of North America were\nsimilar to women's lives in seventeenth-and eighteenth-century England.","Colonial women's status was adversely affected when patterns of\nfamily and community were established in the late seventeenth century.","Colonial women's status should be assessed primarily on the basis\nof their economic function in society."],"correct":0,"explanation":"The correct answer is option A. This can be inferred from the passage. The passage provides evidence that supports the conclusion that the circumstances of colonial women's lives were defined by a\nbroad variety of social and economic factors. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":5,"question":"According to the author, the publications about colonial women\nmentioned in the third paragraph had which one of the following effects?","options":["They undermined Dexter's argument on the status of women colonists\nduring the colonial period.","They revealed the tenacity of the \"golden age\" theory in American\nhistory.","They provided support for historians, such as Hoff-Wilson. Who\nstudy the nineteenth century.","They established that women's status did not change significantly\nfrom the colonial period to the nineteenth century."],"correct":0,"explanation":"The correct answer is option A. The passage explicitly states or directly supports that they undermined dexter's argument on the status of women colonists\nduring the colonial period. This information is stated in the passage, making it the most accurate answer based on the text."},{"id":6,"question":"Practitioners of the new scholarship discussed in the last\nparagraph would be most likely to agree with which one of the following\nstatements about Dexter's argument?","options":["It makes the assumption that women's status is determined\nprimarily by their political power in society.","It makes the assumption that a less complex social system\nnecessarily confers higher status on women.","It is based on inadequate research on women's economic role in the\ncolonies.","It places too much emphasis on the way definitions of gender roles\naffected women colonists in the colonial period."],"correct":1,"explanation":"The correct answer is option B. The passage supports this answer: it makes the assumption that a less complex social system\nnecessarily confers higher status on women. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."}]},"77":{"id":77,"title":"Musicologists concerned with the \"London Pianoforte school,\" the group of","difficulty":"Moderate","passage":"Musicologists concerned with the \"London Pianoforte school,\" the group of composers, pedagogues, pianists, publishers, and builders who contributed to the development of the piano in London at the turn of the nineteenth century, have long encountered a formidable obstacle in the general unavailability of music of this \"school\" in modern scholarly editions. Indeed, much of this repertory has more or less vanished from our historical consciousness. Granted, the sonatas and Gradus ad Parnassum of Muzio Clementi and the nocturnes of John Field have remained familiar enough (though more often than not in editions lacking scholarly rigor), but the work of other leading representatives, like Johann Baptist Cramer and Jan Ladislav Dussek, has eluded serious attempts at revival.\n\nNicholas Temperley's ambitious new anthology decisively overcomes this deficiency. What underscores the intrinsic value of Temperley's editions is that the anthology reproduces nearly all of the original music in facsimile (an exact copy). Making available this cross section of English musical life—some 800 works by 49 composers—should encourage new critical perspectives about how piano music evolved in England, an issue of considerable relevance to our understanding of how piano music developed on the European continent, and of how, finally, the instrument was transformed from the fortepiano to what we know today as the piano.\n\nTo be sure, the London Pianoforte school itself calls for review (to examine or study again; especially: to reexamine judicially). \"School\" may well be too strong a word for what was arguably a group unified not so much by stylistic principles or aesthetic creed as by the geographical circumstance that they worked at various times in London and produced pianos and piano music for English pianos and English markets. Indeed, Temperley concedes that their \"variety may be so great as to cast doubt on the notion of a 'school.'\"\n\nThe notion of a school was first propounded by Alexander Ringer, who argued that laws of artistic survival forced the young, progressive Beethoven to turn outside Austria for creative models, and that he found inspiration in a group of pianists connected with Clementi in London. Ringer's proposed London Pianoforte school did suggest a circumscribed and fairly unified group—for want of a better term, a school—of musicians whose influence was felt primarily in the decades just before and after 1800. After all, Beethoven did respond to the advances of the Broadwood piano—its reinforced frame, extended compass, triple stringing, and pedals, for example—and it is reasonable to suppose that London pianists who composed music for such an instrument during the critical phase of its development exercised no small degree of influence on Continental musicians. Nevertheless, perhaps the most sensible approach to this issue is to define the school by the period (c. (c.: abbr (circa): c.19961996) 1766-1873) during which it flourished, as Temperley has done in the anthology.","questions":[{"id":1,"question":"Which one of the following most accurately states the author's main\npoint?","options":["Temperley has recently called into question the designation of a\ngroup of composers, pedagogues, pianists, publishers, and builders as\nthe London Pianoforte school.","Temperley's anthology of the music of the London Pianoforte school\ncontributes significantly to an understanding of an influential period\nin the history of music.","The music of the London Pianoforte school has been revived by the\npublication of Temperley's new anthology.","Primary sources for musical manuscripts provide the most reliable\nbasis for musicological research."],"correct":1,"explanation":"The correct answer is option B. The passage supports this answer: temperley's anthology of the music of the london pianoforte school\ncontributes significantly to an understanding of an influential period\nin the history of music. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"It can be inferred that which one of the following is true of the\npiano music of the London Pianoforte school?","options":["The nocturnes of John Field typify the London Pianoforte school\nstyle.","The Gradus ad Parnassum of Muzio Clementi is the best-known work\nof these composers.","No original scores for this music are extant.","In modern times much of the music of this school has been little\nknown even to musicians."],"correct":3,"explanation":"The correct answer is option D. This can be inferred from the passage. The passage provides evidence that supports the conclusion that in modern times much of the music of this school has been little\nknown even to musicians. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":3,"question":"The author mentions the sonatas of Muzio Clementi and the nocturnes\nof John Field as examples of which one of the following?","options":["works by composers of the London Pianoforte school that have been\npreserved in rigorous scholarly editions","works that are no longer remembered by most people","works acclaimed by the leaders of the London Pianoforte school","works by composers of the London Pianoforte school that are\nrelatively well known"],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: works by composers of the london pianoforte school that are\nrelatively well known. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":4,"question":"Which one of the following, if true, would most clearly undermine a\nportion of Ringer's argument as the argument is described in the\npassage?","options":["Musicians in Austria composed innovative music for the Broadwood\npiano as soon as the instrument became available.","Clementi and his followers produced most of their compositions\nbetween 1790 and 1810.","The influence of Continental musicians is apparent in some of the\nworks of Beethoven.","The pianist-composers of the London Pianoforte school shared many\nof the same stylistic principles."],"correct":0,"explanation":"The correct answer is option A. The passage supports this answer: musicians in austria composed innovative music for the broadwood\npiano as soon as the instrument became available. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":5,"question":"It can be inferred that the author uses the word \"advances\" (line\n49) to refer to","options":["enticements offered musicians by instrument manufacturers","improvements in the structure of a particular instrument","innovations in the forms of music produced for a particular\ninstrument","stylistic elaborations made possible by changes in a particular\ninstrument"],"correct":1,"explanation":"The correct answer is option B. This can be inferred from the passage. The passage provides evidence that supports the conclusion that improvements in the structure of a particular instrument. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":6,"question":"It can be inferred from the passage as a whole that the author's\npurpose in the third paragraph is primarily to","options":["cast doubt on the usefulness of Temperley's study of the London\nPianoforte school","introduce a discussion of the coherency of the London Pianoforte\nschool","summarize Ringer's argument about the London Pianoforte school","emphasize the complex nature of the musicological elements shared\nby members of the London Pianoforte school"],"correct":1,"explanation":"The correct answer is option B. This can be inferred from the passage. The passage provides evidence that supports the conclusion that introduce a discussion of the coherency of the london pianoforte\nschool. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."}]},"78":{"id":78,"title":"What is \"law\"? By what processes do judges arrive at opinions, those documents that","difficulty":"Moderate","passage":"What is \"law\"? By what processes do judges arrive at opinions, those documents that justify their belief that the \"law\" dictates a conclusion one way or the other? These are among the oldest questions in jurisprudence, debate about which has traditionally been dominated by representatives of two schools of thought: proponents of natural law, who see law as intertwined with a moral order independent of society's rules and mores, and legal positivists, who see law solely as embodying the commands of a society's ruling authority.\n\nSince the early 1970s, these familiar questions have received some new and surprising answers in the legal academy. This novelty is in part a consequence of the increasing influence there of academic disciplines and intellectual traditions previously unconnected with the study of law. Perhaps the most influential have been the answers given by the Law and Economics school. According to these legal economists, law consists and ought to consist of those rules that maximize a society's material wealth and that abet the efficient operation of markets designed to generate wealth. More controversial have been the various answers provided by members of the Critical Legal Studies movement, according to whom law is one among several cultural mechanisms by which holders of power seek to legitimate their domination. Drawing on related arguments developed in anthropology, sociology, and history, the critical legal scholars contend that law is an expression of power, but not, as held by the positivists, the power of the legitimate sovereign government. Rather, it is an expression of the power of elites who may have no legitimate authority, but who are intent on preserving the privileges of their race, class, or gender.\n\nIn the mid-1970s, James Boyd White began to articulate yet another interdisciplinary response to the traditional questions, and in so doing spawned what is now known as the Law and Literature movement. White has insisted that law, particularly as it is interpreted in judicial opinions, should be understood as an essentially literary activity. Judicial opinions should be read and evaluated not primarily as political acts or as attempts to maximize society's wealth through efficient rules, but rather as artistic performances. And like all such performances, White argues, each judicial opinion attempts in its own way to promote a particular political or ethical value.\n\nIn the recent Justice as Translation, White argues that opinion-writing should be regarded as an act of \"translation,\" and judges (should be regarded) as \"translators.\" As such, judges find themselves mediating between the authoritative legal text and the pressing legal problem that demands resolution. A judge must essentially \"re-constitute\" that text by fashioning a new one, which is faithful to the old text but also responsive to and informed by the conditions, constraints, and aspirations of the world in which the new legal problem has arisen.","questions":[{"id":1,"question":"Which one of the following best states the main idea of the passage?","options":["Within the last few decades, a number of novel approaches to\njurisprudence have defined the nature of the law in diverse ways.","Within the last few decades, changes in society and in the number\nand type of cases brought to court have necessitated new methods of\ninterpreting the law.","Of the many interdisciplinary approaches to jurisprudence that\nhave surfaced in the last tow decades, the Law and Literature movement\nis the most intellectually coherent.","The Law and Literature movement, first articulated by James Boyd\nWhite in the mid-1970s, represents a synthesis of the many theories of\njurisprudence inspired by the social sciences."],"correct":0,"explanation":"The correct answer is option A. The passage supports this answer: within the last few decades, a number of novel approaches to\njurisprudence have defined the nature of the law in diverse ways. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"According to the passage, judicial opinions have been described as\neach of the following EXCEPT:","options":["political statements","arcane statements","economic statements","artistic performances"],"correct":1,"explanation":"The correct answer is option B. The passage explicitly states or directly supports that arcane statements. This information is stated in the passage, making it the most accurate answer based on the text."},{"id":3,"question":"Which one of the following statements is most compatible with the\nprinciples of the Critical Legal Studies movement as that movement is\ndescribed in the passage?","options":["Laws governing the succession of power at the death of a head of\nstate represent a synthesis of legal precedents, specific situations,\nand the values of lawmakers.","Laws allowing income tax deductions for charitable contributions,\nthough ostensibly passed by lawmakers, were devised by and are\nperpetuated by the rich.","Laws governing the tariffs placed on imported goods must favor the\ncontinuation of mutually beneficial trade arrangements, even at the\nexpense of long-standing legal precedent.","Laws governing the treatment of the disadvantaged and powerless\nmembers of a given society are an accurate indication of that society's\nmoral state."],"correct":1,"explanation":"The correct answer is option B. The passage supports this answer: laws allowing income tax deductions for charitable contributions,\nthough ostensibly passed by lawmakers, were devised by and are\nperpetuated by the rich. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":4,"question":"Which one of the following does the passage mention as a similarity\nbetween the Critical Legal Studies movement and the Law and Literature\nmovement?","options":["Both offer explanations of how elites maintain their hold on\npower.","Both are logical extensions of either natural law or legal\npositivism.","Both see economic and political primacy as the basis of all\nlegitimate power.","Both rely on disciplines not traditionally connected with the\nstudy of law."],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: both rely on disciplines not traditionally connected with the\nstudy of law. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":5,"question":"Which one of the following can be inferred from the passage about\nthe academic study of jurisprudence before the 1970s?","options":["It was concerned primarily with codifying and maintaining the\nprivileges of elites.","It rejected theories that interpreted law as an expression of a\ngroup's power.","It seldom focused on how and by what authority judges arrived at\nopinions.","It was not concerned with such disciplines as anthropology and\nsociology."],"correct":3,"explanation":"The correct answer is option D. This can be inferred from the passage. The passage provides evidence that supports the conclusion that it was not concerned with such disciplines as anthropology and\nsociology. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":6,"question":"Proponents of the Law and Literature movement would most likely\nagree with which one of the following statements concerning the\nrelationship between the law and judges' written opinions?","options":["The once-stable relationship between law and opinion-writing has\nbeen undermined by new and radical theoretical developments.","Only the most politically conservative of judges continue to base\ntheir opinions on natural law or on legal positivism.","The occurrence of different legal situations requires a judge to\nadopt diverse theoretical approaches to opinion-writing.","Different judges will not necessarily write the same sorts of\nopinions when confronted with the same legal situation."],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: different judges will not necessarily write the same sorts of\nopinions when confronted with the same legal situation. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."}]},"79":{"id":79,"title":"Since the early 1920s, most petroleum geologists have favored a biogenic theory for","difficulty":"Moderate","passage":"Since the early 1920s, most petroleum geologists have favored a biogenic theory for the formation of oil. According to this theory, organic matter became buried in sediments, and subsequent conditions of temperature and pressure over time transformed it into oil.\n\nSince 1979 an opposing abiogenic theory about the origin of oil has been promulgated. According to this theory, what is now oil began as hydrocarbon compounds within the earth's mantle (the region between the core and the crust) during the formation of the earth. Oil was created when gasses rich in methane, the lightest of the hydrocarbons, rose from the mantle through fractures and faults in the crust, carrying a significant amount of heavier hydrocarbons with them. As the gases encountered intermittent drops in pressure, the heavier hydrocarbons condensed, forming oil, and were deposited in reservoirs throughout the crust. Rock regions deformed by motions of the crustal plates provided the conduits and fractures necessary for the gases to rise through the crust.\n\nOpponents of the abiogenic theory charge that hydrocarbons could not exist in the mantle, because high temperatures would destroy or break them down. Advocates of the theory, however, point out that other types of carbon exist in the mantle: unoxidized carbon must exist there, because diamonds are formed within the mantle before being brought to the surface by eruptive processes. Proponents of the abiogenic theory also point to recent experimental work that suggests that the higher pressures within the mantle tend to offset the higher temperatures, allowing hydrocarbons, like unoxidized carbon, to continue to exist in the mantle.\n\nIf the abiogenic theory is correct, vast undiscovered reservoirs of oil and gas—undiscovered because the biogenic model precludes their existence—may in actuality exist. One company owned by the Swedish government has found the abiogenic theory so persuasive that it has started exploratory drilling for gas or oil in a granite formation called the Siljan Ring—not the best place to look for gas or oil if one believes they are derived from organic compounds, because granite forms from magma (molten rock) and contains no organic sediments. The ring was formed about 360 million years ago when a large meteorite hit the 600-million-year-old granite that forms the base of the continental crust. The impact fractured the granite, and the Swedes believe that if oil comes from the mantle, it could have risen with methane gas through this now permeable rock. Fueling their optimism further is the fact that prior to the start of drilling, methane gas had been detected rising through the granite.","questions":[{"id":1,"question":"Which one of the following statements best expresses the main idea\nof the passage?","options":["Although the new abiogenic theory about the origin of oil is\nderived from the conventional biogenic theory, it suggests new types of\nlocations for oil drilling.","The small number of drilling companies that have responded to the\nnew abiogenic theory about the origin of oil reflects the minimal level\nof acceptance the theory has met with in the scientific community.","Although the new abiogenic theory about the origin of oil fails to\nexplain several enigmas about oil reservoirs, it is superior to the\nconventional biogenic theory.","Although it has yet to receive either support or refutation by\ndata gathered from a drilling project, the new abiogenic theory about\nthe origin of oil offers a plausible alternative to the conventional\nbiogenic theory."],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: although it has yet to receive either support or refutation by\ndata gathered from a drilling project, the new abiogenic theory about\nthe origin of oil offers a plausible alternative to the conventional\nbiogenic theory. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"Which one of the following best describes the function of the third\nparagraph?","options":["It presents a view opposed to a theory and points out an internal\ncontradiction in that opposing view.","It describes a criticism of a theory and provides countervailing\nevidence to the criticism.","It identifies a conflict between two views of a theory and revises\nboth views.","It explains an argument against a theory and shows it to be a\nvalid criticism."],"correct":1,"explanation":"The correct answer is option B. The passage supports this answer: it describes a criticism of a theory and provides countervailing\nevidence to the criticism. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":3,"question":"The passage suggests that the opponents of the abiogenic theory\nmentioned in the third paragraph would most probably agree with which\none of the following statements?","options":["The formation of oil does not involve the condensation of\nhydrocarbons released from the earth's mantle.","Large oil reserves are often found in locations that contain small\namounts of organic matter.","The eruptive processes by which diamonds are brought to the\nearth's surface are similar to those that aid in the formation of oil.","Motions of the crustal plates often create the pressure necessary\nto transform organic matter into oil."],"correct":0,"explanation":"The correct answer is option A. This can be inferred from the passage. The passage provides evidence that supports the conclusion that the formation of oil does not involve the condensation of\nhydrocarbons released from the earth's mantle. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":4,"question":"Which one of the following is most analogous to the situation\ndescribed in the final paragraph?","options":["A new theory about the annual cycles of breeding and migration of\nthe monarch butterfly has led scientists to look for similar patterns in\nother butterfly species.","A new theory about the stage at which a star collapses into a\nblack hole has led astronomers to search for evidence of black holes in\nparts of the universe where they had not previously searched.","A new theory about how the emission of sulfur dioxide during\ncoal-burning can be reduced has led several companies to develop\ndesulfurization systems.","A new theory about photosynthesis has convinced a research team to\nexplore in new ways the various functions of the cell membrane in plant\ncells."],"correct":1,"explanation":"The correct answer is option B. The passage supports this answer: a new theory about the stage at which a star collapses into a\nblack hole has led astronomers to search for evidence of black holes in\nparts of the universe where they had not previously searched. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":5,"question":"According to the passage all of the following are true of the\nSiljan Ring EXCEPT:","options":["It was formed from magma.","It does not contain organic sediments.","Its ring shape existed 500 million years ago.","Methane gas has been detected rising through it."],"correct":2,"explanation":"The correct answer is option C. The passage explicitly states or directly supports that its ring shape existed 500 million years ago. This information is stated in the passage, making it the most accurate answer based on the text."}]},"80":{"id":80,"title":"Most studies of recent Southeast Asian immigrants to the United States have focused","difficulty":"Moderate","passage":"Most studies of recent Southeast Asian immigrants to the United States have focused on their adjustment to life in their adopted country and on the effects of leaving their homelands. James Tollefson's Alien Winds examines the resettlement process from a different perspective by investigating the educational programs offered in immigrant processing centers. Based on interviews, transcripts from classes, essays by immigrants, personal visits to a teacher-training unit, and official government documents, Tollefson relies on an impressive amount and variety of d
