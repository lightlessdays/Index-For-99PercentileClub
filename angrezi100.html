ay marketing does not always benefit the\ninterests of unauthorized distributors"],"correct":1,"explanation":"The correct answer is option B. The passage supports this answer: indicate a way in which manufacturers sustain damage against which\nthey ought to be protected. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":6,"question":"The author's attitude toward the possibility that the courts will\ncome to exercise consistent control over gray marketing practices can\nbest be characterized as one of","options":["resigned tolerance","utter dismay","reasoned optimism","unbridled fervor"],"correct":2,"explanation":"The correct answer is option C. The author's tone throughout the passage is best characterised as reflected in this answer. The language and rhetorical choices in the passage support this reading."}]},"35":{"id":35,"title":"Any study of autobiographical narratives that appeared under the ostensible","difficulty":"Moderate","passage":"Any study of autobiographical narratives that appeared under the ostensible authorship of African American writers between 1760 and 1865 inevitably raises concerns about authenticity and interpretation. Should an autobiography whose written composition was literally out of the hands of its narrator be considered as the literary equivalent of those autobiographies that were authored independently by their subjects?\n\nIn many cases, the so-called edited narrative of an ex-slave ought to be treated as a ghostwritten account insofar as literary analysis is concerned, especially when it was composed by its editor from \"a statement of facts\" provided by an African American subject. Blassingame has taken pains to show that the editors of several of the more famous antebellum slave narratives were \"noted for their integrity\" and thus were unlikely to distort the facts given them by slave narrators. From a literary standpoint, however, it is not the moral integrity of these editors that is at issue (at issue 1: in a state of controversy: in disagreement 2 also in issue: under discussion or in dispute) but the linguistic, structural, and tonal integrity of the narratives they produces. Even if an editor faithfully reproduced the facts of a narrator's life, it was still the editor who decided what to make of these facts, how they should be emphasized, in what order they ought to be presented, and what was extraneous or germane. Readers of African American autobiography then and now have too readily accepted the presumption of these eighteenth- and nineteenth-century editors that experiential facts recounted orally could be recorded and sorted by an amanuensis-editor, taken out of their original contexts, and then published with editorial prefaces, footnotes, and appended commentary, all without compromising the validity of the narrative as a product of an African American consciousness.\n\nTranscribed narratives in which an editor explicitly delimits his or her role undoubtedly may be regarded as more authentic and reflective of the narrator's thought in action than those edited works that flesh (to clothe or cover with or as if with flesh; broadly: to give substance to usually used with out) out a statement of facts in ways unaccounted for. Still, it would be naïve to accord dictated oral narratives the same status as autobiographies composed and written by the subjects of the stories themselves. This point is illustrated by an analysis of Works Progress Administration interviews with ex-slaves in the 1930s that suggests that narrators often told interviewers what they seemed to want to hear. If it seemed impolitic for former slaves to tell all they knew and thought about the past to interviewers in the 1930s, the same could be said of escaped slaves on the run in the antebellum era. Dictated narratives, therefore, are literary texts whose authenticity is difficult to determine. Analysts should reserve close analytic readings for independently authored texts. Discussion of collaborative texts should take into account the conditions that governed their production.","questions":[{"id":1,"question":"Which one of the following best summarizes the main point of the\npassage?","options":["The personal integrity of an autobiography's editor has little\nrelevance to its value as a literary work.","Autobiographies dictated to editors are less valuable as\nliterature than are autobiographies authored by their subjects.","The facts that are recorded in an autobiography are less important\nthan the personal impressions of its author.","The circumstances under which an autobiography was written should\naffect the way it is interpreted as literature."],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: the circumstances under which an autobiography was written should\naffect the way it is interpreted as literature. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"The information in the passage suggests that the role of the\n\"editor\" (lines 23-24) is most like that of","options":["an artist who wishes to invent a unique method of conveying the\nemotional impact of a scene in a painting","a worker who must interpret the instructions of an employer","a critic who must provide evidence to support opinions about a\nplay being reviewed","a historian who must decide how to direct the reenactment of a\nhistorical event"],"correct":3,"explanation":"The correct answer is option D. This can be inferred from the passage. The passage provides evidence that supports the conclusion that a historian who must decide how to direct the reenactment of a\nhistorical event. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":3,"question":"Which one of the following best describes the author's opinion\nabout applying literary analysis to edited autobiographies?","options":["The author is adamantly opposed to the application of literary\nanalysis to edited autobiographies.","The author is skeptical of the value of close analytical reading\nin the case of edited autobiographies.","The author believes that literary analysis of the prefaces,\nfootnotes, and commentaries that accompany edited autobiographies would\nbe more useful than an analysis of the text of the autobiographies.","The author believes that an exclusively literary analysis of\nedited autobiographies is more valuable than a reading that emphasizes\ntheir historical import."],"correct":1,"explanation":"The correct answer is option B. The passage supports this answer: the author is skeptical of the value of close analytical reading\nin the case of edited autobiographies. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":4,"question":"The passage supports which one of the following statements about\nthe readers of autobiographies of African Americans that were published\nbetween 1760 and 1865?","options":["They were more concerned with the personal details in the\nautobiographies than with their historical significance.","They were unable to distinguish between ghostwritten and edited\nautobiographies.","They were less naïve about the facts of slave life than are\nreaders today.","They presumed that the editing of the autobiographies did not\naffect their authenticity."],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: they presumed that the editing of the autobiographies did not\naffect their authenticity. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":5,"question":"When one of the following words, as it is used in the passage, best\nserves to underscore the author's concerns about the authenticity of the\nautobiographies discussed?","options":["\"ostensible\" (line 2)","\"integrity\" (line 18)","\"extraneous\" (line 27)","\"delimits\" (line 39)"],"correct":0,"explanation":"The correct answer is option A. The passage supports this answer: \"ostensible\" (line 2). This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":6,"question":"According to the passage, close analytic reading of an\nautobiography is appropriate only when the","options":["autobiography has been dictated to an experienced\namanuensis-editor","autobiography attempts to reflect the narrator's thought in action","autobiography was authored independently by its subject","moral integrity of the autobiography's editor is well\nestablished"],"correct":2,"explanation":"The correct answer is option C. The passage explicitly states or directly supports that autobiography was authored independently by its subject. This information is stated in the passage, making it the most accurate answer based on the text."}]},"36":{"id":36,"title":"A conventional view of nineteenth-century Britain holds that iron manufacturers and","difficulty":"Moderate","passage":"A conventional view of nineteenth-century Britain holds that iron manufacturers and textile manufacturers from the north of England became the wealthiest and most powerful people in society after about 1832. According to Marxist historians, these industrialists were the target of the working class in its struggle for power. A new study by Rubinstein, however, suggests that the real wealth lay with the bankers and merchants of London. Rubinstein does not deny that a northern industrial elite existed but argues that it was consistently outnumbered and outdone by a London-based commercial elite. His claims are provocative and deserve consideration.\n\nRubinstein's claim about the location of wealth comes from his investigation of probate records. These indicate the value of personal property, excluding real property (buildings and land), left by individuals at death. It does seem as if large fortunes were more frequently made in commerce than in industry and, within industry, more frequently from alcohol or tobacco than from textiles or metal. However, such records do not unequivocally make Rubinstein's case. Uncertainties abound about how the probate rules for valuing assets were actually applied. Mills and factories, being real property, were clearly excluded: machinery may also have been, for the same reason. What the valuation conventions were for stock-in-trade (goods for sale) is also uncertain. It is possible that their probate values were much lower than their actual market value: cash or near-cash, such as bank balances or stocks, were, on the other hand, invariably considered at full face value. A further complication is that probate valuations probably took no notice of a business's goodwill (favor with the public) which, since it represents expectations about future profit-making, would today very often be a large fraction of market value. Whether factors like these introduced systematic biases into the probate valuations of individuals with different types of businesses would be worth investigating.\n\nThe orthodox view that the wealthiest individuals were the most powerful is also questioned by Rubinstein's study. The problem for this orthodox view is that Rubinstein finds many millionaires who are totally unknown to nineteenth-century historians: the reason for their obscurity could be that they were not powerful. Indeed, Rubinstein dismisses any notion that great wealth had anything to do with entry into the governing elite, as represented by bishops, higher civil servants, and chairmen of manufacturing companies. The only requirements were university attendance and a father with a middle-class income.\n\nRubinstein, in another study, has begun to buttress his findings about the location of wealth by analyzing income tax returns, which reveal a geographical distribution of middle-class incomes similar to that of wealthy incomes revealed by probate records. But until further confirmatory investigation is done, his claims can only be considered partially convincing.","questions":[{"id":1,"question":"The main idea of the passage is that","options":["the Marxist interpretation of the relationship between class and\npower in nineteenth-century Britain is no longer viable","a simple equation between wealth and power is unlikely to be\nsupported by new data from nineteenth-century British archives","a recent historical investigation has challenged but not disproved\nthe orthodox view of the distribution of wealth and the relationship of\nwealth to power in nineteenth-century Britain","probate records provide the historian with a revealing but\nincomplete glimpse of the extent and location of wealth in\nnineteenth-century Britain"],"correct":2,"explanation":"The correct answer is option C. The passage supports this answer: a recent historical investigation has challenged but not disproved\nthe orthodox view of the distribution of wealth and the relationship of\nwealth to power in nineteenth-century britain. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"The author of the passage implies that probate records as a source\nof information about wealth in nineteenth-century Britain are","options":["self-contradictory and misleading","ambiguous and outdated","controversial but readily available","revealing but difficult to interpret"],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: revealing but difficult to interpret. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":3,"question":"The author suggests that the total probate valuations of the\npersonal property of individuals holding goods for sale in\nnineteenth-century Britain may have been","options":["affected by the valuation conventions for such goods","less accurate than the valuations for such goods provided by\nincome tax returns","less, on average, if such goods were tobacco-related than if they\nwere alcohol-related","greater, on average, than the total probate valuations of those\nindividuals who held bank balances"],"correct":0,"explanation":"The correct answer is option A. This can be inferred from the passage. The passage provides evidence that supports the conclusion that affected by the valuation conventions for such goods. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":4,"question":"According to the passage, Rubinstein has provided evidence that\nchallenges which one of the following claims about nineteenth-century\nBritain?","options":["The distribution of great wealth between commerce and industry was\nnot equal.","Large incomes were typically made in alcohol and tobacco rather\nthan in textiles and metal.","A London-based commercial elite can be identified.","There was a necessary relationship between great wealth and power."],"correct":3,"explanation":"The correct answer is option D. The passage explicitly states or directly supports that there was a necessary relationship between great wealth and power. This information is stated in the passage, making it the most accurate answer based on the text."},{"id":5,"question":"The author mentions that goodwill was probably excluded from the\nprobate valuation of a business in nineteenth-century Britain most\nlikely in order to","options":["give an example of a business asset about which little was known\nin the nineteenth century","suggest that the probate valuations of certain businesses may have\nbeen significant underestimations of their true market value","make the point that this exclusion probably had an equal impact on\nthe probate valuations of all nineteenth-century British businesses","indicate that expectations about future profit-making is the\nsingle most important factor in determining the market value of certain\nbusinesses"],"correct":1,"explanation":"The correct answer is option B. The passage supports this answer: suggest that the probate valuations of certain businesses may have\nbeen significant underestimations of their true market value. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":6,"question":"Which one of the following studies would provide support for\nRubinstein's claims?","options":["a study that indicated that many members of the commercial elite\nin nineteenth-century London had insignificant holdings of real property","a study that indicated that in the nineteenth century,\nindustrialists from the north of England were in fact a target for\nworking-class people","a study that indicated that, in nineteenth-century Britain,\nprobate values of goods for sale were not as high as probate values of\ncash assets","a study that indicated that the wealth of nineteenth-century\nBritish industrialists did not appear to be significantly greater when\nthe full value of their real property holdings was actually\nconsidered"],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: a study that indicated that the wealth of nineteenth-century\nbritish industrialists did not appear to be significantly greater when\nthe full value of their real property holdings was actually\nconsidered. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."}]},"37":{"id":37,"title":"Many argue that recent developments in electronic technology such as computers and","difficulty":"Moderate","passage":"Many argue that recent developments in electronic technology such as computers and videotape have enabled artists to vary their forms of expression. For example, video art can now achieve images whose effect is produced by \"digitalization\": breaking up the picture using computerized information processing. Such new technologies create new ways of seeing and hearing by adding different dimensions to older forms, rather than replacing those forms. Consider Locale, a film about a modern dance company. The camera operator wore a SteadicamTM, an uncomplicated device that allows a camera to be mounted on a person so that the camera remains steady no matter how the operator moves. The SteadicamTM captures the dance in ways impossible with traditional mounts. Such new equipment also allows for the preservation of previously unrecordable aspects of performances, thus enriching archives.\n\nBy Contrast, others claim that technology subverts the artistic enterprise: that artistic efforts achieved with machines preempt human creativity, rather than being inspired by it. The originality of musical performance, for example, might suffer, as musicians would be deprived of the opportunity to spontaneously change pieces of music before live audiences. Some even worry that technology will eliminate live performance altogether; performances will be recorded for home viewing, abolishing the relationship between performer and audience. But these negative views assume both that technology poses an unprecedented challenge to the arts and that we are not committed enough to the artistic enterprise to preserve the live performance, assumptions that seem unnecessarily cynical. In fact, technology has traditionally assisted our capacity for creative expression and can refine our notions of any give art form.\n\nFor example, the portable camera and the snapshot were developed at the same time as the rise of impressionist painting in the nineteenth century. These photographic technologies encouraged a new appreciation. In addition, impressionist artists like Degas studied the elements of light and movement captured by instantaneous photography and used their new understanding of the way our perceptions distort reality to try to more accurately capture realty in their work. Since photos can capture the \"moments\" of a movement, such as a hand partially raised in a gesture of greeting, Impressionist artists were inspired to paint such moments in order to more effectively convey the quality of spontaneous human action. Photography freed artists from the preconception that a subject should be painted in a static, artificial entirety, and inspired them to capture the random and fragmentary qualities of our world. Finally, since photography preempted painting as the means of obtaining portraits, painters had more freedom to vary their subject matter, thus giving rise to the abstract creations characteristic of modern art.","questions":[{"id":1,"question":"Which one of the following statements best expresses the main idea\nof the passage?","options":["The progress of art relies primarily on technology.","Technological innovation can be beneficial to art.","There are risks associated with using technology to create art.","Technology will transform the way the public responds to art."],"correct":1,"explanation":"The correct answer is option B. The passage supports this answer: technological innovation can be beneficial to art. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"It can be inferred from the passage that the author shares which one\nof the following opinions with the opponents of the use of new\ntechnology in art?","options":["The live performance is an important aspect of the artistic\nenterprise.","The public's commitment to the artistic enterprise is\nquestionable.","Recent technological innovations present an entirely new sort of\nchallenge to art.","Technological innovations of the past have been very useful to\nartists."],"correct":0,"explanation":"The correct answer is option A. This can be inferred from the passage. The passage provides evidence that supports the conclusion that the live performance is an important aspect of the artistic\nenterprise. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":3,"question":"Which one of the following, if true, would most undermine the\nposition held by opponents of the use of new technology in art\nconcerning the effect of technology on live performance?","options":["Surveys show that when recordings of performances are made\navailable for home viewing, the public becomes far more knowledgeable\nabout different performing artists.","Surveys show that some people feel comfortable responding\nspontaneously to artistic performances when they are viewing recordings\nof those performances at home.","After a live performance, sales of recordings for home viewing of\nthe particular performing artist generally increase.","The distribution of recordings of artists' performances has begun\nto attract many new audience members to their live performances."],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: the distribution of recordings of artists' performances has begun\nto attract many new audience members to their live performances. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":4,"question":"The author uses the example of the SteadicamTM primarily in order to\nsuggest that","options":["the filming of performances should not be limited by inadequate\nequipment","new technologies do not need to be very complex in order to\nbenefit art","the interaction of a traditional art form with a new technology\nwill change attitudes toward technology in general","new technology does not so much preempt as enhance a traditional\nart form"],"correct":3,"explanation":"The correct answer is option D. This can be inferred from the passage. The passage provides evidence that supports the conclusion that new technology does not so much preempt as enhance a traditional\nart form. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":5,"question":"According to the passage, proponents of the use of new electronic\ntechnology in the arts claim that which one of the following is true?","options":["Most people who reject the use of electronic technology in art\nforget that machines require a person to operate them.","Electronic technology allows for the expansion of archives because\nlonger performances can be recorded.","Electronic technology assists artists in finding new ways to\npresent their material.","Electronic technology makes the practice of any art form more\nefficient by speeding up the creative process."],"correct":2,"explanation":"The correct answer is option C. The passage explicitly states or directly supports that electronic technology assists artists in finding new ways to\npresent their material. This information is stated in the passage, making it the most accurate answer based on the text."},{"id":6,"question":"It can be inferred from the passage that the author would agree with\nwhich one of the following statements regarding changes in painting\nsince the nineteenth century?","options":["The artistic experiments of the nineteenth century led painters to\nuse a variety of methods in creating portraits, which they then applied\nto other subject matter.","The nineteenth-century knowledge of light and movement provided by\nphotography inspired the abstract works characteristic of modern art.","Once painters no longer felt that they had to paint conventional\nportraits, they turned exclusively to abstract portraiture.","Once painters painted fewer conventional portraits, they had\ngreater opportunity to move beyond the literal depiction of objects.\n\nDuring the 1940s and 1950s the United States government developed a new\npolicy toward Native Americans, often known as \"readjustment.\" Because\nthe increased awareness of civil rights in these decades helped\nreinforce the belief that life on reservations prevented Native\nAmericans from exercising the rights guaranteed to citizens under the\nUnited States Constitution, the readjustment movement advocated the end\nof the federal government's involvement in Native American affairs and\nencouraged the assimilation of Native Americans as individuals into\nmainstream society. However, the same years also saw the emergence of a\nNative American leadership and efforts to develop tribal instructions\nand reaffirm tribal identity. The clash of these two trends may be\ntraced in the attempts on the part of the Bureau of Indian Affairs (BIA)\nto convince the Oneida tribe of Wisconsin to accept readjustment.\n\nThe culmination of BIA efforts to sway the Oneida occurred at a meeting\nthat took place in the fall of 1956. The BIA suggested that it would be\nto the Oneida's benefit to own their own property and, like other\nhomeowners, pay real estate taxes on it. The BIA also emphasized that,\nafter readjustment, the government would not attempt to restrict Native\nAmericans' ability to sell their individually owned lands. The Oneida\nwere then offered a one-time lump-sum payment of $60,000 in lieu of (in\nlieu of: , ) the $0.52 annuity guaranteed in perpetuity to each\nmember of the tribe under the Canandaigua Treaty.\n\nThe efforts of the BIA to \"sell\" readjustment to the tribe failed\nbecause the Oneida realized that they had heard similar offers before.\nThe Oneida delegates reacted negatively to the BIA's first suggestion\nbecause taxation of Native American lands had been one past vehicle for\ndispossessing the Oneida: after the distribution of some tribal lands to\nindividual Native Americans in the late nineteenth century, Native\nAmerican lands became subject to taxation, resulting in new and\nimpossible financial burdens, foreclosures, and subsequent tax sales of\nproperty. The Oneida delegates were equally suspicious of the BIA's\nemphasis on the rights of individual landowners, since in the late\nnineteenth century many individual Native Americans had been convinced\nby unscrupulous speculators to sell their lands. Finally, the offer of a\nlump-sum payment was unanimously opposed by the Oneida delegates, who\nsaw that changing the terms of a treaty might jeopardize the many\npending land claims based upon the treaty.\n\nAs a result of the 1956 meeting, the Oneida rejected readjustment.\nInstead, they determined to improve tribal life by lobbying for federal\nmonies for postsecondary education, for the improvement of drainage on\ntribal lands, and for the building of a convalescent home for tribal\nmembers. Thus, by learning the lessons of history, the Oneida were able\nto survive as a tribe in their homeland."],"correct":3,"explanation":"The correct answer is option D. This can be inferred from the passage. The passage provides evidence that supports the conclusion that once painters painted fewer conventional portraits, they had\ngreater opportunity to move beyond the literal depiction of objects.\n\nduring the 1940s and 1950s the united states government developed a new\npolicy toward native americans, often known as \"readjustment.\" because\nthe increased awareness of civil rights in these decades helped\nreinforce the belief that life on reservations prevented native\namericans from exercising the rights guaranteed to citizens under the\nunited states constitution, the readjustment movement advocated the end\nof the federal government's involvement in native american affairs and\nencouraged the assimilation of native americans as individuals into\nmainstream society. however, the same years also saw the emergence of a\nnative american leadership and efforts to develop tribal instructions\nand reaffirm tribal identity. the clash of these two trends may be\ntraced in the attempts on the part of the bureau of indian affairs (bia)\nto convince the oneida tribe of wisconsin to accept readjustment.\n\nthe culmination of bia efforts to sway the oneida occurred at a meeting\nthat took place in the fall of 1956. the bia suggested that it would be\nto the oneida's benefit to own their own property and, like other\nhomeowners, pay real estate taxes on it. the bia also emphasized that,\nafter readjustment, the government would not attempt to restrict native\namericans' ability to sell their individually owned lands. the oneida\nwere then offered a one-time lump-sum payment of $60,000 in lieu of (in\nlieu of: , ) the $0.52 annuity guaranteed in perpetuity to each\nmember of the tribe under the canandaigua treaty.\n\nthe efforts of the bia to \"sell\" readjustment to the tribe failed\nbecause the oneida realized that they had heard similar offers before.\nthe oneida delegates reacted negatively to the bia's first suggestion\nbecause taxation of native american lands had been one past vehicle for\ndispossessing the oneida: after the distribution of some tribal lands to\nindividual native americans in the late nineteenth century, native\namerican lands became subject to taxation, resulting in new and\nimpossible financial burdens, foreclosures, and subsequent tax sales of\nproperty. the oneida delegates were equally suspicious of the bia's\nemphasis on the rights of individual landowners, since in the late\nnineteenth century many individual native americans had been convinced\nby unscrupulous speculators to sell their lands. finally, the offer of a\nlump-sum payment was unanimously opposed by the oneida delegates, who\nsaw that changing the terms of a treaty might jeopardize the many\npending land claims based upon the treaty.\n\nas a result of the 1956 meeting, the oneida rejected readjustment.\ninstead, they determined to improve tribal life by lobbying for federal\nmonies for postsecondary education, for the improvement of drainage on\ntribal lands, and for the building of a convalescent home for tribal\nmembers. thus, by learning the lessons of history, the oneida were able\nto survive as a tribe in their homeland. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."}]},"38":{"id":38,"title":"During the 1940s and 1950s the United States government developed a new policy","difficulty":"Moderate","passage":"During the 1940s and 1950s the United States government developed a new policy toward Native Americans, often known as \"readjustment.\" Because the increased awareness of civil rights in these decades helped reinforce the belief that life on reservations prevented Native Americans from exercising the rights guaranteed to citizens under the United States Constitution, the readjustment movement advocated the end of the federal government's involvement in Native American affairs and encouraged the assimilation of Native Americans as individuals into mainstream society. However, the same years also saw the emergence of a Native American leadership and efforts to develop tribal instructions and reaffirm tribal identity. The clash of these two trends may be traced in the attempts on the part of the Bureau of Indian Affairs (BIA) to convince the Oneida tribe of Wisconsin to accept readjustment.\n\nThe culmination of BIA efforts to sway the Oneida occurred at a meeting that took place in the fall of 1956. The BIA suggested that it would be to the Oneida's benefit to own their own property and, like other homeowners, pay real estate taxes on it. The BIA also emphasized that, after readjustment, the government would not attempt to restrict Native Americans' ability to sell their individually owned lands. The Oneida were then offered a one-time lump-sum payment of $60,000 in lieu of the $0.52 annuity guaranteed in perpetuity to each member of the tribe under the Canandaigua Treaty.\n\nThe efforts of the BIA to \"sell\" readjustment to the tribe failed because the Oneida realized that they had heard similar offers before. The Oneida delegates reacted negatively to the BIA's first suggestion because taxation of Native American lands had been one past vehicle for dispossessing the Oneida: after the distribution of some tribal lands to individual Native Americans in the late nineteenth century, Native American lands became subject to taxation, resulting in new and impossible financial burdens, foreclosures, and subsequent tax sales of property. The Oneida delegates were equally suspicious of the BIA's emphasis on the rights of individual landowners, since in the late nineteenth century many individual Native Americans had been convinced by unscrupulous speculators to sell their lands. Finally, the offer of a lump-sum payment was unanimously opposed by the Oneida delegates, who saw that changing the terms of a treaty might jeopardize the many pending land claims based upon the treaty.\n\nAs a result of the 1956 meeting, the Oneida rejected readjustment. Instead, they determined to improve tribal life by lobbying for federal monies for postsecondary education, for the improvement of drainage on tribal lands, and for the building of a convalescent home for tribal members. Thus, by learning the lessons of history, the Oneida were able to survive as a tribe in their homeland.","questions":[{"id":1,"question":"Which one of the following would be most consistent with the policy\nof readjustment described in the passage?","options":["the establishment among Native Americans of a tribal system of a\nelected government","the creation of a national project to preserve Native American\nlanguage and oral history","the establishment of programs to encourage Native Americans to\nmove from reservations to urban areas","the development of a large-scale effort to restore Native American\nlands to their original tribes"],"correct":2,"explanation":"The correct answer is option C. The passage supports this answer: the establishment of programs to encourage native americans to\nmove from reservations to urban areas. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"According to the passage, after the 1956 meeting the Oneida resolved\nto","options":["obtain improved social services and living conditions for members\nof the tribe","pursue litigation designed to reclaim tribal lands","secure recognition of their unique status as a self-governing\nNative American nation within the United States","establish new kinds of tribal institutions"],"correct":0,"explanation":"The correct answer is option A. The passage explicitly states or directly supports that obtain improved social services and living conditions for members\nof the tribe. This information is stated in the passage, making it the most accurate answer based on the text."},{"id":3,"question":"Which one of the following best describes the function of the first\nparagraph in the context of the passage as a whole?","options":["It summarizes the basis of a conflict underlying negotiations\ndescribed elsewhere in the passage.","It presents two positions, one of which is defended by evidence\nprovided in succeeding paragraphs.","It compares competing interpretations of a historical conflict.","It analyzes the causes of a specific historical event and predicts\na future development."],"correct":0,"explanation":"The correct answer is option A. The passage supports this answer: it summarizes the basis of a conflict underlying negotiations\ndescribed elsewhere in the passage. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":4,"question":"The author refers to the increased awareness of civil rights during\nthe 1940s and 1950s most probably in order to","options":["contrast the readjustment movement with other social phenomena","account for the stance of the Native American leadership","help explain the impetus for the readjustment movement","explain the motives of BIA bureaucrats"],"correct":2,"explanation":"The correct answer is option C. The passage supports this answer: help explain the impetus for the readjustment movement. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":5,"question":"The passage suggests that advocates of readjustment would most\nlikely agree with which one of the following statements regarding the\nrelationship between the federal government and Native Americans?","options":["The federal government should work with individual Native\nAmericans to improve life on reservations.","The federal government should be no more involved in the affaires\nof Native Americans than in the affairs of other citizens.","The federal government should assume more responsibility for\nproviding social services to Native Americans.","The federal government should share its responsibility for\nmaintaining Native American territories with tribal leaders."],"correct":1,"explanation":"The correct answer is option B. This can be inferred from the passage. The passage provides evidence that supports the conclusion that the federal government should be no more involved in the affaires\nof native americans than in the affairs of other citizens. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":6,"question":"The passage suggests that the Oneida delegates viewed the\nCanandaigua Treaty as","options":["a valuable safeguard of certain Oneida rights and privileges","the source of many past problems for the Oneida tribe","a model for the type of agreement they hoped to reach with the\nfederal government","an important step toward recognition of their status as an\nindependent Native American nation"],"correct":0,"explanation":"The correct answer is option A. This can be inferred from the passage. The passage provides evidence that supports the conclusion that a valuable safeguard of certain oneida rights and privileges. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."}]},"39":{"id":39,"title":"Direct observation of contemporary societies at the threshold of widespread","difficulty":"Moderate","passage":"Direct observation of contemporary societies at the threshold of widespread literacy has not assisted our understanding of how such literacy altered ancient Greek society, in particular its political culture. The discovery of what Goody has called the \"enabling effects\" of literacy in contemporary societies tends to seduce the observer into confusing often rudimentary knowledge of how to read with popular access to important books and documents: this confusion is then projected onto ancient societies. \"In ancient Greece,\" Goody writes, \"alphabetic reading and writing was important for the development of political democracy.\"\n\nAn examination of the ancient Greek city Athens exemplifies how this sort of confusion is detrimental to understanding ancient politics. In Athens, the early development of a written law code was retrospectively mythologized as the critical factor in breaking the power monopoly of the old aristocracy: hence the Greek tradition of the \"law-giver,\" which has captured the imaginations of scholars like Goody. But the application and efficacy of all law codes depend on their interpretation by magistrates and courts, and unless the right of interpretation is \"democratized,\" the mere existence of written laws changes little.\n\nIn fact, never in antiquity did any but the elite consult documents and books. Even in Greek courts the juries heard only the relevant statutes read out during the proceedings, as they heard verbal testimony, and they then rendered their verdict on the spot, without the benefit of any discussion among themselves. True, in Athens the juries were representative of a broad spectrum of the population, and these juries, drawn from diverse social classes, both interpreted what they had heard and determined matters of fact. However, they guided solely by the speeches prepared for the parties by professional pleaders and by the quotations of laws or decrees within the speeches, rather than by their own access to any kind of document or book.\n\nGranted, people today also rely heavily on a truly knowledgeable minority for information and its interpretation, often transmitted orally. Yet this is still fundamentally different from an ancient society in which there was no \"popular literature,\" i.e., no newspapers, magazines, or other media that dealt with sociopolitical issues. An ancient law code would have been analogous to the Latin Bible, a venerated document but a closed book. The resistance of the medieval Church to vernacular translations of the Bible, in the West at least, is therefore a pointer to the realities of ancient literacy. When fundamental documents are accessible for study only to an elite, the rest of the society is subject to the elite's interpretation of the rules of behavior, including right political behavior. Athens, insofar as it functioned as a democracy, did so not because of widespread literacy, but because the elite had chosen to accept democratic institutions.","questions":[{"id":1,"question":"Which one of the following statements best expresses the main idea\nof the passage?","options":["Democratic political institutions grow organically from the\ntraditions and conventions of a society.","Democratic political institutions are not necessarily the outcome\nof literacy in a society.","Religious authority, like political authority, can determine who\nin a given society will have access to important books and documents.","Those who are best educated are most often those who control the\ninstitutions of authority in a society."],"correct":1,"explanation":"The correct answer is option B. The passage supports this answer: democratic political institutions are not necessarily the outcome\nof literacy in a society. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"It can be inferred from the passage that the author assumes which\none of the following about societies in which the people possess a\nrudimentary reading ability?","options":["They are more politically advanced than societies without\nrudimentary reading ability.","They are unlikely to exhibit the positive effects of literacy.","They are rapidly evolving toward widespread literacy.","Many of their people might not have access to important documents\nand books."],"correct":3,"explanation":"The correct answer is option D. This can be inferred from the passage. The passage provides evidence that supports the conclusion that many of their people might not have access to important documents\nand books. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":3,"question":"The author refers to the truly knowledgeable minority in\ncontemporary societies in the context of the fourth paragraph in order\nto imply which one of the following?","options":["Because they have a popular literature that closes the gap between\nthe elite and the majority, contemporary societies rely far less on the\nknowledge of experts than did ancient societies.","Contemporary societies rely on the knowledge of experts, as did\nancient societies, because contemporary popular literature so frequently\nconveys specious information.","Although contemporary societies rely heavily on the knowledge of\nexperts, access to popular literature makes contemporary societies less\ndependent on experts for information about rules of behavior than were\nancient societies.","While only some members of the elite can become experts, popular\nliterature gives the majority in contemporary society an opportunity to\nbecome members of such an elite."],"correct":2,"explanation":"The correct answer is option C. The passage supports this answer: although contemporary societies rely heavily on the knowledge of\nexperts, access to popular literature makes contemporary societies less\ndependent on experts for information about rules of behavior than were\nancient societies. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":4,"question":"According to the passage, each of the following statements\nconcerning ancient Greek juries is true EXCEPT:","options":["They were somewhat democratic insofar as they were composed\nlargely of people from the lowest social classes.","They were exposed to the law only insofar as they heard relevant\nstatutes read out during legal proceedings.","They ascertained the facts of a case and interpreted the laws.","They did not have direct access to important books and documents\nthat were available to the elite."],"correct":0,"explanation":"The correct answer is option A. The passage explicitly states or directly supports that they were somewhat democratic insofar as they were composed\nlargely of people from the lowest social classes. This information is stated in the passage, making it the most accurate answer based on the text."},{"id":5,"question":"The author characterizes the Greek tradition of the \"law-giver\"\n(line 21) as an effect mythologizing most probably in order to","options":["illustrate the ancient Greek tendency to memorialize historical\nevents by transforming them into myths","convey the historical importance of the development of the early\nAthenian written law code","convey the high regard in which the Athenians held their legal\ntradition","suggest that the development of a written law code was not\nprimarily responsible for diminishing the power of the Athenian\naristocracy"],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: suggest that the development of a written law code was not\nprimarily responsible for diminishing the power of the athenian\naristocracy. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":6,"question":"The author draws an analogy between the Latin Bible and an early\nlaw code (lines 49-51) in order to make which one of the following\npoints?","options":["Documents were considered authoritative in premodern society in\nproportion to their inaccessibility to the majority.","Documents that were perceived as highly influential in premodern\nsocieties were not necessarily accessible to the society's majority.","What is most revered in a nondemocratic society is what is most\nfrequently misunderstood.","Political documents in premodern societies exerted a social\ninfluence similar to that exerted by religious documents."],"correct":1,"explanation":"The correct answer is option B. The passage supports this answer: documents that were perceived as highly influential in premodern\nsocieties were not necessarily accessible to the society's majority. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."}]},"40":{"id":40,"title":"The English who in the seventeenth and eighteenth centuries inhabited those","difficulty":"Moderate","passage":"The English who in the seventeenth and eighteenth centuries inhabited those colonies that would later become the United States shared a common political vocabulary with the English in England. Steeped as they were in the English political language, these colonials failed to observe that their experience in America had given the words a significance quite different from that accepted by the English with whom they debated; in fact, they claimed that they were more loyal to the English political tradition than were the English in England.\n\nIn many respects the political institutions of England were reproduced in these American colonies. By the middle of eighteenth century, all of these colonies except four were headed by Royal Governors appointed by the King and perceived as bearing a relation to the people of the colony similar to that of the King to the English people. Moreover, each of these colonies enjoyed a representative assembly, which was consciously modeled, in powers and practices, after the English Parliament. In both England and these colonies, only property holders could vote.\n\nNevertheless, though English and colonial institutions were structurally similar, attitudes toward those institutions differed. For example, English legal development from the early seventeenth century had been moving steadily toward the absolute power of Parliament. The most unmistakable sign of this tendency was the legal assertion that the King was subject to the law. Together with this resolute denial of the absolute right of kings went the assertion that Parliament was unlimited in its power: it could change even the Constitution by its ordinary acts of legislation. By the eighteenth century the English had accepted the idea that the parliamentary representatives of the people were omnipotent.\n\nThe citizens of these colonies did not look upon the English Parliament with such fond eyes, nor did they concede that their own assemblies possessed such wide powers. There were good historical reasons for this. To the English the word \"constitution\" meant the whole body of law and legal custom formulated since the beginning of the kingdom, whereas to these colonials a constitution was a specific written document, enumerating specific powers. This distinction in meaning can be traced to the fact that the foundations of government in the various colonies were written charters granted by the Crown. These express () authorizations to govern were tangible, definite things. Over the years these colonial had often repaired to the charters to justify themselves in the struggle against tyrannical governors or officials of the Crown. More than a century of government under written constitutions convinced these colonists of the necessity for and efficacy of protecting their liberties against governmental encroachment by explicitly defining all governmental powers in a document.","questions":[{"id":1,"question":"Which one of the following best expresses the main idea of the\npassage?","options":["The colonials and the English mistakenly thought that they shared\na common political vocabulary.","The colonials and the English shared a variety of institutions.","The colonials and the English had conflicting interpretations of\nthe language and institutional structures that they shared.","Colonial attitudes toward English institutions grew increasingly\nhostile in the eighteenth century."],"correct":2,"explanation":"The correct answer is option C. The passage supports this answer: the colonials and the english had conflicting interpretations of\nthe language and institutional structures that they shared. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"The passage supports all of the following statements about the\npolitical conditions present by the middle of the eighteenth century in\nthe American colonies discussed in the passage EXCEPT:","options":["Colonials who did not own property could not vote.","All of these colonies had representative assemblies modeled after\nthe British Parliament.","Some of these colonies had Royal Governors.","Royal Governors could be removed from office by colonial\nassemblies."],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: royal governors could be removed from office by colonial\nassemblies. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":3,"question":"The passage implies which one of the following about English kings\nprior to the early seventeenth century?","options":["They were the source of all law.","They frequently flouted laws made by Parliament.","Their power relative to that of Parliament was considerably\ngreater than it was in the eighteenth century.","They were more often the sources of legal reform than they were in\nthe eighteenth century."],"correct":2,"explanation":"The correct answer is option C. The passage supports this answer: their power relative to that of parliament was considerably\ngreater than it was in the eighteenth century. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":4,"question":"The author mentions which one of the following as evidence for the\neighteenth-century English attitude toward Parliament?","options":["The English had become uncomfortable with institutions that could\nclaim absolute authority.","The English realized that their interests were better guarded by\nParliament than by the King.","The English allowed Parliament to make constitutional changes by\nlegislative enactment.","The English felt that the King did not possess the knowledge that\ncould enable him to rule responsibly."],"correct":2,"explanation":"The correct answer is option C. The author's tone throughout the passage is best characterised as reflected in this answer. The language and rhetorical choices in the passage support this reading."},{"id":5,"question":"The passage implies that the colonials discussed in the passage\nwould have considered which one of the following to be a source of their\ndebates with England?","options":["their changed use of the English political vocabulary","English commitment to parliamentary representation","their uniquely English experience","their greater loyalty to the English political traditions"],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: their greater loyalty to the english political traditions. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":6,"question":"According to the passage, the English attitude toward the English\nConstitution differed from the colonial attitude toward constitutions in\nthat the English regarded their Constitution as","options":["the legal foundation of the kingdom","a document containing a collection of customs","a cumulative corpus of legislation and legal traditions","a record alterable by royal authority"],"correct":2,"explanation":"The correct answer is option C. The passage explicitly states or directly supports that a cumulative corpus of legislation and legal traditions. This information is stated in the passage, making it the most accurate answer based on the text."}]},"41":{"id":41,"title":"Oil companies needs offshore platforms primarily because the oil or natural gas the","difficulty":"Moderate","passage":"Oil companies needs offshore platforms primarily because the oil or natural gas the companies extract from the ocean floor has to be processed before pumps can be used to move the substances ashore. But because processing crude (unprocessed oil or gas) on a platform rather than at facilities onshore exposes workers to the risks of explosion and to an unpredictable environment, researchers are attempting to diminish the need for human labor on platforms and even to eliminate platforms altogether by redesigning two kinds of pumps to handle crude. These pumps could then be used to boost the natural pressure driving the flow of crude, which, by itself, is sufficient only to bring the crude to the platform, located just above the wellhead. Currently, pumps that could boost this natural pressure sufficiently to drive the crude through a pipeline to the shore do not work consistently because of the crude's content. Crude may consist of oil or natural gas in multiphase states—combinations of liquids, gases, and solids under pressure—that do not reach the wellhead in constant proportions. The flow of crude oil, for example, can change quickly from 60 percent liquid to 70 percent gas. This surge in gas content causes loss of \"head\", or pressure inside a pump, with the result that a pump can no longer impart enough energy to transport the crude mixture through the pipeline and to the shore.\n\nOf two pumps being redesigned, the positive-displacement pump is promising because it is immune to sudden shifts in the proportion of liquid to gas in the crude mixture. But the pump's design, which consists of a single or twin screw pushing the fluid from one end of the pump to the other, brings crude into close contact with most parts of the pump, and thus requires that it be made of expensive, corrosion-resistant material. The alternative is the centrifugal pump, which has a rotating impeller that sucks fluid in at one end and forces fluid out at the other. Although this pump has a proven design and has worked for years with little maintenance in waste-disposal plants, researchers have discovered that because the swirl of its impeller separates gas out from the oil that normally accompanies it, significant reductions in head can occur as it operates.\n\nResearch in the development of these pumps is focused mainly on trying to reduce the cost of the positive-displacement pump and attempting to make the centrifugal pump more tolerant of gas. Other researchers are looking at ways of adapting either kind of pump for use underwater, so that crude could be moved directly from the sea bottom to processing facilities onshore, eliminating platforms.","questions":[{"id":1,"question":"Which one of following best expresses the main idea of the passage?","options":["Oil companies are experimenting with technologies that may help\ndiminish the danger to workers from offshore crude processing.","Oil companies are seeking methods of installing processing\nfacilities underwater.","Researchers are developing several new pumps designed to enhance\nhuman labor efficiency in processing facilities.","Researchers are seeking to develop equipment that would preempt\n(to replace with something considered to be of greater value or\npriority: take precedence over) the need for processing facilities\nonshore."],"correct":0,"explanation":"The correct answer is option A. The passage supports this answer: oil companies are experimenting with technologies that may help\ndiminish the danger to workers from offshore crude processing. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"The passage supports which one of the following statements about the\nnatural pressure driving the flow of crude?","options":["It is higher than that created by the centrifugal pump.","It is constant regardless of relative proportions of gas and\nliquid.","It is able to carry the crude only as far as the wellhead.","It is able to carry the crude to the platform."],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: it is able to carry the crude to the platform. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":3,"question":"Which one of the following best describes the relationship of the\nsecond paragraph to the passage as a whole?","options":["It offers concrete detail designed to show that the argument made\nin the first paragraph is flawed.","It provides detail that expands upon the information presented in\nthe first paragraph.","It enhances the author's discussion by objectively presenting in\ndetail the pros and cons of a claim made in the first paragraph.","It detracts from the author's discussion by presenting various\nproblems that qualify the goals presented."],"correct":1,"explanation":"The correct answer is option B. The passage supports this answer: it provides detail that expands upon the information presented in\nthe first paragraph. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":4,"question":"Which one of the following phrases, if substituted for the word\n\"head\" in line 47, would LEAST change the meaning of the sentence?","options":["the flow of the crude inside the pump","the volume of oil inside the pump","the volume of gas inside the pump","the pressure inside of the pump"],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: the pressure inside of the pump. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":5,"question":"With which one of the following statements regarding offshore\nplatforms would the author most likely agree?","options":["If a reduction of human labor on offshore platform is achieved,\nthere is no real need to eliminate platforms altogether.","Reducing human labor on offshore platforms is desirable because\nresearchers' knowledge about the transportation of crude is dangerously\nincomplete.","The dangers involved in working on offshore platforms make their\nelimination a desirable goal.","The positive-displacement pump is the better alternative for\nresearchers, because it would allow them to eliminate platforms\naltogether."],"correct":2,"explanation":"The correct answer is option C. Based on the arguments and positions presented in the passage, the author would most likely agree that the dangers involved in working on offshore platforms make their\nelimination a desirable goal. This aligns with the overall thrust of the author's argument."},{"id":6,"question":"Which one of the following can be inferred from the passage about\npumps that are currently available to boost the natural pressure of\ncrude?","options":["The efficiency of these pumps depends on there being no gas in the\nflow of crude.","These pumps are more efficient when the crude is less subject to\nsudden increases in the proportion of gas to liquid.","A sudden change from solid to liquid in the flow of crude\nincreases the efficiency of these pumps.","The proportion of liquid to gas in the flow of crude does not\naffect the efficiency of these pumps."],"correct":1,"explanation":"The correct answer is option B. This can be inferred from the passage. The passage provides evidence that supports the conclusion that these pumps are more efficient when the crude is less subject to\nsudden increases in the proportion of gas to liquid. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."}]},"42":{"id":42,"title":"To critics accustomed to the style of fifteenth-century narrative paintings by","difficulty":"Moderate","passage":"To critics accustomed to the style of fifteenth-century narrative paintings by Italian artists from Tuscany, the Venetian examples of narrative paintings with religious subjects that Patricia Fortini Brown analyzes in a recent book will come as a great surprise. While the Tuscan paintings present large-scale figures, clear narratives, and simple settings, the Venetians filled their pictures with dozens of small figures and elaborate building, in addition to a wealth of carefully observed anecdotal detail often irrelevant to the paintings' principal subjects—the religious stories they narrate. Although it occasionally obscured these stories, this accumulation of circumstantial detail from Venetian life—the inclusion of prominent Venetian citizens, for example—was considered appropriate to the narration of historical subjects and underlined the authenticity of the historical events depicted. Indeed, Brown argues that the distinctive style of the Venetian paintings—what she calls the \"eyewitness style\"—was influenced by Venetian affinity for a strongly parochial type of historical writing, consisting almost exclusively of vernacular chronicles of local events embroidered with all kinds of inconsequential detail.\n\nAnd yet, while Venetian attitudes toward history that are reflected in their art account in part for the difference in style between Venetian and Tuscan narrative paintings, Brown has overlooked some practical influences, such as climate. Tuscan churches are filled with frescoes that, in contrast to Venetian narrative paintings, consist mainly of large figures and easily recognized religious stories, as one would expect of paintings that are normally viewed from a distance and are designed primarily to remind the faithful of their religious tenets. In Venice, where the damp climate is unsuited to fresco, narrative frescoes in churches were almost nonexistent, with the result that Venetian artists and their public had no practical experience of the large-scale representation of familiar religious stories. Their model for painted stories was the cycle () of secular historical paintings in the Venetian magistrate's palace, which were indeed the counterpart of written history and were made all the more authoritative by a proliferation of circumstantial detail.\n\nMoreover, because painting frescoes requires an unusually sure hand, particularly in the representation of human form, the development of drawing skill was central to artistic training in Tuscany, and by 1500 the public there tended to distinguish artists on the basis of how well they could draw human figures. In Venice, a city virtually without frescoes, this kind of skill was acquired and appreciated much later. Gentile Bellini, for example, although regarded as one of the supreme painters of the day, was feeble at drawing. On the other hand, the emphasis on architecture so evident in the Venetian narrative paintings was something that local painters obviously prized, largely because painting architecture in perspective was seen as a particular test of the Venetian painter's skill.","questions":[{"id":1,"question":"Which one of the following best states the main idea of the passage?","options":["Tuscan painters' use of fresco explains the prominence of human\nfigures in the narrative paintings that they produced during the\nfifteenth century.","In addition to fifteenth-century Venetian attitudes toward\nhistory, other factors may help to explain the characteristic features\nof Venetian narrative paintings with religious subjects produced during\nthat period.","The inclusion of authentic detail from Venetian life distinguished\nfifteenth-century Venetian narrative paintings from those that were\nproduced in Tuscany.","Venetian painters were generally more skilled at painting\nbuildings than Tuscan painters were at drawing human forms."],"correct":1,"explanation":"The correct answer is option B. The passage supports this answer: in addition to fifteenth-century venetian attitudes toward\nhistory, other factors may help to explain the characteristic features\nof venetian narrative paintings with religious subjects produced during\nthat period. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"In the passage, the author is primarily concerned with","options":["Pointing out the superiority of one painting style over another.","Citing evidence that requires a reevaluation of a conventionally\nheld view.","Discussing factors that explain a difference in painting styles.","Outlining the strengths and weaknesses of two opposing views\nregarding the evolution of a painting style."],"correct":2,"explanation":"The correct answer is option C. The passage supports this answer: discussing factors that explain a difference in painting styles. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":3,"question":"As it is described in the passage, Brown's explanation of the use\nof the eyewitness style in Venetian narrative painting suggests that","options":["The painting of architecture in perspective requires greater\ndrawing skill than does the representation of a human form in a fresco.","Certain characteristics of a style of painting can reflect a style\nof historical writing that was common during the same period.","The eyewitness style in Venetian narrative paintings with\nreligious subjects was largely the result of the influence of Tuscan\nartists who worked primarily in fresco.","The historical detail in Venetian narrative paintings with\nreligious subjects can be traced primarily to the influence of the\npaintings in the Venetian magistrate's palace."],"correct":1,"explanation":"The correct answer is option B. This can be inferred from the passage. The passage provides evidence that supports the conclusion that certain characteristics of a style of painting can reflect a style\nof historical writing that was common during the same period. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":4,"question":"The author suggests that fifteenth-century Venetian narrative\npaintings with religious subjects were painted by artists who","options":["were able to draw human figures with more skill after they were\napprenticed to painters in Tuscany","assumed that their paintings would typically be viewed from a\ndistance","were a major influence on the artists who produced the cycle of\nhistorical paintings in the Venetian magistrate's palace","were better at painting architecture in perspective than they were\nat drawing human figures"],"correct":3,"explanation":"The correct answer is option D. This can be inferred from the passage. The passage provides evidence that supports the conclusion that were better at painting architecture in perspective than they were\nat drawing human figures. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":5,"question":"The author implies that Venetian narrative paintings with religious\nsubjects included the representation of elaborate buildings in part\nbecause","options":["the ability to paint architecture in perspective was seen in\nVenice as proof of a painter's skill","the subjects of such paintings were often religious stories","large frescoes were especially conducive to representing\narchitecture in perspective","the architecture of Venice in the fifteenth century was more\nelaborate than was the architecture of Tuscany"],"correct":0,"explanation":"The correct answer is option A. The passage supports this answer: the ability to paint architecture in perspective was seen in\nvenice as proof of a painter's skill. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":6,"question":"Which one of the following, if true, would most weaken the author's\ncontention that fifteenth-century Venetian artists \"had no practical\nexperience of the large-scale representation of familiar religious\nstories\" (line 40-42)?","options":["The style of secular historical paintings in the palace of the\nVenetian magistrate was similar to that of Venetian narrative paintings\nwith religious subjects.","The style of the historical writing produced by fifteenth-century\nVenetian authors was similar in its inclusion of anecdotal details to\nsecular paintings produced during that century in Tuscany.","Many of the artists who produced Venetian narrative paintings with\nreligious subjects served as apprentices in Tuscany, where they had\nbecome familiar with the technique of painting of frescoes.","Few of the frescoes painted in Tuscany during the fifteenth\ncentury had secular subjects, and those that did often betrayed the\nartist's inability to represent elaborate architecture in\nperspective."],"correct":2,"explanation":"The correct answer is option C. This option most directly addresses the argument in question. It provides evidence or reasoning that bears on the claim being evaluated, while the other options are either irrelevant, supportive of the wrong conclusion, or do not address the specific argument."}]},"43":{"id":43,"title":"Currently, legal scholars agree that in some cases legal rules do not specify a","difficulty":"Moderate","passage":"Currently, legal scholars agree that in some cases legal rules do not specify a definite outcome. These scholars believe that such indeterminacy results from the vagueness of language: the boundaries of the application of a term are often unclear. Nevertheless, they maintain that the system of legal rules by and large rests on clear core meanings that do determine definite outcomes for most cases. Contrary to this view, an earlier group of legal philosophers, called \"realists,\" argued that indeterminacy pervades every part of the law.\n\nThe realists held that there is always a cluster of rules relevant to the decision in any litigated case. For example, deciding whether an aunt's promise to pay her niece a sum of money if she refrained from smoking is enforceable would involve a number of rules regarding such issues as offer, acceptance, and revocation. Linguistic vagueness in any one of these rules would affect the outcome of the case, making possible multiple points of indeterminacy, not just one or two, in any legal case.\n\nFor the realists, an even more damaging kind of indeterminacy stems from the fact that in a common-law system based on precedent, a judge's decision is held to be binding on judges in subsequent similar cases. Judicial decisions are expressed in written opinions, commonly held to consist of two parts: the holding (the decision for or against the plaintiff and the essential grounds or legal reasons for it, that is, what subsequent judges are bound by), and the dicta (everything in an opinion not essential to the decision, for example, comments about points of law not treated as the basis of the outcome). The realists argued that in practice the common-law system treats the \"holding/dicta\" distinction loosely. They pointed out that even when the judge writing an opinion characterizes part of it as \"the holding,\" judges writing subsequent opinions, although unlikely to dispute the decision itself, are not bound by the original judge's perception of what was essential to the decision. Later judges have tremendous leeway in being able to redefine the holding and the dicta in a precedential case. This leeway enables judges to choose which rules of law fo
