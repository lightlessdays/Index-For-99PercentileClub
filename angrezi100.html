marked inability to fly from one pond to another","contain a much greater proportion of macropterous water bugs than\nthe early spring-hatched generation"],"correct":3,"explanation":"The correct answer is option D. The passage explicitly states or directly supports that contain a much greater proportion of macropterous water bugs than\nthe early spring-hatched generation. This information is stated in the passage, making it the most accurate answer based on the text."}]},"8":{"id":8,"title":"The Constitution of the United States does not explicitly define the extent of the","difficulty":"Moderate","passage":"The Constitution of the United States does not explicitly define the extent of the President's authority to involve () United States troops in conflicts with other nations in the absence of a declaration of war. Instead, the question of the President's authority in this matter falls in the hazy area of concurrent, a concurrent resolution: ) power, where authority is not expressly allocated to either the President or the Congress. The Constitution gives Congress the basic power to declare war, as well as the authority to raise and support armies and a navy, enact regulations for the control of the military, and provide for the common defense. The President, on the other hand, in addition to being obligated to execute the laws of the land, including commitments negotiated by defense treaties, is named commander in chief of the armed forces and is empowered to appoint envoys and make treaties with the consent of the Senate. Although this allocation of powers does not expressly address the use of armed forces short of a declared war, the spirit of the Constitution at least requires that Congress should be involved in the decision to deploy troops, and in passing the War Powers Resolution of 1973, Congress has at last reclaimed a role in such decisions.\n\nHistorically, United States Presidents have not waited for the approval of Congress before involving United States troops in conflicts in which a state of war was not declared. One scholar has identified 199 military engagements that occurred without the consent of Congress, ranging from Jefferson's conflict with the Barbary pirates to Nixon's invasion of Cambodia (Cambodia n., ) during the Vietnam conflict, which President Nixon argued was justified because his role as commander in chief allowed him almost unlimited discretion (power of free decision or latitude of choice within certain legal bounds \"reached the age of discretion\") over the deployment of troops. However, the Vietnam conflict, never a declared war, represented a turning point in Congress's tolerance of presidential discretion in the deployment of troops in undeclared wars. Galvanized by the human and monetary cost of those hostilities () and showing a new determination to fulfill its proper role, Congress enacted the War Powers Resolution of 1973, a statute designed to ensure that the collective judgment of both Congress and the President would be applied to the involvement of United States troops in foreign conflicts.\n\nThe resolution required the President, in the absence of a declaration of war, to consult with Congress \"in every possible instance\" before introducing forces and to report to Congress within 48 hours after the forces have actually been deployed. Most important, the resolution allows Congress to veto the involvement once it begins, and requires the President, in most cases, to end the involvement within 60 days unless Congress specifically authorizes the military operation to continue. In its final section, by declaring the resolution is not intended to alter the constitutional authority of either Congress or the President, the resolution asserts that congressional involvement in decisions to use armed force is in accord with (in accord with:...) the intent and spirit of the Constitution.","questions":[{"id":1,"question":"In the passage, the author is primarily concerned with","options":["showing how the Vietnam conflict led to a new interpretation of\nthe Constitution's provisions for use of the military","arguing that the War Powers Resolution of 1973 is an attempt to\nreclaim a share of constitutionally concurrent power that had been\nusurped by the President","outlining the history of the struggle between the President and\nCongress for control of the military","providing examples of conflicts inherent in the Constitution's\napproach to a balance of powers"],"correct":1,"explanation":"The correct answer is option B. The passage supports this answer: arguing that the war powers resolution of 1973 is an attempt to\nreclaim a share of constitutionally concurrent power that had been\nusurped by the president. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"With regard to the use of United States troops in a foreign\nconflict without a formal declaration of war by the United States, the\nauthor believes that the United States Constitution does which one of\nthe following?","options":["assumes that the President and Congress will agree on whether\ntroops should be used","provides a clear-cut division of authority between the President\nand Congress in the decision to use troops","assigns a greater role to the Congress than to the President in\ndeciding whether troops should be used","intends (SIGNIFY, MEAN) that both the President and Congress\nshould be involved in the decision to use troops"],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: intends (signify, mean) that both the president and congress\nshould be involved in the decision to use troops. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":3,"question":"The passage suggests that each of the following contributed to\nCongress's enacting the War Powers Resolution of 1973 EXCEPT","options":["a change in the attitude in Congress toward exercising its role in\nthe use of armed forces","the failure of Presidents to uphold commitments specified in\ndefense treaties","Congress's desire to be consulted concerning United States\nmilitary actions instigated by the President","the amount of money spent on recent conflicts waged without a\ndeclaration of war"],"correct":1,"explanation":"The correct answer is option B. This can be inferred from the passage. The passage provides evidence that supports the conclusion that the failure of presidents to uphold commitments specified in\ndefense treaties. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":4,"question":"It can be inferred from the passage that the War Powers Resolution\nof 1973 is applicable only in \"the absence of a declaration of war\"\n(lines 48-49) because","options":["Congress has enacted other laws that already set out presidential\nrequirements for situations in which war has been declared","by virtue of declaring war,\nCongress already implicitly participates in the decision to deploy\ntroops","the President generally receives broad public support during wars\nthat have been formally declared by Congress","Congress felt that the President should be allowed unlimited\ndiscretion in cases in which war has been declared"],"correct":1,"explanation":"The correct answer is option B. This can be inferred from the passage. The passage provides evidence that supports the conclusion that by virtue of (by virtue of: adv., ) declaring war,\ncongress already implicitly participates in the decision to deploy\ntroops. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":5,"question":"In can be inferred from the passage that the author believes that\nthe War Powers Resolution of 1973","options":["is not in accord with the explicit roles of the President and\nCongress as defined in the Constitution","interferes with the role of the President as commander in chief of\nthe armed forces","signals Congress's commitment to fulfill a role intended for it by\nthe Constitution","fails explicitly to address the use of armed forces in the absence\nof a declaration of war"],"correct":2,"explanation":"The correct answer is option C. This can be inferred from the passage. The passage provides evidence that supports the conclusion that signals congress's commitment to fulfill a role intended for it by\nthe constitution. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":6,"question":"It can be inferred from the passage that the author would be most\nlikely to agree with which one of the following statements regarding the\ninvasion of Cambodia?","options":["Because it was undertaken without the consent of Congress, it\nviolated the intent and spirit of the Constitution.","Because it galvanized support for the War Powers Resolution, it\ncontributed indirectly to the expansion of presidential authority.","Because it was necessitated by a defense treaty, it required the\nconsent of Congress.","It served as a precedent for a new interpretation of the\nconstitutional limits on the President's authority to deploy\ntroops."],"correct":0,"explanation":"The correct answer is option A. This can be inferred from the passage. The passage provides evidence that supports the conclusion that because it was undertaken without the consent of congress, it\nviolated the intent and spirit of the constitution. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."}]},"9":{"id":9,"title":"The extent of a nation's power over its coastal ecosystems and the natural","difficulty":"Moderate","passage":"The extent of a nation's power over its coastal ecosystems and the natural resources in its coastal waters has been defined by two international law doctrines: freedom of the seas and adjacent state sovereignty. Until the mid-twentieth century, most nations favored application of broad open-seas freedoms and limited sovereign rights over coastal waters. A nation had the right to include within its territorial dominion only a very narrow band of coastal waters (generally extending three miles from the shoreline), within which it had the authority but not the responsibility, to regulate all activities. But, because this area of territorial dominion was so limited, most nations did not establish rules for management or protection of their territorial waters.\n\nRegardless of whether or not nations enforced regulations in their territorial waters, large ocean areas remained free of controls or restrictions. The citizens of all nations had the right to use these unrestricted ocean areas for any innocent purpose, including navigation and fishing. Except for controls over its own citizens, no nation had the responsibility, let alone the unilateral authority, to control such activities in international waters. And, since there were few standards of conduct that applied on the \"open seas\", there were few jurisdictional conflicts between nations.\n\nThe lack of standards is traceable to popular perceptions held before the middle of this century. By and large, marine pollution was not perceived as a significant problem, in part because the adverse effect of coastal activities on ocean ecosystems was not widely recognized, and pollution caused by human activities was generally believed to be limited to that caused by navigation. Moreover, the freedom to fish, or overfish, was an essential element of the traditional legal doctrine of freedom of the seas that no maritime (of, relating to, or bordering on the sea \"a maritime province\") country wished to see limited. And finally, the technology that later allowed exploitation of other ocean resources, such as oil, did not yet exist.\n\nTo date, controlling pollution and regulating ocean resources have still not been comprehensively addressed by law, but international law—established through the customs and practices of nations—does not preclude such efforts. And two recent developments may actually lead to future international rules providing for ecosystem management. First, the establishment of extensive fishery zones extending territorial authority as far as 200 miles out from a country's coast, has provided the opportunity for nations individually to manage larger ecosystems. This opportunity, combined with national self-interest in maintaining fish populations, could lead nations to reevaluate policies for management of their fisheries and to address the problem of pollution in territorial waters. Second, the international community is beginning to understand the importance of preserving the resources and ecology of international waters and to show signs of accepting responsibility for doing so. As an international consensus regarding the need for comprehensive management of ocean resources develops, it will become more likely that international standards and policies for broader regulation of human activities that affect ocean ecosystems will be adopted and implemented.","questions":[{"id":1,"question":"According to the passage, until the mid-twentieth century there were\nfew jurisdictional disputes over international waters because.","options":["the nearest coastal nation regulated activities","few controls or restrictions applied to ocean areas","the ocean areas were used for only innocent purposes","the freedom of the seas doctrine settled all claims concerning\nnavigation and fishing"],"correct":1,"explanation":"The correct answer is option B. The passage explicitly states or directly supports that few controls or restrictions applied to ocean areas. This information is stated in the passage, making it the most accurate answer based on the text."},{"id":2,"question":"According to the international law doctrines applicable before the\nmid-twentieth century, if commercial activity within a particular\nnation's territorial waters threatened all marine life in those waters,\nthe nation would have been","options":["formally censured by an international organization for not\nproperly regulating marine activities","called upon by other nations to establish rules to protect its\nterritorial waters","able but not required to place legal limits on such commercial\nactivities","allowed to resolve the problem at it own discretion providing it\ncould contain the threat to its own territorial waters"],"correct":2,"explanation":"The correct answer is option C. The passage explicitly states or directly supports that able but not required to place legal limits on such commercial\nactivities. This information is stated in the passage, making it the most accurate answer based on the text."},{"id":3,"question":"The author suggests that, before the mid-twentieth century, most\nnations' actions with respect to territorial and international waters\nindicated that","options":["managing ecosystems in either territorial or international waters\nwas given low priority","unlimited resources in international waters resulted in little\ninterest in territorial waters","nations considered it their responsibility to protect territorial\nbut not international waters","a nation's authority over its citizenry ended at territorial\nlines"],"correct":0,"explanation":"The correct answer is option A. This can be inferred from the passage. The passage provides evidence that supports the conclusion that managing ecosystems in either territorial or international waters\nwas given low priority. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":4,"question":"The author cites which one of the following as an effect of the\nextension of territorial waters beyond the three-mile limit?","options":["increased political pressure on individual nations to establish\ncomprehensive laws regulating ocean resources","a greater number of jurisdictional disputes among nations over the\nregulation of fishing on the open seas","the opportunity for some nations to manage large ocean ecosystems","a new awareness of the need to minimize pollution caused by\nnavigation"],"correct":2,"explanation":"The correct answer is option C. The passage supports this answer: the opportunity for some nations to manage large ocean ecosystems. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":5,"question":"According to the passage, before the middle of the twentieth\ncentury, nations failed to establish rules protecting their territorial\nwaters because","options":["the waters appeared to be unpolluted and to contain unlimited\nresources","the fishing industry would be adversely affected by such rules","the size of the area that would be subject to such rules was\ninsignificant","the technology needed for pollution control and resource\nmanagement did not exist"],"correct":2,"explanation":"The correct answer is option C. The passage explicitly states or directly supports that the size of the area that would be subject to such rules was\ninsignificant. This information is stated in the passage, making it the most accurate answer based on the text."},{"id":6,"question":"The passage as a whole can best be described as","options":["a chronology of the events that have led up to present-day crisis","a legal inquiry into the abuse of existing laws and the likelihood\nof reform","a political analysis of the problems inherent in directing\nnational attention to an international issue","a historical analysis of a problem that requires international\nattention"],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: a historical analysis of a problem that requires international\nattention. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."}]},"10":{"id":10,"title":"The human species came into being at the time of the greatest biological diversity","difficulty":"Moderate","passage":"The human species came into being at the time of the greatest biological diversity in the history of the Earth. Today, as human populations expand and alter the natural environment, they are reducing biological diversity to its lowest level since the end of the Mesozoic era, 65 million years ago. The ultimate consequences of this biological collision are beyond calculation, but they are certain to be harmful. That, in essence, is the biodiversity crisis.\n\nThe history of global diversity can be summarized as follows : after the initial flowering of multicellular animals, there was a swift rise in the number of species in early Paleozoic times (between 600 and 430 million years ago), then plateaulike stagnation for the remaining 200 million years of the Paleozoic era, and finally a slow but steady climb through the Mesozoic and Cenozoic eras to diversity's all-time high. This history suggests that biological diversity was hard won and a long time in coming. Furthermore, this pattern of increase was set back by five massive extinction episodes. The most recent of these, during the Cretaceous period, is by far the most famous, because it ended the age of the dinosaurs, conferred (1: to bestow from or as if from a position of superiority \"conferred an honorary degree on her\"; 2: to give (as a property or characteristic) to someone or something) hegemony on the mammals, and ultimately made possible the ascendancy of the human species. But the cretaceous crisis was minor compared with the Permian extinctions 240 million years ago, during which between 77 and 96 percent of marine animal species perished. It took 5 million years, well into Mesozoic times, for species diversity to begin a significant recovery.\n\nWithin the past 10,000 years biological diversity has entered a wholly new era. Human activity has had a devastating effect on species diversity, and the rate of human-induced extinctions is accelerating. Half of the bird species of Polynesia have been eliminated through hunting and the destruction of native forests. Hundreds of fish species endemic to Lake Victoria are now threatened with extinction following the careless introduction of one species of fish, the Nile perch. The list of such biogeographic disasters is extensive.\n\nBecause every species is unique and irreplaceable, the loss of biodiversity is the most profound process of environmental change. Its consequences are also the least predictable because the value of Earth's biota (the fauna and flora collectively) remains largely unstudied and unappreciated; unlike material and cultural wealth, which we understand because they are the substance (a fundamental or characteristic part or quality) of our everyday lives, biological wealth is usually taken for granted. This is a serious strategic error, one that will be increasingly regretted as time passes. The biota is not only part of a country's heritage, the product of millions of years of evolution centered on that place; it is also a potential source for immense untapped material wealth in the form of food, medicine, and other commercially important substance.","questions":[{"id":1,"question":"Which one of the following best expresses the main idea of the\npassage?","options":["The reduction in biodiversity is an irreversible process that\nrepresents a setback both for science and for society as a whole.","The material and cultural wealth of a nation are insignificant\nwhen compared with the country's biological wealth.","The enormous diversity of life on Earth could not have come about\nwithout periodic extinctions that have conferred preeminence on one\nspecies at the expense of another.","The current decline in species diversity is human-induced tragedy\nof incalculable proportions that has potentially grave consequences for\nthe human species."],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: the current decline in species diversity is human-induced tragedy\nof incalculable proportions that has potentially grave consequences for\nthe human species. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"Which one of the following situations is most analogous to the\nhistory of global diversity summarized in lines 10-18 of the passage?","options":["The number of fish in a lake declines abruptly as a result of\nwater pollution, then makes a slow comeback \nafter cleanup efforts and the passage of ordinances against dumping.","The concentration of chlorine in the water supply of large city\nfluctuates widely before stabilizing at a constant and safe level.","An old-fashioned article of clothing goes in and out of style\nperiodically as a result of features in fashion magazines and the\npopularity of certain period films.","The variety of styles stocked by a shoe store increases rapidly\nafter the store opens, holds constant for many months, and then\ngradually creeps upward."],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: the variety of styles stocked by a shoe store increases rapidly\nafter the store opens, holds constant for many months, and then\ngradually creeps upward. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":3,"question":"The author suggests which one of the following about the Cretaceous\ncrisis?","options":["It was the second most devastating extinction episode in history.","It was the most devastating extinction episode up until that time.","It was less devastating to species diversity than is the current\nbiodiversity crisis.","The rate of extinction among marine animal species as a result of\nthe crisis did not approach 77 percent."],"correct":3,"explanation":"The correct answer is option D. This can be inferred from the passage. The passage provides evidence that supports the conclusion that the rate of extinction among marine animal species as a result of\nthe crisis did not approach 77 percent. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":4,"question":"The author mentions the Nile perch in order to provide an example\nof","options":["a species that has become extinct through human activity","the typical lack of foresight that has led to biogeographic\ndisaster","a marine animal species that survived the Permian extinctions","a species that is a potential source of material wealth"],"correct":1,"explanation":"The correct answer is option B. The passage supports this answer: the typical lack of foresight that has led to biogeographic\ndisaster. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":5,"question":"All of the following are explicitly mentioned in the passage as\ncontributing to the extinction of species EXCEPT","options":["hunting","pollution","deforestation","the growth of human populations"],"correct":1,"explanation":"The correct answer is option B. The passage supports this answer: pollution. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":6,"question":"The passage suggests which one of the following about material and\ncultural wealth?","options":["Because we can readily assess the value of material and cultural\nwealth, we tend not to take them for granted.","Just as the biota is a source of potential material wealth, it is\nan untapped source of cultural wealth as well.","Some degree of material and cultural wealth may have to be\nsacrificed if we are to protect our biological heritage.","Material and cultural wealth are of less value than biological\nwealth because they have evolved over a shorter period of time."],"correct":0,"explanation":"The correct answer is option A. This can be inferred from the passage. The passage provides evidence that supports the conclusion that because we can readily assess the value of material and cultural\nwealth, we tend not to take them for granted. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."}]},"11":{"id":11,"title":"Women's participation in the revolutionary events in France between 1789 and 1795","difficulty":"Moderate","passage":"Women's participation in the revolutionary events in France between 1789 and 1795 has only recently been given nuanced ) treatment. Early twentieth century historians of the French Revolution are typified by Jaures, who, though sympathetic to the women's movement of his own time, never even mentions its antecedents in revolutionary France. Even today most general histories treat only cursorily a few individual women, like Marie Antoinette. The recent studies by Landes, Badinter, Godineau, and Roudinesco, however, should signal a much-needed reassessment of women's participation.\n\nGodineau and Roudinesco point (intransitive senses 1 a: to indicate the fact or probability of something specified \"everything points to a bright future\") to three significant phases in that participation. The first, up to mid-1792, involved those women who wrote political tracts. Typical of their orientation to theoretical issues—in Godineaus's view, without practical effect—is Marie Gouze's Declaration of the Right of Women. The emergence of vocal middle-class women's political clubs marks the second phase. Formed in 1791 as adjuncts of middle-class male political clubs, and originally philanthropic in function, by late 1792 independent clubs of women began to advocate military participation for women. In the final phase, the famine of 1795 occasioned (occasion sb to do sth) a mass women's movement: women seized food supplies, hold officials hostage, and argued for the implementation of democratic politics. This phase ended in May of 1795 with the military suppression of this multiclass movement. In all three phases women's participation in politics contrasted markedly with their participation before 1789. Before that date some noblewomen participated indirectly in elections, but such participation by more than a narrow range of the population—women or men—came only with the Revolution.\n\nWhat makes the recent studies particularly compelling, however, is not so much their organization of chronology as their unflinching willingness to confront the reasons for the collapse of the women's movement. For Landes and Badinter, the necessity of women's having to speak in the established vocabularies of certain intellectual and political tradition diminished the ability of the women's movement to resist suppression. Many women, and many men, they argue, located their vision within the confining tradition of Jean-Jacques Rousseau, who linked male and female roles with public and private spheres respectively. But, when women went on to make political alliances with radical Jacobin men, Badinter asserts, they adopted a vocabulary and a violently extremist viewpoint that unfortunately was even more damaging to their political interests.\n\nEach of these scholars has different political agenda and takes a different approach—Godineau, for example, works with police archives while Roudinesco uses explanatory schema from modern psychology. Yet, admirably, each gives center stage to a group that previously has been marginalized, or at best undifferentiated, by historians. And in the case of Landes and Badinter, the reader is left with a sobering awareness of the cost to the women of the Revolution of speaking in borrowed voices.","questions":[{"id":1,"question":"Which one of the following best states the main point of the\npassage?","options":["According to recent historical studies, the participation of women\nin the revolutionary events of 1789-1795 can most profitably be viewed\nin three successive stages.","The findings of certain recent historical studies have resulted\nfrom an earlier general reassessment, by historians, of women's\nparticipation in the revolutionary events of 1789-1795.","Adopting the vocabulary and viewpoint of certain intellectual and\npolitical traditions resulted in no political advantage for women in\nFrance in the years 1789-1795.","Certain recent historical studies have provided a much-needed\ndescription and evaluation of the evolving roles of women in the\nrevolutionary events of 1789-1795."],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: certain recent historical studies have provided a much-needed\ndescription and evaluation of the evolving roles of women in the\nrevolutionary events of 1789-1795. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"The passage suggests that Godineau would be likely to agree with\nwhich one of the following statements about Marie Gouze's Declaration of\nthe Rights of Women?","options":["This work was not understood by many of Gouze's contemporaries.","This work indirectly inspired the formation of independent women's\npolitical clubs.","This work had little impact on the world of political action.","This work was the most compelling produced by a French woman\nbetween 1789 and 1792."],"correct":2,"explanation":"The correct answer is option C. This can be inferred from the passage. The passage provides evidence that supports the conclusion that this work had little impact on the world of political action. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":3,"question":"According to the passage, which one of the following is a true\nstatement about the purpose of the women's political cubs mentioned in\nline 20?","options":["These clubs fostered a mass women's movement.","These clubs eventually developed a purpose different from their\noriginal purpose.","These clubs were founder to advocate military participation for\nwomen.","These clubs counteracted the original purpose of male political\nclubs."],"correct":1,"explanation":"The correct answer is option B. The passage explicitly states or directly supports that these clubs eventually developed a purpose different from their\noriginal purpose. This information is stated in the passage, making it the most accurate answer based on the text."},{"id":4,"question":"The primary function of the first paragraph of the passage is to:","options":["outline the author's argument about women's roles in Frances\nbetween 1789 and 1795","anticipate possible challenges to the findings of the recent\nstudies of women in France between 1789 and 1795","summarize some long-standing explanations of the role of\nindividual women in France between 1789 and 1795","present a context for the discussion of recent studies of women in\nFrance between 1789 and 1795"],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: present a context for the discussion of recent studies of women in\nfrance between 1789 and 1795. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":5,"question":"The passage suggests that Landes and Badinter would be likely to\nagree with which one of the following statements about the women's\nmovement in France in the 1790s?","options":["The movement might have been more successful if women had\ndeveloped their own political vocabularies.","The downfall of the movement was probably unrelated to it alliance\nwith Jacobin men.","The movement had a great deal of choice about whether to adopt a\nRousseauist political vocabulary.","The movement would have triumphed if it had not been suppressed by\nmilitary means."],"correct":0,"explanation":"The correct answer is option A. This can be inferred from the passage. The passage provides evidence that supports the conclusion that the movement might have been more successful if women had\ndeveloped their own political vocabularies. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":6,"question":"In the context of the passage, the word \"cost\" in line 63 refers to\nthe","options":["dichotomy of private roles for women and public roles for men","almost nonexistent political participation of women before 1789","historians' lack of differentiation among various groups of women","collapse of the women's movement in the 1790s"],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: collapse of the women's movement in the 1790s. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."}]},"12":{"id":12,"title":"Art historians' approach to French Impressionism has changed significantly in","difficulty":"Moderate","passage":"Art historians' approach to French Impressionism has changed significantly in recent years. While a decade ago Rewald's History of Impressionism, which emphasizes Impressionist painters' stylistic innovations, was unchallenged, the literature (the body of writings on a particular subject \"scientific literature\") on impressionism has now become a kind of ideological battlefield, in which more attention is paid to the subject matter of the paintings, and to the social and moral issues raised by it, than to their style. Recently, politically charged discussions that address the impressionists' unequal treatment of men and women and the exclusion of modern industry and labor from their pictures have tended to crowd out the stylistic analysis favored by Rewald and his followers. In a new work illustrating this trend, Robert L. Herbert dissociates himself from formalists whose preoccupation with the stylistic features of impressionist painting has, in Herbert's view, left the history out of art history; his aim is to restore impressionist paintings \"to their sociocultural context.\" However, his arguments are not finally persuasive.\n\nIn attempting to place impressionist painting in its proper historical context, Herbert has redrawn the traditional boundaries of impressionism. Limiting himself to the two decades between 1860 and 1880, he assembles under the impressionist banner what can only be described as a somewhat eccentric grouping of painters. Cezanne, Pisarro, and Sisley are almost entirely ignored, largely because their paintings do not suit Herbert's emphasis on themes of urban life and suburban leisure, while Manet, Degas, and Caillebotte—who paint scenes of urban life but whom many would hardly characterize as impressionists—dominate the first half of the book. Although this new description of Impressionist painting provides a more unified conception of nineteenth-century French painting by grouping quite disparate modernist painters together and emphasizing their common concerns rather than their stylistic difference, it also forces Herbert to overlook some of the most important genres of impressionist painting—portraiture, pure landscape, and still-life painting.\n\nMoreover, the rationale for Herbert's emphasis on the social and political realities that Impressionist paintings can be said to communicate rather than on their style is finally undermined by what even Herbert concedes was the failure of Impressionist painters to serve as particularly conscientious illustrators of their social milieu. They left much ordinary experience—work and poverty, for example—out of their paintings and what they did put in was transformed by a style that had only an indirect relationship to the social realities of the world they depicted. Not only were their pictures inventions rather than photographs, they were inventions in which style to some degree disrupted description. Their painting in effect have two levels of subject: what is represented and how it is represented, and no art historian can afford to emphasize one at the expense of the other.","questions":[{"id":1,"question":"Which one of the following best expresses the main point of the\npassage?","options":["The style of impressionist paintings has only an indirect relation\nto their subject matter.","The approach to impressionism that is illustrated by Herbert's\nrecent book is inadequate.","The historical context of impressionist paintings is not relevant\nto their interpretation.","impressionism emerged from a historical context of ideological\nconflict and change."],"correct":1,"explanation":"The correct answer is option B. The passage supports this answer: the approach to impressionism that is illustrated by herbert's\nrecent book is inadequate. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"According to the passage, Rewald's book on impressionism was\ncharacterized by which one of the following?","options":["evenhanded objectivity about the achievements of impressionism","bias in favor of certain impressionist painters","an emphasis on the stylistic features of impressionist painting","an idiosyncratic view of which painters were to be classified as\nimpressionists"],"correct":2,"explanation":"The correct answer is option C. The passage explicitly states or directly supports that an emphasis on the stylistic features of impressionist painting. This information is stated in the passage, making it the most accurate answer based on the text."},{"id":3,"question":"The author implies that Herbert's redefinition of the boundaries of\nimpressionism resulted from which one of the following?","options":["an exclusive emphasis on form and style","a bias in favor of the representation of modern industry","an attempt to place impressionism within a specific sociocultural\ncontext","a broadening of the term impressionism to include all\nnineteenth-century French painting"],"correct":2,"explanation":"The correct answer is option C. The passage supports this answer: an attempt to place impressionism within a specific sociocultural\ncontext. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":4,"question":"The author states which one of the following about modern industry\nand labor as subjects for painting?","options":["The impressionists neglected these subjects in their paintings.","Herbert's book on impressionism fails to give adequate treatment\nof these subjects.","The impressionists' treatment of these subjects was idealized.","Rewald's treatment of impressionist painters focused inordinately\non their representations of these subjects."],"correct":0,"explanation":"The correct answer is option A. The passage supports this answer: the impressionists neglected these subjects in their paintings. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":5,"question":"Which one of the following most accurately describes the structure\nof the author's argument in the passage?","options":["The first two paragraphs each present independent arguments for a\nconclusion that is drawn in the third paragraph.","A thesis is stated in the first paragraph and revised in the\nsecond paragraph and revised in the second paragraph, and the revised\nthesis is supported with argument in the third paragraph.","The first two paragraphs discuss and criticize a thesis, and the\nthird paragraph presents an alternative thesis.","a claim is made in the first paragraph, and the next two\nparagraph, and the next two paragraphs each present reasons for\naccepting that claim."],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: a claim is made in the first paragraph, and the next two\nparagraph, and the next two paragraphs each present reasons for\naccepting that claim. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":6,"question":"The author's statement that impressionist paintings \"were\ninventions in which style to some degree disrupted description\" (lines\n57-59) serves to","options":["strengthen the claim that impressionist sought to emphasize the\ndifferences between painting and photography","weaken the argument that style is the only important feature of\nimpressionist paintings","indicate that impressionists recognized that they had been\nstrongly influence by photography","support the argument that an exclusive emphasis on the\nimpressionists subject matter is mistaken"],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: support the argument that an exclusive emphasis on the\nimpressionists subject matter is mistaken. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."}]},"13":{"id":13,"title":"Governments of developing countries occasionally enter into economic development","difficulty":"Moderate","passage":"Governments of developing countries occasionally enter into economic development agreements with foreign investors who provide capital and technological expertise that may not be readily available in such countries. Besides the normal economic risk that accompanies such enterprises, investors face the additional risk that the host government may attempt unilaterally to change in its favor the terms of the agreement or even to terminate the agreement altogether and appropriate the project for itself. In order to make economic development agreements more attractive to investors, some developing countries have attempted to strengthen the security of such agreements with clauses specifying that the agreements will be governed by \"general principles of law recognized by civilized nations\"—a set of legal principles or rules shared by the world's major legal systems. However, advocates of governments' freedom to modify or terminate such agreements argue that these agreements fall within a special class of contracts known as administrative contracts, a concept that originated in French law. They assert that under the theory of administrative contracts, a government retains inherent power to modify or terminate its own contract, and that this power indeed constitutes a general principle of law. However, their argument is flawed on at least two counts.\n\nFirst, in French law not all government contracts are treated as administrative contracts. Some contracts are designated as administrative by specific statute, in which case the contractor is made aware of the applicable legal rules upon entering into agreement with the government. Alternatively, the contracting government agency can itself designate a contract as administrative by including certain terms not found in private civil contracts. Moreover, even in the case of administrative contracts, French law requires that in the event that the government unilaterally modifies the terms of the contract, it must compensate the contractor for any increased burden resulting from the government's action. In effect, the government is thus prevented from modifying those contractual terms that define the financial balance of the contract.\n\nSecond, the French law of administrative contracts, although adopted by several countries, is not so universally accepted that it can be embraced as a general principle of law. In both the United States and the United Kingdom, government contracts are governed by the ordinary law of contracts, with the result that the government can reserve the power to modify or terminate a contract unilaterally only by writing such power into the contract as a specific provision. Indeed, the very fact that termination and modification clauses are commonly found in government contracts suggests that a government's capacity to modify or terminate agreements unilaterally derives from specific contract provisions, not from inherent state power.","questions":[{"id":1,"question":"In the passage, the author is primarily concerned with doing which\none of the following?","options":["pointing out flaws in an argument provided in support of a\nposition","analyzing the weaknesses inherent in the proposed solution to a\nproblem","marshaling evidence in support of a new explanation of a\nphenomenon","analyzing the risks inherent in adopting a certain course of\naction"],"correct":0,"explanation":"The correct answer is option A. The passage supports this answer: pointing out flaws in an argument provided in support of a\nposition. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"It can be inferred from the passage that the author would be most\nlikely to agree with which one of the following assertions regarding the\n\"general principles of law\" mentioned in lines 16-17 of the passage?","options":["They fail to take into account the special needs and interests of\ndeveloping countries that enter into agreements with foreign investors.","They have only recently been invoked as criteria for adjudicating\ndisputes between governments and foreign investors.","They are more compatible with the laws of France and the United\nStates than with those of the United Kingdom.","They do not assert that governments have an inherent right to\nmodify unilaterally the terms of agreements that they have entered into\nwith foreign investors."],"correct":3,"explanation":"The correct answer is option D. This can be inferred from the passage. The passage provides evidence that supports the conclusion that they do not assert that governments have an inherent right to\nmodify unilaterally the terms of agreements that they have entered into\nwith foreign investors. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":3,"question":"The author implies that which one of the following is true of\neconomic development agreements?","options":["They provide greater economic benefits to the governments that are\nparties to such agreements than to foreign investors.","They are interpreted differently by courts in the United Kingdom\nthan they are by courts in the United States.","They have proliferated in recent years as a result of governments'\nattempts to make them more legally secure.","They entail greater risk to investors when the governments that\nenter into such agreements reserve the right to modify unilaterally the\nterms of the agreements."],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: they entail greater risk to investors when the governments that\nenter into such agreements reserve the right to modify unilaterally the\nterms of the agreements. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":4,"question":"According to the author, which one of the following is true of a\ncontract that is designated by a French government agency as an\nadministrative contract?","options":["It requires the government agency to pay for unanticipated\nincreases in the cost of delivering the goods and services specified in\nthe contract.","It provides the contractor with certain guarantees that are not\nnormally provided in private civil contracts.","It must be ratified by the passage of a statute.","It contains terms that distinguish it from a private civil\ncontract."],"correct":3,"explanation":"The correct answer is option D. The passage explicitly states or directly supports that it contains terms that distinguish it from a private civil\ncontract. This information is stated in the passage, making it the most accurate answer based on the text."},{"id":5,"question":"It can be inferred from the passage that under the \"ordinary law of\ncontracts\" (lines 53-54), a government would have the right to modify\nunilaterally the terms of a contract that it had entered into with a\nforeign investor if which one of the following were true?","options":["The government undertook a greater economic risk by entering into\nthe contract than did the foreign investor.","The cost to the foreign investor of abiding by the terms of the\ncontract exceeded the original estimates of such costs.","The modification of the contract did not result in any increased\nfinancial burden for the investor.","The contract contains a specific provision allowing the government\nto modify the contract."],"correct":3,"explanation":"The correct answer is option D. This can be inferred from the passage. The passage provides evidence that supports the conclusion that the contract contains a specific provision allowing the government\nto modify the contract. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":6,"question":"In the last paragraph, the author refers to government contracts in\nthe United States and the United Kingdom primarily in order to","options":["Cite two governments that often reserve the right to modify\nunilaterally contracts that they enter into with foreign investors.","Support the assertion that there is no general principle of law\ngoverning contracts between private individuals and governments.","Cast doubt on the alleged universality of the concept of\nadministrative contracts.","Provide examples of legal systems that might benefit from the\nconcept of administrative contracts."],"correct":2,"explanation":"The correct answer is option C. The passage supports this answer: cast doubt on the alleged universality of the concept of\nadministrative contracts. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."}]},"14":{"id":14,"title":"Nico Frijda writes that emotions are governed by a psychological principle called","difficulty":"Moderate","passage":"Nico Frijda writes that emotions are governed by a psychological principle called the \"law of apparent reality\": emotions are elicited only by events appraised as real, and the intensity of these emotions corresponds to the degree to which these events are appraised as real. This observation seems psychologically plausible, but emotional responses elicited by works of art raise counterexamples.\n\nFrijda's law accounts for my panic if I am afraid of snakes and see an object I correctly appraise as a rattlesnake, and also for my identical response if I see a coiled garden hose I mistakenly perceive to be a snake. However, suppose I am watching a movie and see a snake gliding toward its victim. Surely I might experience the same emotions of panic and distress, though I know the snake is not real. These responses extend even to phenomena not conventionally accepted as real. A movie about ghosts, for example, may be terrifying to all viewers, even those who firmly reject the possibility of ghosts, but this is not because viewers are confusing cinematic depiction with reality. Moreover, I can feel strong emotions in response to objects of art that are interpretations, rather than representations, of reality: I am moved by Mozart's Requiem, but I know that I am not at a real funeral. However, if Frijda's law is to explain all emotional reactions, there should be no emotional response at all to aesthetic objects or events, because we know they are not real in the way a living rattlesnake is real.\n\nMost psychologists, perplexed by the feelings they acknowledge are aroused by aesthetic experience, have claimed that these emotions are genuine, but different in kind from nonaesthetic emotions. This, however, is a descriptive distinction rather than an empirical observation and consequently lacks explanatory value. On the other hand, Gombrich argues that emotional responses to art are ersatz; art triggers remembrances of previously experienced emotions. These debates have prompted the psychologist Radford to argue that people do experience real melancholy or joy in responding to art, but that these are irrational responses precisely because people know they are reacting to illusory stimuli. Frijda's law does not help us to untangle these positions, since it simply implies that events we recognize as being represented rather than real cannot elicit emotion in the first place.\n\nFrijda does suggest that a vivid imagination has \"properties of reality\"—implying, without explanation, that we make aesthetic objects or events \"real\" in the act of experiencing them. However, as Scruton argues, a necessary characteristic of the imaginative construction that can occur in an emotional response to art is that the person knows he or she is pretending. This is what distinguishes imagination from psychotic fantasy.","questions":[{"id":1,"question":"Which one of the following best states the central idea of the\npassage?","options":["The law of apparent reality fails to account satisfactorily for\nthe emotional nature of belief.","Theories of aesthetic response fail to account for how we\ndistinguish unreasonable from reasonable responses to art.","The law of apparent reality fails to account satisfactorily for\nemotional responses to art.","Psychologists have been unable to determine what accounts for the\nchangeable nature of emotional responses to art."],"correct":2,"explanation":"The correct answer is option C. The passage supports this answer: the law of apparent reality fails to account satisfactorily for\nemotional responses to art. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"According to the passage, Frijda's law asserts that emotional\nresponses to events are","options":["unpredictable because emotional responses depend on how aware the\nperson is of the reality of an event","weaker if the person cannot distinguish illusion from reality","more or less intense depending on the degree to which the person\nperceives the event to be real","more intense if the person perceives an event to be\nfrightening"],"correct":2,"explanation":"The correct answer is option C. The passage explicitly states or directly supports that more or less intense depending on the degree to which the person\nperceives the event to be real. This information is stated in the passage, making it the most accurate answer based on the text."},{"id":3,"question":"The author suggests that Frijda's notion of the role of imagination\nin aesthetic response is problematic because it","options":["ignore the unselfconsciousness that is characteristic of emotional\nresponses to art","ignores the distinction between genuine emotion and ersatz emotion","ignores the fact that a person who is imagining knows that he or\nshe is imagining","makes irrelevant distinctions between vivid and weak imaginative\ncapacities"],"correct":2,"explanation":"The correct answer is option C. This can be inferred from the passage. The passage provides evidence that supports the conclusion that ignores the fact that a person who is imagining knows that he or\nshe is imagining. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":4,"question":"The passage supports all of the following statements about the\ndifferences between Gombrich and Radford EXCEPT:","options":["Radfod's argument relies on a notion of irrationality in a way\nthat Gomgbrich's argument does not.","Gmbrich's position is closer to the position of the majority of\npsychologists than is Radford's.","Gombrich, unlike Radford, argues that we do not have true emotions\nin response to art.","Gombrich's argument rests on a notion of memory in a way that\nRadford's argument does not."],"correct":1,"explanation":"The correct answer is option B. The passage supports this answer: gmbrich's position is closer to the position of the majority of\npsychologists than is radford's. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":5,"question":"Which one of the following best captures the progression of the\nauthor's argument in lines 9-31?(yes)","options":["The emotional responses to events ranging from the real to the\ndepicted illustrate the irrationality of emotional response.","A series of events that range from the real to the depicted\nconveys the contrast between real events and cinematic depiction.","An intensification in emotional response to a series of events\nthat range from the real to the depicted illustrates Frijda's law.","The consistency of emotional responses to events that range from\nthe real to the depicted challenges Frijda's law."],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: the consistency of emotional responses to events that range from\nthe real to the depicted challenges frijda's law. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":6,"question":"Author's assertions concerning movies about ghosts imply that all\nof the following statements are false EXCEPT:","options":["Movies about ghosts are terrifying in proportion to viewers'\nbeliefs in the phenomenon of ghosts.","Movies about imaginary phenomena like ghosts may be just as\nterrifying as movies about phenomena like snake.","Movies about ghosts and snakes are not terrifying because people\nknow that what they viewing is not real.","Movies about ghosts are terrifying to viewers who previously\nrejected the possibility of ghosts because movies permanently alter the\nviewers sense of reality."],"correct":1,"explanation":"The correct answer is option B. The passage supports this answer: movies about imaginary phenomena like ghosts may be just as\nterrifying as movies about phenomena like snake. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."}]},"15":{"id":15,"title":"Although bacteria are unicellular and among the simplest autonomous forms of life,","difficulty":"Moderate","passage":"Although bacteria are unicellular and among the simplest autonomous forms of life, they show a remarkable ability to sense their environment. They are attracted to materials they need and are repelled by harmful substances. Most types of bacteria swim very erratically: short smooth runs in relatively straight lines are followed by brief tumbles, after which the bacteria shoot off in random directions. This leaves researchers with the question of how such bacteria find their way to an attractant such as food or, in the case of photosynthetic bacteria, light, if their swimming pattern consists only of smooth runs and tumbles, the latter resulting in random changes in direction.\n\nOne clue comes from the observation that when a chemical attractant is added to a suspension of such bacteria, the bacteria swim along a gradient of the attractant, from an area where the concentration of the attractant is weaker to an area where it is stronger. As they do so, their swimming is characterized by a decrease in tumbling and an increase in straight runs over relatively longer distances. As the bacteria encounter increasing concentrations of the attractant, their tendency to tumble is suppressed, whereas tumbling increases whenever they move away from the attractant. The net effect is that runs in the direction of higher concentrations of the attractant become longer and straighter as a result of the suppression of tumbling, whereas runs away from it are shortened by an increased tendency of the bacteria to tumble and change direction.\n\nBiologists have proposed two mechanisms that bacteria might use in detecting changes in the concentration of a chemical attractant. First, a bacterium might compare the concentration of a chemical at the front and back of its cell body simultaneously. If the concentration is higher at the front of the cell, then it knows it is moving up the concentration gradient, from an area where the concentration is lower to an area where it is higher. Alternatively, it might measure the concentration at one instant and again after a brief interval, in which case the bacterium must retain a memory of the initial concentration. Researchers reasoned that if bacteria do compare concentrations at different times, then when suddenly exposed to a uniformly high concentration of an attractant, the cells would behave as if they were swimming up a concentration gradient, with long, smooth runs and relatively few tumbles. If, on the other hand, bacteria detect a chemical gradient by measuring it simultaneously at two distinct points, front and back, on the cell body, they would not respond to the jump in concentration because the concentration of the attractant in front and back of the cells, though high, would be uniform. Experimental evidence suggests that bacteria compare concentrations at different times.","questions":[{"id":1,"question":"It can be inferred from the passage that which one of the following\nexperimental results would suggest that bacteria detect changes in the\nconcentration of an attractant by measuring its concentration in front\nand back of the cell body simultaneously?","options":["When suddenly transferred from a medium in which the concentration\nof an attractant was uniformly low to one in which the concentration was\nuniformly high, the tendency of the bacteria to tumble and undergo\nrandom changes in direction increased.","When suddenly transferred from a medium in which the concentration\nof an attractant was uniformly low to one in which the concentration was\nuniformly high, the bacteria's exhibited no change in the pattern of\ntheir motion.","When suddenly transferred from a medium in which the concentration\nof an attractant was uniformly low to one in which the concentration was\nuniformly high, the bacteria's movement was characterized by a complete\nabsence of tumbling.","When placed in a medium in which the concentration of an\nattractant was in some areas low and in others high, the bacteria\nexhibited an increased tendency to tumble in those areas where the\nconcentration of the attractant was high."],"correct":1,"explanation":"The correct answer is option B. This can be inferred from the passage. The passage provides evidence that supports the conclusion that when suddenly transferred from a medium in which the concentration\nof an attractant was uniformly low to one in which the concentration was\nuniformly high, the bacteria's exhibited no change in the pattern of\ntheir motion. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":2,"question":"It can be inferred from the passage that a bacterium would increase\nthe likelihood of its moving away from an area where the concentration\nof a harmful substance is high if it did which one of the following?","options":["Increased the speed at which it swam immediately after undergoing\nthe random changes in direction that result from tumbling.","Detected the concentration gradient of an attractant toward which\nit could begin to swim.","Relied on the simultaneous measurement of the concentration of the\nsubstance in front and back of its body, rather than on the comparison\nof the concentration at different points in time.","Exhibited an increased tendency to tumble as it encountered\nincreasing concentrations of the substance, and suppressed tumbling as\nit detected decreases in the concentration of the substance."],"correct":3,"explanation":"The correct answer is option D. This can be inferred from the passage. The passage provides evidence that supports the conclusion that exhibited an increased tendency to tumble as it encountered\nincreasing concentrations of the substance, and suppressed tumbling as\nit detected decreases in the concentration of the substance. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":3,"question":"It can be inferred from the passage that when describing bacteria\nas \"swimming up a concentration gradient\" (lines 49-50), the author\nmeans that they were behaving as if they were swimming","options":["Against a resistant medium that makes their swimming less\nefficient.","Away from a substance to which they are normally attracted.","Away from a substance that is normally harmful to them.","From an area where the concentration of a substance is weaker to\nan area where it is stronger."],"correct":3,"explanation":"The correct answer is option D. This can be inferred from the passage. The passage provides evidence that supports the conclusion that from an area where the concentration of a substance is weaker to\nan area where it is stronger. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":4,"question":"The passage indicates that the pattern that characterizes a\nbacterium's motion changes in response to","options":["The kinds of chemical attractants present in different\nconcentration gradients.","The mechanism that the bacterium adopts in determining the\npresence of an attractant.","The bacterium's detection of changes in the concentration of an\nattractant.","The extent to which neighboring bacteria are engaged in\ntumbling."],"correct":2,"explanation":"The correct answer is option C. The passage supports this answer: the bacterium's detection of changes in the concentration of an\nattractant. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":5,"question":"Which one of the following best describes the organization of the\nthird paragraph of the passage?","options":["Two approaches to a problem are discussed, a test that would\ndetermine which is more efficient is described, and a conclusion is\nmade, based on experimental evidence.","Two hypotheses are described, a way of determining which of them\nis more likely to be true is discussed, and one said to be more accurate\non the basis of experimental evidence.","Two hypotheses are described, the flaws inherent in one of them\nare elaborated, and experimental evidence confirming the other is cited.","An assertion that a species has adopted two different mechanisms\nto solve a particular problem is made, and evidence is then provided in\nsupport of that assertion."],"correct":1,"explanation":"The correct answer is option B. The passage supports this answer: two hypotheses are described, a way of determining which of them\nis more likely to be true is discussed, and one said to be more accurate\non the basis of experimental evidence. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":6,"question":"The passage provides information in support of which one of the\nfollowing assertions?","options":["The seemingly erratic motion exhibited by a microorganism can in\nfact reflect a mechanism by which it is able to control its movement.","Biologists often overstate the complexity of simple organisms such\nas bacteria.","A bacterium cannot normally retain a memory of a measurement of\nthe concentration of an attractant.","Bacteria now appear to have less control over their movement than\nbiologists had previously hypothesized."],"correct":0,"explanation":"The correct answer is option A. The passage supports this answer: the seemingly erratic motion exhibited by a microorganism can in\nfact reflect a mechanism by which it is able to control its movement. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."}]},"16":{"id":16,"title":"Anthropologist David Mandelbaum makes a distinction between life-passage studies","difficulty":"Moderate","passage":"Anthropologist David Mandelbaum makes a distinction between life-passage studies and life-history studies which emerged primarily out of research concerning Native Americans. Life-passage studies, he says, \"emphasize the requirements of society, showing how groups socialize and enculturate (v. ) their young in order to make them into viable members of society.\" Life histories, however, \"emphasize the experiences and requirements of the individual, how the person copes with society rather than how society copes with the stream of individuals.\" Life-passage studies bring out the general cultural characteristics and commonalities (a common feature or attribute) that broadly define a culture, but are unconcerned with an individual's choices or how the individual perceives and responds to the demands and expectations imposed by the constraints of his or her culture. This distinction can clearly be seen in the autobiographies of Native American women.\n\nFor example, some early recorded autobiographies, such as The Autobiography of a Fox (Fox: ()) Indian Woman, a life passage recorded by anthropologist Truman Michelson, emphasizes prescribed roles. The narrator presents her story in a way that conforms with tribal expectations. Michelson's work is valuable as ethnography, as a reflection of the day-to-day responsibilities of Mesquakie women, yet as is often the case with life-passage studies, it presents little of the central character's psychological motivation. The Fox woman's life story focuses on her tribal education and integration into the ways of her people, and relates only what Michelson ultimately decided was worth preserving. The difference between the two types of studies is often the result of the amount of control the narrator maintains over the material; autobiographies in which there are no recorder-editors are far more reflective of the life-history category, for there are no outsiders shaping the story to reflect their preconceived notions of what the general cultural patterns are.\n\nFor example, in Maria Campbell's account of growing up as a Canadian Metis who was influenced strongly, and often negatively, by the non-Native American world around her, one learns a great deal about the life of Native American women, but Campbell's individual story, which is told to us directly, is always the center of her narrative. Clearly it is important to her to communicate to the audience what her experiences as a Native American have been. Through Campbell's story of her family the reader learns of the effect of poverty and prejudice on a people. The reader becomes an intimate of Campbell the writer, sharing her pain and celebrating her small victories. Although Campbell's book is written as a life history (the dramatic moments, the frustrations, and the fears are clearly hers), it reveals much about ethnic relations in Canada while reflecting the period in which it was written.","questions":[{"id":1,"question":"Which one of the following is the most accurate expression of the\nmain point of the passage?","options":["The contributions of life-history studies to anthropology have\nmade life-passage studies obsolete.","Despite their dissimilar approaches to the study of culture,\nlife-history and life-passage studies have similar goals.","The autobiographies of Native American women illustrate the\ndifferences between life-history and life-passage studies.","The roots of Maria Campbell's autobiography can be traced to\nearlier narratives such as The Autobiography of a Fox Indian\nWoman."],"correct":2,"explanation":"The correct answer is option C. The passage supports this answer: the autobiographies of native american women illustrate the\ndifferences between life-history and life-passage studies. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"The term \"prescribed roles\" in line 24 of the passage refers to the","options":["Function of life-passage studies in helping ethnologists to\nunderstand cultural tradition.","Function of life-history studies in helping ethnologists to gather\ninformation.","Way in which a subject of a life passage views himself or herself.","Roles generally adopted by individuals in order to comply with\ncultural demands."],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: roles generally adopted by individuals in order to comply with\ncultural demands. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":3,"question":"The reference to the \"psychological motivation\" (line 30) of the\nsubject of The Autobiography of a Fox Indian Woman serves primarily to","options":["Dismiss as irrelevant the personal perspective in the life-history\nstudy.","Identify an aspect of experience that is not commonly a major\nfocus of life-passage studies.","Clarify the narrator's self-acknowledged purpose in relating a\nlife passage.","Suggest a common conflict between the goals of the narrator and\nthose of the recorder in most life-passage studies."],"correct":1,"explanation":"The correct answer is option B. The passage supports this answer: identify an aspect of experience that is not commonly a major\nfocus of life-passage studies. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":4,"question":"Which one of following statements about Maria Campbell can be\ninferred from material in the passage?","options":["She was familiar with the very early history of her tribe but\nlacked insight into the motivations of non-Native Americans.","She was unfamiliar with Michelson's work but had probably read a\nnumber of life-passage studies about Native Americans.","She had training as a historian but was not qualified as an\nanthropologist.","Her life history provides more than a record of her personal\nexperience."],"correct":3,"explanation":"The correct answer is option D. Thi
