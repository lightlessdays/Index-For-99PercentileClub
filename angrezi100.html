ing one period of rapid Northern Hemisphere cooling in the early 1950s, the sub-Sahara was unusually rainy. Moreover, in the early 1980s, when the drought was particularly severe, Northern Hemisphere lands actually warmed slightly. And further doubt has been cast on the hypothesis by recent analyses suggesting that, when surface temperatures of water as well as land are taken into account, the Northern Hemisphere may not have cooled at all.","questions":[{"id":1,"question":"Which one of the following best expresses the main idea of the\npassage?","options":["There is strong evidence to support the theory that an increase in\natmospheric dust has contributed to the severity of the drought in\nsub-Saharan West Africa.","The suggestion that Northern Hemisphere cooling is contributing to\na decline of rainfall in sub-Saharan West Africa is open to question.","The expansion of the circumpolar vortex has caused a dramatic\nshift in the atmospheric circulation patterns above sub-Saharan West\nAfrica.","The drought in sub-Saharan West Africa represents a long-term\npermanent alteration in global climate patterns."],"correct":1,"explanation":"The correct answer is option B. The passage supports this answer: the suggestion that northern hemisphere cooling is contributing to\na decline of rainfall in sub-saharan west africa is open to question. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"The author's attitude toward the cooling hypothesis is best\ndescribed as one of","options":["vehement opposition","cautious skepticism","growing ambivalence","guarded enthusiasm"],"correct":1,"explanation":"The correct answer is option B. The author's tone throughout the passage is best characterised as reflected in this answer. The language and rhetorical choices in the passage support this reading."},{"id":3,"question":"According to the passage proponents of the cooling hypothesis\nsuggested that the circumpolar vortex is likely to expand when which one\nof the following occurs?","options":["The average annual atmospheric temperature of the tropics is\nsignificantly higher than normal for an extended period of time.","The average annual snowfall in the Northern Hemisphere is lower\nthan normal for an extended period of time.","The average annual surface temperature of Northern Hemisphere\nwaters is higher than the average annual surface temperature of Northern\nHemisphere landmasses.","There is a significant increase in the difference between the\naverage annual atmospheric temperature of the tropics and that of the\nmore northern latitudes."],"correct":3,"explanation":"The correct answer is option D. This can be inferred from the passage. The passage provides evidence that supports the conclusion that there is a significant increase in the difference between the\naverage annual atmospheric temperature of the tropics and that of the\nmore northern latitudes. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":4,"question":"Which one of the following can be inferred from the passage about\nthe average annual temperature of the air over Northern Hemisphere\nlandmasses before 1945?","options":["It was higher than it was between 1945 and the early 1970s.","It was lower than it was during the early 1980s.","It was the same as it was between 1945 and the early 1970s.","It was the same as the annual average surface temperature of\nNorthern Hemisphere landmasses and bodies of water between 1945 and the\nearly 1970s."],"correct":0,"explanation":"The correct answer is option A. This can be inferred from the passage. The passage provides evidence that supports the conclusion that it was higher than it was between 1945 and the early 1970s. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":5,"question":"Which one of the following best describes the organization of the\npassage?","options":["Opposing points of view are presented, evidence supporting each\npoint of view is discussed, and then one point of view is developed into\na formal hypothesis.","A theory is discussed and different points of view about the\ntheory are discussed, supported and then reconciled.","A hypothesis is proposed, contradictory evidence is discussed and\nthen the hypothesis is amended.","A theory explaining a phenomenon is proposed, supporting evidence\nis considered and then the theory is disputed."],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: a theory explaining a phenomenon is proposed, supporting evidence\nis considered and then the theory is disputed. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":6,"question":"A proponent of the cooling hypothesis would most likely argue that\nthe return of the monsoon rains to sub-Saharan West Africa would\nindicate that which one of the following has also occurred?","options":["The amount of ice and snow coverage over the landmasses of the\nNorthern Hemisphere has increased.","The average annual temperature of the atmosphere over the middle\nand high latitudes of the Northern Hemisphere has decreased.","The average annual temperature of the atmosphere over the tropics\nin the Northern Hemisphere has increased.","The atmospheric circulation pattern of the high-altitude westerly\nwinds has resumed its normal pattern.\n\n# LSAT 23 SECTION III\n\nTime 35 minutes 26 Questions\n\nDirections: Each passage in this section is followed by a group of\nquestions to be answered on the basis of what is stated or implied in\nthe passage. For some of the questions, more than one of the choices\ncould conceivably answer the question. However, you are to choose the\nbest answer, that is, the response that most accurately and completely\nanswers the question, and blacken the corresponding space on your answer\nsheet.\n\nWherever the crime novels of P. D. James are discussed by critics, there\nis a tendency on the one hand to exaggerate her merits and on the other\nto castigate her as a genre writer who is getting above herself . Perhaps underlying the debate is that\nfamiliar, false opposition set up between different kinds of fiction,\naccording to which enjoyable novels are held to be somehow slightly\nlowbrow, and a novel is not considered true literature unless it is a\ntiny bit dull.\n\nThose commentators who would elevate James' books to the status of high\nliterature point to her painstakingly constructed characters, her\nelaborate settings, her sense of place, and her love of abstractions:\nnotions about morality, duty, pain, and pleasure are never far from the\nlips of her police officers and murderers. Others find her pretentious\nand tiresome; an inverted snobbery accuses her of abandoning the\ntime-honored conventions of the detective genre in favor of a highbrow\nliterary style. The critic Harriet Waugh wants P. D. James to get on\nwith (get on with: ) \"the more taxing (: ONEROUS, WEARING)\nbusiness of laying a tricky trail and then fooling the reader\"; Philip\nOakes in The Literary Review groans, \"Could we please proceed with\n the business of clapping the handcuffs on the\nkiller?\"\n\nJames is certainly capable of strikingly good writing. She takes immense\ntrouble to provide her characters with convincing histories and\npassions. Her descriptive digressions are part of the pleasure of her\nbooks and give them dignity and weight. But it is equally true that they\nfrequently interfere with the story; the patinas and aromas of a country\nkitchen receive more loving attention than does the plot itself. Her\ndevices to advance the story can be shameless (shameless:\nadj.) and thin (lacking substance or strength \"thin broth\" \"a\nthin plot\"), and it is often impossible to see how her detective arrives\nat the truth; one is left to conclude that the detective solves crimes\nthrough intuition. At this stage in her career P. D. James seems to be\nless interested in the specifics of detection than in her characters'\nvulnerabilities and perplexities.\n\nHowever, once the rules of a chosen genre cramp (cramp: )\ncreative thought, there is no reason why an able and interesting writer\nshould accept them. In her latest book, there are signs that James is\nbeginning to feel constrained by the crime-novel genre, here her\ndetermination to leave (to put, deposit, or deliver before or in the\nprocess of departing \"someone left a package for you\") areas of\nambiguity in the solution of the crime and to distribute guilt among the\nmurderer, victim, and bystanders points to conscious rebellion against\nthe traditional neatness of detective fiction. It is fashionable, though\nreprehensible, for one writer to prescribe to another. But perhaps the\ntime has come for P. D. James to slide out of her handcuffs and stride\ninto the territory of the mainstream novel."],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: the atmospheric circulation pattern of the high-altitude westerly\nwinds has resumed its normal pattern.\n\n# lsat 23 section iii\n\ntime 35 minutes 26 questions\n\ndirections: each passage in this section is followed by a group of\nquestions to be answered on the basis of what is stated or implied in\nthe passage. for some of the questions, more than one of the choices\ncould conceivably answer the question. however, you are to choose the\nbest answer, that is, the response that most accurately and completely\nanswers the question, and blacken the corresponding space on your ans rs, her elaborate settings, her sense of place, and her love of abstractions: notions about morality, duty, pain, and pleasure are never far from the lips of her police officers and murderers. Others find her pretentious and tiresome; an inverted snobbery accuses her of abandoning the time-honored conventions of the detective genre in favor of a highbrow literary style. The critic Harriet Waugh wants P. D. James to get on with \"the more taxing business of laying a tricky trail and then fooling the reader\"; Philip Oakes in The Literary Review groans, \"Could we please proceed with the business of clapping the handcuffs on the killer?\"\n\nJames is certainly capable of strikingly good writing. She takes immense trouble to provide her characters with convincing histories and passions. Her descriptive digressions are part of the pleasure of her books and give them dignity and weight. But it is equally true that they frequently interfere with the story; the patinas and aromas of a country kitchen receive more loving attention than does the plot itself. Her devices to advance the story can be shameless and thin (lacking substance or strength \"thin broth\" \"a thin plot\"), and it is often impossible to see how her detective arrives at the truth; one is left to conclude that the detective solves crimes through intuition. At this stage in her career P. D. James seems to be less interested in the specifics of detection than in her characters' vulnerabilities and perplexities.\n\nHowever, once the rules of a chosen genre cramp creative thought, there is no reason why an able and interesting writer should accept them. In her latest book, there are signs that James is beginning to feel constrained by the crime-novel genre, here her determination to leave (to put, deposit, or deliver before or in the process of departing \"someone left a package for you\") areas of ambiguity in the solution of the crime and to distribute guilt among the murderer, victim, and bystanders points to conscious rebellion against the traditional neatness of detective fiction. It is fashionable, though reprehensible, for one writer to prescribe to another. But perhaps the time has come for P. D. James to slide out of her handcuffs and stride into the territory of the mainstream novel.","questions":[{"id":1,"question":"Which one the following best states the author's main conclusion?","options":["Because P. D. James's potential as a writer is stifled by her\nchosen genre, she should turn her talents toward writing mainstream\nnovels.","Because the requirements of the popular novel are incompatible\nwith true creative expression, P. D. James's promise as a serious author\nhas been diminished.","The dichotomy between popular and sophisticated literature is well\nillustrated in the crime novels of P. D. James.","The critics who have condemned P. D. James's lack of attention to\nthe specifics of detection fail to take into account her carefully\nconstructed plots."],"correct":0,"explanation":"The correct answer is option A. The passage supports this answer: because p. d. james's potential as a writer is stifled by her\nchosen genre, she should turn her talents toward writing mainstream\nnovels. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"The author refers to the \"patinas and aromas of a county kitchen\"\nline 32) most probably in order to","options":["illustrate James's gift for innovative phrasing","highlight James's interest in rural society","allow the reader to experience the pleasure of James's books","exemplify James's preoccupation with descriptive writing"],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: exemplify james's preoccupation with descriptive writing. This is the most accurate and complete re the reader to solve the\ncrime","too few suspects to generate suspense","too simple a plot to hold the attention of the reader"],"correct":0,"explanation":"The correct answer is option A. This can be inferred from the passage. The passage provides evidence that supports the conclusion that too much material that is extraneous to the solution of the crime. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":6,"question":"It can be inferred from the passage that, in the author's view,\ntraditional detective fiction is characterized by","options":["concern for the weaknesses and doubts of the characters","transparent devices to advance the plot","the attribution of intuition to the detective","the straightforward assignment of culpability for the crime"],"correct":3,"explanation":"The correct answer is option D. This can be inferred from the passage. The passage provides evidence that supports the conclusion that the straightforward assignment of culpability for the crime. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."}]},"90":{"id":90,"title":"Many Native Americans view the archaeological excavation and museum display of","difficulty":"Moderate","passage":"Many Native Americans view the archaeological excavation and museum display of ancestral skeletal remains and items buried with them as a spiritual desecration. A number of legal remedies that either prohibit or regulate such activities may be available to Native American communities, if they can establish standing (a position from which one may assert or enforce legal rights and duties) in such cases. In disinterment cases, courts have traditionally affirmed the standing of three classes of plaintiffs: the deceased's heirs, the owner of the property on which the grave is located, and parties, including organizations or distant relatives of the deceased, that have a clear interest in the preservation of a particular grave. If an archaeologically discovered grave is of recent historical origin and associated with an identifiable Native American community, Native Americans are likely to establish standing in a suit to prevent disinterment of the remains, but in cases where the grave is ancient and located in an area where the community of Native Americans associated with the grave has not recently lived, they are less likely to be successful in this regard. Indeed, in most cases involving ancient graves, to recognize that Native Americans have standing would represent a significant expansion of common law. In cases where standing can be achieved, however, common law may provide a basis for some Native American claims against archaeologists and museums.\n\nProperty law, for example, can be useful in establishing Native American claims to artifacts that are retrieved in the excavation of ancient graves and can be considered the communal property of Native American tribes or communities. In Charrier v. Bell, a United States appellate court ruled that the common law doctrine of abandonment, which allows the finder of abandoned property to claim ownership, does not apply to objects buried with the deceased. The court ruled that the practice of burying items with the body of the deceased \"is not intended as a means of relinquishing ownership to a stranger\" and that to interpret it as such \"could render a grave subject to despoliation either immediately after interment or...after removal of the descendants of the deceased from the neighborhood of the cemetery.\" This ruling suggests that artifacts excavated from Native American ancestral graves should be returned to representatives of tribal groups who can establish standing in such cases.\n\nMore generally, United Sates courts have upheld the distinction between individual and communal property, holding that an individual Native American does not have title to communal property owned and held for common use by his or her tribe. As a result, museums cannot assume that they have valid title to cultural property merely because they purchased in good faith an item that was originally sold in good faith (in good faith:,) by an individual member of a Native American community.","questions":[{"id":1,"question":"The primary purpose of the passage is to provide an answer to which\none of the following questions?","options":["How should the legal protection of Native American burial grounds\nbe enhanced?","What characteristics of Native American burial grounds enhance\ntheir chances for protection by the law?","In what ways does the law protect the rights of Native Americans\nin regards to the contents of ancestral graves?","Why are the courts concerned with protecting Native American\nburial grounds from desecration?"],"correct":2,"explanation":"The correct answer is option C. The passage as a whole is primarily focused on this theme. While other options may touch on aspects mentioned in the passage, the central purpose is best captured by this answer: in what ways does the law protect the rights of native americans\nin regards to the contents of ancestral graves?."},{"id":2,"question":"It can be inferred that a court would be most likely to deny\nstanding in a disinterment case to which one of the following Native\nAmerican plaintiffs?","options":["one who seeks, as one of several beneficiaries of his father's\nestate, to protect the father's burial site","one who seeks to prevent tenants on her land from taking artifacts\nfrom a grave located on the property","one who represents a tribe whose members hope to prevent the\ndisinterment of remains from a distant location from which the tribe\nrecently moved","one who seeks the return of artifacts taken from the ancient\nburial grounds of disparate tribes and now displayed in a museum"],"correct":3,"explanation":"The correct answer is option D. This can be inferred from the passage. The passage provides evidence that supports the conclusion that one who seeks the return of artifacts taken from the ancient\nburial grounds of disparate tribes and now displayed in a museum. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":3,"question":"According to the passage, which one of the following is true of\ncases involving ancient graves?","options":["Once a plaintiff's standing has been established, such cases are\nusually more difficult to resolve than are cases involving more recent\ngraves.","The distinction between individual and communal property is\nusually an issue in such cases.","Even when a plaintiff's standing has been established, property\nlaw cannot be used as a basis for the claims of Native Americans in most\nsuch cases.","In most such cases, common law does not currently provide a clear\nbasis for establishing that Native Americans have standing."],"correct":3,"explanation":"The correct answer is option D. The passage explicitly states or directly supports that in most such cases, common law does not currently provide a clear\nbasis for establishing that native americans have standing. This information is stated in the passage, making it the most accurate answer based on the text."},{"id":4,"question":"The passage suggests that in making the ruling in Charrier v.\nBell the court is most likely to have considered the answer to which\none of the following questions?","options":["Are the descendants of the deceased still alive?","What was the reason for burying the objects in question?","How long after interment had buried objects been claimed by\nstranger?","Did the descendants of the deceased remain in the neighborhood of\nthe cemetery?"],"correct":1,"explanation":"The correct answer is option B. This can be inferred from the passage. The passage provides evidence that supports the conclusion that what was the reason for burying the objects in question?. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":5,"question":"The author uses the second paragraph to","options":["illustrate the contention that common law may support the claims\nof Native Americans to the contents of ancestral graves","exemplify the difficulties that Native Americans are likely to\nencounter in claiming ancestral remains","introduce a discussion of the distinction between individual and\ncommunal property","confirm the contention that cases involving ancient graves present\nunresolved legal problems"],"correct":0,"explanation":"The correct answer is option A. The passage supports this answer: illustrate the contention that common law may support the claims\nof native americans to the contents of ancestral graves. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":6,"question":"Which one of the following best expresses the main idea of the\npassage?","options":["Prior to an appellate court's ruling in Charrier v. Bell, Native\nAmericans had no legal grounds for demanding the return of artifacts\nexcavated from ancient graves.","Property law offers the most promising remedies to Native\nAmericans seeking to recover communally owned artifacts that were sold\nto museums without tribal authorization.","The older the grave, the more difficult it is for Native Americans\nto establish standing in cases concerning the disposition of\narchaeologically excavated ancestral remains.","In cases in which Native Americans can establish standing, common\nlaw can be useful in protecting ancestral remains and the artifacts\nburied with them."],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: in cases in which native americans can establish standing, common\nlaw can be useful in protecting ancestral remains and the artifacts\nburied with them. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."}]},"91":{"id":91,"title":"When the same habitat types (forests, oceans, grasslands etc.) in regions of","difficulty":"Moderate","passage":"When the same habitat types (forests, oceans, grasslands etc.) in regions of different latitudes are compared, it becomes apparent that the overall number of species increases from pole to equator. This latitudinal gradient is probably even more pronounced than current records indicate, since researchers believe that most undiscovered species live in the tropics.\n\nOne hypothesis to explain this phenomenon, the \"time theory\" holds that diverse species adapted to today's climatic conditions have had more time to emerge in the tropical regions, which, unlike the temperate and arctic zones, have been unaffected by a succession of ice ages. However, ice ages have caused less disruption in some temperate regions than in others and have not interrupted arctic conditions.\n\nAlternatively, the species-energy hypothesis proposes the following positive correlations: incoming energy from the Sun correlated with rates of growth and reproduction; rates of growth and reproduction with the amount of living matter )) at a given moment; and the amount of biomass with number of species. However, since organisms may die rapidly, high production rates can exist with low biomass. And high biomass can exist with few species. Moreover, the mechanism proposed—greater energy influx leading to bigger populations, thereby lowering the probability of local extinction—remains untested.\n\nA third hypothesis centers on the tropics' climatic stability, which provides a more reliable supply of resources. Species can thus survive even with few types of food, and competing species can tolerate greater overlap between their respective niches. Both capabilities enable more species to exist on the same resources. However, the ecology of local communities cannot account for the origin of the latitudinal gradient. Localized ecological processes such as competition do not generate regional pools of species, and it is the total number of species available regionally for colonizing any particular area that makes the difference between, for example, a forest at the equator and one at higher latitude.\n\nA fourth and most plausible hypothesis focuses on regional speciation, and in particular on rates of speciation and extinction. According to this hypothesis, if speciation rates become higher toward the tropics, and are not negated by extinction rates, then the latitudinal gradient would result—and become increasingly steep.\n\nThe mechanism for this rate-of-speciation hypothesis is that most new animal species, and perhaps plant species, arise because a population subgroup becomes isolated. This subgroup evolves differently and eventually cannot interbreed with members of the original population. The uneven spread of a species over a large geographic area promotes this mechanism: at the edges, small populations spread out and form isolated groups. Since subgroups in an arctic environment are more likely to face extinction than those in the tropics, the latter are more likely to survive long enough to adapt to local conditions and ultimately become new species.","questions":[{"id":1,"question":"Which one of the following most accurately expressed the main idea\nof the passage?","options":["At present, no single hypothesis explaining the latitudinal\ngradient in numbers of species is more widely accepted than any other.","The tropical climate is more conductive to promoting species\ndiversity than are arctic or temperate climates.","Several explanations have been suggested for global patterns in\nspecies distribution, but a hypothesis involving rates of speciation\nseems most promising.","Despite their differences, the various hypotheses regarding a\nlatitudinal gradient in species diversity concur in prediction that the\ngradient can be expected to increase."],"correct":2,"explanation":"The correct answer is option C. The passage supports this answer: several explanations have been suggested for global patterns in\nspecies distribution, but a hypothesis involving rates of speciation\nseems most promising. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"Which one of the following situations is most consistent with the\nspecies-energy hypothesis as described in the passage?","options":["The many plants in a large agricultural tract represent a limited\nrange of species.","An animal species experiences a death rate almost as rapid as its\nrate of growth and reproduction.","Within the small number of living organisms in a desert habitat,\nmany different species are represented.","In an arctic tundra, the plants and animals exhibit a slow rate of\ngrowth and reproduction."],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: in an arctic tundra, the plants and animals exhibit a slow rate of\ngrowth and reproduction. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":3,"question":"As presented in the passage, the principles of the time theory most\nstrongly support which one of the following predictions?","options":["In the absence of additional ice ages, the number of species at\nhigh latitudes could eventually increase significantly.","No future ice ages are likely to change the climatic conditions\nthat currently characterize temperate regions.","If no further ice ages occur, climatic conditions at high\nlatitudes might eventually resemble those at today's tropical latitudes.","Researchers will continue to find many more new species in the\ntropics than in the arctic and temperate zones."],"correct":0,"explanation":"The correct answer is option A. The passage supports this answer: in the absence of additional ice ages, the number of species at\nhigh latitudes could eventually increase significantly. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":4,"question":"Which one of the following, if true, most clearly weakens the\nrate-of-speciation hypothesis as it is described in the passage?","options":["A remote subgroup of a tropical species is reunited with the\noriginal population and proves unable to interbreed with members of this\noriginal population.","Investigation of a small area of a tropical rain forest reveals\nthat many competing species are able to coexist on the same range of\nresources.","A correlation between higher energy influx, larger populations and\nlower probability of local extinction is definitively established.","Most of the isolated subgroups of mammalian life within a tropical\nzone are found to experience rapid extinction."],"correct":3,"explanation":"The correct answer is option D. This option most directly addresses the argument in question. It provides evidence or reasoning that bears on the claim being evaluated, while the other options are either irrelevant, supportive of the wrong conclusion, or do not address the specific argument."},{"id":5,"question":"Which one of the following inferences about the biological\ncharacteristics of a temperate-zone grassland is most strongly supported\nby the passage?","options":["It has more different species than does a tropical-zone forest.","Its climatic conditions have been severely interrupted in the past\nby succession of ice ages.","If it has a large amount of biomass, it also has a large number of\ndifferent species.","It has a larger regional pool of species than does an arctic\ngrassland."],"correct":3,"explanation":"The correct answer is option D. This can be inferred from the passage. The passage provides evidence that supports the conclusion that it has a larger regional pool of species than does an arctic\ngrassland. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":6,"question":"With which one of the following statements concerning possible\nexplanations for the latitudinal gradient in number of species would the\nauthor be most likely to agree?","options":["The time theory is the least plausible of proposed hypotheses,\nsince it does not correctly assess the impact of ice ages upon tropical\nconditions.","The rate-of-speciation hypothesis addresses a principal objection\nto the climatic-stability hypothesis.","The major objection to the time theory is that it does not\naccurately reflect the degree to which the latitudinal gradient exists,\nespecially when undiscovered species are taken into account.","Despite the claims of the species-energy hypothesis, a high rate\nof biological growth and reproduction is more likely to exist with low\nbiomass than with high biomass."],"correct":1,"explanation":"The correct answer is option B. The passage supports this answer: the rate-of-speciation hypothesis addresses a principal objection\nto the climatic-stability hypothesis. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."}]},"92":{"id":92,"title":"Two impressive studies have reexamined Eric Williams' conclusion that Britain's","difficulty":"Moderate","passage":"Two impressive studies have reexamined Eric Williams' conclusion that Britain's abolition of the slave trade in 1807 and its emancipation of slavers in its colonies in 1834 were driven primarily by economic rather than humanitarian motives. Blighted by depleted soil, indebtedness, and the inefficiency of coerced labor, these colonies, according to Williams, had by 1807 become an impediment to British economic progress.\n\nSeymour Drescher provides a more balanced view. Rejecting interpretations based either on economic interest or the moral vision of abolitionists, Drescher has reconstructed the populist (believer in the rights, wisdom, or virtues of the common people) characteristics of British abolitionism, which appears to have cut across lines of class, party, and religion. Noting that between 1780 and 1830 antislavery petitions outnumbered those on any other issue, including parliamentary reform, Drescher concludes that such support cannot be explained by economic interest alone, especially when much of it came from the unenfranchised masses. Yet, aside from demonstrating that such support must have resulted at least in part from widespread literacy and a tradition of political activism, Drescher does not finally explain how England, a nation deeply divided by class struggles, could mobilize popular support for antislavery measures proposed by otherwise conservative politicians in the House of Lords and approved there with little dissent.\n\nDavid Eltis' answer to that question actually supports some of Williams' insights. Eschewing Drescher' s idealization of British traditions of liberty, Eltis points to continuing use of low wages and Draconian vagrancy laws in the seventeenth and eighteenth centuries to ensure the industriousness of British workers. Indeed, certain notables even called for the enslavement of unemployed laborers who roamed the British countryside—an acceptance of coerced labor that Eltis attributes to a preindustrial desire to keep labor costs low and exports competitive. By the late eighteenth century, however, a growing home market began to alert capitalists to the importance of \"want creation\" and to incentives such as higher wages as a means of increasing both worker productivity and the number of consumers.\n\nSignificantly, it was products grown by slaves, such as sugar, coffee, and tobacco, that stimulated new wants at all levels of British society and were the forerunners of products intended in modern capitalist societies to satisfy what Eltis describes as \"nonsubsistence or psychological needs.\" Eltis concludes that in economy that had begun to rely on voluntary labor to satisfy such needs, forced labor necessarily began to appear both inappropriate and counterproductive to employers. Eltis thus concludes that, while Williams may well have underestimated the economic viability of the British colonies employing forced labor in the early 1800s, his insight into the economic motives for abolition was partly accurate. British leaders became committed to colonial labor reform only when they became convinced, for reasons other than those cited by Williams, that free labor was more beneficial to the imperial economy.","questions":[{"id":1,"question":"Which one of the following best describes the main idea of the\npassage?","options":["Although they disagree about the degree to which economic motives\ninfluenced Britain's abolition of slavery, Drescher and Eltis both\nconcede that moral persuasion by abolitionists was a significant factor.","Although both Drescher and Eltis have questioned Williams'\nanalysis of the motivation behind Britain's abolition of slavery, there\nis support for part of Williams' conclusion.","Because he has taken into account the populist characteristics of\nBritish abolitionism, Drescher's explanation of what motivated Britain's\nabolition of slavery is finally more persuasive than that of Eltis.","Neither Eltis nor Drescher has succeeded in explaining why support\nfor Britain's abolition of slavery appears to have cut across lines of\nparty, class, and religion."],"correct":1,"explanation":"The correct answer is option B. The passage supports this answer: although both drescher and eltis have questioned williams'\nanalysis of the motivation behind britain's abolition of slavery, there\nis support for part of williams' conclusion. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"It can be inferred that Eltis cites the views of \"certain notables\"\n(line 35) in order to","options":["support the claim that British traditions of liberty were not as\nstrong as Drescher believed them to be","support the contention that a strong labor force was important to\nBritain's economy","emphasize the importance of slavery as an institution in\npreindustrial Britain","indicate that the laboring classes provided little support for the\nabolition of slavery"],"correct":0,"explanation":"The correct answer is option A. This can be inferred from the passage. The passage provides evidence that supports the conclusion that support the claim that british traditions of liberty were not as\nstrong as drescher believed them to be. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":3,"question":"Which one of the following best states Williams' view of the\nprimary reason for Britain's abolition of the slave trade and the\nemancipation of slaves in its colonies?","options":["British populism appealed to people of varied classes, parties,\nand religions.","Both capitalists and workers in Britain accepted the moral\nprecepts of abolitionists.","Forced labor in the colonies could not produce enough goods to\nsatisfy British consumers.","The operation of colonies based on forced labor was no longer\neconomically advantageous."],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: the operation of colonies based on forced labor was no longer\neconomically advantageous. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":4,"question":"According to Eltis, low wages and Draconian vagrancy laws in\nBritain in the seventeenth and eighteenth centuries were intended to","options":["protect laborers against unscrupulous employment practices","counter the move to enslave unemployed laborers","ensure a cheap and productive work force","ensure that the work force experienced no unemployment"],"correct":2,"explanation":"The correct answer is option C. The passage explicitly states or directly supports that ensure a cheap and productive work force. This information is stated in the passage, making it the most accurate answer based on the text."},{"id":5,"question":"It can be inferred that the author of the passage views Drescher's\npresentation of British traditions concerning liberty as","options":["accurately stated","somewhat unrealistic","carefully researched","unnecessarily tentative"],"correct":1,"explanation":"The correct answer is option B. This can be inferred from the passage. The passage provides evidence that supports the conclusion that somewhat unrealistic. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":6,"question":"The information in the passage suggests that Eltis and Drescher\nagree that","options":["people of all classes in Britain supported the abolition of\nslavery","the motives behind Britain's abolition of slavery were primarily\neconomic","the moral vision of abolitionists played a vital part in Britain's\nabolition of slavery","British traditions of liberty have been idealized by\nhistorians"],"correct":0,"explanation":"The correct answer is option A. This can be inferred from the passage. The passage provides evidence that supports the conclusion that people of all classes in britain supported the abolition of\nslavery. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."}]},"93":{"id":93,"title":"The career of trumpeter Miles Davis was one of the most astonishingly productive","difficulty":"Moderate","passage":"The career of trumpeter Miles Davis was one of the most astonishingly productive that jazz music has ever seen. Yet his genius has never received its due. The impatience and artistic restlessness that characterized his work spawned one stylistic turn after another and made Davis anathema to many critics, who deplored his abandonment first of bebop and then of \"cool\" acoustic jazz for ever more innovative sounds.\n\nHaving begun his career studying bebop, Davis pulled the first of many stylistic surprises when, in 1948, he became a member of an impromptu musical think tank that gathered in a New York City apartment. The work of this group not only slowed down tempos and featured ensemble playing as much as or even more than solos—in direct reaction to bebop—it also became the seedbed for the \"West Coast cool\" jazz style.\n\nIn what would become a characteristic zigzag, Davis didn't follow up on these innovations himself. Instead, in the late 1950s he formed a new band that broke free from jazz's restrictive pattern of chord changes. Soloists could determine the shapes of their melodies without referring back to the same unvarying repetition of chords. In this period, Davis attempted to join jazz phrasings (the act, method, or result of grouping notes into musical phrases), harmonies, and tonal qualities with a unified and integrated sound similar to that of a classical orchestral piece: in his recordings the rhythms, no matter how jazzlike, are always understated, and the instrumental voicings seem muted.\n\nDavis's recordings from the late 1960s signal that, once again, his direction was changing. On Filles de Kilimanjaro, Davis's request that keyboardist Herbie Hancock play electric rather than acoustic piano caused consternation among jazz purists of the time. Other albums featured rock-style beats, heavily electronic instrumentation, a loose improvisational attack and a growing use of studio editing to create jagged soundscapes. By 1969 Davis's typical studio procedure was to have musicians improvise from a base script of material and then to build finished pieces out of tape, like a movie director. Rock groups had pioneered the process; to jazz lovers, raised on the ideal of live improvisation, that approach was a violation of the premise that recordings should simply document the musicians' thought processes in real time. Davis again became the target of fierce polemics by purist jazz critics, who have continued to belittle his contributions to jazz.\n\nWhat probably underlies the intensity of the reactions against Davis is fear of the broadening of possibilities that he exemplified. Ironically, he was simply doing what jazz explorers have always done: reaching for something new that was his own. But because his career endured, because he didn't die young or record only sporadically, and because he refused to dwell in whatever niche he had previously carved out, critics find it difficult to definitively rank Davis in the aesthetic hierarchy to which they cling.","questions":[{"id":1,"question":"Which one of the following best states the main point the passage?","options":["Because the career of Miles Davis was characterized by frequent\nshifts in styles, he never fulfilled his musical potential.","Because the career of Miles Davis does not fit neatly into their\npreconceptions about the life and music of jazz musicians, jazz critics\nhave not accorded him the appreciation he deserves.","Because the career of Miles Davis was unusually long and\nproductive, he never received the popular acclaim generally reserved for\nartists with more tragic life histories.","The long and productive career of Miles Davis spawned most of the\nmajor stylistic changes affecting twentieth-century jazz."],"correct":1,"explanation":"The correct answer is option B. The passage supports this answer: because the career of miles davis does not fit neatly into their\npreconceptions about the life and music of jazz musicians, jazz critics\nhave not accorded him the appreciation he deserves. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"According to the passage, which one of the following true of the\n\"West Coast cool\" jazz style?","options":["It was popularized by Miles Davis.","It was characterized by a unified and integrated sound.","It was played primarily by large ensembles.","It grew out of innovations developed in New York City."],"correct":3,"explanation":"The correct answer is option D. The passage explicitly states or directly supports that it grew out of innovations developed in new york city. This information is stated in the passage, making it the most accurate answer based on the text."},{"id":3,"question":"The passage suggests which one of the following about the kind of\njazz played by Miles Davis prior to 1948?","options":["It was characterized by rapid tempos and an emphasis on solo\nplaying.","It equally balanced ensemble and solo playing.","It was a reaction against more restrictive jazz styles.","It is regarded by purist jazz critics as the only authentic jazz\nstyle."],"correct":0,"explanation":"The correct answer is option A. This can be inferred from the passage. The passage provides evidence that supports the conclusion that it was characterized by rapid tempos and an emphasis on solo\nplaying. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":4,"question":"Which one of the following best describes the author's attitude\ntoward Miles Davis' music?","options":["uneasy ambivalence","cautious neutrality","grudging respect","appreciative advocacy"],"correct":3,"explanation":"The correct answer is option D. The author's tone throughout the passage is best characterised as reflected in this answer. The language and rhetorical choices in the passage support this reading."},{"id":5,"question":"Which one of the following creative processes is most similar to\nMiles Davis' typical studio procedure of the late 1960s, as described in\nthe fourth paragraph of the passage?","options":["The producer of a television comedy show suggests a setting and\ngeneral topic for a comedy sketch and then lets the comedians write\ntheir own script.","An actor digresses from the written script and improvises during a\nmonologue in order to introduce a feeling of spontaneity to the\nperformance.","A conductor rehearses each section of the orchestra separately\nbefore assembling them to rehearse the entire piece together.","An artist has several photographers take pictures pertaining to a\ncertain assigned theme and then assembles them into a pictorial\ncollage."],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: an artist has several photographers take pictures pertaining to a\ncertain assigned theme and then assembles them into a pictorial\ncollage. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":6,"question":"Which one of the following, if true, would most undermine the\nauthor's explanation for the way Miles Davis is regarded by jazz\ncritics?","options":["Many jazz musicians who specialize in improvisational playing are\ngreatly admired by jazz critics.","Many jazz musicians whose careers have been characterized by\nseveral radical changes in style are greatly admired by jazz critics.","Several jazz musicians who perform exclusively on electronic\ninstruments are very highly regarded by jazz critics.","The jazz innovators who are held in the highest regard by jazz\ncritics had brief yet brilliant careers."],"correct":1,"explanation":"The correct answer is option B. The passage supports this answer: many jazz musicians whose careers have been characterized by\nseveral radical changes in style are greatly admired by jazz critics. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."}]},"94":{"id":94,"title":"By the mid-fourteenth century, professional associations of canon lawyers (legal","difficulty":"Moderate","passage":"By the mid-fourteenth century, professional associations of canon lawyers (legal advocates in Christian ecclesiastical courts, which dealt with cases involving marriage, inheritance, and other issues) had appeared in most of Western Europe, and a body of professional standards had been defined for them. One might expect that the professional associations would play a prominent role in enforcing these standards of conduct, as other guilds often did, and as modern professional associations do, but that seems not to have happened. Advocates' professional organizations showed little fervor for disciplining their erring members. Some even attempted to hobble (HAMPER, IMPEDE) efforts at enforcement. The Florentine guild of lawyers, for example, forbade its members to play any role in disciplinary proceedings against other guild members. In the few recorded episodes of disciplinary enforcement, the initiative for disciplinary action apparently came from a dissatisfied client, not from fellow lawyers.\n\nAt first glance, there seem to be two possible explanations for the rarity of disciplinary proceedings. Medieval canon lawyers may have generally observed the standards of professional conduct scrupulously. Alternatively, it is possible that deviations from the established standards of behavior were not uncommon, but that canonical disciplinary mechanisms were so inefficient that most delinquents escaped detection and punishment.\n\nTwo considerations make it clear that the second of these explanations is more plausible. First, the English civil law courts, whose ethical standards were similar to those of ecclesiastical courts, show many more examples of disciplinary actions against legal practitioners than do the records of church courts. This discrepancy could well indicate that the disciplinary mechanisms of the civil courts functioned more efficiently than those of the church courts. The alternative inference, namely, that ecclesiastical advocates were less prone to ethical lapses than their counterparts in the civil courts, seems inherently weak, especially since there was some overlap of personnel between the civil bar and the ecclesiastical bar.\n\nSecond, church authorities themselves complained about the failure of advocates to measure up to ethical standards and deplored the shortcomings of the disciplinary system. Thus the Council of Basel declared that canon lawyers failed to adhere to the ethical prescriptions laid down in numerous papal constitutions and directed Cardinal Cesarian to address the problem. In England, where medieval church records are extraordinarily rich, similar complaints about the failure of the disciplinary system to reform (to put an end to (an evil) by enforcing or introducing a better method or course of action) unethical practices were very common.\n\nSuch criticisms seem to have had a paradoxical result, for they apparently reinforced the professional solidarity of lawyers at the expense of the enforcement of ethical standards. Thus the profession's critics may actually have induced advocates to organize professional associations for self-defense. The critics' attacks may also have persuaded lawyers to assign a higher priority to defending themselves against attacks by nonprofessionals than to disciplining wayward members within their own ranks.","questions":[{"id":1,"question":"Which one of the following best states the main conclusion of the\npassage?","options":["Professional organizations of medieval canon lawyers probably only\nenforced ethical standards among their own members when provoked to do\nso by outside criticisms.","Professional organizations of medieval civil lawyers seem to have\nmaintained stricter ethical standards for their own members than did\nprofessional organizations of medieval canon lawyers.","Professional organizations of medieval canon lawyers apparently\nserved to defend their members against critics' attacks rather than to\nenforce ethical standards.","The ethical standards maintained by professional associations of\nmedieval canon lawyers were chiefly laid down in papal\nconstitutions."],"correct":2,"explanation":"The correct answer is option C. The passage supports this answer: professional organizations of medieval canon lawyers apparently\nserved to defend their members against critics' attacks rather than to\nenforce ethical standards. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"According to the passage, which one of the following statements\nabout law courts in medieval England is true?","options":["Some English lawyers who practiced in civil courts also practiced\nin church courts, but others served exclusively in one court or the\nother.","English canon lawyers were more likely to initiate disciplinary\nproceedings against their colleagues than were English civil lawyers.","English civil lawyers maintained more stringent ethical standards\nthan did civil lawyers in the rest of Europe.","English ecclesiastical courts had originally been modeled upon\nEnglish civil courts."],"correct":0,"explanation":"The correct answer is option A. The passage explicitly states or directly supports that some english lawyers who practiced in civil courts also practiced\nin church courts, but others served exclusively in one court or the\nother. This information is stated in the passage, making it the most accurate answer based on the text."},{"id":3,"question":"The author refers to the Florentine guild of lawyers in the first\nparagraph most probably in order to","options":["introduce a theory about to be promoted","illustrate the type of action referred to in the previous sentence","underline the universality of a method discussed throughout the\nparagraph","point out a flaw in an argument presented earlier in the\nparagraph"],"correct":1,"explanation":"The correct answer is option B. The passage supports this answer: illustrate the type of action referred to in the previous sentence. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":4,"question":"The author refers to the Council of Basel (line 47) primarily in\norder to","options":["provide an example of the type of action needed to establish\nprofessional standards for canon lawyers","contrast the reactions of English church authorities with the\nreactions of other bodies to violations of professional standards by\ncanon lawyers","bolster the argument that violations of professional standards by\ncanon lawyers did take place","explain how rules of conduct for canon lawyers were\nestablished"],"correct":2,"explanation":"The correct answer is option C. The passage supports this answer: bolster the argument that violations of professional standards by\ncanon lawyers did take place. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":5,"question":"According to the information in the passage, for which one of the\nfollowing ethical violations would documentation of disciplinary action\nagainst a canon lawyer be most likely to exist?","options":["betraying a client's secrets to the opposing party","bribing the judge to rule in favor of a client","misrepresenting credentials in order to gain admission to the\nlawyers' guild","spreading rumors in order to discredit an opposing lawyer"],"correct":0,"explanation":"The correct answer is option A. The passage explicitly states or directly supports that betraying a client's secrets to the opposing party. This information is stated in the passage, making it the most accurate answer based on the text."},{"id":6,"question":"Which one of the following is most analogous to the \"professional\nsolidarity\" referred to in lines 56-57?","options":["Members of a teachers' union go on strike when they believe one of\ntheir colleagues to be falsely accused of using an inappropriate\ntextbook.","In order to protect the reputation of the press in the face of a\nlargely hostile public, a journalist conceals distortions in a\ncolleague's news article.","Several dozen recording artists agree to participate in a concert\nto benefit an endangered environmental habitat.","In order to expedite governmental approval of a drug, a government\nofficial is persuaded to look the other way when a pharmaceutical\nmanufacturer conceals evidence that the drug may have minor side\neffects."],"correct":1,"explanation":"The correct answer is option B. The passage supports this answer: in order to protect the reputation of the press in the face of a\nlargely hostile public, a journalist conceals distortions in a\ncolleague's news article. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."}]},"95":{"id":95,"title":"Many birds that form flocks compete through aggressive interaction (mutual or","difficulty":"Moderate","passage":"Many birds that form flocks compete through aggressive interaction (mutual or reciprocal action or influence) for priority of access to resources such as food and shelter. The result of repeated interactions between flock members is that each bird gains a particular social status related to its fighting ability, with priority of access to resources increasing with higher status. As the number and intensity of interactions between birds increase, however, so increase the costs to each bird in terms of energy expenditure, time, and risk of injury. Thus, birds possessing attributes that reduce the number of costly interactions in which they must be involved, without leading to a reduction in status, are at an advantage. An external signal, such as a plumage type, announcing fighting ability and thereby obviating the actual need to fight, could be one such attribute.\n\nThe zoologist Rohwer asserted that plumage variations in \"Harris sparrows\" support the status signaling hypothesis (SSH). He reported that almost without exception birds with darker throats win conflicts with individuals having lighter plumage. He claimed that even among birds of the same age and sex the amount of dark plumage predicts relative dominance status.\n\nHowever, Rohwer's data do not support his assertions: in one of his studies darker birds won only 57 out of 75 conflicts; within another, focusing on conflicts between birds of the same age group or sex, darker birds won 63 and lost 62. There are indications that plumage probably does signal broad age-related differences in status among Harris sparrows: adults, usually dark throated, have higher status than juveniles, who are usually light throated; moreover, juveniles dyed to resemble adults are dominant over undyed juveniles. However, the Harris sparrows' age-related plumage differences do not signal the status of individual birds within an age class, and thus cannot properly be included under the term \"status signaling.\"\n\nThe best evidence for status signaling is from the greater titmouse. Experiments show a strong correlation between the width of the black breast-plumage stripe and status as measured by success in aggressive interactions. An analysis of factors likely to be associated with breast-stripe width (sex, age, wing length, body weight) has demonstrated social status to be the only variable that correlates with stripe width when the other variables are held constant.\n\nAn ingenious experiment provided further evidence for status signaling in the greater titmouse. One of three stuffed titmouse dummies was mounted on a feeding tray. When a live bird approached, the dummy was turned by radio control to face the bird and present its breast stripe in \"display\". When presented with a dummy having a narrower breast stripe than their own, birds approached closely and behaved aggressively. However, when presented with a dummy having a broader breast stripe than their own, live birds acted submissive and did not approach.","questions":[{"id":1,"question":"According to the passage, the status signaling hypothesis holds\nthat the ability to display a recognizable external signal would have\nthe effect on an individual bird of","options":["enabling it to attract a mate of high status","allowing it to avoid costly aggressive interactions","decreasing its access to limited resources","making it less attractive to predatory species"],"correct":1,"explanation":"The correct answer is option B. The passage explicitly states or directly supports that allowing it to avoid costly aggressive interactions. This information is stated in the passage, making it the most accurate answer based on the text."},{"id":2,"question":"The author refers to the fact that adult Harris sparrows are\nusually dark throated (lines 31-32), in order to do which one of the\nfollowing?","options":["support the conclusion that plumage variation among Harris\nsparrows probably does not signal individual status","argue that plumage variation among Harris sparrows helps to\nconfirm the status signaling hypothesis","indicate that in light of plumage variation patterns among Harris\nsparrows, the status signaling hypothesis should probably be modified","demonstrate that Harris sparrows are the most appropriate subjects\nfor the study of status signaling among birds"],"correct":0,"explanation":"The correct answer is option A. The passage supports this answer: support the conclusion that plumage variation among harris\nsparrows probably does not signal individual status. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":3,"question":"Which one of the following, if true, would most seriously undermine\nthe validity of the results of the experiment discussed in the last\nparagraph?","options":["The live birds all came from different titmouse flocks.","The physical characteristics of the stuffed dummies varied in ways\nother than just breast-stripe width.","No live juvenile birds were included in the experiment.","The food placed in the feeding tray was not the kind of food\nnormally eaten by titmice in the wild."],"correct":1,"explanation":"The correct answer is option B. The passage supports this answer: the physical characteristics of the stuffed dummies varied in ways\nother than just breast-stripe width. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":4,"question":"Which one of the following best describes the organization of the\npassage?","options":["A hypothesis is introduced and studies relevant to the hypothesis\nare discussed and evaluated.","A natural phenomenon is presented and several explanations for the\nphenomenon are examined in detail.","Behavior is described, possible underlying causes for the behavior\nare reported, and the likelihood of each cause is assessed.","A scientific conundrum is explained and the history of the issue\nis recounted."],"correct":0,"explanation":"The correct answer is option A. The passage supports this answer: a hypothesis is introduced and studies relevant to the hypothesis\nare discussed and evaluated. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":5,"question":"According to the passage, which one of the following true of\nRohwer's relationship to the status signaling hypothesis (SSH)?","options":["Although his research was designed to test the SSH, his data\nproved to be more relevant to other issues.","He set out to confirm the SSH, but ended up revising it.","He set out to disprove the SSH, but ended up accepting it.","He advocated the SSH, but his research data failed to confirm it."],"correct":3,"explanation":"The correct answer is option D. The passage explicitly states or directly supports that he advocated the ssh, but his research data failed to confirm it. This information is stated in the passage, making it the most accurate answer based on the text."},{"id":6,"question":"The passage suggests that among birds that form flocks, a bird of\nhigh status is most likely to have which one of the following?","options":["dark throat plumage","greater-than-average body weight","offspring of high status","strong fighting ability"],"correct":3,"explanation":"The correct answer is option D. This can be inferred from the passage. The passage provides evidence that supports the conclusion that strong fighting ability. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."}]},"96":{"id":96,"title":"In The Dynamics of Apocalypse, John Lowe attempts to solve the mystery of the","difficulty":"Moderate","passage":"In The Dynamics of Apocalypse, John Lowe attempts to solve the mystery of the collapse of the Classic Mayan civilization. Lowe bases his study on a detailed examination of the known archaeological record. Like previous investigators, Lowe relies on dated monuments to construct a step-by-step account of the actual collapse. Using the erection of new monuments as a means to determine a site's occupation span, Lowe assumes that once new monuments ceased to be built, a site had been abandoned. Lowe's analysis of the evidence suggests that construction of new monuments continued to increase between A. D. 672 and 751, but that the civilization stopped expanding geographically; new construction took place almost exclusively in established settlements. The first signs of trouble followed. Monument inscriptions indicate that between 751 and 790, long-standing alliances started to break down. Evidence also indicates that between 790 and 830, the death rate in Classic Mayan cities outstripped the birthrate. After approximately 830, construction stopped throughout the area, and within a hundred years, the Classic Mayan civilization all but vanished.\n\nHaving established this chronology, Lowe sets forth a plausible explanation of the collapse that accommodates (to make fit, suitable, or congruous) the available archaeological evidence. He theorizes that Classic Mayan civilization was brought down by the interaction of several factors, set in motion by population growth. An increase in population, particularly within the elite segment of society, necessitated ever more intense farming. Agricultural intensification exerted stress on the soil and led to a decline in productivity (the amount of food produced through each unit of labor invested). At the same time, the growth of the elite class created increasing demands for ceremonial monuments and luxuries, diverting needed labor from the fields. The theory holds that these stresses were communicated—and amplified—throughout the area as Mayan states engaged in warfare to acquire laborers and food, and refugees fled impoverished areas. The most vulnerable states thus began to break down, and each downfall triggered others, until the entire civilization collapsed.\n\nIf there is a central flaw in Lowe's explanation, it is that the entire edifice rests on the assumption that the available evidence paints a true picture of how the collapse proceeded. However, it is difficult to know how accurately the archaeological record reflects historic activity, especially of a complex civilization such as the Mayans', and a hypothesis can be tested only against the best available data. It is quite possible that our understanding of the collapse might be radically altered by better data. For example, Lowe's assumption about monument construction and the occupation span of a site might well be disproved if further investigations of Classic Mayan sites established that some remained heavily settled long after the custom of carving dynastic monuments had ceased.","questions":[{"id":1,"question":"Which one of the following best describes the organization of the\npassage?","options":["A method used to analyze evidence is described, an explanation of\nthe evidence is suggested, and then a conclusion is drawn from the\nevidence.","A hypothesis is presented, evidence supporting the hypothesis is\nprovided, and then the hypothesis is affirmed.","An analysis of a study is presented, contradictory evidence is\nexamined, and then a direction for future studies is suggested.","The basis of a study is described, a theory that explains the\navailable evidence is presented, and a possible flaw in the study is\npointed out."],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: the basis of a study is described, a theory that explains the\navailable evidence is presented, and a possible flaw in the study is\npointed out. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":2,"question":"Which one of the following best expresses the main idea of the\npassage?","options":["In The Dynamics of Apocalypse, John Lowe successfully proves\nthat the collapse of Classic Mayan civilization was set in motion by\nincreasing population and decreasing productivity.","In The Dynamics of Apocalypse, John Lowe breaks new ground in\nsolving the mystery of the collapse of Classic Mayan civilization\nthrough his use of dated monuments to create a step-by-step account of\nthe collapse.","In The Dynamics of Apocalypse, John Lowe successfully uses\nexisting data to document the reduction and then cessation of new\nconstruction throughout Classic Mayan civilization.","While John Lowe's theory about the collapse of Classic Mayan\ncivilization appears credible, it is based on an assumption that cannot\nbe verified using the archaeological record."],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: while john lowe's theory about the collapse of classic mayan\ncivilization appears credible, it is based on an assumption that cannot\nbe verified using the archaeological record. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":3,"question":"Which one of the following is most closely analogous to the\nassumption Lowe makes about the relationship between monument\nconstruction and Classic Mayan cities?(Lowe assumes that once new\nmonuments ceased to be built, a site had been abandoned.)","options":["A person assumes that the shortage of fresh produce on the shelves\nof a grocery store is due to the effects of poor weather conditions\nduring the growing season.","A person assumes that a movie theater only shows foreign films\nbecause the titles of the films shown there are not familiar to the\nperson.","A person assumes that a restaurant is under new ownership because\nthe restaurant's menu has changed drastically since the last time the\nperson ate there.","A person assumes a friend has sold her stamp collection because\nthe friend has stopped purchasing new stamps."],"correct":3,"explanation":"The correct answer is option D. The passage supports this answer: a person assumes a friend has sold her stamp collection because\nthe friend has stopped purchasing new stamps. This is the most accurate and complete response based on the information provided in the passage. The other options either misstate information from the passage, are too narrow or too broad, or introduce ideas not supported by the text."},{"id":4,"question":"It can be inferred from the passage that the author would describe\nthe method Lowe used to construct a step-by-step chronology of the\nactual collapse of Classic Mayan civilization as","options":["daringly innovative but flawed","generally accepted but questionable","very reliable but outdated","unscientific but effective"],"correct":1,"explanation":"The correct answer is option B. This can be inferred from the passage. The passage provides evidence that supports the conclusion that generally accepted but questionable. The other options either contradict the passage, are not supported by the text, or go beyond what can reasonably be inferred."},{"id":5,"question":"The author of the passage would most likely agree with which one of\nthe following statements about the use of the archaeological record to\nreconstruct historic activity?(A)","options":["With careful analysis, archaeological evidence can be used to\nreconstruct accurately the historic activity of a past civilization.","Archaeological evidence is more useful for reconstructing the\nday-to-day activities of a culture than its long-term trends.","The accuracy of the archaeological record for reconstructing\nhistoric activity is dependent on the duration of the particular\ncivilization.","Historic activity can be reconstructed from archaeological\nevidence, but it is ultimately impossible to confirm the accuracy of the\nreconstruction.\n\n# LSAT 25 SECTION I\n\nTime 35 minutes 26 Questions\n\nDirections: Each passage in this section is followed by a group of\nquestions to be answered on the basis of what is stated or implied in\nthe passage. For some of the questions, more than one of the choices\ncould conceivably answer the question. However, you are to choose the\nbest answer, that is, the response that most accurately and completely\nanswers the question, and blacken the corresponding space on your answer\nsheet.\n\nPainter Frida Kahlo (1910-1954) often used harrowing images derived from\nher Mexican heritage to express suffering caused by a disabling accident\nand a stormy (marked by turmoil or fury \"a stormy life\") marriage.\nSuggesting much personal and emotional content, her works---many of them\nself-portraits---have been exhaustively psychoanalyzed, while their\npolitical content has been less studied. Yet Kahlo was an ardent\npolitical activist who in her art sought not only to explore her own\nroots, but also to champion (to protect or fight for as a champion)\nMexico's struggle for an independent political and cultural identity\n.\n\nKahlo was influenced by Marxism, which appealed to many intellectuals in\nthe 1920s and 1930s, and by Mexican nationalism. Interest in Mexico's\nculture and history had revived in the nineteenth century, and by the\nearly 1900s, Mexican indigenista tendencies ranged from a violently\nanti-Spanish idealization of Aztec Mexico to an emphasis on contemporary\nMexican Indians as the key to authentic Mexican culture. Mexican\nnationalism, reacting against contemporary United States political\nintervention in labor disputes as well as against past domination by\nSpain, identified the Aztecs as the last independent rulers of an\nindigenous political unit. Kahlo's form of Mexicanidad, a romantic\nnationalism that focused upon traditional art uniting all\nindigenistas, revered the Aztecs as a powerful pre-Columbian society\nthat had united a large area of the Middle Americas and that was thought\nto have been based on communal labor, the Marxist ideal.\n\nIn her paintings, Kahlo repeatedly employed Aztec (a member of a\nNahuatl-speaking people that founded the Mexican empire conquered by\nCortes in 1519) symbols, such as skeletons or bleeding hearts that were\ntraditionally related to the emanation of life from death and light from\ndarkness. These images of destruction coupled with (coupled with:\n) creation speak (to express feelings by other than verbal\nmeans \"actions speak louder than words\") not only to Kahlo's personal\nbattle for life, but also to the Mexican struggle to emerge as a\nnation---by implication (by implication: , ), to emerge with\nthe political and cultural strength admired in the Aztec civiliza
